<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StarGear — [Episode Name]</title>
<style>
  :root{
    --accent:#46c7ff;
    --glow: 150, 200, 255;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    background:#04060e; color:#eaf2ff; overflow:hidden; user-select:none;
  }

  /* ---------- title screen ----------
     No dedicated art for this episode yet — this is a procedural placeholder
     (starfield + glow), not a stand-in image, so it needs no new assets and is
     obviously temporary until real title art lands. Swap the .peBg gradient/
     .peShip block for real art the same way episode1.html's sgFrame does. */
  #startOverlay{position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
       align-items:center; justify-content:flex-end; padding-bottom:8vh;
       transition:opacity .6s ease;}
  #startOverlay.fading{opacity:0; pointer-events:none;}

  .peBg{position:fixed; inset:0; z-index:0; overflow:hidden;
       background:
         radial-gradient(1px 1px at 8% 22%, #cfe4ff 0, transparent 100%),
         radial-gradient(1px 1px at 18% 68%, #9fc0ff 0, transparent 100%),
         radial-gradient(2px 2px at 32% 14%, #eaf3ff 0, transparent 100%),
         radial-gradient(1px 1px at 46% 82%, #cfe4ff 0, transparent 100%),
         radial-gradient(1px 1px at 61% 38%, #eaf3ff 0, transparent 100%),
         radial-gradient(2px 2px at 74% 60%, #9fc0ff 0, transparent 100%),
         radial-gradient(1px 1px at 85% 20%, #cfe4ff 0, transparent 100%),
         radial-gradient(1px 1px at 93% 76%, #eaf3ff 0, transparent 100%),
         radial-gradient(1400px 900px at 50% 110%, rgba(40,80,160,0.35), transparent 60%),
         radial-gradient(900px 600px at 80% -10%, rgba(80,50,150,0.28), transparent 60%),
         linear-gradient(180deg, #04060e 0%, #070a16 55%, #050710 100%);
  }
  .peGlow{position:fixed; inset:0; z-index:1; pointer-events:none;
       background:radial-gradient(600px 400px at 50% 42%, rgba(70,150,255,0.10), transparent 70%);
       animation:peGlowPulse 5s ease-in-out infinite;}
  @keyframes peGlowPulse{
    0%,100%{opacity:.6;} 50%{opacity:1;}
  }

  .peTitleWrap{position:relative; z-index:2; display:flex; flex-direction:column;
       align-items:center; gap:.5rem; margin-bottom:6vh;}
  .peKicker{font-size:.85rem; letter-spacing:.5em; color:rgba(160,210,255,0.75);
       text-transform:uppercase;}
  .peTitle{font-size:clamp(2.2rem,7vw,4.2rem); letter-spacing:.1em; font-weight:800;
       color:#eaf3ff; text-transform:uppercase;
       text-shadow:0 0 20px rgba(var(--glow),.55), 0 0 60px rgba(var(--glow),.3);
       animation:peTitleGlow 3.2s ease-in-out infinite;}
  @keyframes peTitleGlow{
    0%,100%{ filter:drop-shadow(0 0 6px rgba(var(--glow),.35)); }
    50%    { filter:drop-shadow(0 0 18px rgba(var(--glow),.7)); }
  }
  .peSub{font-size:.9rem; letter-spacing:.3em; color:rgba(255,255,255,0.4); text-transform:uppercase;}
  .pePlaceholderTag{margin-top:.6rem; font-size:.7rem; letter-spacing:.18em;
       color:rgba(255,190,110,0.75); text-transform:uppercase; border:1px dashed rgba(255,190,110,0.4);
       border-radius:6px; padding:.25rem .8rem;}

  #startMenu{position:relative; z-index:2; display:flex; flex-direction:column;
       align-items:center; gap:14px; margin:0;}
  .menuBtn{font-family:inherit; cursor:pointer; min-width:260px;
       font-size:1.15rem; letter-spacing:.28em; text-transform:uppercase; font-weight:600;
       color:#eafcff; padding:.9rem 2.6rem; border-radius:10px;
       background:linear-gradient(180deg, rgba(20,80,122,0.92), rgba(11,32,58,0.92));
       border:1px solid var(--accent);
       box-shadow:0 0 22px rgba(70,150,255,0.35), inset 0 0 18px rgba(70,150,255,0.15);
       transition:transform .15s ease, box-shadow .2s ease, background .2s ease;}
  .menuBtn:hover{transform:translateY(-2px);
       background:linear-gradient(180deg, rgba(30,110,160,0.96), rgba(16,44,78,0.96));
       box-shadow:0 0 34px rgba(70,150,255,0.6), inset 0 0 22px rgba(70,150,255,0.25);}
  .menuBtn:active{transform:translateY(0);}
  #startMenu .hint{margin-top:.4rem; color:rgba(255,255,255,0.6); font-size:.85rem;
       text-shadow:0 2px 8px rgba(0,0,0,0.9);}
  kbd{background:#101a30; border:1px solid rgba(255,255,255,0.2); border-bottom-width:2px;
      border-radius:5px; padding:1px 7px; font-size:.72rem; color:#cfe0ff;}

  /* full-screen black used for the fade-to-black transition into flight */
  #fadeBlack{position:fixed; inset:0; z-index:60; background:#000; opacity:0;
       pointer-events:none; transition:opacity .5s ease;}
  #fadeBlack.on{opacity:1;}

  /* ---------- flight (the forked iso engine, fullscreen) ---------- */
  #gameplay{position:fixed; inset:0; z-index:5; background:#04060e;}
  #gameplay.hidden{display:none;}
  #gpFrame{position:absolute; inset:0; width:100%; height:100%; border:0; background:#04060e;}
</style>
</head>
<body>
  <div id="startOverlay">
    <div class="peBg"></div>
    <div class="peGlow"></div>
    <div class="peTitleWrap">
      <div class="peKicker">StarGear</div>
      <div class="peTitle">[EPISODE NAME]</div>
      <div class="peSub">Space explore &middot; flight &middot; combat</div>
      <div class="pePlaceholderTag">Placeholder title art — foundation build</div>
    </div>
    <div id="startMenu">
      <button id="startBtn" class="menuBtn">Start</button>
      <div class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> to begin</div>
    </div>
  </div>

  <div id="fadeBlack"></div>

  <div id="gameplay" class="hidden">
    <iframe id="gpFrame" title="Episode flight"></iframe>
  </div>

<script>
  const startOverlay = document.getElementById("startOverlay");
  const fadeBlack     = document.getElementById("fadeBlack");
  const gameplay      = document.getElementById("gpFrame") && document.getElementById("gameplay");
  const gpFrame       = document.getElementById("gpFrame");
  let starting = false;

  function startGame(){
    if (starting) return;
    starting = true;
    startOverlay.classList.add("fading");
    fadeBlack.classList.add("on");
    setTimeout(() => {
      gpFrame.src = "episode-template-flight.html";   // point this at your renamed flight file
      gameplay.classList.remove("hidden");
      // give the iframe a beat to paint before lifting the black, and hand it
      // keyboard focus so WASD/arrows work without an extra click first
      setTimeout(() => {
        fadeBlack.classList.remove("on");
        gpFrame.focus();
      }, 350);
    }, 550);
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  window.addEventListener("keydown", e => {
    if (starting) return;
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); startGame(); }
  });
</script>
</body>
</html>
