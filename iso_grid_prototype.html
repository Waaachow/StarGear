<style>

         align-items: center; justify-content: center; padding: 20px;

  #tut.show { display: flex; }
  .tutCard { width: min(90vw, 560px); background: linear-gradient(160deg, #0d1830, #0a1120);

<body>
<div id="wrap">
  <div id="hud">
    <b>StarGear</b> &nbsp;—&nbsp;
    Move: <span class="keys">Arrows / WASD</span> &nbsp;|&nbsp;
    Scan: <span class="keys">F</span> &nbsp;|&nbsp;

</div>
<div id="tut" role="dialog" aria-modal="true">

    <div class="tutTitle"></div>

  </div>

<script>
"use strict";

// ============================================================
// CONSTANTS (spec §1.1)
// ============================================================
const GRID_SIZE = 13, CENTER = 6;
const TILE_WIDTH = 64, TILE_HEIGHT = 32;
const HALF_W = TILE_WIDTH / 2, HALF_H = TILE_HEIGHT / 2;
const Z_PIXELS_PER_UNIT = 32;
const RISE_MS = 300, DROP_MS = 250, LATERAL_MS = 300;

const DIR = { NONE:0, FWD:1, BACK:2, LEFT:3, RIGHT:4 };

// SPACE is the default base tile (open void). The others remain available
// (kept for the sprite cache / future use) but are not generated by default.
const TileType = { GROUND:0, METAL:1, HAZARD:2, EMPTY:3, BOOST:4, SPACE:5 };

// ---- World object layer (multi-tile entities placed over the space grid) ----
// STATION = the small unmanned comm satellites scattered as scenery.
// TRADE = the manned trade stations you actually dock at (rare, hand-placed).
const OBJ = { NONE:0, PLANET:1, ASTEROID_S:2, ASTEROID_L:3, STATION:4,
              CRYSTAL:5, WRECK:6, WARSHIP:7, MOON:8, NEXUS:9, TRADE:10 };
const OBJ_FOOTPRINT = {                  // square footprint size in tiles
  [OBJ.PLANET]: 4, [OBJ.ASTEROID_S]: 1, [OBJ.ASTEROID_L]: 2, [OBJ.STATION]: 1,
  [OBJ.CRYSTAL]: 2, [OBJ.WRECK]: 1, [OBJ.WARSHIP]: 2, [OBJ.MOON]: 7, [OBJ.NEXUS]: 8,
  [OBJ.TRADE]: 3,
};

// ============================================================
// FIXED SECTOR MAP — a finite circle of radius MAP_RADIUS (≈200×200 tiles),
// built once from a constant seed so the layout never changes. The four themed
// zones are DISTINCT POCKETS placed around a central open-space hub where the
// player starts; the story route loops out through all four quadrants:
//   START(centre) → Whispering Nebula(NW) → Broken Moon(NE)
//                 → Silent Armada(SE) → Command Nexus(SW)
// Everything between the pockets is open "deep space" (REGION.OPEN).
// ============================================================
const MAP_RADIUS = 100;                  // playfield is a circle of this radius (tiles)
const MAP_SEED   = 0x5EED;               // constant -> identical map every load
const SPAWN = { ax: 0, ay: 0 };          // ship starts at the central hub, in open space

const REGION = { OUTSIDE:0, NEBULA:1, MOON:2, ARMADA:3, NEXUS:4, OPEN:5 };
const REGION_NAME = {
  [REGION.OUTSIDE]: "Deep Void",
  [REGION.NEBULA]:  "The Whispering Nebula",
  [REGION.MOON]:    "Broken Moon Orbit",
  [REGION.ARMADA]:  "The Silent Armada",
  [REGION.NEXUS]:   "Command Nexus",
  [REGION.OPEN]:    "Open Space",
};
// Each zone is a disc (centre + radius) placed in its own quadrant. `regionAt`
// returns the pocket a tile falls inside, else OPEN (the hub/void between them).
// These centres are also the story waypoints (see STORY_TARGETS) — tune here.
const ZONES = [
  { region: REGION.NEBULA, cx: -28, cy: -26, r: 22 },   // NW
  { region: REGION.MOON,   cx:  30, cy: -24, r: 22 },   // NE
  { region: REGION.ARMADA, cx:  28, cy:  28, r: 24 },   // SE
  { region: REGION.NEXUS,  cx: -26, cy:  30, r: 22 },   // SW (final)
];
const ZONE = {};                          // lookup by region → its {cx,cy,r}
for (const z of ZONES) ZONE[z.region] = z;
function regionAt(ax, ay) {
  if (Math.hypot(ax, ay) > MAP_RADIUS) return REGION.OUTSIDE;
  for (const z of ZONES) if (Math.hypot(ax - z.cx, ay - z.cy) <= z.r) return z.region;
  return REGION.OPEN;
}
// Per-zone palette: tile = overlay tint on the space tiles; grad = sky gradient
// top→bottom; neb = drifting nebula glows; star = dominant star tint.
const REGION_THEME = {
  [REGION.OUTSIDE]: { tile:"rgba(2,3,8,0.78)",     grad:["#04050b","#04050b","#05060e"],
                      neb:["rgba(20,30,60,0.06)"],                                  star:"#9fb0d0" },
  [REGION.OPEN]:    { tile:"rgba(8,12,24,0.10)",    grad:["#05060e","#070912","#05060e"],
                      neb:["rgba(30,45,80,0.06)","rgba(20,30,60,0.05)"],            star:"#b8c4e0" },
  [REGION.NEBULA]:  { tile:"rgba(120,70,210,0.20)", grad:["#0a0820","#0d0a2a","#08121e"],
                      neb:["rgba(120,60,200,0.20)","rgba(30,150,170,0.16)","rgba(60,200,220,0.12)"], star:"#cfd6ff" },
  [REGION.MOON]:    { tile:"rgba(120,90,70,0.17)",  grad:["#0a0a0e","#120b07","#0a0606"],
                      neb:["rgba(150,70,25,0.16)","rgba(90,90,100,0.12)","rgba(60,80,120,0.08)"],   star:"#e8d8c2" },
  [REGION.ARMADA]:  { tile:"rgba(70,100,150,0.16)", grad:["#060810","#08101e","#0a0e1a"],
                      neb:["rgba(50,80,140,0.15)","rgba(180,150,70,0.06)","rgba(40,60,110,0.12)"],  star:"#dfe8ff" },
  [REGION.NEXUS]:   { tile:"rgba(170,120,40,0.16)", grad:["#0a0806","#120c06","#0c0a08"],
                      neb:["rgba(190,130,40,0.16)","rgba(40,120,200,0.10)","rgba(120,80,30,0.12)"], star:"#ffe6b0" },
};

// The fixed object catalogue, populated by buildMap() at startup.
let MAP_OBJECTS = [];
// deterministic [0,1) value per (index, salt) — drives the fixed layout
function mrand(i, salt) { return rand01(MAP_SEED, i, salt, 7); }

// The manned stations, in sector coords. Keep them clear of the pocket centres
// (which are the story waypoints) and of each other. Edit freely — everything
// downstream (docking, the Star Map, the dock screen) reads this one list.
// `keeper` places the station's keeper in their own room. Each backdrop is composed
// around a counter with open space to one side of it, and that side differs per room —
// Quarry's counter recedes down the left, the Hub's open corridor is on the right — so
// the side is data, not a constant. `dx` nudges along that edge, `scale` is the figure's
// height as a fraction of the visible canvas. The UI panel takes the opposite side.
const TRADE_STATIONS = [
  // Moved from (6,8) — Steve, 2026-07-21: nothing should be on the doorstep when you first
  // load in. ⚠️ The tile grid is NOT the visibility bound — objects render well outside the
  // 13x13 window, so (6,8) and even (0,18) still drew on screen at spawn. 36 tiles is the
  // nearest distance that's off-screen at every aspect from 1366x768 up to 1920x1080; it's
  // also just outside MINIMAP_R (34), so the sector opens with a genuinely empty radar.
  // Still by far the nearest station (the others are ~54) — about 11s of cruise — in OPEN
  // space with 7.7 tiles of clearance from any pocket, and out toward the first story
  // objective so you meet it on the way rather than having to hunt for it.
  { id: "hub",    name: "Waypoint Hub",    ax:   0, ay: -36,     // north of the central start
    keeper: { side: "right", dx: 20, scale: 0.62, baseline: 0.79 } },
  { id: "neb",    name: "Veil Anchorage",  ax: -30, ay: -46,     // approach to the Nebula (NW)
    keeper: { side: "left",  dx: 10, scale: 0.60, baseline: 0.80 } },
  { id: "moon",   name: "Quarry Station",  ax:  44, ay: -30,     // approach to Broken Moon (NE)
    keeper: { side: "left",  dx: 0,  scale: 0.64, baseline: 0.78 } },
  { id: "armada", name: "Salvage Reach",   ax:  30, ay:  46,     // approach to the Armada (SE)
    keeper: { side: "right", dx: 10, scale: 0.62, baseline: 0.76 } },
];
const TRADE_BY_ID = {}; for (const s of TRADE_STATIONS) TRADE_BY_ID[s.id] = s;

function buildMap() {
  const objs = [];
  const add = (type, ax, ay, extra) => {
    const fp = OBJ_FOOTPRINT[type];
    objs.push(Object.assign({ type, fp, ax: Math.round(ax - (fp - 1) / 2),
                              ay: Math.round(ay - (fp - 1) / 2), variant: 0.5, hue: 200 }, extra));
  };

  // scatter `n` objects in a disc around a zone centre (polar, deterministic)
  const scatter = (n, z, salt, place) => {
    for (let i = 0; i < n; i++) {
      const a = mrand(i, salt) * 6.283, rr = (0.12 + 0.88 * mrand(i, salt + 1)) * z.r;
      place(i, z.cx + Math.cos(a) * rr, z.cy + Math.sin(a) * rr);
    }
  };
  const Zneb = ZONE[REGION.NEBULA], Zmoon = ZONE[REGION.MOON],
        Zarm = ZONE[REGION.ARMADA], Znex = ZONE[REGION.NEXUS];

  // --- Command Nexus (SW): the colossal command station at the pocket's heart ---
  add(OBJ.NEXUS, Znex.cx, Znex.cy, { variant: 0.5, hue: 40 });

  // --- The Silent Armada (SE): warships scattered through the pocket ---
  scatter(58, Zarm, 30, (i, ax, ay) =>
    add(OBJ.WARSHIP, ax, ay, { variant: mrand(i, 33), hue: 210, big: mrand(i, 34) > 0.85 }));

  // --- Broken Moon Orbit (NE): the split moon + drifting wreckage/stations ---
  add(OBJ.MOON, Zmoon.cx, Zmoon.cy, { variant: 0.4, hue: 24 });
  scatter(40, Zmoon, 40, (i, ax, ay) => {
    if (Math.hypot(ax - Zmoon.cx, ay - Zmoon.cy) < 9) return;   // keep clear of the moon itself
    add(mrand(i, 42) < 0.72 ? OBJ.WRECK : OBJ.STATION, ax, ay, { variant: mrand(i, 43), hue: 18 });
  });

  // --- The Whispering Nebula (NW): floating crystals, comm satellites, debris ---
  scatter(52, Zneb, 20, (i, ax, ay) => {
    const roll = mrand(i, 22);
    const t = roll < 0.55 ? OBJ.CRYSTAL : (roll < 0.8 ? OBJ.STATION : OBJ.ASTEROID_S);
    add(t, ax, ay, { variant: mrand(i, 23), hue: roll < 0.55 ? Math.floor(170 + mrand(i, 24) * 130) : 210 });
  });

  // --- Landmark planets: two distinct worlds hanging in open space between the
  // pockets, so the void isn't empty. variant<0.5 = Planet1 (crystalline), else Planet2.
  add(OBJ.PLANET, 46, -6, { variant: 0.2 });    // Planet1, out to the east
  add(OBJ.PLANET, -8, 52, { variant: 0.8 });    // Planet2, down to the south

  // --- TRADE STATIONS: rare, manned, hand-placed. These are what you dock at to
  // sell scrap, repair modules, trade and pick up bounties — deliberately few and
  // deliberately spread, so a full hold means a real trip. `name` shows on the map,
  // in the dock screen and on the Star Map legend. Positions sit just OUTSIDE each
  // pocket so they're findable landmarks on the route between zones, plus one at
  // the central hub you start next to.
  for (const s of TRADE_STATIONS) add(OBJ.TRADE, s.ax, s.ay, { variant: 0.5, hue: 190, name: s.name, id: s.id });

  // --- Deep-space debris: a light sprinkle in the open void (never inside a pocket) ---
  for (let i = 0; i < 26; i++) {
    const a = mrand(i, 50) * 6.283, r = 14 + mrand(i, 51) * 74;
    const ax = Math.round(Math.cos(a) * r), ay = Math.round(Math.sin(a) * r);
    if (regionAt(ax, ay) !== REGION.OPEN) continue;             // only in the void
    add(mrand(i, 52) < 0.5 ? OBJ.ASTEROID_S : OBJ.WRECK, ax, ay, { variant: mrand(i, 53), hue: 210 });
  }
  return objs;
}

// Space-themed tile palette. `glow` is an optional accent for energy tiles.
const TILE_STYLE = {
  [TileType.GROUND]: { top:"#33415a", side:"#1d2638", edge:"#4c6088", glow:null,      label:"DECK" }, // hull deck plating
  [TileType.METAL]:  { top:"#5a6b7d", side:"#39434f", edge:"#7d93a8", glow:null,      label:"ALLOY"}, // reinforced alloy
  [TileType.HAZARD]: { top:"#3a1410", side:"#1c0a08", edge:"#ff7a3c", glow:"#ff5a2c", label:"VENT" }, // reactor vent
  [TileType.EMPTY]:  { top:"#0a0d16", side:"#070a12", edge:"#1b2236", glow:null,      label:"VOID" }, // open void
  [TileType.BOOST]:  { top:"#0c2a33", side:"#072027", edge:"#46e6ff", glow:"#3ad7ff", label:"WARP" }, // warp pad
  [TileType.SPACE]:  { top:"#0a0e1c", side:"#070a14", edge:"#16203a", glow:null,      label:"SPACE"}, // open void (default)
};

// ============================================================
// EASING (spec §4.1)
// ============================================================
const cubicOut   = t => 1 - Math.pow(1 - t, 3);
const cubicIn    = t => t * t * t;
const cubicInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
const clamp01 = t => t < 0 ? 0 : t > 1 ? 1 : t;
const lerp = (a, b, f) => a + (b - a) * f;

// ============================================================
// DETERMINISTIC RNG — splitmix64-ish in 53-bit safe JS (spec §3.1)
// Uses BigInt for the hash, then a float in [0,1).
// ============================================================
function hash64(a, b, c) {
  const MASK = (1n << 64n) - 1n;
  let x = (BigInt.asUintN(64, BigInt(a))
        ^ (BigInt.asUintN(64, BigInt(b)) * 0x9E3779B97F4A7C15n)
        ^ (BigInt.asUintN(64, BigInt(c)) * 0xC2B2AE3D27D4EB4Fn)) & MASK;
  // splitmix64 finalizer
  x = (x ^ (x >> 30n)) * 0xBF58476D1CE4E5B9n & MASK;
  x = (x ^ (x >> 27n)) * 0x94D049BB133111EBn & MASK;
  x = (x ^ (x >> 31n)) & MASK;
  return x;
}
// Deterministic value in [0,1) for an absolute world coord + salt.
function rand01(seed, gx, gy, salt) {
  const h = hash64(BigInt(seed) ^ (BigInt(salt) << 17n), gx, gy);
  // take top 53 bits as a float
  return Number(h >> 11n) / 9007199254740992; // 2^53
}

// ============================================================
// WORLD STATE (spec §7)
// ============================================================
let WORLD_SEED = 0xBEEF;
let nextTileId = 1;

const world = {
  grid: new Array(GRID_SIZE),          // grid[x][y]
  worldOriginX: 0,
  worldOriginY: 0,
  moving: false,
  currentMove: DIR.NONE,
  lateral: null,                       // {elapsed, dur, startX, startY}
  cameraOffsetX: 0,
  cameraOffsetY: 0,
  droppingTiles: [],                   // tiles animating their exit
  bufferedMove: DIR.NONE,
  autoQueue: [],                       // scripted moves to run automatically (e.g. "back off 3")
  shipBobPhase: 0,
  shipFacing: DIR.BACK,                 // which sprite/orientation the ship shows (starts facing "back" — the map's forward)
  bgX: 0, bgY: 0,                       // accumulated parallax offset for starfield
};
const BG_PARALLAX = 0.35;              // how far the background drifts vs the world

// ---- ship sprites (spec §6.5) ----
// north east.png = NE facing, south west.png = SW facing.
// NW = NE flipped horizontally, SE = SW flipped horizontally.
const shipImg = { ne: new Image(), sw: new Image() };
shipImg.ne.src = "north east.png";
shipImg.sw.src = "south west.png";

// Hostile ships use their own hull (distinct from the player). NW/SE reuse
// these two mirrored, exactly like the player sprite.
const enemyImg = { ne: new Image(), sw: new Image() };
enemyImg.ne.src = "Assets/obj/Enemy ne.png";
enemyImg.sw.src = "Assets/obj/Enemy sw.png";

// Per-hull combat profiles. The six hostile hulls are no longer interchangeable:
// each fights with its own stats AND its own AI doctrine, so a mixed fight forces
// the player to read the board differently ship to ship. Fields:
//   hp          hull points
//   moves       tiles it can travel per enemy turn (BFS reach in planEnemyMove)
//   speed       free-roam travel multiplier while wandering the sector (1 = baseline
//               ENEMY_ROAM_SPEED/ENEMY_CHASE_SPEED); Tank crawls, Wing/Neo dart
//   ammo        missile shots (phaser is unlimited)
//   phaserDmg/missileDmg   damage per weapon
//   prefRange   the stand-off distance it steers toward when choosing a firing
//               tile / when repositioning — low = crowd in, high = hang back
//   rangeW      how hard it fights to reach prefRange vs. moving as little as
//               possible (higher = more willing to travel to hold its range)
//   missileBias >0 → reaches for the missile even when a phaser shot lines up
//   role        label for the log/debug; the numbers above drive behaviour
// `scrap` is the salvage a wreck yields — roughly hull mass, so the Tank pays out
// most and the interceptors least. Auto-collected on the kill (see grantScrapFor).
const SHIP_PROFILES = {
  // Artillery: fragile, slow, but long missile reach — snipes from the back line.
  Cyclops: { hp: 5,  moves: 2, speed: 0.8, ammo: 4, phaserDmg: 2, missileDmg: 5, prefRange: 5, rangeW: 9, missileBias: 1, role: "sniper",       scrap: 6 },
  // Bruiser: tough, hits hard up close, charges the player.
  Dread:   { hp: 8,  moves: 3, speed: 1.0, ammo: 1, phaserDmg: 4, missileDmg: 4, prefRange: 1, rangeW: 4, missileBias: 0, role: "bruiser",      scrap: 10 },
  // Skirmisher: the balanced baseline — decent everything, mid range.
  Gunner:  { hp: 6,  moves: 3, speed: 1.0, ammo: 2, phaserDmg: 3, missileDmg: 4, prefRange: 2, rangeW: 3, missileBias: 0, role: "skirmisher",   scrap: 7 },
  // Flanker: glass cannon on fast engines — darts to a firing angle then peels off.
  Neo:     { hp: 4,  moves: 5, speed: 1.4, ammo: 2, phaserDmg: 2, missileDmg: 4, prefRange: 3, rangeW: 7, missileBias: 0, role: "flanker",      scrap: 5 },
  // Tank: huge hull, crawls forward relentlessly, low damage — a soak.
  Tank:    { hp: 12, moves: 2, speed: 0.55, ammo: 1, phaserDmg: 2, missileDmg: 3, prefRange: 1, rangeW: 2, missileBias: 0, role: "tank",        scrap: 14 },
  // Interceptor: fastest hull, rushes into phaser range to pin the player.
  Wing:    { hp: 5,  moves: 5, speed: 1.5, ammo: 1, phaserDmg: 3, missileDmg: 4, prefRange: 1, rangeW: 6, missileBias: 0, role: "interceptor",  scrap: 6 },
  // Boss hull — never spawned as a patrol (see BOSS_SHIPS). The fight sets its own HP
  // from WOLFPACK.coreHp; this profile exists so anything reading `.profile` has sane
  // numbers, and so the codex can print stats for it.
  "Blood Crown": { hp: 26, moves: 3, speed: 0.9, ammo: 3, phaserDmg: 5, missileDmg: 6, prefRange: 2, rangeW: 3, missileBias: 1, role: "flagship", scrap: 40 },
  // Drax's escort wing: fast, fragile, thrown at you in pairs.
  Hound:         { hp: 7,  moves: 5, speed: 1.45, ammo: 0, phaserDmg: 3, missileDmg: 3, prefRange: 1, rangeW: 6, missileBias: 0, role: "escort",   scrap: 8 },
  // Sable Renn's courier hull: fastest thing in the sector, barely armed, no armour at all.
  "Half-Light":  { hp: 22, moves: 6, speed: 1.6,  ammo: 0, phaserDmg: 4, missileDmg: 4, prefRange: 4, rangeW: 7, missileBias: 0, role: "interceptor", scrap: 26 },
  // Harkin Dross's converted ore hauler: enormous, barely mobile, hits like a mine works.
  Tithe:         { hp: 24, moves: 1, speed: 0.4,  ammo: 0, phaserDmg: 2, missileDmg: 9, prefRange: 1, rangeW: 1, missileBias: 0, role: "siege",       scrap: 34 },
};
// Six hostile hulls; each battle enemy is assigned one at random (see startCombat),
// so a fight fields a varied mix of the profiles above. NE/SW mirror exactly like
// the player + default enemy sprite. Filenames are a bit inconsistent — most use
// "_ne"/"_sw", Neo uses "-ne"/"-sw". The image set carries its name + profile so
// each combat enemy can look up how it should fight.
const ENEMY_SHIPS = ["Cyclops", "Dread", "Gunner", "Neo", "Tank", "Wing"].map(name => {
  const sep = name === "Neo" ? "-" : "_";
  const set = { ne: new Image(), sw: new Image(), shipName: name, profile: SHIP_PROFILES[name] };
  set.ne.src = "Assets/obj/" + name + sep + "ne.png";
  set.sw.src = "Assets/obj/" + name + sep + "sw.png";
  return set;
});
function randomEnemyShip() { return ENEMY_SHIPS[(Math.random() * ENEMY_SHIPS.length) | 0]; }
// ---- unique boss hulls ----------------------------------------------------
// Kept OUT of ENEMY_SHIPS deliberately: that list is what `randomEnemyShip` draws

// beside its own boss card. `bossHull()` searches both lists, so a spec's `hull`
// can name either a common hull or one of these.
// `scale` multiplies ENEMY_SCALE when the hull is drawn, so a hull can read as bigger
// or smaller than the common ships without touching the shared constant.

  { name: "Hound", file: "hound", scale: 0.72 },       // his escort wing — visibly smaller
  { name: "Half-Light", file: "half", scale: 0.88 },   // Sable Renn's blink interceptor
  { name: "Tithe", file: "tithe", scale: 1.25 },       // Harkin Dross's barge — the biggest hull

                profile: SHIP_PROFILES[d.name] || SHIP_PROFILES.Dread };
  set.ne.src = "Assets/obj/" + d.file + "_ne.png";

});
// image set for an enemy's assigned hull (falls back to the default enemy sprite)
function enemyShipSet(e) { return (e && e.ship) || enemyImg; }
// A hull only has to be scanned ONCE. After that every ship of that type reads as
// scanned wherever it turns up, so Kael's action is for NEW hulls, not re-identifying
// the same fighter every fight. (shipDex is the codex; see discoverShip.)
function isScanned(e) {
  if (!e) return false;
  if (e.scanned) return true;
  if (e.boss) {
    // A boss's CORE is identified by its contract (scanning Drax credits "wolfpack").
    // Its lesser parts are ordinary ships and identify by their own hull — otherwise
    // a wave of freshly-warped-in escorts reads as unknown even though you scanned
    // that exact hull a minute ago.
    if (e.part !== "core" && e.ship && e.ship.shipName) return shipDex.has(e.ship.shipName);
    return typeof bossDexId === "function" && shipDex.has(bossDexId());
  }
  return !!(e.ship && e.ship.shipName && shipDex.has(e.ship.shipName));
}

// ============================================================
// SHIP CONFIG — a Resonance of Fate-style module grid. Modules are shaped parts
// placed on a grid over the ship blueprint; they only install if they FIT
// (in bounds, no overlap) and touch the existing cluster. A module is POWERED
// only if it's connected (orthogonally, through the cluster) back to the Reactor
// Core. Each action module maps to one action of a "ship-system" crew member —
// Astra (drive), Rex (weapons), Kael (systems) — so removing a module removes
// that crew's action in combat. Voss/Tessa/Selyra are crew skills, always on.
// ============================================================
const SHIPCFG_COLS = 10, SHIPCFG_ROWS = 7;
const SHIP_MODULES = [
  { id: "core",     name: "Reactor Core",   crew: null,    action: null,        color: "#f2c14e", cells: [[0,0],[1,0],[0,1],[1,1]] },
  { id: "thruster", name: "Thruster Array", crew: "Astra", action: "Maneuver",  color: "#b481ff", cells: [[0,0],[0,1],[1,1]] },

  // Non-action parts: no crew action, but they buff the ship while powered.
  // `cargo` adds hold capacity, `hull` adds max HP — both only count while the
  // module is powered AND unbroken (moduleActive).
  { id: "cargo",    name: "Cargo Hold",     crew: null,    action: null,        color: "#9fb4c8", cells: [[0,0],[1,0],[0,1],[1,1]], cargo: 30,
    desc: "The main hold. Capacity to hold 30 more scrap while powered." },
  // ---- shop stock: not owned at the start, bought at a trade station ----
  { id: "cargopod", name: "Cargo Pod",      crew: null,    action: null,        color: "#9fb4c8", cells: [[0,0],[0,1]], cargo: 15, price: 220,
    desc: "A strap-on hold extension. Capacity to hold 15 more scrap." },
  { id: "cargobay", name: "Expanded Hold",  crew: null,    action: null,        color: "#9fb4c8", cells: [[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]], cargo: 45, price: 480,
    desc: "A full second cargo deck. Capacity to hold 45 more scrap, but it eats the grid." },
  { id: "armour",   name: "Armour Plating", crew: null,    action: null,        color: "#c8b49f", cells: [[0,0],[1,0],[0,1],[1,1]], hull: 6, price: 320,
    desc: "Ablative plating across the spine. +6 maximum hull." },
];
const SHIP_MODULE_BY_ID = {}; for (const m of SHIP_MODULES) SHIP_MODULE_BY_ID[m.id] = m;
const blueprintImg = new Image(); blueprintImg.src = "Assets/Blueprint.png";   // Ship Config backdrop
// Resource-bar icons. Pre-cropped to 64x64 squares; the readout falls back to
// text-only labels if either fails to load, so a missing file never breaks the HUD.
const scrapIcon = new Image(); scrapIcon.src = "Assets/ui/scrap_64.png";
const coinIcon  = new Image(); coinIcon.src  = "Assets/ui/coin_64.png";
function iconReady(im) { return im.complete && im.naturalWidth > 0; }
const SHIP_CREW = { Astra: true, Rex: true, Kael: true };   // module-gated crew
let shipLoadout = [];               // installed placements: { id, cx, cy, rot }
let shipPowered = new Set();        // module ids currently connected to the Reactor Core
// Owning a module and having it INSTALLED are different things: the Ship Config
// grid only offers what you own, and the station shop sells what you don't.
// Modules with a `price` are shop stock — you don't start with them.
const OWNED_KEY = "stargear_owned_v1";
let shipOwned = new Set(SHIP_MODULES.filter(m => !m.price).map(m => m.id));
function moduleOwned(id) { return shipOwned.has(id); }
function ownedModules() { return SHIP_MODULES.filter(m => shipOwned.has(m.id)); }
function saveOwned() { try { localStorage.setItem(OWNED_KEY, JSON.stringify([...shipOwned])); } catch (e) {} }

// rotate a cell list by rot×90° and normalize so its min corner is (0,0)
function rotCells(cells, rot) {
  let out = cells.map(([x, y]) => [x, y]);
  for (let r = 0; r < ((rot % 4) + 4) % 4; r++) out = out.map(([x, y]) => [-y, x]);
  const minx = Math.min(...out.map(c => c[0])), miny = Math.min(...out.map(c => c[1]));
  return out.map(([x, y]) => [x - minx, y - miny]);
}
function placedCells(p) { return rotCells(SHIP_MODULE_BY_ID[p.id].cells, p.rot).map(([x, y]) => [x + p.cx, y + p.cy]); }
function loadoutOccupied() {
  const occ = new Set();
  for (const p of shipLoadout) for (const [x, y] of placedCells(p)) occ.add(x + "," + y);
  return occ;
}
function cellsInBounds(cells) { return cells.every(([x, y]) => x >= 0 && x < SHIPCFG_COLS && y >= 0 && y < SHIPCFG_ROWS); }
function cellsTouch(cells, occ) {
  for (const [x, y] of cells) for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) if (occ.has((x + dx) + "," + (y + dy))) return true;
  return false;
}
// can the template `id` be placed at (cx,cy,rot)? bounds + no overlap + touches
// the existing cluster (the first piece may go anywhere). `shipLoadout` must NOT
// already contain the piece being placed (pick-ups remove it first).
function canPlaceModule(id, cx, cy, rot) {
  const cells = rotCells(SHIP_MODULE_BY_ID[id].cells, rot).map(([x, y]) => [x + cx, y + cy]);
  if (!cellsInBounds(cells)) return false;
  const occ = loadoutOccupied();
  for (const [x, y] of cells) if (occ.has(x + "," + y)) return false;   // overlap
  if (shipLoadout.length === 0) return true;                           // first piece, anywhere
  return cellsTouch(cells, occ);                                       // else must attach to cluster
}
// recompute which modules are powered: BFS from the Reactor Core over placements
// that share an orthogonally-adjacent cell.
function recomputePower() {
  shipPowered = new Set();
  const core = shipLoadout.findIndex(p => p.id === "core");
  if (core < 0) return;
  const cellsOf = shipLoadout.map(placedCells);
  const sets = cellsOf.map(cs => new Set(cs.map(([x, y]) => x + "," + y)));
  const adj = (a, b) => cellsOf[a].some(([x, y]) => [[1,0],[-1,0],[0,1],[0,-1]].some(([dx, dy]) => sets[b].has((x + dx) + "," + (y + dy))));
  const seen = new Set([core]), stack = [core];
  while (stack.length) { const u = stack.pop(); for (let v = 0; v < shipLoadout.length; v++) if (!seen.has(v) && adj(u, v)) { seen.add(v); stack.push(v); } }
  for (const i of seen) shipPowered.add(shipLoadout[i].id);
}
// try to auto-place every module (fresh game / reset), core first, greedily; any
// that can't be fit is left out (its action stays unavailable until installed).
function autoPlaceDefault() {
  shipLoadout = [];
  for (const id of ownedModules().map(m => m.id)) {
    let done = false;
    for (let cy = 0; cy < SHIPCFG_ROWS && !done; cy++)
      for (let cx = 0; cx < SHIPCFG_COLS && !done; cx++)
        for (let rot = 0; rot < 4 && !done; rot++)
          if (canPlaceModule(id, cx, cy, rot)) { shipLoadout.push({ id, cx, cy, rot }); done = true; }
  }
  recomputePower();
}
const SHIPCFG_KEY = "stargear_shiploadout";
function saveLoadout() { recomputePower(); try { localStorage.setItem(SHIPCFG_KEY, JSON.stringify(shipLoadout)); } catch (e) {} }

// ---- module → crew-action gating -----------------------------------------
// A ship-system crew's action is available only if its module is installed AND
// powered. Ungated crew always have both actions.
function shipActionPowered(crewName, actionName) {
  const mod = SHIP_MODULES.find(m => m.crew === crewName && m.action === actionName);
  if (!mod) return true;
  return moduleActive(mod.id);          // installed + powered + not broken
}
function crewOptionAvailable(c, k) { return SHIP_CREW[c.name] ? shipActionPowered(c.name, c.slot0.options[k].name) : true; }
function crewAvailableIdxs(c) { const r = []; c.slot0.options.forEach((o, k) => { if (crewOptionAvailable(c, k)) r.push(k); }); return r; }
function crewOffline(c) { return SHIP_CREW[c.name] && crewAvailableIdxs(c).length === 0; }

// ---- damaged modules ------------------------------------------------------
// Losing a fight breaks 1–2 random installed modules (design: breakage is on a
// LOSS, not a win). A broken module still OCCUPIES its grid slot — it just does
// nothing — so you limp home with a hole in your loadout and pay coin at a
// station to repair it. The Reactor Core never breaks (that would be a soft-lock).
const BROKEN_KEY = "stargear_broken_v1";
let shipBroken = new Set();               // module ids installed but non-functional
function moduleBroken(id) { return shipBroken.has(id); }
function moduleActive(id) { return shipPowered.has(id) && !shipBroken.has(id); }
function saveBroken() { try { localStorage.setItem(BROKEN_KEY, JSON.stringify([...shipBroken])); } catch (e) {} }
function repairModule(id) { shipBroken.delete(id); saveBroken(); }
// break `n` random installed, unbroken, non-core modules. Returns the ids broken.
function breakRandomModules(n) {
  const pool = shipLoadout.map(p => p.id).filter(id => id !== "core" && !shipBroken.has(id));
  const hit = [];
  for (let i = 0; i < n && pool.length; i++) {
    const id = pool.splice((Math.random() * pool.length) | 0, 1)[0];
    shipBroken.add(id); hit.push(id);
  }
  if (hit.length) saveBroken();
  return hit;
}

// ============================================================
// ECONOMY — SCRAP is the raw pickup, COIN is money. Scrap only becomes coin by
// selling at a station; repairs and module purchases are paid in coin. Cargo has
// a hard capacity: once you're full, scrap pickups simply STOP (nothing is
// bumped) — that's the pressure that sends you back to a station.
// ============================================================
const ECON_KEY = "stargear_econ_v1";
const CARGO_BASE = 40;                    // hold capacity with no cargo modules fitted
// `goods` is the trade cargo, keyed by commodity id. It shares the hold with scrap,
// so filling up on cheap ore means no room for salvage — the hold is the real
// decision, not a second inventory.
// `basis` is the average coin/unit paid for each good still in the hold. It exists so
// selling can stop at break-even rather than dumping into a market you've already
// crashed — see sellGoods. Cleared per-commodity when the last unit leaves.
const START_COIN = 250;                   // seed capital: ~2 lots of ore, so the very
                                          // first dock can actually trade instead of
                                          // waiting on salvage to unlock the market
let econ = { scrap: 0, coin: 0, goods: {}, basis: {} };
function saveEcon() { try { localStorage.setItem(ECON_KEY, JSON.stringify(econ)); } catch (e) {} }
// capacity = base + every fitted cargo module that is powered and unbroken
function cargoCap() {
  let cap = CARGO_BASE;
  for (const p of shipLoadout) {
    const m = SHIP_MODULE_BY_ID[p.id];
    if (m && m.cargo && moduleActive(p.id)) cap += m.cargo;
  }
  return cap;
}
// max hull = the base plus every fitted, powered, unbroken armour module
function playerMaxHp() {
  let hp = PLAYER_MAX_HP;
  for (const p of shipLoadout) {
    const m = SHIP_MODULE_BY_ID[p.id];
    if (m && m.hull && moduleActive(p.id)) hp += m.hull;
  }
  return hp;
}
function goodsHeld(id) { return econ.goods[id] || 0; }
function goodsTotal() { let n = 0; for (const k in econ.goods) n += econ.goods[k]; return n; }
function cargoUsed() { return econ.scrap + goodsTotal(); }
function cargoFree() { return Math.max(0, cargoCap() - cargoUsed()); }
function cargoFull() { return cargoFree() <= 0; }
// Losing a fight costs you cargo: whoever broke you off takes a cut of the hold.
// One fraction is rolled for the whole hold rather than per-commodity, so it reads as
// "they took a third of everything" instead of a shopping list of unrelated numbers.
// COIN IS NOT TOUCHED — it isn't in the hold, and the locked economy rule is that coin
// is what you've already banked at a station.
const LOOT_LOSS_MIN = 0.30, LOOT_LOSS_MAX = 0.50;
function loseCargoOnDefeat() {
  const frac = LOOT_LOSS_MIN + Math.random() * (LOOT_LOSS_MAX - LOOT_LOSS_MIN);
  const lost = [];
  const takeFrom = (have) => {
    if (have <= 0) return 0;
    return Math.max(1, Math.round(have * frac));    // any cargo at all loses something
  };
  const s = takeFrom(econ.scrap);
  if (s) { econ.scrap -= s; lost.push(s + " scrap"); }
  for (const c of COMMODITIES) {
    const n = takeFrom(goodsHeld(c.id));
    if (!n) continue;
    econ.goods[c.id] = goodsHeld(c.id) - n;
    if (econ.goods[c.id] <= 0) delete econ.goods[c.id];
    lost.push(n + " " + c.name);
  }
  if (lost.length) saveEcon();
  return { pct: Math.round(frac * 100), lost };
}

// take as much of `n` as fits; returns what was actually stowed (0 when full).
function addScrap(n) {
  const took = Math.max(0, Math.min(n | 0, cargoFree()));
  if (took) { econ.scrap += took; saveEcon(); }
  return took;
}
function addCoin(n) { econ.coin += n | 0; saveEcon(); }
function spendCoin(n) { if (econ.coin < n) return false; econ.coin -= n | 0; saveEcon(); return true; }
// sell the whole hold; returns { scrap, coin } for the confirmation line
function sellAllScrap() {
  const s = econ.scrap, c = s * SCRAP_PRICE;
  if (!s) return { scrap: 0, coin: 0 };
  econ.scrap = 0; econ.coin += c; saveEcon();
  return { scrap: s, coin: c };
}
const SCRAP_PRICE = 3;                    // coin paid per unit of scrap at a station

// ============================================================
// TRADE COMMODITIES — buy low at one station, sell high at another. Prices are a
// base value times a per-station modifier, so each station is cheap in what its
// region produces and dear in what it lacks. That makes a real route: ore is cheap
// at the mining station and dear at the nebula, and so on. Goods share the cargo
// hold with scrap.
// ============================================================
// `restock` is seconds per unit for the shelf to drift back toward baseline, and it is
// the master dial on how much coin the whole economy can emit per hour: the sustainable
// income of any route is exactly (restock rate x margin per unit). It scales with value
// so the dear goods refill slowest — otherwise relics are the only cargo worth carrying.
// Tuned so every commodity sustains 40-70 coin/min (see scratchpad econ_sim.py).
const COMMODITIES = [
  { id: "ore",    name: "Raw Ore",          base: 12, restock:  8, desc: "Bulk mineral. Cheap, heavy, always moving." },
  { id: "parts",  name: "Machine Parts",    base: 30, restock: 14, desc: "Salvaged components. Every yard wants them." },
  { id: "meds",   name: "Medical Supplies", base: 55, restock: 24, desc: "Sealed medical stock. Dear wherever it's scarce." },
  { id: "relics", name: "Nebula Relics",    base: 90, restock: 40, desc: "Strange finds from the deep nebula. Collectors pay." },
];
const COMMODITY_BY_ID = {}; for (const c of COMMODITIES) COMMODITY_BY_ID[c.id] = c;
// per-station price multipliers — below 1 = this station SELLS it cheap (buy here),
// above 1 = it PAYS well (sell here). Anything unlisted trades at par.
const STATION_PRICES = {
  hub:    { ore: 1.00, parts: 1.00, meds: 1.00, relics: 1.00 },   // neutral clearing house
  neb:    { ore: 1.35, parts: 1.15, meds: 1.30, relics: 0.65 },   // relics are local; everything else shipped in
  moon:   { ore: 0.60, parts: 0.80, meds: 1.35, relics: 1.25 },   // mining + breaking yards
  armada: { ore: 1.20, parts: 0.65, meds: 0.85, relics: 1.40 },   // swimming in salvaged parts
};
const TRADE_LOT = 10;                     // units bought per purchase
// A station BUYS for less than it SELLS — the house takes a cut. This is the single
// most important number in the market, because without it buying and selling ran off
// the same price ladder: a buy paid each price BEFORE the stock decrement and a sell
// collected each price AFTER, so buying N and immediately selling N back at the SAME
// station returned the whole ladder one rung higher than you paid for it. Net was
// always positive (+44 coin a cycle on relics), left stock exactly where it started,
// and needed no travel and no risk — a standing-still money printer. With a spread,
// the ONLY source of margin is the difference between two stations, which is exactly
// the loop the game wants to encourage. Do not remove this.
const TRADE_SPREAD = 0.85;
// ---- STATION INVENTORIES ---------------------------------------------------
// Every station holds a finite quantity of each commodity, and its price moves with
// what's on the shelf: buy it out and the price climbs, dump a hold of ore and the
// local price collapses. That's what makes a route pay well the first run and less
// each time until the market recovers. Stock drifts back toward baseline in real time
// at the commodity's own `restock` rate.
const STOCK_KEY = "stargear_stock_v1";
let stationStock = {};                    // { stationId: { commodityId: units } }
let stockTouched = {};                    // { stationId: { commodityId: last drift ms } }
function saveStock() {
  try { localStorage.setItem(STOCK_KEY, JSON.stringify({ s: stationStock, t: stockTouched })); } catch (e) {}
}
// Baseline = how much a station carries of anything, and it is deliberately FLAT.
// It used to vary with the price modifier (140 / 65 / 35), which meant an importer's
// shelf (35) was shallower than the hold (40) — one trade inverted the local market and
// the second run of any route was already a loss. Regional flavour belongs in
// STATION_PRICES; doubling it up in the shelf depth just broke the curve.
// Depth is ~5x the hold, so one full load moves the price a visible ~11%.
const STOCK_DEPTH = 200;
function baseStock(stationId, commodityId) { return STOCK_DEPTH; }
function stockOf(stationId, commodityId) {
  const st = stationStock[stationId];
  if (!st || st[commodityId] === undefined) return baseStock(stationId, commodityId);
  return Math.max(0, st[commodityId] | 0);
}
function setStock(stationId, commodityId, n) {
  if (!stationStock[stationId]) stationStock[stationId] = {};
  stationStock[stationId][commodityId] = Math.max(0, Math.round(n));
}
// Pull this station's shelves back toward baseline for the time that has passed. Each
// commodity drifts at its own rate, so the clock is kept per commodity. Called when you
// dock and while the market is on screen, so it's always current.
function touchStock(stationId) {
  if (!stationId) return;
  const now = Date.now();
  // migration: the clock used to be one timestamp per station, not per commodity
  if (typeof stockTouched[stationId] !== "object" || !stockTouched[stationId]) {
    const was = typeof stockTouched[stationId] === "number" ? stockTouched[stationId] : now;
    stockTouched[stationId] = {};
    for (const c of COMMODITIES) stockTouched[stationId][c.id] = was;
  }
  const clock = stockTouched[stationId];
  let moved = false;
  for (const c of COMMODITIES) {
    const ms = (c.restock || 18) * 1000;
    const last = clock[c.id] || now;
    const steps = Math.floor((now - last) / ms);
    if (steps <= 0) { if (!clock[c.id]) clock[c.id] = now; continue; }
    clock[c.id] = last + steps * ms;
    const b = baseStock(stationId, c.id), have = stockOf(stationId, c.id);
    if (have === b) continue;
    setStock(stationId, c.id, have < b ? Math.min(b, have + steps) : Math.max(b, have - steps));
    moved = true;
  }
  if (moved) saveStock();
}
// Scarcity multiplier: an empty shelf is dear, a glutted one is cheap.
// ⚠️ The clamp is deliberately WIDE. Tightening it looks like it would tame repeat-run
// grinding, but it does the opposite: if glut and scarcity can't fully cancel out the
// two stations' price modifiers, the arbitrage never closes and the route settles onto a
// PERMANENT floor — a tight 0.85-1.15 clamp leaves neb->armada relics paying +960 a run
// forever. A wide swing lets the margin genuinely reach zero and stay there until the
// shelves recover. Tuned against the 40-unit hold in scratchpad econ_sim.py.
const STOCK_SWING = 0.55, STOCK_LO = 0.55, STOCK_HI = 1.60;
function stockFactor(stationId, commodityId) {
  const b = baseStock(stationId, commodityId) || 1;
  const dev = (stockOf(stationId, commodityId) - b) / b;      // + = glut, - = scarce
  return Math.max(STOCK_LO, Math.min(STOCK_HI, 1 - STOCK_SWING * dev));
}
// What the station charges YOU for a unit.
function goodsBuyPrice(stationId, commodityId) {
  const c = COMMODITY_BY_ID[commodityId];
  const mod = (STATION_PRICES[stationId] || {})[commodityId] || 1;
  return Math.max(1, Math.round(c.base * mod * stockFactor(stationId, commodityId)));
}
// What it pays YOU for a unit — always less. See TRADE_SPREAD.
function goodsSellPrice(stationId, commodityId) {
  return Math.max(1, Math.round(goodsBuyPrice(stationId, commodityId) * TRADE_SPREAD));
}
// kept as the "sticker price" alias so older call sites keep meaning the buy side
function goodsPrice(stationId, commodityId) { return goodsBuyPrice(stationId, commodityId); }
// How the shelf reads at a glance, next to the price.
// Thresholds are tied to the deviation the PRICE actually reacts to, so the words track
// the number. A full 40-unit hold moves a 200-deep shelf by 20%, which is one band.
function stockHint(stationId, commodityId) {
  const n = stockOf(stationId, commodityId);
  if (n <= 0) return "SOLD OUT";
  const b = baseStock(stationId, commodityId) || 1, dev = (n - b) / b;
  if (dev <= -0.45) return "picked clean · " + n + " left";
  if (dev <= -0.15) return "running short · " + n + " in stock";
  if (dev >=  0.45) return "glutted · " + n + " in stock";
  if (dev >=  0.15) return "well stocked · " + n + " in stock";
  return n + " in stock";
}
// "cheap here" / "pays well here" hint, so a station reads at a glance
function goodsHint(stationId, commodityId) {
  const mod = (STATION_PRICES[stationId] || {})[commodityId] || 1;
  if (mod <= 0.8) return "cheap here";
  if (mod >= 1.2) return "pays well here";
  return "trading at par";
}
// What you paid on average for the units of `id` currently in the hold.
function goodsBasis(id) { return (econ.basis && econ.basis[id]) || 0; }
// Bought a unit at a time so clearing a shelf costs progressively more — the last
// few units of a station's stock are the expensive ones.
function buyGoods(stationId, id, qty) {
  touchStock(stationId);
  const room = cargoFree(), have = stockOf(stationId, id);
  if (have <= 0) return { n: 0, coin: 0, why: "Sold out here — try another station." };
  if (room <= 0) return { n: 0, coin: 0, why: "No room in the hold." };
  let n = 0, spent = 0;
  const want = Math.min(qty, room, have);
  while (n < want) {
    const price = goodsBuyPrice(stationId, id);
    if (econ.coin - spent < price) break;
    spent += price; n++;
    setStock(stationId, id, stockOf(stationId, id) - 1);
  }
  if (!n) return { n: 0, coin: 0, why: "Not enough coin." };
  // roll the cost basis forward over what was already aboard
  const had = goodsHeld(id);
  econ.basis = econ.basis || {};
  econ.basis[id] = (goodsBasis(id) * had + spent) / (had + n);
  econ.coin -= spent;
  econ.goods[id] = had + n;
  saveEcon(); saveStock();
  recordIntel(stationId);
  return { n, coin: spent };
}
// How many units this station will take before the price drops below what you paid.
// The market is allowed to crash under your cost — what must never happen is the game
// making you eat it, so selling stops at break-even unless you explicitly dump the lot.
function sellableAtProfit(stationId, id) {
  const held = goodsHeld(id); if (!held) return { n: 0, coin: 0 };
  const basis = goodsBasis(id);
  const stock0 = stockOf(stationId, id);
  let n = 0, coin = 0;
  while (n < held) {
    setStock(stationId, id, stock0 + n);
    const p = goodsSellPrice(stationId, id);
    if (p < basis) break;
    coin += p; n++;
  }
  setStock(stationId, id, stock0);                    // probe only — put it back
  return { n, coin };
}
// Selling works in reverse: each unit you dump lands on the station's shelf and pushes
// the next unit's price down, so a big load fetches less per unit than the sticker
// price. That's the ceiling on trade-route profit. `all` = true dumps the hold even at
// a loss (a deliberate, priced choice); otherwise it stops at break-even.
function sellGoods(stationId, id, all) {
  touchStock(stationId);
  const held = goodsHeld(id);
  if (!held) return { n: 0, coin: 0 };
  const want = all ? held : sellableAtProfit(stationId, id).n;
  if (!want) return { n: 0, coin: 0, why: "No buyer here above what you paid — try another station." };
  let earned = 0;
  for (let i = 0; i < want; i++) {
    earned += goodsSellPrice(stationId, id);
    setStock(stationId, id, stockOf(stationId, id) + 1);
  }
  const left = held - want;
  const cost = goodsBasis(id) * want;
  if (left > 0) econ.goods[id] = left;                // basis is unchanged: same average
  else { delete econ.goods[id]; if (econ.basis) delete econ.basis[id]; }
  econ.coin += earned;
  saveEcon(); saveStock();
  recordIntel(stationId);
  return { n: want, coin: earned, profit: Math.round(earned - cost), left };
}

// ---- MARKET INTEL ----------------------------------------------------------
// Nothing used to tell the player where to SELL — the market screen only described the
// station you were standing in, so the buy-here-sell-there loop was invisible unless you
// kept notes. Docking now REMEMBERS that station's prices, and the market quotes the best
// price you have SEEN elsewhere, with how long ago you saw it. Deliberately not live:
// the staleness is the reason to go and look.
const INTEL_KEY = "stargear_intel_v1";
let marketIntel = {};                     // { stationId: { commodityId: {buy, sell, at} } }
function saveIntel() { try { localStorage.setItem(INTEL_KEY, JSON.stringify(marketIntel)); } catch (e) {} }
// ⚠️ Called every frame the market screen is up, so it must not write localStorage
// unless a price actually moved — persisting at 60fps stutters the dock screen.
function recordIntel(stationId) {
  if (!stationId) return;
  touchStock(stationId);
  const rec = marketIntel[stationId] || (marketIntel[stationId] = {});
  const now = Date.now();
  let changed = false;
  for (const c of COMMODITIES) {
    const buy = goodsBuyPrice(stationId, c.id), sell = goodsSellPrice(stationId, c.id);
    const was = rec[c.id];
    if (was && was.buy === buy && was.sell === sell) { was.at = now; continue; }
    rec[c.id] = { buy, sell, at: now };
    changed = true;
  }
  if (changed) saveIntel();
}
// Best remembered buyer for a commodity, excluding where you're standing.
function bestKnownMarket(commodityId, exceptId) {
  let best = null;
  for (const st of TRADE_STATIONS) {
    if (st.id === exceptId) continue;
    const rec = (marketIntel[st.id] || {})[commodityId];
    if (!rec) continue;
    if (!best || rec.sell > best.sell) best = { id: st.id, name: st.name, sell: rec.sell, buy: rec.buy, at: rec.at, st };
  }
  return best;
}
function intelAge(at) {
  const m = Math.max(0, Math.round((Date.now() - at) / 60000));
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  return Math.round(m / 60) + "h ago";
}
// "54 tiles NW" from the ship to a station, for the intel line
function bearingTo(st) {
  const dx = st.ax - playerAX(), dy = st.ay - playerAY();
  const d = Math.round(Math.hypot(dx, dy));
  const ns = dy < -2 ? "N" : dy > 2 ? "S" : "";
  const ew = dx > 2 ? "E" : dx < -2 ? "W" : "";
  return d + " tiles" + (ns + ew ? " " + ns + ew : "");
}

// ============================================================
// SIDE MISSIONS — multi-step, story-flavoured jobs taken at a station (bounties
// are the single-target boss fights; these are the errands with a bit of colour).
//
// A mission is an ordered list of STEPS. Each step declares a `check()` that the
// tick polls, and optionally a `mark` (a sector position to draw a waypoint at)
// and `take()` to consume what it asked for. When the last step passes, the
// mission pays out. Only one is active at a time, like bounties.
//
// Step vocabulary (add a new kind by adding a check — nothing else needs to know):
//   hold goods   · carry N of a commodity          · reach a point · scan at a point
//   kill N hostiles · bank N scrap · dock at a named station
// ============================================================
const SIDES_KEY = "stargear_sides_v1";
let sideKills = 0;                        // hostiles destroyed, counted for `kills` steps

const SIDE_MISSIONS = [
  {
    id: "longhaul", from: "hub", title: "The Long Haul", reward: 450,
    brief: "A hauler pilot at the Hub broke her drive and can't make her run. The medical " +
           "consignment is due at Quarry Station and people are waiting on it.",
    steps: [
      // `prog` is optional and only for countable steps — the Missions menu shows it
      // as a "4 / 10" tally next to the step so you can see how far along you are.
      { text: "Acquire 10 Medical Supplies", hint: "Buy them at any station's market.",
        prog: () => ({ have: goodsHeld("meds"), need: 10 }),
        check: () => goodsHeld("meds") >= 10 },
      { text: "Deliver them to Quarry Station", hint: "Dock at Quarry Station with the cargo aboard.",
        prog: () => ({ have: Math.min(goodsHeld("meds"), 10), need: 10 }),
        mark: () => TRADE_BY_ID.moon,
        check: () => dockedAt && dockedAt.id === "moon" && goodsHeld("meds") >= 10,
        take: () => { econ.goods.meds = goodsHeld("meds") - 10; saveEcon(); } },
    ],
  },
  {
    id: "ghosts", from: "neb", title: "Ghosts on the Scope", reward: 600,
    brief: "Veil Anchorage keeps logging sensor echoes off the nebula's edge that resolve into " +
           "nothing. Their last survey ship went out to look and came back with holes in it.",
    steps: [
      { text: "Reach the echo source", hint: "A marker is set on the nebula's edge.",
        mark: () => ({ ax: -44, ay: -30 }),
        check: () => nearPoint(-44, -30, 3) },
      { text: "Sweep the area", hint: "Run a scan (F) at the marker.",
        mark: () => ({ ax: -44, ay: -30 }),
        check: () => _sideScanned },
      { text: "Destroy 2 hostiles", hint: "Whatever was hiding out there is awake now.",
        prog: () => ({ have: Math.min(sideKills, 2), need: 2 }),
        check: () => sideKills >= 2, start: () => { sideKills = 0; } },
    ],
  },
  {
    id: "salvage", from: "armada", title: "Salvage Rights", reward: 500,
    brief: "Salvage Reach is being undercut by a crew stripping hulls faster than the yard can. " +
           "The foreman wants a hold of scrap on his terms, to make a point about who works this drift.",
    steps: [
      { text: "Bank 40 scrap", hint: "Break hulls or sweep wrecks until the hold has 40.",
        prog: () => ({ have: Math.min(econ.scrap, 40), need: 40 }),
        check: () => econ.scrap >= 40 },
      { text: "Bring it to Salvage Reach", hint: "Dock at Salvage Reach with the scrap aboard.",
        prog: () => ({ have: Math.min(econ.scrap, 40), need: 40 }),
        mark: () => TRADE_BY_ID.armada,
        check: () => dockedAt && dockedAt.id === "armada" && econ.scrap >= 40,
        take: () => { econ.scrap -= 40; saveEcon(); } },
    ],
  },
];
const SIDE_BY_ID = {}; for (const s of SIDE_MISSIONS) SIDE_BY_ID[s.id] = s;

let sides = { state: {}, active: null, step: 0 };
for (const s of SIDE_MISSIONS) sides.state[s.id] = "open";
let _sideScanned = false;                 // a scan happened at the active step's marker

function saveSides() { try { localStorage.setItem(SIDES_KEY, JSON.stringify(sides)); } catch (e) {} }
function sideState(id) { return sides.state[id] || "open"; }
function activeSide() { return sides.active ? SIDE_BY_ID[sides.active] : null; }
function activeSideStep() { const m = activeSide(); return m ? m.steps[sides.step] : null; }
function nearPoint(ax, ay, d) {
  const px = world.worldOriginX + CENTER, py = world.worldOriginY + CENTER;
  return Math.hypot(px - ax, py - ay) <= d;
}
function syncSideCounters() {
  ep0.sidesTotal = SIDE_MISSIONS.length;
  ep0.sidesDone = SIDE_MISSIONS.filter(s => sideState(s.id) === "done").length;
  saveEp0(); checkAchievements();
}
// Accepting a job at a station starts it there and then (per Steve, 2026-07-21):
// there's no separate "make this the live one" step. Whatever was running drops back
// to "taken" — still in the log, just no longer the tracked objective, and it can be
// made live again from the Missions menu.
function acceptSide(id) {
  if (sideState(id) !== "open") return;
  sides.state[id] = "taken";
  saveSides();
  activateSide(id);
}
// "4 / 10" tally for a countable step, or "" for one that just happens (reach here,
// run a scan). Used by the Missions menu and the station job board.
function stepProgressText(st) {
  if (!st || !st.prog) return "";
  const p = st.prog();
  if (!p || !p.need) return "";
  return Math.min(p.have | 0, p.need | 0) + " / " + (p.need | 0);
}
// Promote a collected job to the running one. Whatever was running goes back to
// "taken" — it stays in the log, it just isn't the tracked objective any more.
function activateSide(id) {
  if (sideState(id) !== "taken") return;
  const prev = sides.active;
  if (prev && sideState(prev) === "active") sides.state[prev] = "taken";   // one at a time
  sides.state[id] = "active"; sides.active = id; sides.step = 0;
  _sideScanned = false; sideKills = 0;
  const st = SIDE_BY_ID[id].steps[0];
  if (st && st.start) st.start();
  saveSides();
}
// Abandoning hands the job back to the board it came from, so it's findable again.
function abandonSide() {
  const a = sides.active;
  if (a && sideState(a) === "active") sides.state[a] = "open";
  sides.active = null; sides.step = 0; saveSides();
}
// Hand back a specific job — it may be the running one or merely collected.
function handBackSide(id) {
  if (!id) return abandonSide();
  if (sides.active === id) return abandonSide();
  if (sideState(id) === "taken") { sides.state[id] = "open"; saveSides(); }
}
function completeSide(m) {
  sides.state[m.id] = "done";
  sides.active = null; sides.step = 0;
  saveSides();
  addCoin(m.reward);
  sfx("coin");
  syncSideCounters();
  achToasts.push({ name: "SIDE MISSION COMPLETE — " + m.reward + " coin", t: 0, dur: 4200 });
}
// polled each frame: advance the active mission when its current step passes
function tickSides() {
  const m = activeSide(); if (!m) return;
  const st = m.steps[sides.step]; if (!st) return;
  if (!st.check()) return;
  if (st.take) st.take();
  sides.step++;
  _sideScanned = false;
  if (sides.step >= m.steps.length) { completeSide(m); return; }
  const next = m.steps[sides.step];
  if (next && next.start) next.start();
  saveSides();
  achToasts.push({ name: "STEP COMPLETE — " + m.title, t: 0, dur: 3000 });
}

// ---- station pricing ------------------------------------------------------
// Everything scales off a module's footprint, so a bigger part costs more to buy
// and more to put right. Repairs are deliberately cheaper than replacement.
function modulePrice(m)  { return m.price || (m.cells.length * 90); }
function repairCost(m)   { return Math.max(40, Math.round(modulePrice(m) * 0.35)); }
function sellbackValue(m){ return Math.round(modulePrice(m) * 0.5); }

// ============================================================
// BOUNTIES — each is a boss fight (see BOSS_SPECS). Taking one marks its target
// in the sector; flying to the marker starts the fight; winning pays coin. The
// contract list is fixed for Episode 0 and feeds the "Bounty Board Clear"
// achievement via ep0.bountiesDone / bountiesTotal.
// ============================================================
const BOUNTY_KEY = "stargear_bounty_v1";
const BOUNTIES = [
  { id: "wolfpack",    boss: "wolfpack",    reward: 900,
    title: "Captain Malachar Drax", where: { ax: -52, ay: -18 }, zone: "the Nebula approach",
    brief: "\"The Red Reaver\" — war hero turned raider, running the stolen warship Blood Crown with " +
           "an escort wing of veterans who'd die for him. Four haulers lost out of station traffic. " +
           "Wanted alive or dead. Pay is on Drax — the wing is your problem." },
  { id: "phaserunner", boss: "phaserunner", reward: 750,
    title: "Sable Renn", where: { ax: 58, ay: 10 }, zone: "the eastern shipping lane",
    brief: "\"The Afterimage\" — a blink-drive runner nobody has held a sensor lock on. Strands " +
           "crews rather than killing them, and mines the space she leaves behind. Low purse: the " +
           "lane wants her stopped, not avenged. Wanted alive if you can manage it." },
  { id: "siegehauler", boss: "siegehauler", reward: 1200,
    title: "Harkin Dross", where: { ax: 12, ay: 66 }, zone: "the southern drift",
    brief: "\"The Tollman\" — parks an armoured ore barge broadside across the drift and charges " +
           "every hull that passes. Pay and he lets you through; refuse and he rams. Heavily " +
           "plated, immovable, and the biggest purse on the board. He has earned it." },
];
const BOUNTY_BY_ID = {}; for (const b of BOUNTIES) BOUNTY_BY_ID[b.id] = b;
// state: "open" (on the board) | "accepted" (taken — marked in the sector and on the
// star map) | "done". There is no separate "make this the one I'm hunting" step: per
// Steve (2026-07-21) accepting a contract is the whole commitment, and every accepted
// mark shows at once, so you can take three and clear them in whatever order you fly.
// `active` is kept only as "the mark you most recently accepted" for old saves.
let bounties = { state: {}, active: null };
for (const b of BOUNTIES) bounties.state[b.id] = "open";
function saveBounties() { try { localStorage.setItem(BOUNTY_KEY, JSON.stringify(bounties)); } catch (e) {} }
// Saves written before contracts became single-stage used "taken" (in the log) and
// "active" (the one being hunted). Both are simply "accepted" now.
function normalizeBounties() {
  for (const b of BOUNTIES) {
    const s = bounties.state[b.id];
    if (s === "taken" || s === "active") bounties.state[b.id] = "accepted";
    else if (!s) bounties.state[b.id] = "open";
  }
}
function bountyState(id) { return bounties.state[id] || "open"; }
function activeBounty() { return bounties.active ? BOUNTY_BY_ID[bounties.active] : null; }
// every contract you're carrying — all of them are marked and all of them are live
function acceptedBounties() { return BOUNTIES.filter(b => bountyState(b.id) === "accepted"); }
// keep the achievement counters in step with the board
function syncBountyCounters() {
  ep0.bountiesTotal = BOUNTIES.length;
  ep0.bountiesDone = BOUNTIES.filter(b => bountyState(b.id) === "done").length;
  saveEp0(); checkAchievements();
}
// Accepting a contract at the board is the whole transaction: it goes in your log
// and its mark goes up in the sector and on the star map. You can carry several.
function acceptBounty(id) {
  if (bountyState(id) !== "open") return;
  bounties.state[id] = "accepted";
  bounties.active = id;                   // most recently accepted (legacy field)
  bountyDeclined = false;                 // a fresh mark should trigger on arrival
  saveBounties();
}
// kept so old saves / the Missions menu's Enter still work — re-accepting a contract
// you already hold is a no-op beyond re-arming its trigger
function activateBounty(id) {
  if (bountyState(id) === "done" || bountyState(id) === "open") return;
  bounties.state[id] = "accepted"; bounties.active = id;
  bountyDeclined = false;
  saveBounties();
}
function abandonBounty(id) {
  const a = id || bounties.active;
  if (a && bountyState(a) === "accepted") bounties.state[a] = "open";
  if (bounties.active === a) bounties.active = null;
  saveBounties();
}
// Hand back a specific contract.
function handBackBounty(id) { abandonBounty(id); }
// ---- shared by the Missions view and its input handler ----
// Everything you've taken, in board order. Both the renderer and the keyboard index
// into this, so what's highlighted always matches what Enter acts on.
function collectedJobs(kind) {
  const stateOf = kind === "side" ? sideState : bountyState;
  return (kind === "side" ? SIDE_MISSIONS : BOUNTIES).filter(m => stateOf(m.id) !== "open");
}
function activateJob(kind, id) {
  if (kind === "side") activateSide(id); else activateBounty(id);
}
function completeBounty(id) {
  if (!id || bountyState(id) === "done") return;
  const b = BOUNTY_BY_ID[id];
  bounties.state[id] = "done";
  if (bounties.active === id) bounties.active = null;
  saveBounties();
  addCoin(b.reward);
  syncBountyCounters();
  achToasts.push({ name: "BOUNTY CLAIMED — " + b.reward + " coin", t: 0, dur: 4200 });
}

// ---- tile generation (spec §3.3) ----
// Base layer is uniform open space; all features live in the fixed object
// catalogue built by buildMap() (see MAP_OBJECTS / collectObjects).
function pickType(seed, gx, gy) {
  return TileType.SPACE;
}

// All fixed-map objects whose centre falls within the visible window (+margin).
// The margin is generous so large features (moon, nexus) don't pop in/out.
function collectObjects() {
  const out = [];
  const M = 12;
  const minAx = world.worldOriginX - M, maxAx = world.worldOriginX + GRID_SIZE + M;
  const minAy = world.worldOriginY - M, maxAy = world.worldOriginY + GRID_SIZE + M;
  for (const o of MAP_OBJECTS) {
    const ccx = o.ax + (o.fp - 1) / 2, ccy = o.ay + (o.fp - 1) / 2;
    if (ccx < minAx || ccx > maxAx || ccy < minAy || ccy > maxAy) continue;
    out.push({ obj: o, lax: o.ax - world.worldOriginX, lay: o.ay - world.worldOriginY });
  }
  return out;
}
function generateTile(absX, absY, startZ) {
  const type = pickType(WORLD_SEED, absX, absY);
  return {
    id: nextTileId++,
    x: absX, y: absY,
    type,
    height: 0.0,
    worldZ: startZ,
    targetZ: 0.0,
    anim: null,            // {kind, elapsed, dur, start, end, ease}
  };
}

function enqueueRise(tile) {
  tile.worldZ = -1.0;
  tile.anim = { kind:"rise", elapsed:0, dur:RISE_MS, start:-1.0, end:0.0, ease:cubicOut };
}
function enqueueDrop(tile) {
  tile.anim = { kind:"drop", elapsed:0, dur:DROP_MS, start:0.0, end:-1.0, ease:cubicIn };
  world.droppingTiles.push(tile);
}

// ---- initial fill ----
function initWorld() {
  nextTileId = 1;
  world.worldOriginX = SPAWN.ax - CENTER; world.worldOriginY = SPAWN.ay - CENTER;
  world.droppingTiles.length = 0;
  world.moving = false; world.currentMove = DIR.NONE;
  world.cameraOffsetX = world.cameraOffsetY = 0;
  world.bufferedMove = DIR.NONE;
  for (let x = 0; x < GRID_SIZE; x++) {
    world.grid[x] = new Array(GRID_SIZE);
    for (let y = 0; y < GRID_SIZE; y++) {
      world.grid[x][y] = generateTile(x, y, 0.0); // start at rest
    }
  }
}

// ============================================================
// SHIFTS (spec §2.2–2.5) — array updated atomically at move start
// ============================================================
function shiftForward() {                  // new row at y=0
  world.worldOriginY -= 1;
  for (let x = 0; x < GRID_SIZE; x++) enqueueDrop(world.grid[x][GRID_SIZE-1]);
  for (let y = GRID_SIZE-1; y >= 1; y--)
    for (let x = 0; x < GRID_SIZE; x++) world.grid[x][y] = world.grid[x][y-1];
  for (let x = 0; x < GRID_SIZE; x++) {
    const t = generateTile(world.worldOriginX + x, world.worldOriginY + 0, -1.0);
    world.grid[x][0] = t; enqueueRise(t);
  }
}
function shiftBackward() {                  // new row at y=6
  world.worldOriginY += 1;
  for (let x = 0; x < GRID_SIZE; x++) enqueueDrop(world.grid[x][0]);
  for (let y = 0; y <= GRID_SIZE-2; y++)
    for (let x = 0; x < GRID_SIZE; x++) world.grid[x][y] = world.grid[x][y+1];
  for (let x = 0; x < GRID_SIZE; x++) {
    const t = generateTile(world.worldOriginX + x, world.worldOriginY + (GRID_SIZE-1), -1.0);
    world.grid[x][GRID_SIZE-1] = t; enqueueRise(t);
  }
}
function shiftLeft() {                       // new col at x=0
  world.worldOriginX -= 1;
  for (let y = 0; y < GRID_SIZE; y++) enqueueDrop(world.grid[GRID_SIZE-1][y]);
  for (let x = GRID_SIZE-1; x >= 1; x--)
    for (let y = 0; y < GRID_SIZE; y++) world.grid[x][y] = world.grid[x-1][y];
  for (let y = 0; y < GRID_SIZE; y++) {
    const t = generateTile(world.worldOriginX + 0, world.worldOriginY + y, -1.0);
    world.grid[0][y] = t; enqueueRise(t);
  }
}
function shiftRight() {                      // new col at x=6
  world.worldOriginX += 1;
  for (let y = 0; y < GRID_SIZE; y++) enqueueDrop(world.grid[0][y]);
  for (let x = 0; x <= GRID_SIZE-2; x++)
    for (let y = 0; y < GRID_SIZE; y++) world.grid[x][y] = world.grid[x+1][y];
  for (let y = 0; y < GRID_SIZE; y++) {
    const t = generateTile(world.worldOriginX + (GRID_SIZE-1), world.worldOriginY + y, -1.0);
    world.grid[GRID_SIZE-1][y] = t; enqueueRise(t);
  }
}

// lateral camera start offset (spec §4.4); eased to 0
function lateralStartOffset(dir) {
  switch (dir) {
    case DIR.FWD:   return [ +HALF_W, -HALF_H ];
    case DIR.BACK:  return [ -HALF_W, +HALF_H ];
    case DIR.LEFT:  return [ -HALF_W, -HALF_H ];
    case DIR.RIGHT: return [ +HALF_W, +HALF_H ];
  }
  return [0, 0];
}

function beginMove(dir) {
  world.moving = true; world.currentMove = dir;
  world.shipFacing = dir;              // face the direction of travel
  switch (dir) {
    case DIR.FWD:   shiftForward();  break;
    case DIR.BACK:  shiftBackward(); break;
    case DIR.LEFT:  shiftLeft();     break;
    case DIR.RIGHT: shiftRight();    break;
  }
  const [sx, sy] = lateralStartOffset(dir);
  world.lateral = { elapsed:0, dur:LATERAL_MS, startX:sx, startY:sy, ease:cubicInOut };
  world.cameraOffsetX = sx; world.cameraOffsetY = sy;

  // Enemies live in absolute sector coords, so they stay put as the world scrolls;
  // no per-move fix-up needed (drawEnemies converts world→screen each frame).
}

// ============================================================
// UPDATE LOOP (spec §8)
// ============================================================
function tickTileAnim(tile, dt) {
  const a = tile.anim;
  if (!a) return;
  a.elapsed += dt;
  const f = a.ease(clamp01(a.elapsed / a.dur));
  tile.worldZ = lerp(a.start, a.end, f);
  if (a.elapsed >= a.dur) { tile.worldZ = a.end; tile.anim = null; }
}

function update(dt) {
  // ease the Command Nexus toward its awake/dormant target (runs even while the
  // world is paused for a menu or during combat, so the power-up/down is smooth)
  nexusWake += ((nexusAwake ? 1 : 0) - nexusWake) * Math.min(1, dt / 500);
  tickChatter(dt);                                           // crew banter: region changes + idle timer
  tickKeeper(dt);                                            // station keeper's line + the leaving beat
  tickSides();                                               // advance the active side mission
  // a tip that fired while a Y/N prompt was up waits its turn here
  if (!tutorialOpen && !objectivePrompt && !dockPrompt && _tutQueue.length) showTutorial(_tutQueue.shift());
  if (menuOpen || objectivePrompt || dockPrompt || tutorialOpen) return;   // menu / prompt / tutorial up → game paused
  // per-tile rise/drop
  for (let x = 0; x < GRID_SIZE; x++)
    for (let y = 0; y < GRID_SIZE; y++) tickTileAnim(world.grid[x][y], dt);
  for (const t of world.droppingTiles) tickTileAnim(t, dt);

  // lateral camera
  if (world.lateral) {
    const L = world.lateral;
    L.elapsed += dt;
    const f = L.ease(clamp01(L.elapsed / L.dur));
    world.cameraOffsetX = lerp(L.startX, 0, f);
    world.cameraOffsetY = lerp(L.startY, 0, f);
    // parallax: drift starfield with the world (content moves by -startOffset)
    const k = Math.min(dt, L.dur) / L.dur;
    world.bgX += -L.startX * k * BG_PARALLAX;
    world.bgY += -L.startY * k * BG_PARALLAX;
    if (L.elapsed >= L.dur) {
      world.cameraOffsetX = world.cameraOffsetY = 0;
      world.lateral = null;
    }
  }

  // cleanup dropped tiles
  for (let i = world.droppingTiles.length - 1; i >= 0; i--) {
    if (world.droppingTiles[i].anim === null) world.droppingTiles.splice(i, 1);
  }

  // move completion (lateral done AND all rises done)
  if (world.moving && !world.lateral) {
    let risingLeft = false;
    for (let x = 0; x < GRID_SIZE && !risingLeft; x++)
      for (let y = 0; y < GRID_SIZE; y++)
        if (world.grid[x][y].anim && world.grid[x][y].anim.kind === "rise") { risingLeft = true; break; }
    if (!risingLeft) {
      world.moving = false; world.currentMove = DIR.NONE;
      if (world.bufferedMove !== DIR.NONE) {
        const d = world.bufferedMove; world.bufferedMove = DIR.NONE;
        if (canMove(d)) beginMove(d);
      } else if (world.autoQueue.length) {            // run a scripted move (e.g. backing off)
        const d = world.autoQueue.shift();
        if (canMove(d)) beginMove(d);
      }
    }
  }

  world.shipBobPhase += dt / 1000;
  markExplored(world.worldOriginX + CENTER, world.worldOriginY + CENTER);   // reveal nearby map

  // report sector position so the next story segment can resume here (continuity)
  {
    const ax = world.worldOriginX + CENTER, ay = world.worldOriginY + CENTER;
    if (ax !== _lastPosAx || ay !== _lastPosAy) {
      _lastPosAx = ax; _lastPosAy = ay;
      try { window.parent.postMessage({ type: "pos", ax, ay }, "*"); } catch (e) {}
    }
  }
  // persist newly-explored fog every so often so it survives the next reload
  _fogSaveAcc += dt;
  if (_fogDirty && _fogSaveAcc > 1200) { _fogDirty = false; _fogSaveAcc = 0; saveFog(); }

  // pulling up to a trade station asks whether to dock, the same way a story
  // waypoint asks whether to continue. Declining re-arms once you leave the radius,
  // and E still docks while you're alongside, so changing your mind doesn't mean a lap.
  if (!MISSION_MODE && !combat) {
    const st = stationInRange();
    if (!st) { dockDeclined = false; dockPrompt = null; }
    else if (!dockPrompt && !dockDeclined && !dockedAt && !world.moving) dockPrompt = st;
  }

  // story waypoint: in travel mode, reaching the objective offers to continue
  if (storyTarget && !MISSION_MODE && !objectiveReached) {
    const px = world.worldOriginX + CENTER, py = world.worldOriginY + CENTER;
    const within = Math.hypot(px - storyTarget.ax, py - storyTarget.ay) <= ARRIVE_DIST;
    if (within && !objectivePrompt && !objectiveDeclined) objectivePrompt = true;  // ask first
    if (!within) objectiveDeclined = false;                                         // re-arm after leaving
  }

  // Flying into an accepted bounty's target starts that boss fight. Like the story
  // waypoint it only fires once you've settled, and re-arms if you leave and return.
  // Every accepted contract is live, so any of their marks can start its fight.
  if (!MISSION_MODE && !combat) {
    const px = world.worldOriginX + CENTER, py = world.worldOriginY + CENTER;
    let atAny = false;
    for (const ab of acceptedBounties()) {
      if (Math.hypot(px - ab.where.ax, py - ab.where.ay) > BOUNTY_ARRIVE_DIST) continue;
      atAny = true;
      if (bountyDeclined) break;
      pendingBossId = ab.boss; pendingBountyId = ab.id;
      startCombat(null);
      pendingBossId = null; pendingBountyId = null;
      break;
    }
    if (!atAny) bountyDeclined = false;      // re-arm once we're clear of every mark
  }

  if (combatCooldown > 0) combatCooldown -= dt;
  if (combat) {
    tickCombat(dt);
  } else {
    updateEnemies(dt);
    // collision with a wandering enemy drops us into turn-based combat
    if (combatCooldown <= 0) {
      const px = world.worldOriginX + CENTER, py = world.worldOriginY + CENTER;
      for (const e of enemies) {
        // only red (hostile) ships start a fight; collide when it reaches the player tile
        if (e.hostile && Math.hypot(e.ax - px, e.ay - py) < 0.9) { startCombat(e); break; }
      }
    }
  }
}

// ============================================================
// RENDERING (spec §6)
// ============================================================
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let SHIP_ANCHOR = { x: 0, y: 0 };
let showIDs = false, showGrid = false;
let gTime = 0;                          // global time (ms), set by main loop
let mouseX = -1, mouseY = -1;           // cursor in canvas space (for combat menu/hover)

// ============================================================
// TILE SPRITE CACHE — each type pre-rendered once to an offscreen
// canvas, then blitted (spec §6 batching/sprite-based rendering).
// ============================================================
const TILE_DEPTH = 10;
const SPR_W = TILE_WIDTH;                // sprite width  = full diamond width
const SPR_H = TILE_HEIGHT + TILE_DEPTH;  // top diamond + side thickness
const SS = 2;                            // supersample factor for crispness
const tileSprites = {};                  // TileType -> HTMLCanvasElement

const clampByte = v => v < 0 ? 0 : v > 255 ? 255 : v | 0;
function shade(hex, amt) {
  const h = hex.replace('#', '');
  const r = clampByte(parseInt(h.substr(0,2),16) + amt);
  const g = clampByte(parseInt(h.substr(2,2),16) + amt);
  const b = clampByte(parseInt(h.substr(4,2),16) + amt);
  return `rgb(${r},${g},${b})`;
}
function diamondPath(g, cx, cy, hw, hh) {
  g.beginPath();
  g.moveTo(cx, cy - hh); g.lineTo(cx + hw, cy);
  g.lineTo(cx, cy + hh); g.lineTo(cx - hw, cy);
  g.closePath();
}

function buildTileSprite(type) {
  const st = TILE_STYLE[type];
  const c = document.createElement("canvas");
  c.width = SPR_W * SS; c.height = SPR_H * SS;
  const g = c.getContext("2d");
  g.scale(SS, SS);

  const hw = HALF_W, hh = HALF_H, depth = TILE_DEPTH;
  const cx = hw, cy = hh;                 // centre of the top diamond in sprite space

  // --- side faces (front-left + front-right) ---
  g.fillStyle = shade(st.side, 6);
  g.beginPath();
  g.moveTo(0, hh); g.lineTo(hw, 2*hh); g.lineTo(hw, 2*hh + depth); g.lineTo(0, hh + depth);
  g.closePath(); g.fill();
  g.fillStyle = shade(st.side, -10);
  g.beginPath();
  g.moveTo(hw, 2*hh); g.lineTo(2*hw, hh); g.lineTo(2*hw, hh + depth); g.lineTo(hw, 2*hh + depth);
  g.closePath(); g.fill();
  // emissive rim along the bottom edge for energy tiles
  if (st.glow) {
    g.strokeStyle = st.glow; g.lineWidth = 1.5; g.globalAlpha = 0.8;
    g.beginPath(); g.moveTo(0, hh); g.lineTo(hw, 2*hh); g.lineTo(2*hw, hh); g.stroke();
    g.globalAlpha = 1;
  }

  // --- top face ---
  g.save();
  diamondPath(g, cx, cy, hw, hh); g.clip();
  if (type === TileType.SPACE) {
    g.fillStyle = "rgba(14,20,40,0.14)";         // open space: barely-there tint
    g.fillRect(0, 0, 2*hw, 2*hh);
  } else if (type === TileType.EMPTY) {
    g.fillStyle = "rgba(8,11,20,0.42)";          // void: mostly see-through
    g.fillRect(0, 0, 2*hw, 2*hh);
  } else {
    const grad = g.createLinearGradient(0, 0, 0, 2*hh);
    grad.addColorStop(0, shade(st.top, 16));
    grad.addColorStop(1, shade(st.top, -12));
    g.fillStyle = grad; g.fillRect(0, 0, 2*hw, 2*hh);
  }
  drawTileDetail(g, type, st, cx, cy, hw, hh);
  g.restore();

  // --- edge highlight ---
  g.lineWidth = 1.1; g.strokeStyle = st.edge; g.globalAlpha = 0.9;
  diamondPath(g, cx, cy, hw, hh); g.stroke();
  g.globalAlpha = 1;

  return c;
}

function drawTileDetail(g, type, st, cx, cy, hw, hh) {
  switch (type) {
    case TileType.GROUND: {                       // hull deck: panel grooves + rivets
      g.strokeStyle = shade(st.top, 24); g.lineWidth = 1;
      g.beginPath();
      g.moveTo(cx, cy - hh*0.5); g.lineTo(cx, cy + hh*0.5);
      g.moveTo(cx - hw*0.5, cy); g.lineTo(cx + hw*0.5, cy);
      g.stroke();
      g.fillStyle = shade(st.top, 40);
      for (const [dx,dy] of [[-0.45,0],[0.45,0],[0,-0.45],[0,0.45]]) {
        g.beginPath(); g.arc(cx + dx*hw, cy + dy*hh, 1.1, 0, 6.283); g.fill();
      }
      break;
    }
    case TileType.METAL: {                         // reinforced alloy: bolts + cross brace
      g.strokeStyle = st.edge; g.lineWidth = 1.4; g.globalAlpha = 0.5;
      diamondPath(g, cx, cy, hw*0.62, hh*0.62); g.stroke();
      g.globalAlpha = 1;
      g.fillStyle = shade(st.top, -28);
      for (const [dx,dy] of [[-0.6,0],[0.6,0],[0,-0.6],[0,0.6]]) {
        g.beginPath(); g.arc(cx + dx*hw, cy + dy*hh, 1.6, 0, 6.283); g.fill();
      }
      break;
    }
    case TileType.HAZARD: {                         // reactor vent: hot core + chevrons
      const rg = g.createRadialGradient(cx, cy, 1, cx, cy, hw*0.8);
      rg.addColorStop(0, st.glow);
      rg.addColorStop(0.5, "rgba(255,90,44,0.55)");
      rg.addColorStop(1, "rgba(255,90,44,0)");
      g.fillStyle = rg; g.fillRect(0, 0, 2*hw, 2*hh);
      g.strokeStyle = "rgba(20,8,6,0.8)"; g.lineWidth = 2;
      for (let i = 1; i <= 2; i++) {
        diamondPath(g, cx, cy, hw*(0.32*i), hh*(0.32*i)); g.stroke();
      }
      break;
    }
    case TileType.BOOST: {                           // warp pad: concentric energy rings
      const rg = g.createRadialGradient(cx, cy, 1, cx, cy, hw*0.9);
      rg.addColorStop(0, st.glow);
      rg.addColorStop(0.4, "rgba(70,230,255,0.45)");
      rg.addColorStop(1, "rgba(70,230,255,0)");
      g.fillStyle = rg; g.fillRect(0, 0, 2*hw, 2*hh);
      g.strokeStyle = st.glow; g.globalAlpha = 0.85;
      for (let i = 1; i <= 3; i++) {
        g.lineWidth = 1.2; g.globalAlpha = 0.85 - i*0.18;
        diamondPath(g, cx, cy, hw*(0.22*i), hh*(0.22*i)); g.stroke();
      }
      g.globalAlpha = 1;
      break;
    }
    case TileType.EMPTY: {                            // void: a few faint stars
      g.fillStyle = "rgba(200,215,255,0.7)";
      for (const [dx,dy,r] of [[-0.3,-0.2,0.8],[0.25,0.15,0.6],[0.1,-0.35,0.5]]) {
        g.beginPath(); g.arc(cx + dx*hw, cy + dy*hh, r, 0, 6.283); g.fill();
      }
      break;
    }
  }
}

function buildAllTileSprites() {
  for (const k of Object.values(TileType)) tileSprites[k] = buildTileSprite(k);
}

// ============================================================
// SPACE BACKGROUND — parallax starfield + nebula (behind grid)
// ============================================================
let stars = [], nebulae = [];
// ambient starfield velocity (px per ms) — keeps the field cruising while idle
const AMBIENT_DRIFT_X = -0.004;
const AMBIENT_DRIFT_Y = -0.012;
function genBackground(w, h) {
  stars = [];
  const n = Math.max(60, Math.floor(w * h / 2600));
  const layers = [ {m:0.25}, {m:0.5}, {m:1.0} ];   // parallax depths
  for (let i = 0; i < n; i++) {
    const L = layers[(Math.random()*layers.length)|0];
    const tint = Math.random() < 0.15 ? "#bcd2ff" : (Math.random() < 0.3 ? "#ffd9c2" : "#ffffff");
    stars.push({
      x: Math.random()*w, y: Math.random()*h,
      r: 0.5 + Math.random()*1.3, m: L.m,
      a: 0.4 + Math.random()*0.6,
      tw: Math.random()*6.283, sp: 0.5 + Math.random()*1.6,
      c: tint,
    });
  }
  const big = Math.max(w, h);
  // fixed nebula-cloud positions/sizes; colours are chosen per zone at draw time
  nebulae = [
    { x: w*0.28, y: h*0.30, r: big*0.45 },
    { x: w*0.74, y: h*0.62, r: big*0.50 },
    { x: w*0.52, y: h*0.88, r: big*0.40 },
  ];
}
function drawBackground(w, h, t, region) {
  const theme = REGION_THEME[region] || REGION_THEME[REGION.NEBULA];
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, theme.grad[0]);
