  grad.addColorStop(0.6, theme.grad[1]);
  grad.addColorStop(1, theme.grad[2]);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);

  for (let i = 0; i < nebulae.length; i++) {
    const nb = nebulae[i];
    const nx = nb.x + (world.bgX + t*AMBIENT_DRIFT_X)*0.15, ny = nb.y + (world.bgY + t*AMBIENT_DRIFT_Y)*0.15;
    const rg = ctx.createRadialGradient(nx, ny, 0, nx, ny, nb.r);
    rg.addColorStop(0, theme.neb[i % theme.neb.length]); rg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);
  }

  // steady ambient drift so the field keeps moving even when the player is idle
  const driftX = t * AMBIENT_DRIFT_X;
  const driftY = t * AMBIENT_DRIFT_Y;
  for (const s of stars) {
    const sx = (((s.x + (world.bgX + driftX)*s.m) % w) + w) % w;
    const sy = (((s.y + (world.bgY + driftY)*s.m) % h) + h) % h;
    const tw = 0.55 + 0.45*Math.sin(t*0.003*s.sp + s.tw);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(sx, sy, s.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.floor(rect.width  * dpr);
  canvas.height = Math.floor(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  SHIP_ANCHOR.x = rect.width / 2;
  SHIP_ANCHOR.y = rect.height / 2 - 40;
  genBackground(rect.width, rect.height);
  if (!enemies.length) spawnEnemies();
}
window.addEventListener("resize", () => { resize(); });

// world position of centre tile at rest
const CENTER_WORLD_X = (CENTER - CENTER) * HALF_W; // 0
const CENTER_WORLD_Y = (CENTER + CENTER) * HALF_H; // 96

function worldToScreen(worldX, worldY, worldZ) {
  return {
    x: SHIP_ANCHOR.x + (worldX - CENTER_WORLD_X) + world.cameraOffsetX,
    y: SHIP_ANCHOR.y + (worldY - CENTER_WORLD_Y) + world.cameraOffsetY
         - worldZ * Z_PIXELS_PER_UNIT,
  };
}

function tileWorld(tile, ax, ay) {
  // use absolute coords relative to the current origin so the grid stays put
  const lx = ax, ly = ay;                  // 0..6 array coords for projection
  const worldX = (lx - ly) * HALF_W;
  const worldY = (lx + ly) * HALF_H;
  return { worldX, worldY, worldZ: tile.worldZ };
}

function drawDiamond(cx, cy, style, alpha, label, id, type) {
  ctx.globalAlpha = alpha;

  // additive glow halo for energy tiles (warp / vent)
  if (style.glow) { ctx.save(); ctx.shadowColor = style.glow; ctx.shadowBlur = 16; }
  // blit the pre-rendered sprite; sprite local (HALF_W,HALF_H) maps to (cx,cy)
  ctx.drawImage(tileSprites[type], cx - HALF_W, cy - HALF_H, SPR_W, SPR_H);
  if (style.glow) ctx.restore();

  if (showGrid) {
    ctx.globalAlpha = alpha * 0.5;
    ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, cy - HALF_H); ctx.lineTo(cx + HALF_W, cy);
    ctx.lineTo(cx, cy + HALF_H); ctx.lineTo(cx - HALF_W, cy);
    ctx.closePath(); ctx.stroke();
  }

  if (showIDs && label) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.font = "8px Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(label, cx, cy - 2);
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.fillText("#" + id, cx, cy + 7);
  }
  ctx.globalAlpha = 1;
}

// fill just the top diamond face of a tile at (cx,cy) — used for the zone wash
function fillDiamondTop(cx, cy, color, alpha) {
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(cx, cy - HALF_H); ctx.lineTo(cx + HALF_W, cy);
  ctx.lineTo(cx, cy + HALF_H); ctx.lineTo(cx - HALF_W, cy);
  ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.globalAlpha = 1;
}

// ---- world object rendering ----
const frac = v => v - Math.floor(v);
const noise = (i, s) => frac(Math.sin(i * 12.9898 + s * 78.233) * 43758.5453);

function objCenterScreen(it) {
  const fp = it.obj.fp;
  const cax = it.lax + (fp - 1) / 2, cay = it.lay + (fp - 1) / 2;
  const wx = (cax - cay) * HALF_W, wy = (cax + cay) * HALF_H;
  return worldToScreen(wx, wy, 0);
}

function drawObject(it) {
  const s = objCenterScreen(it);
  switch (it.obj.type) {
    case OBJ.PLANET:     drawPlanet(s.x, s.y, it.obj); break;
    case OBJ.ASTEROID_S: drawAsteroid(s.x, s.y, 1, it.obj); break;
    case OBJ.ASTEROID_L: drawAsteroid(s.x, s.y, 2, it.obj); break;
    case OBJ.STATION:    drawStation(s.x, s.y, it.obj); break;
    case OBJ.TRADE:      drawTrade(s.x, s.y, it.obj); break;
    case OBJ.CRYSTAL:    drawCrystal(s.x, s.y, it.obj); break;
    case OBJ.WRECK:      drawWreck(s.x, s.y, it.obj); break;
    case OBJ.WARSHIP:    drawWarship(s.x, s.y, it.obj); break;
    case OBJ.MOON:       drawMoon(s.x, s.y, it.obj); break;
    case OBJ.NEXUS:      drawNexus(s.x, s.y, it.obj); break;
  }
}

// Real planet art: a flat billboard centred on the tile, scaled to the footprint.
// `variant` selects Planet1 (<0.5) or Planet2. Falls back to the procedural planet.
const PLANET_SCALE = 0.95;   // sprite width = footprint tiles * TILE_WIDTH * this
const PLANET_VOFF  = 0.50;   // share of sprite height above the tile centre (0.5 = centred)
function drawPlanet(x, y, o) {
  const img = planetImg[o.variant < 0.5 ? 0 : 1];
  if (!img.complete || img.naturalWidth === 0) { drawPlanetProcedural(x, y, o); return; }
  const dw = o.fp * TILE_WIDTH * PLANET_SCALE;
  const dh = dw * (img.naturalHeight / img.naturalWidth);
  ctx.drawImage(img, x - dw / 2, y - dh * PLANET_VOFF, dw, dh);
}

function drawPlanetProcedural(x, y, o) {
  const R = o.fp * HALF_W * 0.82;
  const hue = o.hue;
  ctx.save();
  // atmosphere halo
  const atmo = ctx.createRadialGradient(x, y, R*0.85, x, y, R*1.18);
  atmo.addColorStop(0, `hsla(${hue},80%,62%,0)`);
  atmo.addColorStop(0.7, `hsla(${hue},85%,62%,0.28)`);
  atmo.addColorStop(1, `hsla(${hue},85%,62%,0)`);
  ctx.fillStyle = atmo;
  ctx.beginPath(); ctx.arc(x, y, R*1.18, 0, 6.283); ctx.fill();
  // body, lit from top-left
  const body = ctx.createRadialGradient(x - R*0.38, y - R*0.38, R*0.1, x, y, R);
  body.addColorStop(0, `hsl(${hue},62%,70%)`);
  body.addColorStop(0.55, `hsl(${hue},58%,46%)`);
  body.addColorStop(1, `hsl(${hue},55%,15%)`);
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(x, y, R, 0, 6.283); ctx.fill();
  // surface bands (clipped to sphere)
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, R, 0, 6.283); ctx.clip();
  ctx.fillStyle = `hsla(${(hue+28)%360},55%,28%,0.45)`;
  for (let i = 0; i < 4; i++) {
    const by = y - R + (noise(i+1, o.variant)) * 2 * R;
    const bh = R * (0.10 + 0.18 * noise(i+7, o.variant));
    ctx.beginPath();
    ctx.ellipse(x, by, R, bh, 0, 0, 6.283); ctx.fill();
  }
  ctx.restore();
  // ring on some planets
  if (o.variant > 0.66) {
    ctx.strokeStyle = `hsla(${(hue+50)%360},70%,72%,0.75)`;
    ctx.lineWidth = Math.max(2, R*0.10);
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.5);
    ctx.beginPath(); ctx.ellipse(0, 0, R*1.5, R*0.42, 0, 0, 6.283); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// Real asteroid art: one rock sprite, sized by `scale` (1 = small, 2 = large) and
// varied per-instance with a slight tumble + occasional flip. Falls back procedurally.
const ASTEROID_SCALE = 1.25;   // sprite width = scale tiles * TILE_WIDTH * this
function drawAsteroid(x, y, scale, o) {
  const img = asteroidImg;
  if (!img.complete || img.naturalWidth === 0) { drawAsteroidProcedural(x, y, scale, o); return; }
  const dw = scale * TILE_WIDTH * ASTEROID_SCALE;
  const dh = dw * (img.naturalHeight / img.naturalWidth);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((o.variant - 0.5) * 0.6);              // gentle tumble, keeps lighting believable
  if (o.variant > 0.5) ctx.scale(-1, 1);            // mirror half of them for variety
  ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  ctx.restore();
}

function drawAsteroidProcedural(x, y, scale, o) {
  const R = scale * HALF_W * 0.58;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(o.variant * 6.283);
  // jagged rock body
  const n = 9;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * 6.283;
    const rr = R * (0.68 + 0.34 * noise(i, o.variant));
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.85;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  const g = ctx.createLinearGradient(-R, -R, R, R);
  g.addColorStop(0, "#857a6c"); g.addColorStop(1, "#3f3930");
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = "#2a261f"; ctx.stroke();
  // craters
  ctx.fillStyle = "rgba(35,31,26,0.55)";
  for (let i = 0; i < 2 + scale; i++) {
    const cx = (noise(i+3, o.variant) - 0.5) * R, cy = (noise(i+11, o.variant) - 0.5) * R;
    ctx.beginPath(); ctx.arc(cx, cy, R * (0.10 + 0.10*noise(i+5,o.variant)), 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

// ---- TRADE STATION: the manned dockable station. Bigger and deliberately more
// built-up than the comm satellites so it reads as a place at a glance, with a
// slow-rotating docking ring and a green "docking clear" beacon. Each station has its
// own art (tradeImg, keyed by id); the procedural draw is the per-station fallback.
const TRADE_SCALE = 1.5;
function drawTrade(x, y, o) {
  const img = tradeImg[o.id];
  if (img && img.complete && img.naturalWidth) {
    const dw = o.fp * TILE_WIDTH * TRADE_SCALE;
    const dh = dw * (img.naturalHeight / img.naturalWidth);
    ctx.save(); ctx.translate(x, y);
    ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
    ctx.restore();
  } else drawTradeProcedural(x, y, o);
  // beacon + name plate, drawn over the art either way so a station is findable
  const puls = 0.5 + 0.5 * Math.sin(gTime * 0.004 + (o.ax || 0));
  const R = o.fp * HALF_W * 0.5;
  ctx.save();
  ctx.fillStyle = `rgba(126,231,135,${0.5 + 0.5 * puls})`;
  ctx.shadowColor = "#7ee787"; ctx.shadowBlur = 10 + 8 * puls;
  ctx.beginPath(); ctx.arc(x, y - R * 0.95, 3.2, 0, 6.283); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.font = "bold 10px Consolas, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(2,4,10,0.85)";
  ctx.strokeText(o.name || "Station", x, y - R * 1.25);
  ctx.fillStyle = "#bfffce";
  ctx.fillText(o.name || "Station", x, y - R * 1.25);
  ctx.restore();
}
function drawTradeProcedural(x, y, o) {
  const R = o.fp * HALF_W * 0.46;
  const spin = gTime * 0.00018;
  ctx.save();
  ctx.translate(x, y);
  // outer docking ring (slowly turning, squashed to sit in the iso plane)
  ctx.save(); ctx.rotate(spin);
  ctx.strokeStyle = "#5f7d92"; ctx.lineWidth = R * 0.16;
  ctx.beginPath(); ctx.ellipse(0, 0, R, R * 0.68, 0, 0, 6.283); ctx.stroke();
  ctx.strokeStyle = "#8fb4c8"; ctx.lineWidth = R * 0.05;
  ctx.beginPath(); ctx.ellipse(0, 0, R, R * 0.68, 0, 0, 6.283); ctx.stroke();
  // spokes into the hub
  ctx.strokeStyle = "#4a6274"; ctx.lineWidth = R * 0.09;
  for (let i = 0; i < 4; i++) {
    const a = i * 1.5708;
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R * 0.68); ctx.stroke();
  }
  ctx.restore();
  // central hub: stacked drum + lit windows
  const hw = R * 0.5, hh = R * 0.46;
  const g = ctx.createLinearGradient(0, -hh, 0, hh);
  g.addColorStop(0, "#93aab8"); g.addColorStop(1, "#3d4d5c");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, hw, hh, 0, 0, 6.283); ctx.fill();
  ctx.strokeStyle = "#22303c"; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = "rgba(255,214,120,0.9)";
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * 6.283 + spin * 2;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * hw * 0.6, Math.sin(a) * hh * 0.6, R * 0.055, 0, 6.283);
    ctx.fill();
  }
  ctx.restore();
}

// Real station art: a comm satellite (beacon baked in). Small object, varied per
// instance with a slight tilt + occasional flip. Falls back to drawStationProcedural.
const STATION_SCALE = 1.6;   // sprite width = footprint tiles * TILE_WIDTH * this
function drawStation(x, y, o) {
  const img = stationImg;
  if (!img.complete || img.naturalWidth === 0) { drawStationProcedural(x, y, o); return; }
  const dw = o.fp * TILE_WIDTH * STATION_SCALE;
  const dh = dw * (img.naturalHeight / img.naturalWidth);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((o.variant - 0.5) * 0.5);
  if (o.variant > 0.5) ctx.scale(-1, 1);
  ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  ctx.restore();
}

function drawStationProcedural(x, y, o) {
  const s = HALF_W * 0.55;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(o.variant * 0.8 - 0.4);
  // solar-panel arm + panels
  ctx.fillStyle = "#2b3340";
  ctx.fillRect(-s*1.7, -s*0.12, s*3.4, s*0.24);
  ctx.fillStyle = "#2f6ea8";
  for (const sx of [-s*1.7, s*0.8]) {
    ctx.fillRect(sx, -s*0.55, s*0.9, s*1.1);
  }
  ctx.strokeStyle = "rgba(10,20,35,0.7)"; ctx.lineWidth = 1;
  for (const sx of [-s*1.7, s*0.8]) {
    ctx.beginPath();
    ctx.moveTo(sx + s*0.45, -s*0.55); ctx.lineTo(sx + s*0.45, s*0.55);
    ctx.moveTo(sx, 0); ctx.lineTo(sx + s*0.9, 0); ctx.stroke();
  }
  // central hub
  ctx.fillStyle = "#c6cdd6"; ctx.beginPath(); ctx.arc(0, 0, s*0.5, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#7e8a98"; ctx.beginPath(); ctx.arc(0, 0, s*0.28, 0, 6.283); ctx.fill();
  ctx.restore();
  // blinking beacon
  const blink = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(gTime * 0.006 + o.variant * 10));
  ctx.fillStyle = `rgba(255,70,70,${blink})`;
  ctx.beginPath(); ctx.arc(x, y - s*0.7, 1.8, 0, 6.283); ctx.fill();
}

// NEBULA — a cluster of glowing crystalline shards refracting starlight.
// Real crystal art: a glowing shard rosette. Its radial symmetry means a per-
// instance rotation reads naturally. Falls back to the procedural crystal.
const CRYSTAL_SCALE = 1.05;   // sprite width = footprint tiles * TILE_WIDTH * this
function drawCrystal(x, y, o) {
  const img = crystalImg;
  if (!img.complete || img.naturalWidth === 0) { drawCrystalProcedural(x, y, o); return; }
  const dw = o.fp * TILE_WIDTH * CRYSTAL_SCALE;
  const dh = dw * (img.naturalHeight / img.naturalWidth);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((o.variant - 0.5) * 1.2);
  ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  ctx.restore();
}

function drawCrystalProcedural(x, y, o) {
  const R = o.fp * HALF_W * 0.55;
  const hue = o.hue;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((o.variant - 0.5) * 1.2);
  // soft refraction halo
  const halo = ctx.createRadialGradient(0, 0, R * 0.2, 0, 0, R * 1.4);
  halo.addColorStop(0, `hsla(${hue},90%,70%,0.30)`);
  halo.addColorStop(1, `hsla(${hue},90%,70%,0)`);
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0, 0, R * 1.4, 0, 6.283); ctx.fill();
  // a few elongated shards fanning out
  const shards = 3 + Math.floor(o.variant * 3);
  for (let i = 0; i < shards; i++) {
    const a = (i / shards) * 6.283 + o.variant * 3;
    const len = R * (0.7 + 0.5 * noise(i, o.variant));
    const wdt = R * 0.16;
    const dx = Math.cos(a), dy = Math.sin(a) * 0.7;
    const g = ctx.createLinearGradient(0, 0, dx * len, dy * len);
    g.addColorStop(0, `hsla(${(hue + 30) % 360},85%,82%,0.95)`);
    g.addColorStop(1, `hsla(${hue},80%,45%,0.85)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-dy * wdt, dx * wdt);
    ctx.lineTo(dx * len, dy * len);
    ctx.lineTo(dy * wdt, -dx * wdt);
    ctx.closePath(); ctx.fill();
  }
  // bright core
  ctx.fillStyle = `hsla(${hue},95%,90%,0.95)`;
  ctx.beginPath(); ctx.arc(0, 0, R * 0.16, 0, 6.283); ctx.fill();
  ctx.restore();
}

// Real wreck art: a torn hull fragment (distress beacon baked in). Tumbles per
// instance. Falls back to drawWreckProcedural until loaded.
const WRECK_SCALE = 1.4;   // sprite width = footprint tiles * TILE_WIDTH * this
function drawWreck(x, y, o) {
  const img = wreckImg;
  if (!img.complete || img.naturalWidth === 0) { drawWreckProcedural(x, y, o); return; }
  const dw = o.fp * TILE_WIDTH * WRECK_SCALE;
  const dh = dw * (img.naturalHeight / img.naturalWidth);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((o.variant - 0.5) * 0.8);
  if (o.variant > 0.5) ctx.scale(-1, 1);
  ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  ctx.restore();
}

// BROKEN MOON — twisted hull fragment from the ancient battle, with a faint
// distress beacon still flickering after all these years.
function drawWreckProcedural(x, y, o) {
  const R = HALF_W * 0.7;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(o.variant * 6.283);
  // jagged broken hull plate
  const n = 7;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * 6.283;
    const rr = R * (0.45 + 0.7 * noise(i + 2, o.variant));
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.7;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  const g = ctx.createLinearGradient(-R, -R, R, R);
  g.addColorStop(0, "#6e5a48"); g.addColorStop(0.5, "#4a4a52"); g.addColorStop(1, "#241f1c");
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "#7a4326"; ctx.lineWidth = 1; ctx.stroke();  // rust seams
  // exposed structural ribs
  ctx.strokeStyle = "rgba(20,18,16,0.7)"; ctx.lineWidth = 1.4;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(-R * 0.6, i * R * 0.25); ctx.lineTo(R * 0.6, i * R * 0.25); ctx.stroke();
  }
  ctx.restore();
  // flickering distress beacon
  const flick = Math.sin(gTime * 0.01 + o.variant * 20) > 0.6 ? 0.9 : 0.12;
  ctx.fillStyle = `rgba(255,90,60,${flick})`;
  ctx.beginPath(); ctx.arc(x + R * 0.4, y - R * 0.3, 1.6, 0, 6.283); ctx.fill();
}

// SILENT ARMADA — a derelict warship hanging silent in formation. Uses the NE
// ship sprite (dormant/derelict: cooled and dimmed), with a slow navigation
// light that pulses every few seconds. Falls back to the procedural hull below
// until the sprite has loaded.
const WARSHIP_TINT = "rgba(58,80,116,0.5)";   // cool, dim — reads as powered-down
// Real warship art: a dormant top-down capital hull. Each ship in the armada gets
// its own fixed random heading + drift so the lattice reads as a scattered dead
// fleet, not clones. Falls back to drawWarshipProcedural until the sprite loads.
const WARSHIP_SCALE = 1.35;   // sprite width = footprint tiles * TILE_WIDTH * this
function drawWarship(x, y, o) {
  const img = warshipImg;
  if (!img.complete || img.naturalWidth === 0) { drawWarshipProcedural(x, y, o); return; }
  const big = o.big ? 1.6 : 1;
  const W = o.fp * TILE_WIDTH * WARSHIP_SCALE * big, H = W * (img.naturalHeight / img.naturalWidth);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(o.variant * 6.283);              // full random heading per ship
  ctx.globalAlpha = 0.95;
  ctx.drawImage(img, -W / 2, -H / 2, W, H);
  ctx.restore();
  // dim, slow navigation light
  const pulse = 0.12 + 0.55 * Math.pow(0.5 + 0.5 * Math.sin(gTime * 0.0011 + o.variant * 9), 4);
  ctx.fillStyle = `rgba(150,195,255,${pulse})`;
  ctx.beginPath(); ctx.arc(x, y, 1.5 * big, 0, 6.283); ctx.fill();
}

// Procedural fallback hull — dust-grey wedge with faded gold trim.
function drawWarshipProcedural(x, y, o) {
  const big = o.big ? 1.6 : 1;
  const L = HALF_W * 0.95 * big, Wd = HALF_H * 0.62 * big;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(o.ang || -0.5);
  // hull — sleek wedge
  ctx.beginPath();
  ctx.moveTo(L, 0);
  ctx.lineTo(-L * 0.55, -Wd);
  ctx.lineTo(-L, -Wd * 0.35);
  ctx.lineTo(-L, Wd * 0.35);
  ctx.lineTo(-L * 0.55, Wd);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, -Wd, 0, Wd);
  g.addColorStop(0, "#46566c"); g.addColorStop(0.5, "#2c3850"); g.addColorStop(1, "#161d2a");
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "#5d6f88"; ctx.lineWidth = 1; ctx.stroke();
  // faded gold spine
  ctx.strokeStyle = "rgba(196,166,92,0.55)"; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(L * 0.7, 0); ctx.lineTo(-L * 0.85, 0); ctx.stroke();
  // settled dust on the upper hull
  ctx.fillStyle = "rgba(210,215,230,0.10)";
  ctx.beginPath();
  ctx.moveTo(L * 0.6, -Wd * 0.1); ctx.lineTo(-L * 0.5, -Wd * 0.85); ctx.lineTo(-L * 0.9, -Wd * 0.3);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  // dim, slow navigation light
  const pulse = 0.12 + 0.55 * Math.pow(0.5 + 0.5 * Math.sin(gTime * 0.0011 + o.variant * 9), 4);
  ctx.fillStyle = `rgba(150,195,255,${pulse})`;
  ctx.beginPath(); ctx.arc(x, y, 1.5 * big, 0, 6.283); ctx.fill();
}

// BROKEN MOON — real art: a shattered planetoid with a glowing core. Drawn as a
// flat billboard centred on the tile, scaled to the footprint. Falls back to the
// procedural drawing below until the sprite loads.
const MOON_SCALE = 0.95;     // sprite width = footprint tiles * TILE_WIDTH * this
const MOON_VOFF  = 0.50;     // share of sprite height above the tile centre (0.5 = centred)
function drawMoon(x, y, o) {
  const img = moonImg;
  if (!img.complete || img.naturalWidth === 0) { drawMoonProcedural(x, y, o); return; }
  const dw = o.fp * TILE_WIDTH * MOON_SCALE;
  const dh = dw * (img.naturalHeight / img.naturalWidth);
  ctx.drawImage(img, x - dw / 2, y - dh * MOON_VOFF, dw, dh);
}

function drawMoonProcedural(x, y, o) {
  const R = o.fp * HALF_W * 0.42;
  const gap = R * 0.28;
  ctx.save();
  ctx.translate(x, y);
  // magma glow bleeding from the fractured core
  const core = ctx.createRadialGradient(0, 0, R * 0.05, 0, 0, R * 0.9);
  core.addColorStop(0, "rgba(255,180,70,0.95)");
  core.addColorStop(0.4, "rgba(240,90,20,0.55)");
  core.addColorStop(1, "rgba(120,30,10,0)");
  ctx.fillStyle = core;
  ctx.fillRect(-R * 1.1, -R * 1.1, R * 2.2, R * 2.2);
  // two stone hemispheres pulled apart, lit from upper-left
  for (const dir of [-1, 1]) {
    ctx.save();
    ctx.translate(dir * gap, dir * gap * 0.3);
    ctx.beginPath();
    // half disc — the flat edge faces the fracture line
    ctx.arc(0, 0, R, dir > 0 ? -1.05 : 2.09, dir > 0 ? 2.09 : -1.05, false);
    ctx.closePath();
    const body = ctx.createRadialGradient(-R * 0.4, -R * 0.4, R * 0.1, 0, 0, R * 1.2);
    body.addColorStop(0, "#8b8b93"); body.addColorStop(0.6, "#54555e"); body.addColorStop(1, "#22232b");
    ctx.fillStyle = body; ctx.fill();
    // glowing magma along the fractured face
    ctx.strokeStyle = "rgba(255,140,50,0.85)"; ctx.lineWidth = R * 0.06;
    ctx.beginPath();
    ctx.moveTo(0, -R * 0.92); ctx.lineTo(0, R * 0.92); ctx.stroke();
    // craters
    ctx.fillStyle = "rgba(25,25,30,0.5)";
    for (let i = 0; i < 4; i++) {
      const ca = noise(i + dir * 5, o.variant) * 6.283;
      const cr = R * (0.3 + 0.5 * noise(i + 9, o.variant));
      ctx.beginPath();
      ctx.arc(Math.cos(ca) * cr * dir, Math.sin(ca) * cr, R * (0.07 + 0.08 * noise(i + 1, o.variant)), 0, 6.283);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
}

// COMMAND NEXUS — the colossal tiered fortress-station at the heart of the fleet,
// central spire firing an energy beam. Real art: cross-fade the DORMANT (dark) and
// ACTIVE (lit, beam firing) layers on a slow sine so it powers up and down. The two
// arts are framed differently, so each is scaled to a common on-screen base width
// (NEXUS_SCALE) and anchored by its base bottom (NEXUS_BASE_DROP below the tile) so
// the two stations register. Falls back to the procedural station until loaded.
const NEXUS_SCALE     = 1.155;  // on-screen station base width = footprint tiles * TILE_WIDTH * this
const NEXUS_BASE_DROP = 0.15;   // base bottom drawn this share of base-width below the tile centre
const NEXUS_WAKE_LIFT = 0.07;   // how far (share of base-width) the fortress rises when fully awake
function drawNexusLayer(img, bb, cx, yBottom, bodyW) {
  const s = bodyW / bb.cw;                       // scale so content width → bodyW
  ctx.drawImage(img, cx - bb.ccx * s, yBottom - bb.maxY * s,
                img.naturalWidth * s, img.naturalHeight * s);
}
function drawNexus(x, y, o) {
  const d = nexusDormantImg, a = nexusActiveImg;
  if (!d.complete || d.naturalWidth === 0) { drawNexusProcedural(x, y, o); return; }
  const bodyW = o.fp * TILE_WIDTH * NEXUS_SCALE;
  // as it wakes, the whole fortress rises a little (both layers together, so the
  // cross-fade stays clean) — it sits lowest dormant, highest fully active.
  const yBottom = y + bodyW * NEXUS_BASE_DROP - bodyW * NEXUS_WAKE_LIFT * nexusWake;
  drawNexusLayer(d, NEXUS_BB.dormant, x, yBottom, bodyW);
  if (nexusWake > 0.01 && a.complete && a.naturalWidth) {   // fade the lit layer in as it wakes
    // once awake, add a subtle surge pulse; scaled by the eased wake level so the
    // power-up/down ramps smoothly rather than popping on.
    const glow = nexusWake * (0.82 + 0.18 * Math.sin(gTime * 0.0022));
    ctx.save(); ctx.globalAlpha = clamp01(glow);
    drawNexusLayer(a, NEXUS_BB.active, x, yBottom, bodyW);
    ctx.restore();
  }
}

function drawNexusProcedural(x, y, o) {
  const R = o.fp * HALF_W * 0.62;
  const spin = gTime * 0.00006;          // the ring turns, barely, for the first time in centuries
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, 0.62);                    // foreshorten into the iso plane
  // dormant amber wash
  const amb = ctx.createRadialGradient(0, 0, R * 0.1, 0, 0, R * 1.5);
  amb.addColorStop(0, "rgba(255,170,60,0.18)");
  amb.addColorStop(1, "rgba(255,170,60,0)");
  ctx.fillStyle = amb; ctx.beginPath(); ctx.arc(0, 0, R * 1.5, 0, 6.283); ctx.fill();
  // the great ring
  ctx.save();
  ctx.rotate(spin);
  ctx.lineWidth = R * 0.18; ctx.strokeStyle = "#5a4a32";
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.stroke();
  ctx.lineWidth = R * 0.06; ctx.strokeStyle = "#8a7142";
  ctx.beginPath(); ctx.arc(0, 0, R * 1.08, 0, 6.283); ctx.stroke();
  // gear teeth around the ring
  for (let i = 0; i < 28; i++) {
    const a = (i / 28) * 6.283;
    ctx.save(); ctx.rotate(a); ctx.translate(R * 1.12, 0);
    ctx.fillStyle = "#4a3c28"; ctx.fillRect(0, -R * 0.05, R * 0.10, R * 0.10);
    ctx.restore();
  }
  // radiating docking arms / cathedral spokes
  ctx.strokeStyle = "#6b5836"; ctx.lineWidth = R * 0.05;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * 6.283;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * R * 0.32, Math.sin(a) * R * 0.32);
    ctx.lineTo(Math.cos(a) * R * 0.92, Math.sin(a) * R * 0.92);
    ctx.stroke();
  }
  ctx.restore();
  // central core hub
  const hub = ctx.createRadialGradient(0, 0, R * 0.04, 0, 0, R * 0.34);
  hub.addColorStop(0, "rgba(120,190,255,0.95)");
  hub.addColorStop(0.5, "rgba(60,120,200,0.7)");
  hub.addColorStop(1, "rgba(20,40,80,0.2)");
  ctx.fillStyle = hub; ctx.beginPath(); ctx.arc(0, 0, R * 0.34, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#1b2230"; ctx.beginPath(); ctx.arc(0, 0, R * 0.16, 0, 6.283); ctx.fill();
  ctx.restore();
  // amber maintenance lights blinking around the rim
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * 6.283 + spin;
    const lx = x + Math.cos(a) * R, ly = y + Math.sin(a) * R * 0.62;
    const b = 0.25 + 0.6 * (0.5 + 0.5 * Math.sin(gTime * 0.003 + i * 1.7));
    ctx.fillStyle = `rgba(255,180,70,${b})`;
    ctx.beginPath(); ctx.arc(lx, ly, 1.8, 0, 6.283); ctx.fill();
  }
}

function currentRegion() {
  return regionAt(world.worldOriginX + CENTER, world.worldOriginY + CENTER);
}
function render() {
  const r = canvas.getBoundingClientRect();
  drawBackground(r.width, r.height, gTime, currentRegion());

  // Collect renderables: live grid tiles + dropping tiles + world objects.
  // `band` (ax+ay) drives iso depth; `order` tie-breaks within a band
  // (0 tiles, 1 rising tiles, 2 objects → objects composite on top).
  const items = [];
  for (let x = 0; x < GRID_SIZE; x++)
    for (let y = 0; y < GRID_SIZE; y++) {
      const t = world.grid[x][y];
      const rising = t.anim && t.anim.kind === "rise";
      items.push({ kind:"tile", tile:t, ax:x, ay:y, band:x+y, order:(rising?1:0), z:t.worldZ });
    }
  for (const t of world.droppingTiles) {
    const ax = t.x - world.worldOriginX, ay = t.y - world.worldOriginY;
    items.push({ kind:"tile", tile:t, ax, ay, band:ax+ay, order:0, z:t.worldZ, dropping:true });
  }
  for (const it of collectObjects()) {
    const fp = it.obj.fp;
    const cax = it.lax + (fp - 1) / 2, cay = it.lay + (fp - 1) / 2;
    items.push({ kind:"obj", obj:it.obj, lax:it.lax, lay:it.lay, band:cax+cay, order:2, z:0 });
  }

  items.sort((a, b) =>
    (a.band - b.band) || (a.z - b.z) || (a.order - b.order));

  for (const it of items) {
    if (it.kind === "obj") { drawObject(it); continue; }
    const w = tileWorld(it.tile, it.ax, it.ay);
    const s = worldToScreen(w.worldX, w.worldY, w.worldZ);
    const style = TILE_STYLE[it.tile.type];
    let alpha = 1;
    if (it.dropping) alpha = clamp01(1 + it.tile.worldZ);
    drawDiamond(s.x, s.y, style, alpha, style.label, it.tile.id, it.tile.type);
    // wash each tile in its zone's colour so the four regions read at a glance
    const absX = it.dropping ? it.tile.x : world.worldOriginX + it.ax;
    const absY = it.dropping ? it.tile.y : world.worldOriginY + it.ay;
    fillDiamondTop(s.x, s.y, REGION_THEME[regionAt(absX, absY)].tile, alpha);
  }

  if (combat) {
    drawCombat();
    drawResourceBar();                    // salvage ticking up mid-fight is the point
    if (menuOpen) drawMenu();
    return;
  }

  // Enemy ships — wandering, drawn before the player so the player sits on top
  drawEnemies();

  // Ship — fixed at centre anchor, drawn after all tiles (spec §6.5)
  const bob = Math.sin(world.shipBobPhase * 3) * 2;
  drawShip(SHIP_ANCHOR.x, SHIP_ANCHOR.y - 18 + bob, world.shipFacing);

  // highlight centre tile (3,3) footprint
  const c = worldToScreenCenterMarker();
  ctx.strokeStyle = "rgba(126,231,135,0.9)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(c.x, c.y - HALF_H);
  ctx.lineTo(c.x + HALF_W, c.y);
  ctx.lineTo(c.x, c.y + HALF_H);
  ctx.lineTo(c.x - HALF_W, c.y);
  ctx.closePath(); ctx.stroke();

  drawObjectiveMarker();                  // story waypoint in the world
  if (objectivePrompt) drawObjectivePrompt();
  else if (dockPrompt) drawDockPrompt();  // "request docking?" alongside a station

  drawBountyMarker();                     // accepted contract's target in the world
  drawResourceBar();                      // scrap / coin readout, always visible
  drawMiniMap();                          // corner radar: local charted space + contacts
  drawScanHint();                         // "F — SCAN" prompt, bottom-left

  // sector map overlay sits on top of the world; pause menu on top of everything
  if (mapOpen) drawMapView();
  if (menuOpen) drawMenu();
}

const CHATTER_IDLE_MS = 26000;            // quiet time before someone speaks up
const CHATTER_MIN_GAP = 9000;             // never two lines closer than this
let chatter = null;                       // { who, text, t, dur }
let chatterIdle = 0, chatterLast = -1e9, _chatterSeen = {}, _lastRegion = null;
let _holdFullNoted = false;               // salvage was left behind this fight

let _hostileNoted = false;                // a hostile is currently being tracked

// ============================================================
// AUDIO LEVELS
// Player-facing mix, set in Options and persisted. These are MULTIPLIERS over the
// hand-tuned per-channel mix already in the code (BGM.vol, SFX_VOL, the VO channels'
// own vol), so the relative balance survives and the sliders only scale it. Master
// multiplies all three.
// ============================================================
const AUDIO_KEY = "stargear_audio_v1";
const AUDIO_CHANNELS = [
  { key: "master", label: "Master" },
  { key: "voice",  label: "Voice"  },
  { key: "bgm",    label: "Music"  },
  { key: "sfx",    label: "Effects"},
];
let audioMix = { master: 1, voice: 1, bgm: 1, sfx: 1 };
try {
  const raw = localStorage.getItem(AUDIO_KEY);
  if (raw) Object.assign(audioMix, JSON.parse(raw));
} catch (e) {}
function saveAudioMix() { try { localStorage.setItem(AUDIO_KEY, JSON.stringify(audioMix)); } catch (e) {} }
function volVoice() { return audioMix.master * audioMix.voice; }
function volBgm()   { return audioMix.master * audioMix.bgm; }
function volSfx()   { return audioMix.master * audioMix.sfx; }
// Applied live so dragging a slider is audible immediately rather than on the next cue.
function applyAudioMix() {
  saveAudioMix();
  if (typeof BGM !== "undefined" && BGM.current && !BGM.current._fade) {
    try { BGM.current.volume = Math.max(0, Math.min(1, BGM.vol * volBgm())); } catch (e) {}
  }
  for (const ch of [typeof CHATTER_VO !== "undefined" ? CHATTER_VO : null,
                    typeof KEEPER_VO !== "undefined" ? KEEPER_VO : null,
                    typeof CREW_BARK_VO !== "undefined" ? CREW_BARK_VO : null,
                    typeof BOSS_VO !== "undefined" ? BOSS_VO : null]) {
    if (ch && ch._cur) { try { ch._cur.volume = Math.max(0, Math.min(1, ch.vol * volVoice())); } catch (e) {} }
  }
}

// ---- chatter voice-over ----
// One clip per line in audio/Explore/, on its own channel so it layers over the
// music and SFX. Entirely optional: if a clip is missing the line still plays as

// ============================================================
// EXPLORATION SCAN — the free-roam verb. Sweeps the space around the ship and
// turns up salvage and points of interest. Range and yield are gated on the
// Sensor Suite module (the same part that gives Kael his combat Scan), and a
// fitted Cargo Hold widens the sweep further — so scanning is something you
// upgrade into, per the to-do's "upgradable via module".
//
// POIs are generated deterministically from the sector seed, so the same spot
// always holds the same find and a scan can't be farmed by re-scanning: each
// site is consumed once found (`poiFound`).
// ============================================================
const SCAN_BASE_R = 6;                   // tiles swept with no sensor module
const SCAN_COOLDOWN_MS = 2600;
let scanCooldown = 0;
let scanPulse = null;                    // { t, dur, r } expanding sweep ring

// can't re-farm the same wreck.
const POI_KEY = "stargear_poi_v1";

function savePoi() { try { localStorage.setItem(POI_KEY, JSON.stringify([...poiFound])); } catch (e) {} }

function scanRange() {
  let r = SCAN_BASE_R;
  if (moduleActive("sensor")) r += 5;                       // the Sensor Suite is the real upgrade
  if (moduleActive("cargo") || moduleActive("cargobay")) r += 2;   // bigger hold, better sorting gear
  return r;
}
// Is there a point of interest at this tile? Deterministic from the map seed.
// Density is low so a sweep usually turns up one thing, sometimes nothing.
function poiAt(ax, ay) {
  if (Math.hypot(ax, ay) > MAP_RADIUS - 2) return null;
  // Density is deliberately low: a full-range sweep (~530 tiles) should turn up a
  // couple of things, not twenty. At 0.4% a base sweep finds something about half
  // the time and an upgraded one reliably pays — which is what makes the Sensor
  // Suite worth grid space. Raising this quickly trivialises the economy.
  const roll = rand01(MAP_SEED ^ 0x9E37, ax, ay, 71);
  if (roll > 0.004) return null;
  const kind = rand01(MAP_SEED ^ 0x9E37, ax, ay, 72);
  const rg = regionAt(ax, ay);
  // Scanning NEVER yields coin. Coin is earned at a station — that's the whole point
  // of the hold filling up and forcing a trade run, and a scan that paid cash let you
  // skip the loop entirely. The old coin `cache` type (25% of finds) is gone and scrap
  // is down from 55% to 30% to 12% (Steve, 2026-07-21: scans still returned scrap too
  // often), so a sweep is overwhelmingly trade goods you still have to sell somewhere.
  if (kind < 0.12) return { type: "scrap", ax, ay,
    amount: 3 + Math.floor(rand01(MAP_SEED ^ 0x9E37, ax, ay, 73) * 9) };
  // a goods crate, weighted to what the region would plausibly be shipping
  const g = rg === REGION.NEBULA ? "relics" : rg === REGION.MOON ? "ore"
          : rg === REGION.ARMADA ? "parts" : "meds";
  return { type: "goods", ax, ay, goods: g,
    amount: 4 + Math.floor(rand01(MAP_SEED ^ 0x9E37, ax, ay, 75) * 10) };
}

function doScan() {
  if (combat || scanCooldown > 0) return;
  if (!moduleActive("sensor") && !SCAN_WORKS_UNPOWERED) {
    setScanMsg("Sensor Suite offline — fit and power it in Ship Config.");
    scanCooldown = 900;
    return;
  }
  const R = scanRange();
  scanCooldown = SCAN_COOLDOWN_MS;
  scanPulse = { t: 0, dur: 900, r: R };
  sfx("scan");
  showTutorial("scan");                     // first sweep → what a scan is for
  // a "scan at the marker" step only counts if we're actually at the marker

  const finds = [];
  for (let ax = px - R; ax <= px + R; ax++)
    for (let ay = py - R; ay <= py + R; ay++) {
      if (Math.hypot(ax - px, ay - py) > R) continue;
      const key = ax + "," + ay;
      if (poiFound.has(key)) continue;
      const p = poiAt(ax, ay);
      if (p) { poiFound.add(key); finds.push(p); }
    }
  if (!finds.length) { setScanMsg("Sweep complete — nothing out there."); return; }
  savePoi();
  say("scanFind");

  let gotScrap = 0, missed = false;
  const gotGoods = {};
  for (const f of finds) {
    if (f.type === "scrap") {
      const got = addScrap(f.amount);
      gotScrap += got;
      if (got < f.amount) missed = true;
    } else {                                  // goods crate (the coin `cache` type is gone)
      const room = Math.min(f.amount, cargoFree());
      if (room > 0) { econ.goods[f.goods] = goodsHeld(f.goods) + room; gotGoods[f.goods] = (gotGoods[f.goods] || 0) + room; saveEcon(); }
      if (room < f.amount) missed = true;
    }
  }

  if (gotScrap) parts.push("+" + gotScrap + " scrap");
  for (const g in gotGoods) parts.push("+" + gotGoods[g] + " " + COMMODITY_BY_ID[g].name);
  if (missed) { parts.push("some left behind — hold full"); _holdFullNoted = true; }

}

// small always-on prompt so the verb is discoverable at all

// ---- DOCKING -------------------------------------------------------------
// Trade stations are the only places you can sell scrap, repair modules, buy parts
// and take bounties. Fly alongside one and a prompt appears; E opens the dock.
// Widened from 3 (Steve, 2026-07-21) — at 3 tiles you could slide past the station
// without it ever offering, which reads as the station being broken rather than missed.
const DOCK_DIST = 4.5;                   // tiles from the station centre
let dockedAt = null;                     // the station def while its screen is open
// Arriving alongside a station raises a yes/no panel, exactly like the story
// waypoint's "progress the story?" — see drawDockPrompt / the update() trigger.
let dockPrompt = null;                   // the station being offered, or null
let dockDeclined = false;                // said no — don't re-ask until we leave the radius
let _dockPromptHit = null;               // clickable YES / NO rects
function stationInRange() {
  const px = world.worldOriginX + CENTER, py = world.worldOriginY + CENTER;
  for (const s of TRADE_STATIONS)
    if (Math.hypot(px - s.ax, py - s.ay) <= DOCK_DIST) return s;
  return null;
}
// ---- station keepers: who's behind the counter, and what they say ----
// One greeting when you dock, one send-off when you leave. Lines rotate through their
// pool rather than picking at random, same rule as the crew's CHATTER, so you don't hear
// the same greeting twice running. Text only for now — if these are ever voiced, hang the
// clip off each line the way CHATTER does and read the duration at runtime.
const KEEPERS = {
  hub: { name: "Marla Quen", accent: "#f2c14e",
    welcome: [
      "Waypoint Hub, and welcome to it. Clamps are on, take your time.",
      "Back again. Hold's a mess, I imagine — the counter's open.",

    ],
    farewell: [

      "Clamps released. Don't be a stranger.",
    ] },
  neb: { name: "Oris Vale", accent: "#c99af5",
    welcome: [
      "The nebula let you through, then. It doesn't always.",
      "Ah — a buyer. Or a seller. You've the look of both.",
      "Careful what you brought in with you. Things follow, out here.",
    ],
    farewell: [
      "Go carefully. The Veil remembers a face.",
      "Take what you've learned. Leave what you haven't.",
    ] },
  moon: { name: "Dova Krezh", accent: "#ff9a5a",
    welcome: [
      "Quarry Station. Ore's priced on the board and I don't haggle.",
      "You're on the pad. Mind the dust, it gets everywhere.",
      "Buying or selling? Either way, be quick about it.",
    ],
    farewell: [
      "Clear of the clamps. Don't scratch my dock on the way out.",
      "Right. Go on, then.",
    ] },
  armada: { name: "Wick", accent: "#8dffb0",
    welcome: [
      "Salvage Reach! You brought me something, didn't you? You did.",
      "Ohh, that hull's got some new dents. Want me to take them off your hands?",
      "Come in, come in — mind the cable, that one's live.",
    ],
    farewell: [
      "Bring me back something with SERIAL NUMBERS on it!",
      "Fly safe! Well — fly. Safe's optional.",
    ] },
};
// Keeper voice-over. One clip per line in audio/Station/<id>_NN.mp3 — 01..03 welcomes,
// 04..05 send-offs, matching the order of each keeper's entry above. Cut from the four
// per-character masters by transcribe_station.py -> align_station.py -> cut_station.py.
// Optional throughout: a missing clip or blocked autoplay leaves a silent subtitle.
const KEEPER_VO = { vol: 0.95, _cache: {}, _cur: null };
function stopKeeperVO() {
  const a = KEEPER_VO._cur;
  if (a) { try { a.pause(); a.currentTime = 0; } catch (e) {} KEEPER_VO._cur = null; }
}
function playKeeperVO(file) {
  stopKeeperVO();
  let a = KEEPER_VO._cache[file];
  if (!a) {
    a = new Audio("audio/Station/" + file);
    a.preload = "auto";
    a.addEventListener("error", () => { a._missing = true; }, { once: true });
    KEEPER_VO._cache[file] = a;
  }
  if (a._missing) return null;
  a.volume = Math.max(0, Math.min(1, KEEPER_VO.vol * volVoice()));
  try { a.currentTime = 0; } catch (e) {}
  const p = a.play();
  if (p && p.catch) p.catch(() => {});        // autoplay not unlocked yet — subtitle only
  KEEPER_VO._cur = a;
  return a;
}

let keeperSay = null;                    // { text, name, accent, t, dur }
let dockLeaving = 0;                     // gTime at which a farewell finishes and we undock
let keeperPending = null;                // { id, at } — a greeting waiting to start
const _keeperSeen = {};                  // per-station, per-pool rotation counters
// The greeting holds off a beat after docking so the screen and the dock clunk land first
// and the keeper reads as speaking to you, rather than talking over your arrival.
const KEEPER_GREET_DELAY = 1000;

// Runs from update() before its menu-paused early return, since the dock screen *is* a
// menu — the keeper's line has to keep ticking while everything else is held.
function tickKeeper(dt) {
  if (keeperPending && gTime >= keeperPending.at) {
    const id = keeperPending.id; keeperPending = null;
    if (dockedAt && dockedAt.id === id && !dockLeaving) keeperLine(id, "welcome");
  }
  if (keeperSay) { keeperSay.t += dt; if (keeperSay.t >= keeperSay.dur) keeperSay = null; }
  if (dockLeaving && gTime >= dockLeaving) undock();
}

function keeperLine(id, pool) {
  const k = KEEPERS[id]; if (!k || !k[pool] || !k[pool].length) return;
  const key = id + "|" + pool;
  const i = (_keeperSeen[key] = (_keeperSeen[key] || 0)) % k[pool].length;
  _keeperSeen[key]++;
  const c = keeperSay = { text: k[pool][i], name: k.name, accent: k.accent, t: 0,
                          startedAt: gTime, dur: pool === "farewell" ? 2600 : 6400 };
  // clip number is the line's position across the whole entry: welcomes then send-offs
  const n = (pool === "welcome" ? 1 : k.welcome.length + 1) + i;
  const a = playKeeperVO(id + "_" + String(n).padStart(2, "0") + ".mp3");
  if (!a) return;
  // Hold the subtitle for as long as the clip actually runs, so text and voice leave
  // together — and re-recording a line needs no code change. Metadata can arrive after
  // the fact, so the leaving beat is re-timed here too rather than staying a guess.
  const sync = () => {
    if (!a.duration || !isFinite(a.duration) || keeperSay !== c) return;
    c.dur = Math.max(1800, a.duration * 1000 + 800);
    // anchored to when the LINE started, not to when the metadata happened to arrive —
    // otherwise a slow-loading clip drags the send-off out well past the audio
    if (dockLeaving) dockLeaving = c.startedAt + a.duration * 1000 + 450;
  };
  if (a.readyState >= 1) sync();
  else a.addEventListener("loadedmetadata", sync, { once: true });
}

function acceptDock() { const s = dockPrompt; dockPrompt = null; dockAt(s); }
function declineDock() { dockPrompt = null; dockDeclined = true; }
function dockAt(s) {
  if (!s) return;
  dockPrompt = null;
  touchStock(s.id);                       // catch this station's shelves up on arrival
  recordIntel(s.id);                      // and remember what it's paying today
  dockedAt = s; stationTab = 0; stationSel = 0; stationMsg = ""; stationConfirm = null;
  menuOpen = true; menuView = "station";
  mapOpen = false;
  dockLeaving = 0;
  keeperSay = null;
  keeperPending = { id: s.id, at: gTime + KEEPER_GREET_DELAY };
  sfx("dock");
  bgm("station");                         // calm dockside track (falls back silently if absent)
  showTutorial("dock");                   // first docking → what the keeper deals in
}
// Leaving runs through the keeper's send-off first: the UI panel drops away, they get a
// beat to say it, then we actually undock. Every exit route (Esc, the UNDOCK tab, the back
// button) goes through here, so none of them can skip the goodbye. Hitting it again during
// the beat leaves immediately, so it can't trap anyone who's in a hurry.
function requestUndock() {
  if (dockLeaving) { dockLeaving = 0; undock(); return; }
  const id = dockedAt && dockedAt.id;
  if (!id || !KEEPERS[id]) { undock(); return; }
  keeperPending = null;                   // leaving before the greeting even started
  dockLeaving = gTime + 2200;             // provisional; keeperLine re-times it to the clip
  keeperLine(id, "farewell");
  if (keeperSay) dockLeaving = gTime + keeperSay.dur - 300;
}
function undock() {
  dockedAt = null; menuOpen = false; menuView = "root";
  dockLeaving = 0; keeperSay = null; keeperPending = null;
  stopKeeperVO();                         // cut the line if you walk out over it
  dockPrompt = null; dockDeclined = true;   // you're still in range — don't immediately re-ask
  bgm(combat ? "combat" : "explore");
}
// The old always-on "⏵ DOCK AT …" pill was removed once arriving raised its own Y/N
// prompt — two things asking the same question. Declining still leaves E working while
// you're in range (see the keydown handler), so there's a way back in without flying off.

// ---- BOUNTY TARGET MARKERS -----------------------------------------------
// Every accepted contract's mark, drawn like the story waypoint but in bounty amber
// so the two never read as the same thing. Carry three, see three.
function drawBountyMarker() {
  if (combat) return;
  for (const b of acceptedBounties()) drawWorldMark(b.where.ax, b.where.ay, b.title, "242,193,78", "BOUNTY");
  // the active side-mission step can also carry a mark, in mission green so the
  // two never read as the same objective
  const st = activeSideStep();

    const mk = st.mark();
    if (mk) drawWorldMark(mk.ax, mk.ay, activeSide().title, "141,255,176", "JOB");
  }
}
function drawWorldMark(mkAx, mkAy, title, rgb, kind) {
  const r = canvas.getBoundingClientRect();
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top; if (!(visH > 120)) visH = r.height; visH = Math.min(visH, r.height);
  const s = absTileToScreen(mkAx, mkAy);
  const margin = 54;
  const onScreen = s.x > margin && s.x < r.width - margin && s.y > margin && s.y < visH - margin;
  const puls = 0.5 + 0.5 * Math.sin(gTime * 0.005);
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  if (onScreen) {
    const sz = 15 + 4 * puls;
    ctx.strokeStyle = `rgba(${rgb},${0.55 + 0.45 * puls})`; ctx.lineWidth = 2.4;
    ctx.shadowColor = `rgb(${rgb})`; ctx.shadowBlur = 12;
    ctx.beginPath();                                   // a diamond-in-crosshair
    ctx.moveTo(s.x, s.y - sz); ctx.lineTo(s.x + sz, s.y);
    ctx.lineTo(s.x, s.y + sz); ctx.lineTo(s.x - sz, s.y); ctx.closePath(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(s.x - sz * 1.5, s.y); ctx.lineTo(s.x - sz * 0.6, s.y);
    ctx.moveTo(s.x + sz * 0.6, s.y); ctx.lineTo(s.x + sz * 1.5, s.y); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgb(${rgb})`; ctx.font = "bold 11px Consolas, monospace";
    ctx.fillText(kind, s.x, s.y - sz - 6);
    ctx.fillStyle = `rgba(${rgb},0.85)`; ctx.font = "10px Consolas, monospace";
    ctx.fillText(title, s.x, s.y + sz + 14);
  } else {                                             // off-screen: rim arrow
    const cx = r.width / 2, cy = visH / 2;
    let dx = s.x - cx, dy = s.y - cy;
    const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
    const rad = Math.min(r.width, visH) / 2 - 46;
    const ax = cx + dx * rad, ay = cy + dy * rad;
    ctx.translate(ax, ay); ctx.rotate(Math.atan2(dy, dx));
    ctx.fillStyle = `rgba(${rgb},${0.6 + 0.4 * puls})`;
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, 7); ctx.lineTo(-8, -7); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// ---- MINI-MAP ------------------------------------------------------------
// Corner radar showing a local window of charted space around the ship, so you
// can read your surroundings without opening the full Star Map. Same data and
// colours as the Star Map (`mapCanvas` fog + zone pixels), just zoomed in and
// always centred on you. Free-roam only — combat has its own screen furniture.
const MINIMAP_R = 34;                    // tiles of sector visible around the ship
function drawMiniMap() {
  if (combat || menuOpen || mapOpen || objectivePrompt || dockPrompt) return;
  const r = canvas.getBoundingClientRect();
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top; if (!(visH > 200)) visH = r.height; visH = Math.min(visH, r.height);
  const D = 132, x = r.width - D - 16, y = visH - D - 16;   // bottom-right, clear of the resource chip
  const cx = x + D / 2, cy = y + D / 2, rad = D / 2;
  const px = world.worldOriginX + CENTER, py = world.worldOriginY + CENTER;
  const span = 2 * MINIMAP_R + 1, scale = D / span;        // screen px per tile
  const pulse = 0.5 + 0.5 * Math.sin(gTime * 0.006);
  ctx.save();
  // dish + charted pixels, clipped to the circle
  ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.283);
  ctx.fillStyle = "rgba(6,10,20,0.82)"; ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.283); ctx.clip();
  ctx.imageSmoothingEnabled = false;
  // source window in fog-map pixel space, centred on the ship
  const sx = px + MAP_RADIUS - MINIMAP_R, sy = py + MAP_RADIUS - MINIMAP_R;
  ctx.globalAlpha = 0.9;
  ctx.drawImage(mapCanvas, sx, sy, span, span, x, y, D, D);
  ctx.globalAlpha = 1;
  // objective + hostiles, drawn in the same local frame
  const toX = ax => cx + (ax - px) * scale, toY = ay => cy + (ay - py) * scale;
  if (storyTarget && !objectiveReached) {
    let tx = toX(storyTarget.ax), ty = toY(storyTarget.ay);
    const d = Math.hypot(tx - cx, ty - cy);
    if (d > rad - 8) { const k = (rad - 8) / d; tx = cx + (tx - cx) * k; ty = cy + (ty - cy) * k; }  // clamp to the rim
    ctx.strokeStyle = `rgba(126,231,135,${0.6 + 0.4 * pulse})`; ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(tx, ty - 5); ctx.lineTo(tx + 5, ty); ctx.lineTo(tx, ty + 5); ctx.lineTo(tx - 5, ty);
    ctx.closePath(); ctx.stroke();
  }
  for (const e of enemies) {
    if (!e.hostile) continue;
    const w = enemyWorldPos(e);
    const iax = Math.round(w.ax), iay = Math.round(w.ay);
    if (iax < -MAP_RADIUS || iax > MAP_RADIUS || iay < -MAP_RADIUS || iay > MAP_RADIUS) continue;
    if (!explored[(iax + MAP_RADIUS) + (iay + MAP_RADIUS) * FOG_SIZE]) continue;   // uncharted → hidden
    const ex = toX(w.ax), ey = toY(w.ay);
    if (Math.hypot(ex - cx, ey - cy) > rad - 3) continue;                          // outside the dish
    ctx.fillStyle = "#ff5a5a";
    ctx.beginPath(); ctx.arc(ex, ey, 2.6, 0, 6.283); ctx.fill();
  }
  // trade stations in range — the thing you're usually steering back toward
  for (const st of TRADE_STATIONS) {
    const sx = toX(st.ax), sy = toY(st.ay);
    if (Math.hypot(sx - cx, sy - cy) > rad - 4) continue;
    ctx.strokeStyle = "#8fd8ff"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(sx, sy, 3.2, 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx - 5, sy); ctx.lineTo(sx + 5, sy); ctx.stroke();
  }
  for (const abm of acceptedBounties()) {           // every contract you're carrying
    let bx = toX(abm.where.ax), by = toY(abm.where.ay);
    const d = Math.hypot(bx - cx, by - cy);
    if (d > rad - 8) { const k = (rad - 8) / d; bx = cx + (bx - cx) * k; by = cy + (by - cy) * k; }
    ctx.strokeStyle = `rgba(242,193,78,${0.6 + 0.4 * pulse})`; ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(bx, by - 5); ctx.lineTo(bx + 5, by); ctx.lineTo(bx, by + 5); ctx.lineTo(bx - 5, by);
    ctx.closePath(); ctx.stroke();
  }
  ctx.restore();
  // player pip at dead centre + a chevron for facing
  ctx.fillStyle = "#7ee787";
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 6.283); ctx.fill();
  ctx.strokeStyle = `rgba(126,231,135,${0.25 + 0.4 * pulse})`; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(cx, cy, 6 + 2 * pulse, 0, 6.283); ctx.stroke();
  // rim + label
  ctx.strokeStyle = "rgba(120,200,220,0.5)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.283); ctx.stroke();
  ctx.fillStyle = "rgba(150,200,220,0.75)"; ctx.font = "bold 9px Consolas, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText(REGION_NAME[currentRegion()].toUpperCase(), cx, y - 6);
  ctx.fillStyle = "rgba(150,200,220,0.45)"; ctx.font = "9px Consolas, monospace";
  ctx.fillText("M — STAR MAP", cx, y + D + 12);
  ctx.restore();
}

// ---- SCRAP / COIN readout ------------------------------------------------
// Top-right chip, live in both free-roam and combat, so the hold filling up is
// something you watch happen rather than discover at a station. The scrap figure
// turns amber near capacity and red at full (pickups stop there).
function drawResourceBar() {
  // The root menu overlays the game without dimming it, so the chip stays up there —
  // you shouldn't have to close the menu to check what you're carrying. Sub-views draw
  // a full-screen backdrop and own the whole canvas, so the chip drops out for those.
  if (mapOpen || (menuOpen && menuView !== "root")) return;
  if (bossIntro) return;                 // encounter splash owns the screen
  // Not during a fight (Steve, 2026-07-21): the hold is an exploration concern and the
  // combat HUD is busy enough. Salvage still announces itself with its "+N SCRAP" floater.
  if (combat) return;
  const r = canvas.getBoundingClientRect();
  const cap = cargoCap(), used = cargoUsed(), pct = cap ? used / cap : 0;
  const goods = goodsTotal();
  const scrapCol = pct >= 1 ? "#ff7a6a" : pct >= 0.85 ? "#ffc766" : "#cfeef6";
  // Two rows only (Steve, 2026-07-21): SCRAP and COIN. Trade goods still eat hold
  // space, so they stay visible as the grey second segment of the bar — the itemised
  // manifest lives in Menu → Ship → CARGO.
  const w = 188, h = 52, x = r.width - w - 16, y = 14;
  ctx.save();
  ctx.fillStyle = "rgba(4,10,18,0.72)";
  ctx.strokeStyle = "rgba(120,200,220,0.45)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.fill(); ctx.stroke();
  ctx.textBaseline = "middle"; ctx.font = "bold 13px Consolas, monospace";
  // Icons sit in the left gutter; labels shift right to clear them, but only when
  // the art actually loaded — otherwise every row keeps the old flush-left position.
  const ICON = 16, icons = iconReady(scrapIcon) && iconReady(coinIcon);
  const tx = x + (icons ? 34 : 12);
  // scrap row + a capacity bar underneath it. The number is scrap alone; the bar is
  // the whole HOLD (scrap green, trade goods grey on top), so a hold full of ore still
  // reads as "no room for salvage" rather than silently eating pickups.
  ctx.textAlign = "left";
  if (icons) ctx.drawImage(scrapIcon, x + 12, y + 15 - ICON / 2, ICON, ICON);
  ctx.fillStyle = "rgba(150,200,220,0.7)"; ctx.fillText("SCRAP", tx, y + 15);
  ctx.textAlign = "right"; ctx.fillStyle = scrapCol;
  ctx.fillText(econ.scrap + " / " + cap, x + w - 12, y + 15);
  const bx = x + 12, bw = w - 24, by = y + 26;
  ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(bx, by, bw, 3);
  if (goods) {                                    // scrap portion, then goods on top
    ctx.fillStyle = "#8dffb0"; ctx.fillRect(bx, by, bw * clamp01(econ.scrap / cap), 3);
    ctx.fillStyle = "#9fb4c8"; ctx.fillRect(bx + bw * clamp01(econ.scrap / cap), by, bw * clamp01(goods / cap), 3);
  } else {
    ctx.fillStyle = scrapCol; ctx.fillRect(bx, by, bw * clamp01(pct), 3);
  }
  const ry = y + 40;
  // coin row
  ctx.textAlign = "left";
  if (icons) ctx.drawImage(coinIcon, x + 12, ry - ICON / 2, ICON, ICON);
  ctx.fillStyle = "rgba(150,200,220,0.7)"; ctx.fillText("COIN", tx, ry);
  ctx.textAlign = "right"; ctx.fillStyle = "#f2c14e";
  ctx.fillText("" + econ.coin, x + w - 12, ry);
  ctx.restore();
}

// Absolute sector tile -> screen point (mirrors the tile projection).
function absTileToScreen(ax, ay) {
  const lx = ax - world.worldOriginX, ly = ay - world.worldOriginY;
  return worldToScreen((lx - ly) * HALF_W, (lx + ly) * HALF_H, 0);
}
// Draws the story objective as a pulsing in-world waypoint; when it's off the

function drawObjectiveMarker() {
  if (!storyTarget || objectiveReached) return;
  const r = canvas.getBoundingClientRect();
  // The embedded canvas is taller than the visible iframe, so clamp the edge arrow
  // to the VISIBLE height, or it lands below the fold (off-screen).
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top; if (!(visH > 120)) visH = r.height; visH = Math.min(visH, r.height);
  const s = absTileToScreen(storyTarget.ax, storyTarget.ay);
  const margin = 54;
  const onScreen = s.x > margin && s.x < r.width - margin && s.y > margin && s.y < visH - margin;
  const puls = 0.5 + 0.5 * Math.sin(gTime * 0.005);
  const glow = `rgba(126,231,135,${0.55 + 0.45 * puls})`;
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  if (onScreen) {
    const sz = 16 + 4 * puls;
    ctx.strokeStyle = glow; ctx.lineWidth = 2;
    ctx.shadowColor = "#7ee787"; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y - sz); ctx.lineTo(s.x + sz, s.y);
    ctx.lineTo(s.x, s.y + sz); ctx.lineTo(s.x - sz, s.y); ctx.closePath(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#bfffce"; ctx.font = "bold 11px Consolas, monospace";
    ctx.fillText("OBJECTIVE", s.x, s.y - sz - 6);
    ctx.fillStyle = "rgba(190,255,206,0.85)"; ctx.font = "10px Consolas, monospace";
    ctx.fillText(storyTarget.label, s.x, s.y + sz + 14);
  } else {
    const cx = r.width / 2, cy = visH / 2;
    const ang = Math.atan2(s.y - cy, s.x - cx);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const hw = r.width / 2 - margin, hh = visH / 2 - margin;
    const t = Math.min(hw / Math.max(Math.abs(ca), 1e-3), hh / Math.max(Math.abs(sa), 1e-3));
    const ex = cx + ca * t, ey = cy + sa * t;
    ctx.save();
    ctx.translate(ex, ey); ctx.rotate(ang);
    ctx.fillStyle = glow; ctx.shadowColor = "#7ee787"; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-9, -10); ctx.lineTo(-9, 10); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = "#bfffce"; ctx.font = "bold 10px Consolas, monospace";
    ctx.fillText(storyTarget.label.toUpperCase(), ex, ey - 16);
  }
  ctx.restore();
}

function worldToScreenCenterMarker() {
  const worldX = (CENTER - CENTER) * HALF_W;
  const worldY = (CENTER + CENTER) * HALF_H;
  // ignore camera offset so marker stays under the ship
  return {
    x: SHIP_ANCHOR.x + (worldX - CENTER_WORLD_X),
    y: SHIP_ANCHOR.y + (worldY - CENTER_WORLD_Y),

}

// Cache of tinted ship sprites keyed by source image, then by colour, so red
// (hostile), blue (neutral) and grey (dormant armada) variants of the same
// sprite can coexist on screen without re-tinting every frame. The sprite is a
// transparent cutout, so we tint only its opaque pixels via "source-atop".
const _tintCache = new WeakMap();
function getTintedSprite(img, color) {
  let byColor = _tintCache.get(img);
  if (!byColor || byColor.w !== img.naturalWidth) {
    byColor = { w: img.naturalWidth, colors: new Map() };
    _tintCache.set(img, byColor);
  }
  const hit = byColor.colors.get(color);
  if (hit) return hit;
  const cv = document.createElement("canvas");
  cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  const c = cv.getContext("2d");
  c.drawImage(img, 0, 0);
  c.globalCompositeOperation = "source-atop";
  c.fillStyle = color;                 // semi-transparent tint keeps hull detail
  c.fillRect(0, 0, cv.width, cv.height);
  byColor.colors.set(color, cv);
  return cv;
}

// Pick sprite + horizontal flip from facing direction, from a given sprite set
// (player hull by default, enemy hull when `set` is passed).
//   FWD -> NE,  LEFT -> NW (NE flipped),  BACK -> SW,  RIGHT -> SE (SW flipped)
function shipSprite(dir, set) {
  set = set || shipImg;
  switch (dir) {
    case DIR.FWD:   return { img: set.ne, flip: false };
    case DIR.LEFT:  return { img: set.ne, flip: true  };
    case DIR.BACK:  return { img: set.sw, flip: false };
    case DIR.RIGHT: return { img: set.sw, flip: true  };
    default:        return { img: set.ne, flip: false };
  }
}

function drawShip(cx, cy, dir, tint, set, scale) {
  scale = scale || 1;
  const { img, flip } = shipSprite(dir, set);

  // Sprite not decoded yet → draw nothing (no placeholder box). The hulls are
  // bundled and load in a frame or two, so the ship just appears fully-formed
  // instead of flashing a grey/red rectangle first.
  if (!img.complete || img.naturalWidth === 0) return;

  // soft drop shadow ellipse under the ship
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.30)";
  ctx.beginPath();
  ctx.ellipse(cx, cy + 30 * scale, 34 * scale, 12 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  const src = tint ? getTintedSprite(img, tint) : img;
  const W = 96 * scale;
  const H = W * (img.naturalHeight / img.naturalWidth);
  ctx.save();
  if (flip) {
    ctx.translate(cx, cy);
    ctx.scale(-1, 1);
    ctx.drawImage(src, -W / 2, -H / 2, W, H);
  } else {
    ctx.drawImage(src, cx - W / 2, cy - H / 2, W, H);
  }
  ctx.restore();
}

// ============================================================
// WANDERING SHIPS — a persistent standing population that roams the sector in
// absolute coords, independent of the player, simulated even while off-screen.
//   • RED ships are hostile: they patrol, show on the Star Map as contacts, and
//     once within AGGRO_TILES of the player home in and drop us into combat on
//     contact. ~ENEMY_TARGET are kept alive in the band around the player, so you
//     reliably encounter some without the sector feeling swarmed (they're visible
//     and avoidable). One you fly past persists — turn around and give chase.
//   • BLUE ships are neutral: they only drift — never chase, never collide into
//     combat, and never appear in a battle. (None spawn in normal play today.)
// ============================================================
const ENEMY_TINT = "rgba(255,45,45,0.6)";   // red = hostile
const BLUE_TINT  = "rgba(70,150,255,0.6)";  // blue = neutral
let enemySpawnTimer = 0;                     // stagger countdown for refilling the population
// Mission mode (embedded by episode1.html via "#mission"): a hostile comes in
// right away and, on victory, we notify the parent frame so the story advances.
const MISSION_MODE = /mission/i.test(location.hash);
let missionDone = false;

// The Command Nexus sits dormant (dark, powered-down) until a battle erupts at it,
// then awakens (energy surging, beam firing) for the fight and goes dormant again
// once it's defeated. `nexusAwake` is the target state (toggled by combat); the
// drawing eases `nexusWake` 0→1 toward it for a smooth power-up/down.
let nexusAwake = false;
let nexusWake = 0;                      // eased 0 (dormant) .. 1 (fully awake)
const NEXUS_WAKE_RANGE = 10;           // tiles from the nexus centre that count as "at the nexus"
const NEXUS_ARENA_CELL = { gx: 9, gy: 4 };   // grid cell the fortress centre maps to — sits over its weak points

// Story objective (episode1.html passes "#goto=<zone>"): a waypoint the player
// must fly to. Shown on the Star Map and as an in-world marker; reaching it (in
// travel mode) notifies the parent so the story continues.
const STORY_TARGETS = {   // the four story waypoints = the four zone-pocket centres
  nebula: { ax: ZONE[REGION.NEBULA].cx, ay: ZONE[REGION.NEBULA].cy, label: "Whispering Nebula" },
  moon:   { ax: ZONE[REGION.MOON].cx,   ay: ZONE[REGION.MOON].cy,   label: "Broken Moon Orbit" },
  armada: { ax: ZONE[REGION.ARMADA].cx, ay: ZONE[REGION.ARMADA].cy, label: "The Silent Armada" },
  nexus:  { ax: ZONE[REGION.NEXUS].cx,  ay: ZONE[REGION.NEXUS].cy,  label: "Command Nexus" },
};
const STORY_GOTO = (location.hash.match(/goto=([a-z]+)/i) || [])[1] || null;
const storyTarget = STORY_GOTO ? STORY_TARGETS[STORY_GOTO] : null;
const ARRIVE_DIST = 1;                    // tiles — how close counts as "arrived"
let objectiveReached = false;
const BOUNTY_ARRIVE_DIST = 2;             // tiles — how close to the mark starts the boss fight
let bountyDeclined = false;               // set after a bounty fight so it doesn't instantly re-trigger
let pendingBountyId = null;               // the contract the fight being staged belongs to
let objectivePrompt = false;             // "progress the story?" yes/no panel is up
let objectiveDeclined = false;           // chose "no" — don't re-ask until we leave the radius
let _promptHit = null;                    // clickable rects for the prompt (filled by drawObjectivePrompt)

function proceedObjective() {             // YES — continue the episode
  objectivePrompt = false; objectiveReached = true;
  saveFog();                             // capture this leg's exploration before the segment ends
  try { window.parent.postMessage({ type: "reachedObjective" }, "*"); } catch (e) {}
}
function declineObjective() {             // NO — turn 180° and pull back three tiles
  objectivePrompt = false; objectiveDeclined = true;
  const OPP = { [DIR.FWD]: DIR.BACK, [DIR.BACK]: DIR.FWD, [DIR.LEFT]: DIR.RIGHT, [DIR.RIGHT]: DIR.LEFT };
  const back = OPP[world.shipFacing] || DIR.BACK;
  world.shipFacing = back;
  world.autoQueue = [back, back, back];
  if (!world.moving && canMove(back)) { const d = world.autoQueue.shift(); beginMove(d); }
}

// ---- combat staging (episode1.html passes these on the #mission hash) ----
//   at=<zone>   stage the battle at a story location so the backdrop matches
//   enemies=<n> force a fixed number of hostiles for this battle
//   flee=1      on the first enemy turn one hostile breaks off and escapes
//               (the drone Scene 2 says "wasn't retreating — it was reporting us")
//   start=ax,ay resume exactly where the previous segment ended (continuity)
const COMBAT_AT = (location.hash.match(/at=([a-z]+)/i) || [])[1] || null;
const START_AT = location.hash.match(/start=(-?\d+),(-?\d+)/);
//   load=<n>    boot straight into save slot n (title screen's LOAD GAME) — applied
//               at the end of boot, see the call to loadFromSlot below.
//   load=f      same, but from the file-import slot (a downloaded .sgsave)
const LOAD_SLOT = (() => {
  const m = location.hash.match(/load=(\d+|f)/i);
  if (!m) return -1;
  if (m[1].toLowerCase() === "f") return "f";
  const n = parseInt(m[1], 10);
  return n >= 0 && n < 3 ? n : -1;         // SAVE_SLOTS isn't defined this early
})();
if (START_AT) {                                // resume at the carried-over position
  SPAWN.ax = parseInt(START_AT[1], 10);
  SPAWN.ay = parseInt(START_AT[2], 10);
} else if (COMBAT_AT && STORY_TARGETS[COMBAT_AT]) {
  SPAWN.ax = STORY_TARGETS[COMBAT_AT].ax;      // fallback: stage at a named location
  SPAWN.ay = STORY_TARGETS[COMBAT_AT].ay;
}
const FORCE_ENEMIES = parseInt((location.hash.match(/enemies=(\d+)/i) || [])[1], 10) || 0;
const FLEE_FIRST = /flee=1/i.test(location.hash);
// A battle is a BOSS fight only when the hash says so. `boss=1` is the original
// Nexus fortress (kept for the episode's final beat); `boss=<id>` stages any other
// registered boss — that's how the three bounty bosses are launched.
const BOSS_ID = (() => {
  const m = location.hash.match(/boss=([a-z0-9_]+)/i);
  if (!m) return null;
  return m[1] === "1" ? "nexus" : m[1].toLowerCase();
})();
const BOSS_FLAG = !!BOSS_ID;
let _lastPosAx = NaN, _lastPosAy = NaN;        // last sector pos reported to the episode
// Wandering hostiles are a persistent, sector-wide standing population, stored in
// absolute sector coords and simulated even off-screen — so you can see them
// coming on the Star Map, chase one you flew past, and route around the rest.
// Tunables (tiles / tiles-per-second):
const ENEMY_ROAM_SPEED  = 0.55;   // idle patrol drift
const ENEMY_CHASE_SPEED = 1.7;    // homing once it has your scent (player travels ~3.3/s)
const AGGRO_TILES = 8;            // starts charging when the player is within this many tiles
const ENEMY_TARGET = 3;           // hostiles kept alive around the player (scattered patrols)
const ENEMY_BAND_MIN = 16, ENEMY_BAND_MAX = 32;   // new patrols fade in this far out (off-screen)
const ENEMY_DESPAWN_TILES = 42;   // culled only once it strays this far — generous, so it stays chaseable
const ENEMY_CLEAR_TILES = 10;     // after a win, the engaged cluster this close is destroyed
const ENEMY_SPAWN_STAGGER_MS = 4500;   // gap between topping the population back up
// absolute centre tile the player currently occupies
function playerAX() { return world.worldOriginX + CENTER; }
function playerAY() { return world.worldOriginY + CENTER; }
// nearest iso facing for a heading given in tile space (dgx,dgy)
function tileHeadingToFacing(hx, hy) { return bestIsoDir((hx - hy) * HALF_W, (hx + hy) * HALF_H).dir; }
// the four iso-grid directions, as screen-space velocity vectors + matching facing
const ISO_DIRS = [
  { dir: DIR.FWD,   vx:  HALF_W, vy: -HALF_H },        // up-right
  { dir: DIR.RIGHT, vx:  HALF_W, vy:  HALF_H },        // down-right
  { dir: DIR.BACK,  vx: -HALF_W, vy:  HALF_H },        // down-left
  { dir: DIR.LEFT,  vx: -HALF_W, vy: -HALF_H },        // up-left
];
let enemies = [];

// screen point -> fractional grid coords (inverse of cellToScreen)
function gridCoordsAt(sx, sy) {
  const worldX = sx - SHIP_ANCHOR.x;
  const worldY = sy - SHIP_ANCHOR.y + CENTER_WORLD_Y;
  return { gx: (worldX / HALF_W + worldY / HALF_H) / 2,
           gy: (worldY / HALF_H - worldX / HALF_W) / 2 };
}
function onGrid(sx, sy, margin = 0.6) {
  const g = gridCoordsAt(sx, sy);
  return g.gx >= -margin && g.gx <= GRID_SIZE - 1 + margin &&
         g.gy >= -margin && g.gy <= GRID_SIZE - 1 + margin;
}
// distance from a screen point to the player's centre tile, in grid units
function tileDistToPlayer(sx, sy) {
  const g = gridCoordsAt(sx, sy);
  return Math.hypot(g.gx - CENTER, g.gy - CENTER);
}
// A wanderer's absolute sector coordinates (already stored in world coords) —
// used for the fog-map contact dots.
function enemyWorldPos(e) { return { ax: e.ax, ay: e.ay }; }
// the iso grid direction whose heading best matches a screen-space vector
function bestIsoDir(dx, dy) {
  let best = ISO_DIRS[0], bestDot = -Infinity;
  for (const d of ISO_DIRS) { const dot = d.vx * dx + d.vy * dy; if (dot > bestDot) { bestDot = dot; best = d; } }
  return best;
}
// choose a fresh roam heading (unit vector in tile space); near the rim, bias back
// toward the sector centre so patrols don't pin against the boundary.
function enemyPickHeading(e) {
  let ang = Math.random() * 6.283;
  if (Math.hypot(e.ax, e.ay) > MAP_RADIUS * 0.8) ang = Math.atan2(-e.ay, -e.ax) + (Math.random() - 0.5);
  e.hx = Math.cos(ang); e.hy = Math.sin(ang);
  e.facing = tileHeadingToFacing(e.hx, e.hy);
  e.retargetIn = 2500 + Math.random() * 4000;
}
// A patrol fades in at a random bearing, ENEMY_BAND_MIN..MAX tiles from the player
// (off-screen), kept inside the sector. Stored in absolute sector coords.
function spawnEnemy(hostile) {
  const px = playerAX(), py = playerAY();
  let ax = px, ay = py, guard = 0;
  do {
    const ang = Math.random() * 6.283;
    const dist = ENEMY_BAND_MIN + Math.random() * (ENEMY_BAND_MAX - ENEMY_BAND_MIN);
    ax = px + Math.cos(ang) * dist; ay = py + Math.sin(ang) * dist;
  } while (Math.hypot(ax, ay) > MAP_RADIUS - 2 && guard++ < 16);
  const ship = randomEnemyShip();                                    // random one of the six hulls
  const e = { ax, ay, hostile: !!hostile, ship,
              speed: (ship.profile && ship.profile.speed) || 1,      // per-hull roam/chase multiplier
              facing: DIR.BACK, bob: Math.random() * 6.283, hx: 0, hy: 0, retargetIn: 0 };
  enemyPickHeading(e);
  return e;
}
// (Re)build the standing population. A fresh sector fills at once so the map reads
// as inhabited; mission mode stages a single hostile. During the post-combat
// breather (combatCooldown) refills are left to updateEnemies.
function spawnEnemies() {
  enemies = [];
  enemySpawnTimer = 0;
  if (MISSION_MODE && !missionDone) { enemies.push(spawnEnemy(true)); return; }
  if (combatCooldown <= 0) for (let k = 0; k < ENEMY_TARGET; k++) enemies.push(spawnEnemy(true));
}
function updateEnemies(dt) {
  const s = dt / 1000, px = playerAX(), py = playerAY();
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const dist = Math.hypot(e.ax - px, e.ay - py);
    const roam = ENEMY_ROAM_SPEED * (e.speed || 1), chase = ENEMY_CHASE_SPEED * (e.speed || 1);
    if (e.hostile && dist <= AGGRO_TILES) {                 // lock on and charge the player
      const dx = px - e.ax, dy = py - e.ay, m = Math.hypot(dx, dy) || 1;
      e.hx = dx / m; e.hy = dy / m;
      e.facing = tileHeadingToFacing(e.hx, e.hy);
      e.ax += e.hx * chase * s; e.ay += e.hy * chase * s;
    } else {                                                // idle patrol drift
      e.retargetIn -= dt;
      if (e.retargetIn <= 0) enemyPickHeading(e);
      e.ax += e.hx * roam * s; e.ay += e.hy * roam * s;
      if (Math.hypot(e.ax, e.ay) > MAP_RADIUS - 1) {        // reached the rim → turn back inward
        e.ax -= e.hx * roam * s; e.ay -= e.hy * roam * s;
        enemyPickHeading(e);
      }
    }
    e.bob += s;
    if (dist > ENEMY_DESPAWN_TILES) enemies.splice(i, 1);   // strayed far out of range → drop (refilled below)
  }
  // keep the sector populated: once the breather is over, trickle patrols back up
  // to target on a stagger so they don't all pop in at once.
  const target = MISSION_MODE ? 1 : ENEMY_TARGET;
  if (!missionDone && combatCooldown <= 0) {
    enemySpawnTimer -= dt;
    const reds = enemies.reduce((a, e) => a + (e.hostile ? 1 : 0), 0);
    if (reds < target && enemySpawnTimer <= 0) {
      enemies.push(spawnEnemy(true));
      enemySpawnTimer = ENEMY_SPAWN_STAGGER_MS;
    }
  }
}
function drawEnemies() {
  const px = playerAX(), py = playerAY();
  for (const e of enemies) {
    if (Math.hypot(e.ax - px, e.ay - py) > 14) continue;    // far off-screen: nothing to draw
    const sc = cellToScreen(e.ax - world.worldOriginX, e.ay - world.worldOriginY);
    const bob = Math.sin(e.bob * 3) * 2;
    const set = enemyShipSet(e);        // this wanderer's random hull (falls back to enemyImg)
    // add the live cameraOffset so ships slide smoothly with the world during a move
    drawShip(sc.x + world.cameraOffsetX, sc.y + world.cameraOffsetY + bob, e.facing, e.hostile ? null : BLUE_TINT, set);
  }
}

// ============================================================
// TURN-BASED COMBAT
// Triggered by colliding with a wandering enemy. The world freezes and the
// 13×13 grid becomes the battle arena. Each round: the player moves up to
// PLAYER_MOVES tiles (facing follows the last move / Q-E), then fires one
// weapon; afterwards every surviving enemy moves toward and attacks the
// player. When the fight ends the grid slides so the ship is centred again
// and free-roam resumes.
// ============================================================
const PLAYER_MAX_HP = 20, ENEMY_HP = 6;
const PHASER_DMG = 3, MISSILE_DMG = 8;
const ENEMY_PHASER_DMG = 2, ENEMY_MISSILE_DMG = 4, ENEMY_START_AMMO = 1;  // enemies share the player's weapons, weaker
const PLAYER_MOVES = 4, ENEMY_MOVES = 3, START_AMMO = 3;
const ENEMY_GAP_MS = 520;                        // pause between enemy ships on their turn
const ENEMY_FIRE_PAUSE = 850;                    // linger after a shot so the player sees it land

// ---- crew-action combat model (replaces the ship's own weapon/move buttons) ----
// Each player turn the crew take ACTIONS_PER_TURN actions total; clicking a crew
// face-circle resolves that crew's equipped ability (auto-targeted). See runCrewAction.
const ACTIONS_PER_TURN = 3;
const CREW_SLOTS = 3;                             // action slots per crew (slots 2–3 locked for now)
const SLOTS_UNLOCKED = 1;                         // how many of those slots are currently usable
const LASER_DMG = 2;                              // Rex · Lasers — low damage, 3-wide cone in front
const CREW_MISSILE_DMG = 4;                       // Rex · Missile — medium damage, straight line
const REPAIR_HP = 7;                              // Tessa · Repair — hull recovered
const SHIELD_PCT = 0.10;                          // Kael · Shield — incoming damage negated
const INCAP_CHANCE = 0.25;                        // chance an enemy hit knocks out a crew member
const INCAP_TURNS = 2;                            // knocked-out crew auto-revive after this many turns
const ADRENALINE_CHANCE = 0.5;                    // Selyra · Adrenaline — extra-action roll
const JAM_CHANCE = 0.5;                           // Voss · Transmission — enemy-skip roll

let combat = null;
let combatCooldown = 0;                 // ms; suppress re-engaging right after a fight

const CDELTA = {                        // grid step per facing (screen-aligned with sprites)
  [DIR.FWD]:   { dx: 0,  dy: -1 },      // up-right
  [DIR.BACK]:  { dx: 0,  dy:  1 },      // down-left
  [DIR.LEFT]:  { dx: -1, dy:  0 },      // up-left
  [DIR.RIGHT]: { dx: 1,  dy:  0 },      // down-right
};
const CW_ORDER = [DIR.FWD, DIR.RIGHT, DIR.BACK, DIR.LEFT];

function cellToScreen(gx, gy) {
  const worldX = (gx - gy) * HALF_W, worldY = (gx + gy) * HALF_H;
  return { x: SHIP_ANCHOR.x + (worldX - CENTER_WORLD_X),
           y: SHIP_ANCHOR.y + (worldY - CENTER_WORLD_Y) };
}
function inBounds(gx, gy) { return gx >= 0 && gx < GRID_SIZE && gy >= 0 && gy < GRID_SIZE; }

// Enemies occupy a SINGLE tile (their anchor). ENEMY_FOOT is kept as a fixed
// offset in case a multi-tile footprint is wanted again; at {0,0} the second
// cell collapses into the anchor so movement, blocking and targeting stay simple.
const ENEMY_FOOT = { dx: 0, dy: 0 };
const ENEMY_SCALE = 1.1;                 // enemy hull drawn just slightly bigger than the player

    cells.push({ gx: e.gx + ENEMY_FOOT.dx, gy: e.gy + ENEMY_FOOT.dy });
  return cells;
}
function enemyFootFits(gx, gy) {         // both tiles of an anchor at (gx,gy) are in bounds
  return inBounds(gx, gy) && inBounds(gx + ENEMY_FOOT.dx, gy + ENEMY_FOOT.dy);
}
function enemyAt(gx, gy) {

}
function dirToward(fx, fy, tx, ty) {
  const dx = tx - fx, dy = ty - fy;

function clog(msg) { combat.log.unshift(msg); if (combat.log.length > 3) combat.log.pop(); }

function startCombat(trigger) {
