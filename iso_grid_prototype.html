// ============================================================
// INPUT (spec §8.1)
// ============================================================
// The ship may not leave the circular sector. Reject a move whose resulting
// centre tile would fall outside MAP_RADIUS.
function canMove(dir) {
  let cx = world.worldOriginX + CENTER, cy = world.worldOriginY + CENTER;
  if      (dir === DIR.FWD)  cy -= 1;
  else if (dir === DIR.BACK) cy += 1;
  else if (dir === DIR.LEFT) cx -= 1;
  else if (dir === DIR.RIGHT) cx += 1;
  return Math.hypot(cx, cy) <= MAP_RADIUS - 0.5;
}
const DIR_OPPOSITE = { [DIR.FWD]: DIR.BACK, [DIR.BACK]: DIR.FWD, [DIR.LEFT]: DIR.RIGHT, [DIR.RIGHT]: DIR.LEFT };
function requestMove(dir) {
  if (!canMove(dir)) {
    // Reached the rim of the sector: rather than a dead stop, spin the ship 180°
    // and shove it one tile back inward — a bounce off the boundary.
    const opp = DIR_OPPOSITE[dir];
    if (!world.moving && opp !== undefined && canMove(opp)) beginMove(opp);
    return;
  }
  if (!world.moving) beginMove(dir);
  else world.bufferedMove = dir;     // buffer one
}
// ---- mouse: combat is mouse-driven (keyboard kept as fallback below) ----
canvas.addEventListener("mousemove", (e) => {
  const r = canvas.getBoundingClientRect();
  mouseX = e.clientX - r.left; mouseY = e.clientY - r.top;
  // hovering a crew panel selects it, so the panel under the cursor expands
  if (menuOpen && menuView === "crew" && _menuHit && _menuHit.crew) {
    for (const c of _menuHit.crew) if (ptIn(c, mouseX, mouseY)) { crewSel = c.idx; break; }
  }
  // hovering a Ship Database card highlights it too
  if (menuOpen && menuView === "database" && _menuHit && _menuHit.db) {
    for (const d of _menuHit.db) if (ptIn(d, mouseX, mouseY)) { dbSel = d.idx; break; }
  }
  // Ship Config: hovering the grid slides the held ghost piece to that cell
  if (menuOpen && menuView === "shipConfig" && scfgPlacing) {
    const cp = scfgCellAt(mouseX, mouseY);
    if (cp) { scfgCursor = cp; scfgClampCursor(); }
  }
  const aiming = combat && (combat.targeting || combat.actionPick) && combat.phase === "player";
  const pointer = menuOpen || mapOpen || objectivePrompt || dockPrompt || aiming || (combat && overCombatButton(mouseX, mouseY));
  canvas.style.cursor = pointer ? "pointer" : "default";
});
// the Field Manual's chapter pages are the only scrollable screen so far
canvas.addEventListener("wheel", (e) => {
  if (menuOpen && menuView === "manualPage") { manScroll = Math.max(0, manScroll + e.deltaY); e.preventDefault(); }
  // Ship Config module inventory scrolls a row per notch (clamped in the draw)
  else if (menuOpen && menuView === "shipConfig" && shipTab === 0) { scfgScroll += e.deltaY > 0 ? 1 : -1; e.preventDefault(); }
}, { passive: false });
// right-click cancels an in-progress action pick / target
canvas.addEventListener("contextmenu", (e) => {
  if (combat && (combat.targeting || combat.actionPick)) { e.preventDefault(); cancelTargeting(); }
  else if (menuOpen && menuView === "shipConfig" && scfgPlacing) { e.preventDefault(); scfgPlacing.rot = (scfgPlacing.rot + 1) & 3; scfgClampCursor(); }
});
canvas.addEventListener("click", (e) => {
  if (tutorialOpen) return;                      // tutorial overlay owns input while open
  if (bossIntro) { skipBossIntro(); return; }    // splash owns input; a click skips it
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  if (testingMode && _skipBtnRect && !menuOpen && !mapOpen && !objectivePrompt && ptIn(_skipBtnRect, mx, my)) { skipObjective(); return; }
  if (menuOpen) { handleMenuClick(mx, my); return; }
  if (objectivePrompt) {
    if (_promptHit && ptIn(_promptHit.yes, mx, my)) proceedObjective();
    else if (_promptHit && ptIn(_promptHit.no, mx, my)) declineObjective();
    return;
  }
  if (dockPrompt) {
    if (_dockPromptHit && ptIn(_dockPromptHit.yes, mx, my)) acceptDock();
    else if (_dockPromptHit && ptIn(_dockPromptHit.no, mx, my)) declineDock();
    return;
  }
  if (mapOpen) { exitMap(); return; }
  if (!combat) return;
  handleCombatClick(mx, my);
});

window.addEventListener("keydown", (e) => {
  if (tutorialOpen) { e.preventDefault(); closeTutorial(); return; }   // any key dismisses the tutorial
  if (menuOpen) { handleMenuKey(e); return; }   // pause menu owns input while open
  if (objectivePrompt) {                          // "progress the story?" — Y/N
    if (e.key === "y" || e.key === "Y" || e.key === "Enter") { proceedObjective(); e.preventDefault(); }
    else if (e.key === "n" || e.key === "N" || e.key === "q" || e.key === "Q" || e.key === "Escape") { declineObjective(); e.preventDefault(); }
    return;
  }
  if (dockPrompt) {                               // "request docking?" — Y/N (E also docks)
    if (e.key === "y" || e.key === "Y" || e.key === "Enter" || e.key === "e" || e.key === "E") { acceptDock(); e.preventDefault(); }
    else if (e.key === "n" || e.key === "N" || e.key === "q" || e.key === "Q" || e.key === "Escape") { declineDock(); e.preventDefault(); }
    return;
  }
  if (mapOpen) {                                 // sector map is up — any of these close it
    if (e.key === "Escape" || e.key === "q" || e.key === "Q" || e.key === "m" || e.key === "M" || e.key === "Enter") {
      exitMap(); e.preventDefault();
    }
    return;
  }
  if (!combat && (e.key === "m" || e.key === "M")) { openMenu(); e.preventDefault(); return; }  // M → menu (not in combat)
  if (bossIntro) {                               // encounter splash — any of these skip it
    if (e.key === " " || e.key === "Enter" || e.key === "q" || e.key === "Q" || e.key === "Escape") { skipBossIntro(); e.preventDefault(); }
    return;                                      // and nothing reaches the arena underneath
  }
  if (combat) {                                  // combat is mouse-driven; keys assist
    if (combat.phase !== "player" || combat.player.walk || combat.pending) return;   // ignore input mid-glide / shot
    if ((e.key === "Escape" || e.key === "q" || e.key === "Q") && (combat.targeting || combat.actionPick)) { cancelTargeting(); e.preventDefault(); return; }
    switch (e.key) {
      // number keys 1–6 pick the matching crew member; Enter ends the turn
      case "1": case "2": case "3": case "4": case "5": case "6":
        activateCrew(parseInt(e.key, 10) - 1); e.preventDefault(); break;
      case "Enter": if (!combat.targeting) endPlayerTurn(); e.preventDefault(); break;
    }
    return;
  }
  switch (e.key) {
    case "ArrowUp": case "w": case "W":    requestMove(DIR.FWD);   e.preventDefault(); break;
    case "ArrowDown": case "s": case "S":  requestMove(DIR.BACK);  e.preventDefault(); break;
    case "ArrowLeft": case "a": case "A":  requestMove(DIR.LEFT);  e.preventDefault(); break;
    case "ArrowRight": case "d": case "D": requestMove(DIR.RIGHT); e.preventDefault(); break;
    // E docks when alongside a trade station (D is taken by "move right")
    case "e": case "E": { const st = stationInRange(); if (st) { dockAt(st); e.preventDefault(); } break; }
    case "f": case "F": doScan(); e.preventDefault(); break;   // sweep for salvage / points of interest
    case "Enter": openMenu(); e.preventDefault(); break;     // open the pause menu
    case "r": case "R": initWorld(); spawnEnemies(); break;   // return to the nebula spawn (map is fixed)
    case "i": case "I": showIDs = !showIDs; break;
    case "g": case "G": showGrid = !showGrid; break;
  }
});

// ============================================================
// BGM — looping exploration / combat music, crossfaded on transitions.
// Audio can't autoplay until a user gesture; startBgm() runs on the first
// click/keypress (or when a tutorial pop-up is dismissed).
// ============================================================
// `station` is optional — if audio/BGM/Station.mp3 isn't there the play() simply
// rejects and we fall back to silence at the dock rather than erroring.
const BGM = {
  explore: new Audio("audio/BGM/Explore.mp3"),
  combat:  new Audio("audio/BGM/Combat.mp3"),
  station: new Audio("audio/BGM/Station.mp3"),
  vol: 0.55, current: null, started: false,
};
for (const k of ["explore", "combat", "station"]) { BGM[k].loop = true; BGM[k].volume = 0; BGM[k].preload = "auto"; }
function _bgmFade(a, target, ms) {
  if (a._fade) clearInterval(a._fade);
  const s = a.volume, t0 = performance.now();
  a._fade = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    a.volume = s + (target - s) * k;
    if (k >= 1) { clearInterval(a._fade); a._fade = null; if (target === 0) { try { a.pause(); } catch (e) {} } }
  }, 40);
}
function bgm(track) {                         // crossfade to a named loop
  if (!BGM.started) return;
  const next = BGM[track];
  if (!next || next === BGM.current) return;
  if (BGM.current) _bgmFade(BGM.current, 0, 700);
  BGM.current = next;
  next.play().then(() => _bgmFade(next, BGM.vol * volBgm(), 700))
             .catch(() => { BGM.current = null; });   // blocked → retry on next gesture
}
function bgmStop() { if (BGM.current) _bgmFade(BGM.current, 0, 500); BGM.current = null; }
// the track the moment should be playing — combat wins, then dockside, then explore
function bgmWanted() {
  return combat ? "combat" : (dockedAt && menuOpen && menuView === "station") ? "station" : "explore";
}
function startBgm() {                         // unlock + start the right track (once)
  if (BGM.started) return;
  BGM.started = true;
  bgm(bgmWanted());
}
// Every gesture RE-ASSERTS the music rather than only unlocking it once. A rejected
// play() (autoplay policy, mid-decode reload) nulls BGM.current, and the old one-shot
// listeners never retried — inside the episode that meant a whole mission could run
// silent after its iframe reload (Brett's LOC02 dropout). Now any click or key brings
// the right track back.
function bgmKick() {
  if (!BGM.started) return startBgm();
  if (!BGM.current) bgm(bgmWanted());
}
window.addEventListener("pointerdown", bgmKick);
window.addEventListener("keydown", bgmKick);

// ============================================================
// SOUND EFFECTS
// One-shot cues from `audio/SFX/`. Every cue is OPTIONAL: if the file isn't there
// the play call silently does nothing, so the game runs mute-but-correct and each
// file swaps itself in the moment it's dropped in the folder. See AUDIO_PROMPTS.md
// for what to generate.
//
// Each cue keeps a small POOL of Audio elements and round-robins them, because a
// single element restarted mid-playback cuts itself off — which is exactly what
// happens when salvage auto-collects from four kills at once, or a laser fires
// twice in a turn.
// ============================================================
const SFX_VOL = {                            // per-cue mix, relative to SFX.vol
  laser: 0.55, missile: 0.7, hit: 0.8, shield_hit: 0.6, miss: 0.35,
  explode: 0.9, scan: 0.5, scrap: 0.4, coin: 0.6, dock: 0.7, ui_select: 0.25,
};
const SFX_POOL = { laser: 3, hit: 3, scrap: 4, miss: 3, explode: 3 };   // cues that overlap
// Optional cap on how long a cue may ring, in ms, with a short fade so the cut
// isn't a click. This is a SAFETY NET for cues that fire in bursts, not a fix:
// laser and explode were regenerated to spec (2026-07-20) so their caps now sit
// above the file length and never bite. `ui_select` is still ~0.9s against a
// 0.15s spec, and `scrap` ~0.5s against 0.25s — those two are genuinely trimmed,
// since a menu blip and a pickup chime fire far too often to ring that long.
// Delete an entry to hear a cue in full.
const SFX_MAXMS = { laser: 700, ui_select: 260, scrap: 340 };
const SFX_FADE_MS = 90;
const SFX = { vol: 0.8, enabled: true, _pools: {}, _next: {}, _missing: {} };
function _sfxPool(name) {
  if (SFX._pools[name]) return SFX._pools[name];
  const n = SFX_POOL[name] || 1;
  const pool = [];
  for (let i = 0; i < n; i++) {
    const a = new Audio("audio/SFX/" + name + ".mp3");
    a.preload = "auto";
    // a missing file errors once; remember it so we stop retrying every shot
    a.addEventListener("error", () => { SFX._missing[name] = true; }, { once: true });
    pool.push(a);
  }
  SFX._pools[name] = pool; SFX._next[name] = 0;
  return pool;
}
// Play a cue. `gain` scales this one instance (e.g. quieter for a distant hit).
function sfx(name, gain) {
  if (!SFX.enabled || SFX._missing[name]) return;
  try {
    const pool = _sfxPool(name);
    const a = pool[SFX._next[name] % pool.length];
    SFX._next[name]++;
    const vol = Math.max(0, Math.min(1, SFX.vol * volSfx() * (SFX_VOL[name] != null ? SFX_VOL[name] : 0.6) * (gain != null ? gain : 1)));
    if (a._cut) { clearTimeout(a._cut); a._cut = null; }
    if (a._fade) { clearInterval(a._fade); a._fade = null; }
    a.volume = vol;
    a.currentTime = 0;
    const p = a.play();
    if (p && p.catch) p.catch(() => {});          // autoplay not unlocked yet — ignore
    // trim over-long cues (see SFX_MAXMS) with a quick fade rather than a hard stop
    const cap = SFX_MAXMS[name];
    if (cap) a._cut = setTimeout(() => {
      const step = vol / Math.max(1, SFX_FADE_MS / 20);
      a._fade = setInterval(() => {
        a.volume = Math.max(0, a.volume - step);
        if (a.volume <= 0.001) { clearInterval(a._fade); a._fade = null; try { a.pause(); } catch (e) {} }
      }, 20);
    }, Math.max(0, cap - SFX_FADE_MS));
  } catch (e) { SFX._missing[name] = true; }
}
// warm the cues most likely to fire first, so the first shot isn't silent
function preloadSfx() { for (const n of ["laser", "hit", "explode", "scrap", "miss"]) _sfxPool(n); }
window.addEventListener("pointerdown", preloadSfx, { once: true });
window.addEventListener("keydown", preloadSfx, { once: true });

      `<div class="row">This is a crew member's action menu. The top row is the ability they have <b>loaded right now</b> — <span class="k">▶</span> uses it.</div>
       <div class="row">Under it is <b><span class="k">⇄</span> Switch Action</b>. Every one of the six crew has <b>two</b> abilities: Rex has lasers or a missile, Astra can fly or jump, Kael can scan or shield. Nobody is locked to one.</div>
       <div class="row">Switching <span class="hot">in battle costs that crew member's action</span> for the turn. Switching from <b>Menu → Crew</b> between fights is <b>free</b> — set your loadout before the shooting starts.</div>
       <div class="row">The greyed <b>Slot 2 / Slot 3</b> rows are a different thing: extra slots, unlocked later.</div>`
  },
  crewSlot: {
    title: "◆  SETTING A LOADOUT",
    body:
      `<div class="row">This is where you choose which of a crew member's <b>two abilities</b> they carry into the next fight. Doing it here is <b>free</b>; doing it mid-battle costs them a turn.</div>
       <div class="row">Press <span class="k">Enter</span> on <b>Slot 1</b>, or click <b>⇄ SWAP</b>, to change it. The counter under the button shows which of the two is loaded.</div>
       <div class="row">An ability whose ship module is unpowered or wrecked can't be loaded — see <b>Ship</b> for the fit.</div>`
  },
  combatTarget: {
    title: "◆  TAKING AIM",
    body:
      `<div class="row">Weapons fire into the arc the ship is <b>facing</b>, and only out to their range — the highlighted cells are what you can actually hit.</div>
       <div class="row">Turning to face a target is itself a move. <span class="k">Q</span> backs out of an action before it's spent.</div>`
  },
  combatOut: {
    title: "◆  END OF TURN",
    body:
      `<div class="row">Your actions are spent — <b>End Turn</b> and the enemy moves.</div>
       <div class="row">The strip at the top is the <b>turn order</b>. Read it before you commit the last action of a round.</div>`
  },
  defeat: {
    title: "◆  HULL BREACH",
    body:
      `<div class="row">The StarGear went down. You keep your <b>coin, modules, crew and progress</b> — you lose <span class="hot">part of the hold</span>.</div>
       <div class="row">Repair broken modules at a station, and pick fights you're fitted for.</div>`
  },
};
let _tutKey = null, _tutShownAt = 0;
const _tutQueue = [];                        // tips raised while another one is up
function tipSeen(key) {
  try { return localStorage.getItem("stargear_tut_" + key + "_v3") === "1"; } catch (e) { return false; }
}
function showTutorial(key, onClose) {
  const c = TIPS[key];
  // tips switched off, unknown key, or already dismissed once → straight through
  if (!tipsOn || !c || tipSeen(key)) { if (onClose) onClose(); return; }
  // a tip never opens on top of another tip OR a Y/N prompt — it queues and update()
  // drains it once the screen is clear (two popups at once read as a glitch)
  if (tutorialOpen || objectivePrompt || dockPrompt) { _tutQueue.push(key); if (onClose) onClose(); return; }
  _tutKey = "stargear_tut_" + key + "_v3";
  tutEl.querySelector(".tutTitle").textContent = c.title;
  tutEl.querySelector(".tutBody").innerHTML = c.body;
  tutEl.classList.add("show");
  tutorialOpen = true;
  _tutShownAt = performance.now();
  _tutOnClose = onClose || null;
}
function closeTutorial() {
  if (!tutorialOpen) return;
  // Reaching the flight game means tapping through dialogue; that same click/key
  // can carry over onto the freshly-loaded iso. Ignore dismissals for a moment so
  // the pop-up isn't closed before it's even seen.
  if (performance.now() - _tutShownAt < 450) return;
  tutorialOpen = false;
  tutEl.classList.remove("show");
  try { if (_tutKey) localStorage.setItem(_tutKey, "1"); } catch (e) {}   // mark seen only once actually dismissed
  _tutKey = null;
  bgmKick();                                  // the dismiss gesture unlocks / re-asserts audio
  const cb = _tutOnClose; _tutOnClose = null;
  if (cb) cb();
  while (_tutQueue.length && !tutorialOpen) showTutorial(_tutQueue.shift());   // next queued tip
}
tutEl.addEventListener("pointerdown", (e) => { e.stopPropagation(); closeTutorial(); });

// ============================================================
// MAIN LOOP
// ============================================================
const statusEl = document.getElementById("status");
let last = performance.now();
function frame(now) {
  gTime = now;
  let dt = now - last; last = now;
  if (dt > 50) dt = 50;            // clamp big stalls
  update(dt);
  render();
  drawScan(dt);                    // sweep ring + result line (needs dt, so it runs here)
  drawChatter(dt);                 // crew one-liners while flying
  drawAchToasts(dt);               // unlock banners ride above everything, menus included
  _skipBtnRect = null;
  if (testingMode && !menuOpen && !mapOpen && !objectivePrompt) drawSkipButton();   // testing skip button on top
  const px = world.worldOriginX + CENTER, py = world.worldOriginY + CENTER;
  const objHint = (storyTarget && !objectiveReached)
    ? `  ·  ◆ FLY TO ${storyTarget.label.toUpperCase()} (M → Star Map)` : "";
  statusEl.textContent = combat
    ? `COMBAT — turn ${combat.turn} · ${combat.phase} · enemies:${combat.enemies.length}`
    : `${REGION_NAME[currentRegion()]}  ·  pos(${px},${py})  ·  ` +
      `${Math.round(Math.hypot(px, py))}/${MAP_RADIUS} from centre` + objHint;
  requestAnimationFrame(frame);
}

buildAllTileSprites();
MAP_OBJECTS = buildMap();          // assemble the fixed sector once
resize();
initWorld();
// Fog persists in shared localStorage so it survives the per-segment iframe
// reloads WITHIN a run. Only a continuation segment (episode passes start=ax,ay)
// should inherit it; a fresh load — the run's first segment, or the iso opened
// standalone — must start with a clean map, or last run's fog bleeds through.
if (START_AT) loadFog();           // continuation: restore explored map from earlier segments
else { try { localStorage.removeItem(FOG_KEY); } catch (e) {} }   // fresh run: wipe stale fog
// LOAD FROM THE TITLE SCREEN. episode1.html's main-menu Load passes `load=<slot>`
// (alongside a `start=` taken from the same slot, so the restore code above treats
// this as a continuation and doesn't wipe anything). Runs here, at the end of boot,
// because loadFromSlot rebuilds the world and repaints fog — both need initWorld()
// and the map canvas to exist first. It overwrites whatever the live keys held.
const HAS_LOAD = LOAD_SLOT === "f" || LOAD_SLOT >= 0;   // "f" is the file-import slot
if (HAS_LOAD && !loadFromSlot(LOAD_SLOT))
  console.warn("iso: load=" + LOAD_SLOT + " requested but that slot is empty");

if (MISSION_MODE) startCombat(enemies.find(e => e.hostile));   // scripted battles begin immediately (no roaming first)
else if (HAS_LOAD) { /* a loaded game skips the first-flight tutorial */ }
else showTutorial("explore");      // free-roam beat → first-time flight controls pop-up
// Kick the music off at boot rather than waiting for the first in-page gesture.
// Standalone first loads are blocked by autoplay policy (play() rejects, harmless —
// the gesture listeners above recover), but inside the episode the iframe inherits
// the parent page's activation, so each segment reload gets its music back straight
// away instead of cutting to silence until the player happens to click (LOC02 fix).
startBgm();
try { window.focus(); } catch (e) {}   // grab keyboard focus so movement works without a click
requestAnimationFrame(frame);
</script>
</body>
