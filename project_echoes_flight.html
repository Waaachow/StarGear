// ---- combat staging (episode1.html passes these on the #mission hash) ----
//   at=<zone>   stage the battle at a story location so the backdrop matches
//   enemies=<n> force a fixed number of hostiles for this battle
//   flee=1      on the first enemy turn one hostile breaks off and escapes
//               (the drone Scene 2 says "wasn't retreating — it was reporting us")
//   start=ax,ay resume exactly where the previous segment ended (continuity)
const COMBAT_AT = (location.hash.match(/at=([a-z]+)/i) || [])[1] || null;
const START_AT = location.hash.match(/start=(-?\d+),(-?\d+)/);
//   load=<n>    boot straight into save slot n (title screen's LOAD GAME) — applied
//               at the end of boot, see the call to loadFromSlot below.
//   load=f      same, but from the file-import slot (a downloaded .sgsave)
const LOAD_SLOT = (() => {
  const m = location.hash.match(/load=(\d+|f)/i);
  if (!m) return -1;
  if (m[1].toLowerCase() === "f") return "f";
  const n = parseInt(m[1], 10);
  return n >= 0 && n < 3 ? n : -1;         // SAVE_SLOTS isn't defined this early
})();
if (START_AT) {                                // resume at the carried-over position
  SPAWN.ax = parseInt(START_AT[1], 10);
  SPAWN.ay = parseInt(START_AT[2], 10);
} else if (COMBAT_AT && STORY_TARGETS[COMBAT_AT]) {
  SPAWN.ax = STORY_TARGETS[COMBAT_AT].ax;      // fallback: stage at a named location
  SPAWN.ay = STORY_TARGETS[COMBAT_AT].ay;
}
const FORCE_ENEMIES = parseInt((location.hash.match(/enemies=(\d+)/i) || [])[1], 10) || 0;
const FLEE_FIRST = /flee=1/i.test(location.hash);
// A battle is a BOSS fight only when the hash says so. `boss=1` is the original
// Nexus fortress (kept for the episode's final beat); `boss=<id>` stages any other
// registered boss — that's how the three bounty bosses are launched.
const BOSS_ID = (() => {
  const m = location.hash.match(/boss=([a-z0-9_]+)/i);
  if (!m) return null;
  return m[1] === "1" ? "nexus" : m[1].toLowerCase();
})();
const BOSS_FLAG = !!BOSS_ID;
let _lastPosAx = NaN, _lastPosAy = NaN;        // last sector pos reported to the episode
// Wandering hostiles are a persistent, sector-wide standing population, stored in
// absolute sector coords and simulated even off-screen — so you can see them
// coming on the Star Map, chase one you flew past, and route around the rest.
// Tunables (tiles / tiles-per-second):
const ENEMY_ROAM_SPEED  = 0.55;   // idle patrol drift
const ENEMY_CHASE_SPEED = 1.7;    // homing once it has your scent (player travels ~3.3/s)
const AGGRO_TILES = 8;            // starts charging when the player is within this many tiles
const ENEMY_TARGET = 3;           // hostiles kept alive around the player (scattered patrols)
const ENEMY_BAND_MIN = 16, ENEMY_BAND_MAX = 32;   // new patrols fade in this far out (off-screen)
const ENEMY_DESPAWN_TILES = 42;   // culled only once it strays this far — generous, so it stays chaseable
const ENEMY_CLEAR_TILES = 10;     // after a win, the engaged cluster this close is destroyed
const ENEMY_SPAWN_STAGGER_MS = 4500;   // gap between topping the population back up
// absolute centre tile the player currently occupies
function playerAX() { return world.worldOriginX + CENTER; }
function playerAY() { return world.worldOriginY + CENTER; }
// nearest iso facing for a heading given in tile space (dgx,dgy)
function tileHeadingToFacing(hx, hy) { return bestIsoDir((hx - hy) * HALF_W, (hx + hy) * HALF_H).dir; }
// the four iso-grid directions, as screen-space velocity vectors + matching facing
const ISO_DIRS = [
  { dir: DIR.FWD,   vx:  HALF_W, vy: -HALF_H },        // up-right
  { dir: DIR.RIGHT, vx:  HALF_W, vy:  HALF_H },        // down-right
  { dir: DIR.BACK,  vx: -HALF_W, vy:  HALF_H },        // down-left
  { dir: DIR.LEFT,  vx: -HALF_W, vy: -HALF_H },        // up-left
];
let enemies = [];

// screen point -> fractional grid coords (inverse of cellToScreen)
function gridCoordsAt(sx, sy) {
  const worldX = sx - SHIP_ANCHOR.x;
  const worldY = sy - SHIP_ANCHOR.y + CENTER_WORLD_Y;
  return { gx: (worldX / HALF_W + worldY / HALF_H) / 2,
           gy: (worldY / HALF_H - worldX / HALF_W) / 2 };
}
function onGrid(sx, sy, margin = 0.6) {
  const g = gridCoordsAt(sx, sy);
  return g.gx >= -margin && g.gx <= GRID_SIZE - 1 + margin &&
         g.gy >= -margin && g.gy <= GRID_SIZE - 1 + margin;
}
// distance from a screen point to the player's centre tile, in grid units
function tileDistToPlayer(sx, sy) {
  const g = gridCoordsAt(sx, sy);
  return Math.hypot(g.gx - CENTER, g.gy - CENTER);
}
// A wanderer's absolute sector coordinates (already stored in world coords) —
// used for the fog-map contact dots.
function enemyWorldPos(e) { return { ax: e.ax, ay: e.ay }; }
// the iso grid direction whose heading best matches a screen-space vector
function bestIsoDir(dx, dy) {
  let best = ISO_DIRS[0], bestDot = -Infinity;
  for (const d of ISO_DIRS) { const dot = d.vx * dx + d.vy * dy; if (dot > bestDot) { bestDot = dot; best = d; } }
  return best;
}
// choose a fresh roam heading (unit vector in tile space); near the rim, bias back
// toward the sector centre so patrols don't pin against the boundary.
function enemyPickHeading(e) {
  let ang = Math.random() * 6.283;
  if (Math.hypot(e.ax, e.ay) > MAP_RADIUS * 0.8) ang = Math.atan2(-e.ay, -e.ax) + (Math.random() - 0.5);
  e.hx = Math.cos(ang); e.hy = Math.sin(ang);
  e.facing = tileHeadingToFacing(e.hx, e.hy);
  e.retargetIn = 2500 + Math.random() * 4000;
}
// A patrol fades in at a random bearing, ENEMY_BAND_MIN..MAX tiles from the player
// (off-screen), kept inside the sector. Stored in absolute sector coords.
function spawnEnemy(hostile) {
  const px = playerAX(), py = playerAY();
  let ax = px, ay = py, guard = 0;
  do {
    const ang = Math.random() * 6.283;
    const dist = ENEMY_BAND_MIN + Math.random() * (ENEMY_BAND_MAX - ENEMY_BAND_MIN);
    ax = px + Math.cos(ang) * dist; ay = py + Math.sin(ang) * dist;
  } while (Math.hypot(ax, ay) > MAP_RADIUS - 2 && guard++ < 16);
  const ship = randomEnemyShip();                                    // random one of the six hulls
  const e = { ax, ay, hostile: !!hostile, ship,
              speed: (ship.profile && ship.profile.speed) || 1,      // per-hull roam/chase multiplier
              facing: DIR.BACK, bob: Math.random() * 6.283, hx: 0, hy: 0, retargetIn: 0 };
  enemyPickHeading(e);

}
// (Re)build the standing population. A fresh sector fills at once so the map reads
// as inhabited; mission mode stages a single hostile. During the post-combat
// breather (combatCooldown) refills are left to updateEnemies.
function spawnEnemies() {
  enemies = [];
  enemySpawnTimer = 0;
  if (MISSION_MODE && !missionDone) { enemies.push(spawnEnemy(true)); return; }
  if (combatCooldown <= 0) for (let k = 0; k < ENEMY_TARGET; k++) enemies.push(spawnEnemy(true));

function updateEnemies(dt) {
  const s = dt / 1000, px = playerAX(), py = playerAY();
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const dist = Math.hypot(e.ax - px, e.ay - py);
    const roam = ENEMY_ROAM_SPEED * (e.speed || 1), chase = ENEMY_CHASE_SPEED * (e.speed || 1);
    if (e.hostile && dist <= AGGRO_TILES) {                 // lock on and charge the player
      const dx = px - e.ax, dy = py - e.ay, m = Math.hypot(dx, dy) || 1;
      e.hx = dx / m; e.hy = dy / m;
      e.facing = tileHeadingToFacing(e.hx, e.hy);
      e.ax += e.hx * chase * s; e.ay += e.hy * chase * s;
    } else {                                                // idle patrol drift
      e.retargetIn -= dt;
      if (e.retargetIn <= 0) enemyPickHeading(e);
      e.ax += e.hx * roam * s; e.ay += e.hy * roam * s;
      if (Math.hypot(e.ax, e.ay) > MAP_RADIUS - 1) {        // reached the rim → turn back inward
        e.ax -= e.hx * roam * s; e.ay -= e.hy * roam * s;
        enemyPickHeading(e);
      }
    }
    e.bob += s;
    if (dist > ENEMY_DESPAWN_TILES) enemies.splice(i, 1);   // strayed far out of range → drop (refilled below)
  }
  // keep the sector populated: once the breather is over, trickle patrols back up
  // to target on a stagger so they don't all pop in at once.
  const target = MISSION_MODE ? 1 : ENEMY_TARGET;
  if (!missionDone && combatCooldown <= 0) {
    enemySpawnTimer -= dt;
    const reds = enemies.reduce((a, e) => a + (e.hostile ? 1 : 0), 0);
    if (reds < target && enemySpawnTimer <= 0) {
      enemies.push(spawnEnemy(true));
      enemySpawnTimer = ENEMY_SPAWN_STAGGER_MS;
    }
  }
}
function drawEnemies() {
  const px = playerAX(), py = playerAY();
  for (const e of enemies) {
    if (Math.hypot(e.ax - px, e.ay - py) > 14) continue;    // far off-screen: nothing to draw
    const sc = cellToScreen(e.ax - world.worldOriginX, e.ay - world.worldOriginY);
    const bob = Math.sin(e.bob * 3) * 2;
    const set = enemyShipSet(e);        // this wanderer's random hull (falls back to enemyImg)
    // add the live cameraOffset so ships slide smoothly with the world during a move
    const ex = sc.x + world.cameraOffsetX, ey = sc.y + world.cameraOffsetY + bob;
    drawShip(ex, ey, e.facing, e.hostile ? null : BLUE_TINT, set);
    // an uncatalogued hostile gets a "?" nudge to scan it (Ship Database); scanned hulls show nothing
    if (e.hostile && !isScanned(e)) drawUnscannedTag(ex, ey - 42);
  }
}

// ============================================================
// CIVILIAN TRAFFIC — a few hand-placed BLUE (neutral) ships giving the Trade Lane
// its "constant civilian traffic ... predictable routes" per the design doc, plus
// one slow maintenance drone loitering at Main Station. No pathfinding — simple
// ping-pong lerp along a lane leg, or a slow orbit for the loiterer. Reuses the
// existing enemyImg hull tinted BLUE_TINT as placeholder art (already coded as
// neutral/never-fights but unused until now); logged for a distinct civilian hull
// in Echoes/ASSETS_NEEDED.md. Never added to `enemies`, so the minimap/Star Map
// hostile-contact loops (which only plot e.hostile) never see them.
// ============================================================
const CIVILIAN_ROUTES = [
  { id: "freighter1", kind: "lane",   from: { ax: MAIN_STATION_POS.ax, ay: MAIN_STATION_POS.ay }, to: { ax: -50, ay: 0 },  speed: 4 },
  { id: "hauler1",     kind: "lane",  from: { ax: -50, ay: 0 }, to: { ax: MERC_HANGAR.ax, ay: MERC_HANGAR.ay },            speed: 3.6 },
  { id: "drone1",      kind: "loiter", center: { ax: MAIN_STATION_POS.ax, ay: MAIN_STATION_POS.ay }, radius: 10,          speed: 0.5 },
];
let civilians = [];
function buildCivilians() {
  return CIVILIAN_ROUTES.map(r => r.kind === "lane"
    ? { ...r, ax: r.from.ax, ay: r.from.ay, t: 0, dir: 1, facing: DIR.BACK, bob: Math.random() * 6.283 }
    : { ...r, ax: r.center.ax, ay: r.center.ay, ang: 0, facing: DIR.BACK, bob: Math.random() * 6.283 });
}
function updateCivilians(dt) {
  const s = dt / 1000;
  for (const c of civilians) {
    if (c.kind === "lane") {
      const dx = c.to.ax - c.from.ax, dy = c.to.ay - c.from.ay, len = Math.hypot(dx, dy) || 1;
      c.t += (c.dir * c.speed * s) / len;
      if (c.t >= 1) { c.t = 1; c.dir = -1; } else if (c.t <= 0) { c.t = 0; c.dir = 1; }
      c.ax = lerp(c.from.ax, c.to.ax, c.t); c.ay = lerp(c.from.ay, c.to.ay, c.t);
      c.facing = tileHeadingToFacing(c.dir * dx / len, c.dir * dy / len);
    } else {
      c.ang += c.speed * s * 0.3;
      c.ax = c.center.ax + Math.cos(c.ang) * c.radius; c.ay = c.center.ay + Math.sin(c.ang) * c.radius;
      c.facing = tileHeadingToFacing(-Math.sin(c.ang), Math.cos(c.ang));
    }
    c.bob += s;
  }
}
function drawCivilians() {
  const px = playerAX(), py = playerAY();
  for (const c of civilians) {
    if (Math.hypot(c.ax - px, c.ay - py) > 14) continue;
    const sc = cellToScreen(c.ax - world.worldOriginX, c.ay - world.worldOriginY);
    const bob = Math.sin(c.bob * 3) * 2;
    const cx = sc.x + world.cameraOffsetX, cy = sc.y + world.cameraOffsetY + bob;
    drawShip(cx, cy, c.facing, BLUE_TINT, enemyImg, c.kind === "loiter" ? 0.6 : 1);
  }
}

// Crimson's free-roam escort used to snap straight to a fixed grid cell exactly one
// completed move behind the player — but worldOriginX jumps to its new value the
// INSTANT a move begins, while that trail entry only advanced once the move finished,
// so for the whole tween he rendered two tiles back, then popped forward one full tile
// the moment the player's move completed. Every move produced a visible pop (Steve,
// 2026-07-26: "very steppy"). He's now released from the grid entirely: rather than
// tile-cell bookkeeping, he holds station at a fixed tile-offset behind wherever the
// player's CONTINUOUS position currently is (including the in-flight tween), and
// eases toward that spot every frame — no grid, no snapping, just a wingman drifting
// into formation. When the player turns, only his station-keeping TARGET jumps to the
// new heading; his own rendered position keeps easing smoothly, so he arcs into the
// turn instead of popping.
const CRIMSON_STANDOFF = 1;      // tiles behind the player's facing he tries to hold station at
const CRIMSON_EASE_MS = 360;     // how briskly he closes the gap — bigger = lazier drift

// player's true continuous position, INCLUDING the mid-tween lag the camera is still
// easing through — worldOriginX/Y already jumped, cameraOffset is what hasn't caught
// up yet, so this is the inverse of cellToScreen at the player's fixed screen anchor.
function playerContPos() {
  const sx = SHIP_ANCHOR.x - world.cameraOffsetX;

  return { ax: world.worldOriginX + g.gx, ay: world.worldOriginY + g.gy };
}
function tickCrimsonEscort(dt) {
  const cont = playerContPos();

  const target = { ax: cont.ax + d.dx * CRIMSON_STANDOFF, ay: cont.ay + d.dy * CRIMSON_STANDOFF };

  if (!crimsonPos) { crimsonPos = { ax: target.ax, ay: target.ay }; crimsonFacing = world.shipFacing; }
  const prevAx = crimsonPos.ax, prevAy = crimsonPos.ay;
  const k = 1 - Math.exp(-dt / CRIMSON_EASE_MS);
  crimsonPos.ax = lerp(crimsonPos.ax, target.ax, k);
  crimsonPos.ay = lerp(crimsonPos.ay, target.ay, k);

  const mdx = crimsonPos.ax - prevAx, mdy = crimsonPos.ay - prevAy;
  if (Math.hypot(mdx, mdy) > 0.01) crimsonFacing = tileHeadingToFacing(mdx, mdy);
}
function drawCrimsonEscort() {
  if (!crimsonHired || combat || !crimsonPos) return;
  const px = playerAX(), py = playerAY();
  if (Math.hypot(crimsonPos.ax - px, crimsonPos.ay - py) > 14) return;   // far off-screen: nothing to draw
  const sc = cellToScreen(crimsonPos.ax - world.worldOriginX, crimsonPos.ay - world.worldOriginY);
  const bob = Math.sin(gTime * 0.003) * 2;

function drawUnscannedTag(x, y) {

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(6,12,20,0.55)";                       // dark disc so the glyph reads over any hull

  ctx.strokeStyle = `rgba(${UNSCANNED_RGB},${0.5 + 0.4 * puls})`; ctx.lineWidth = 1.6;

// ============================================================
// TURN-BASED COMBAT
// Triggered by colliding with a wandering enemy. The world freezes and the
// 13×13 grid becomes the battle arena. Each round: the player moves up to
// PLAYER_MOVES tiles (facing follows the last move / Q-E), then fires one
// weapon; afterwards every surviving enemy moves toward and attacks the
// player. When the fight ends the grid slides so the ship is centred again
// and free-roam resumes.
// ============================================================
const PLAYER_MAX_HP = 20, ENEMY_HP = 6;
const PHASER_DMG = 3, MISSILE_DMG = 8;
const ENEMY_PHASER_DMG = 2, ENEMY_MISSILE_DMG = 4, ENEMY_START_AMMO = 1;  // enemies share the player's weapons, weaker
const PLAYER_MOVES = 4, ENEMY_MOVES = 3, START_AMMO = 3;
const ENEMY_GAP_MS = 520;                        // pause between enemy ships on their turn
// Beat between a phase's turn banner appearing and its first actor actually moving/firing —
// shared by the enemy phase and the guest phase so both hand-offs read the same (Steve,
// 2026-07-26: wanted the guest's pause longer, the enemy phase to get one too, then longer
// again — now nearly the banner's full 1200ms `dur` rather than a fraction of it).
const TURN_START_PAUSE = 1100;
const ENEMY_FIRE_PAUSE = 850;                    // linger after a shot so the player sees it land

// ---- crew-action combat model (replaces the ship's own weapon/move buttons) ----
// Each player turn the crew take ACTIONS_PER_TURN actions total; clicking a crew
// face-circle resolves that crew's equipped ability (auto-targeted). See runCrewAction.
const ACTIONS_PER_TURN = 3;
const CREW_SLOTS = 3;                             // action slots per crew (slots 2–3 locked for now)
const SLOTS_UNLOCKED = 1;                         // how many of those slots are currently usable
const LASER_DMG = 2;                              // Rex · Lasers — low damage, 3-wide cone in front
const CREW_MISSILE_DMG = 4;                       // Rex · Missile — medium damage, straight line
const REPAIR_HP = 7;                              // Tessa · Repair — hull recovered
const REPAIR_BAY_BONUS = 5;                       // extra hull when the Repair Bay module is powered
const MEDBAY_HULL = 4;                            // hull patched when the Med Bay module powers a Heal
const SHIELD_PCT = 0.10;                          // Kael · Shield — incoming damage negated
const INCAP_CHANCE = 0.25;                        // chance an enemy hit knocks out a crew member

const CRIMSON_DMG = 3;                            // Spotlight Shot — single target
const CRIMSON_AOE_DMG = 2;                        // Supernova Strike — every live enemy
const CRIMSON_AOE_THRESHOLD = 3;                  // enemy count at/above which he goes wide
const CRIMSON_TARGET_CHANCE = 0.3;                // chance an enemy that CAN hit him does, over the player

const CDELTA = {                        // grid step per facing (screen-aligned with sprites)
  [DIR.FWD]:   { dx: 0,  dy: -1 },      // up-right
  [DIR.BACK]:  { dx: 0,  dy:  1 },      // down-left
  [DIR.LEFT]:  { dx: -1, dy:  0 },      // up-left

const CW_ORDER = [DIR.FWD, DIR.RIGHT, DIR.BACK, DIR.LEFT];

function cellToScreen(gx, gy) {

  return { x: SHIP_ANCHOR.x + (worldX - CENTER_WORLD_X),
           y: SHIP_ANCHOR.y + (worldY - CENTER_WORLD_Y) };
}
function inBounds(gx, gy) { return gx >= 0 && gx < GRID_SIZE && gy >= 0 && gy < GRID_SIZE; }

// Enemies occupy a SINGLE tile (their anchor). ENEMY_FOOT is kept as a fixed
// offset in case a multi-tile footprint is wanted again; at {0,0} the second
// cell collapses into the anchor so movement, blocking and targeting stay simple.
const ENEMY_FOOT = { dx: 0, dy: 0 };

function enemyCells(e) {

  // Tithe ask. Damage stays one-per-ship (fireCrewWeapon loops enemies, not cells),
  // and the wider target is INERT while shielded, so it never clashes with targeting
  // the rotating plates that share those tiles.
  if (e.openFoot && e.part === "core" && combat && combat.boss && !combat.boss.shielded) {
    // Follow the hull's on-screen long axis: the sprite draws along "/" (the gy axis)
    // when facing fore/aft, and flips to "\" (the gx axis) facing left/right — so the
    // lit/hittable tiles always lie under the ship however it's turned to face you.
    const flip = e.facing === DIR.LEFT || e.facing === DIR.RIGHT;
    const off = flip ? [[0, 0], [1, 0], [-1, 0]] : [[0, 0], [0, -1], [0, 1]];
    return off.map(([dx, dy]) => ({ gx: e.gx + dx, gy: e.gy + dy })).filter(c => inBounds(c.gx, c.gy));
  }
  const cells = [{ gx: e.gx, gy: e.gy }];

    cells.push({ gx: e.gx + ENEMY_FOOT.dx, gy: e.gy + ENEMY_FOOT.dy });

}
function enemyFootFits(gx, gy) {         // both tiles of an anchor at (gx,gy) are in bounds

function enemyAt(gx, gy) {

function startCombat(trigger) {

  const entryOX = world.worldOriginX, entryOY = world.worldOriginY;

  // a battle at the Command Nexus is the BOSS fight (the fortress itself, no other
  // ships) and wakes the Nexus; it powers back down when defeated (see winCombat).
  const nz = ZONE[REGION.NEXUS];         // the Nexus sits in its SW pocket

  // whose target you just flew to (pendingBossId)
  const bossBattle = BOSS_FLAG || !!pendingBossId;

    const b = setupBoss();                                      // whichever boss the hash named

    // bounty bosses are ships, so they're fought wherever you ran them down.
    if (b.meta.spec.arena === "nexus") {

      // entered from (the episode carries a `start=` that isn't the Nexus centre).
      // NEXUS_ARENA_CELL = the grid cell the fortress centre maps to (low gx = NW).
      world.worldOriginX = nz.cx - NEXUS_ARENA_CELL.gx;
      world.worldOriginY = nz.cy - NEXUS_ARENA_CELL.gy;
      regenerateGrid();
    }

    // SUBJECT of this fight, and without this its on-screen position varied with the
    // approach direction carried in `start=` (Steve's v0.4 #14). The Nexus stays
    // dormant — only the finale wakes it — and entryOrigin (captured above) still
    // returns the player to their true approach position afterwards.
    if (MISSION_MODE && COMBAT_AT === "nexus") {
      world.worldOriginX = nz.cx - NEXUS_ARENA_CELL.gx;
      world.worldOriginY = nz.cy - NEXUS_ARENA_CELL.gy;
      regenerateGrid();

    // collided with is guaranteed to appear (first), then any other nearby patrols,
    // then random hulls to fill out the encounter size.
    const cpx = world.worldOriginX + CENTER, cpy = world.worldOriginY + CENTER;
    const cluster = enemies.filter(e => e.hostile && Math.hypot(e.ax - cpx, e.ay - cpy) <= AGGRO_TILES);
    const hulls = [];
    if (trigger && trigger.ship) hulls.push(trigger.ship);         // the one you rammed, first
    for (const c of cluster) if (c !== trigger && c.ship) hulls.push(c.ship);
    const reds = cluster.length;

                            : Math.max(2, Math.min(4, reds || 3));
    const used = new Set([CENTER + "," + CENTER]);

    while (list.length < n && guard++ < 400) {
      const gx = 1 + ((Math.random() * (GRID_SIZE - 2)) | 0);
      const gy = 1 + ((Math.random() * (GRID_SIZE - 2)) | 0);
      const md = Math.abs(gx - CENTER) + Math.abs(gy - CENTER);
      if (md < 3 || !enemyFootFits(gx, gy)) continue;            // both tiles must be on the grid
      const cells = enemyCells({ gx, gy });
      if (cells.some(c => used.has(c.gx + "," + c.gy))) continue; // don't overlap another footprint
      cells.forEach(c => used.add(c.gx + "," + c.gy));
      const shipSet = hulls[list.length] || randomEnemyShip();   // seed from the cluster, then random
      const prof = shipSet.profile || SHIP_PROFILES.Gunner;   // fall back to the baseline hull
      list.push({ gx, gy, vgx: gx, vgy: gy, walk: null, facing: dirToward(gx, gy, CENTER, CENTER),

    actionsLeft: ACTIONS_PER_TURN, actedThisTurn: [], overclock: 0, confirmEnd: false,
    player: { gx: CENTER, gy: CENTER, vgx: CENTER, vgy: CENTER, walk: null,
              facing: world.shipFacing || DIR.FWD,
              hp: playerMaxHp(), maxhp: playerMaxHp(), ammo: START_AMMO, shieldPct: 0 },
    enemies: list, boss: bossMeta, flashes: [], explosions: [], shots: [], floaters: [], log: [], pending: null,
    trigger: trigger || null,                  // kept so a lost story fight can restage itself
    entryOrigin: { x: entryOX, y: entryOY },   // world position to restore when the fight ends
    bountyId: pendingBountyId,                 // set when this fight IS a bounty contract
    // Each boss announces itself: an explicit `banner` if the spec sets one, otherwise its

      combat.guest = { gx: CENTER - 1, gy: CENTER + 1, facing: DIR.FWD, bob: Math.random() * 6.283,

  crewBark = null; stopCrewBarkVO(); crewBarkLast = -1e9;   // and no leftover crew barks

  // frame and its name card is held back until the CG fades, otherwise you get a second
  // of arena and a banner before the introduction you actually wrote.

}

// `bonus` (from Tessa's Overclock) extends a weapon's reach by that many tiles.
function attackCells(px, py, facing, weapon, bonus) {
  bonus = bonus || 0;
  const d = CDELTA[facing], perp = { dx: -d.dy, dy: d.dx };
  const cells = [];
  if (weapon === "missile") {                       // 1 wide, 6 deep straight line (enemy)
    for (let s = 1; s <= 6 + bonus; s++) cells.push({ gx: px + d.dx * s, gy: py + d.dy * s });
  } else if (weapon === "missile5") {               // Rex Missile: 1 wide, 5 deep line
    for (let s = 1; s <= 5 + bonus; s++) cells.push({ gx: px + d.dx * s, gy: py + d.dy * s });
  } else if (weapon === "railgun") {                // Rex Railgun: 1 wide, pierces the whole line to the edge
    for (let s = 1; s <= GRID_SIZE; s++) cells.push({ gx: px + d.dx * s, gy: py + d.dy * s });
  } else if (weapon === "vent") {                   // Tessa Vent Plasma: the 8 cells around the ship (facing-independent)
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) if (ox || oy) cells.push({ gx: px + ox, gy: py + oy });
  } else if (weapon === "lasers") {                 // Rex Lasers: 3 wide, 3 deep block in front
    for (let s = 1; s <= 3 + bonus; s++)
      for (let w = -1; w <= 1; w++)
        cells.push({ gx: px + d.dx * s + perp.dx * w, gy: py + d.dy * s + perp.dy * w });
  } else {                                          // phaser: 3 wide, 4 deep cone (enemy)
    for (let s = 1; s <= 4 + bonus; s++)
      for (let w = -1; w <= 1; w++)
        cells.push({ gx: px + d.dx * s + perp.dx * w, gy: py + d.dy * s + perp.dy * w });
  }
  return cells.filter(c => inBounds(c.gx, c.gy));
}

function combatFire(weapon) {
  if (combat.phase !== "player" || combat.pending) return;
  const p = combat.player;
  if (weapon === "missile" && p.ammo <= 0) { clog("No missiles left!"); return; }
  const cells = attackCells(p.gx, p.gy, p.facing, weapon);
  const dmg = weapon === "missile" ? MISSILE_DMG : PHASER_DMG;
  let hits = 0;
  const killed = [];
  for (const e of combat.enemies)
    if (enemyCells(e).some(ec => cells.some(c => c.gx === ec.gx && c.gy === ec.gy))) {
      e.hp -= dmg; hits++; if (e.hp <= 0) killed.push(e);
      spawnFloater(e.gx, e.gy, "-" + dmg, "#ff9a3c");
    }
  if (weapon === "missile") p.ammo--;
  combat.flashes.push({ cells, t: 320,
    color: weapon === "missile" ? "rgba(255,140,40,0.6)" : "rgba(90,200,255,0.5)" });
  const ptgt = farthestCell(p.gx, p.gy, cells);        // beam/bolt animation along the shot
  const travel = weapon === "missile" ? 360 : 240;     // matches spawnShot's dur
  spawnShot(p.gx, p.gy, ptgt.gx, ptgt.gy, weapon, weapon === "missile" ? "#ffae42" : "#7fe3ff");
  if (!hits) spawnFloater(ptgt.gx, ptgt.gy, "MISS", "#9fb4c2");
  clog((weapon === "missile" ? "Missile" : "Phaser") + " — " + hits + " hit" + (hits === 1 ? "" : "s"));
  // Hold the turn open until the bolt/beam reaches the target; only then do hit
  // ships explode and disappear (see the pending block in tickCombat). Damaged-
  // but-alive ships stay visible the whole time.
  combat.pending = { t: travel, kill: killed };

    // Escorts always get their move, whether or not Crimson has joined yet —
    // this IS their guest turn. Without a real guest (g), or with nothing left
    // to shoot at, the phase ends right here; no windup/attack half without him.

// Spotlight Shot's target: whichever live enemy is closest to the player — reads as

function pickGuestTarget() {
  const p = combat.player;
  return combat.enemies.reduce((best, e) =>
    (Math.abs(e.gx - p.gx) + Math.abs(e.gy - p.gy)) < (Math.abs(best.gx - p.gx) + Math.abs(best.gy - p.gy)) ? e : best);
}

function nearestEnemy(fx, fy) {

  for (const e of combat.enemies) {

    if (d < bd) { bd = d; best = e; }

    let h = 0;
    for (const e of combat.enemies)

    if (Math.abs(dx) >= Math.abs(dy)) mx = Math.sign(dx); else my = Math.sign(dy);
    let nx = cx + mx, ny = cy + my;

      mx = mx === 0 ? Math.sign(dx) : 0; my = my === 0 ? Math.sign(dy) : 0;
      nx = cx + mx; ny = cy + my;
      if ((mx === 0 && my === 0) || !inBounds(nx, ny) || enemyAt(nx, ny)) break;

    for (let gy = 0; gy < GRID_SIZE; gy++) {
      if ((gx === p.gx && gy === p.gy) || enemyAt(gx, gy)) continue;
      if (Math.abs(gx - p.gx) + Math.abs(gy - p.gy) <= 3) continue;   // must jump far
      let score = 0;
      const en = nearestEnemy(gx, gy);
      if (en) {

        if (bf.hits > 0) score += 100 + bf.hits * 10;

}

  combat.actionPick = { ci: t, mode: "root", borrower: vossIdx };
}
function applyEnemyTarget(name, e) {
  if (name === "Scan") {

    clog("Kael scans the enemy — stats revealed.");
    crewBarkSay("kael-scan");
    // every other ship of the same hull on the field reads as scanned too
    if (e.ship && e.ship.shipName && combat && combat.enemies)
      for (const o of combat.enemies) if (o.ship && o.ship.shipName === e.ship.shipName) o.scanned = true;
    // Log it in the Ship Database. A boss credits its OWN entry, not the hull it
    // borrows — scanning the Wolfpack's flagship shouldn't just tick "Dread" — but an
    // escort with a real hull still credits that hull.
    if (e.ship && e.ship.shipName) discoverShip(e.ship.shipName);
    // Any piece OF the boss identifies the boss (Steve, v0.5): the core, a Nexus
    // shield generator, a Tithe blast plate — scan whichever you can reach and the
    // codex entry unlocks. The anti-cheese rule survives via the hull check: an
    // ESCORT (a Hound) is its own ship, not a piece of the flagship, so scanning
    // one still credits only its own hull.
    if (e.boss && (e.part === "core" || !e.ship)) discoverShip(bossDexId());

  else if (name === "Transmission") {
    if (Math.random() < JAM_CHANCE) { e.skipTurn = true; clog("Transmission jams the enemy — it loses its next action."); crewBarkSay("kael-jam"); }
    else clog("Transmission failed to jam.");

  else if (name === "Disruptor Pulse") { e.skipTurn = true; sfx("disruptor"); clog("Disruptor pulse — the enemy's systems overload, it skips its turn."); crewBarkSay("kael-disruptor"); }
  else if (name === "Focus Fire") { e.marked = true; sfx("focus"); clog("Voss marks the target — focus fire! (+" + Math.round((MARK_MULT - 1) * 100) + "% crew damage this turn)"); crewBarkSay("voss-focus"); }
}
// grid/facing clicks while a target is being chosen (crew-face clicks handled in handleCombatClick)
function handleTargetingGrid(mx, my) {
  const t = combat.targeting, i = t.ci, p = combat.player;
  if ((t.kind === "move" || t.kind === "hop") && t.step === 1) {   // choosing which way to face
    const dir = facingChevronAt(mx, my, t.dest);
    if (dir !== null) { (t.kind === "move" ? applyManeuver : applyHop)(t.dest, dir); spendAction(i); }
    return;
  }
  const c = cellAtScreen(mx, my);
  if (t.kind === "move") { if (moveTileValid(c.gx, c.gy)) { t.dest = c; t.step = 1; } return; }
  if (t.kind === "hop")  { if (hopTileValid(c.gx, c.gy))  { t.dest = c; t.step = 1; } return; }
  if (t.kind === "aim")  { if (inBounds(c.gx, c.gy) && !(c.gx === p.gx && c.gy === p.gy)) { applyAim(dirToward(p.gx, p.gy, c.gx, c.gy)); spendAction(i); } return; }

// ---- combat ship movement: ships glide along a tile path, never teleport ----
const WALK_SPEED = 3.6;                          // tiles per second (slowed for readability)
function stepFacing(dx, dy) {
  if (dx > 0) return DIR.RIGHT; if (dx < 0) return DIR.LEFT;
  if (dy > 0) return DIR.BACK;  if (dy < 0) return DIR.FWD;
  return null;
}
// `path` is the ordered list of cells incl. the start; the sprite eases through it.
// `endFacing` (optional) is the facing to settle on once the glide finishes.
function startWalk(ent, path, endFacing) {
  ent.walk = { path, prog: 0, endFacing: (endFacing == null ? null : endFacing) };
  ent.vgx = path[0].gx; ent.vgy = path[0].gy;
}
function tickWalk(ent, dt) {
  const w = ent.walk; if (!w) return;
  w.prog += (dt / 1000) * WALK_SPEED;
  const segs = w.path.length - 1;
  if (w.prog >= segs) { ent.vgx = w.path[segs].gx; ent.vgy = w.path[segs].gy; if (w.endFacing != null) ent.facing = w.endFacing; ent.walk = null; return; }
  const i = Math.floor(w.prog), f = w.prog - i, a = w.path[i], b = w.path[i + 1];
  ent.vgx = a.gx + (b.gx - a.gx) * f;
  ent.vgy = a.gy + (b.gy - a.gy) * f;
  const fc = stepFacing(b.gx - a.gx, b.gy - a.gy);
  if (fc !== null) ent.facing = fc;             // face along travel for natural motion
}

// Best shot on the player from a given tile, trying all four facings. Normally
// prefers the free phaser and saves missiles for a longer lineup; a hull with
// missileBias (the Cyclops sniper) reaches for the missile first while it has ammo.
function shotFromTile(gx, gy, p, e) {
  const ammo = e ? e.ammo : 0;
  const pr = (e && e.profile) || SHIP_PROFILES.Gunner;
  const phaser = () => {
    for (const face of CW_ORDER)
      if (attackCells(gx, gy, face, "phaser").some(c => c.gx === p.gx && c.gy === p.gy))
        return { weapon: "phaser", face };
    return null;
  };
  const missile = () => {
    if (ammo <= 0) return null;
    for (const face of CW_ORDER)
      if (attackCells(gx, gy, face, "missile").some(c => c.gx === p.gx && c.gy === p.gy))
        return { weapon: "missile", face };
    return null;
  };
  if (pr.missileBias > 0) return missile() || phaser();
  return phaser() || missile();
}
function enemyWeaponShot(e, p) { return shotFromTile(e.gx, e.gy, p, e); }

// `target` defaults to the player. shotFromTile/enemyWeaponShot already accept any
// {gx,gy} target generically — only the hit-application block here needs to branch,
// since Crimson takes damage differently (no dodge, no shield, and a knockout sends
// him home instead of knocking out a crew member).
function enemyFire(e, weapon, face, target) {
  target = target || combat.player;
  const isGuest = target === combat.guest;
  const isEscort = !isGuest && target !== combat.player;
  e.facing = face;
  const cells = attackCells(e.gx, e.gy, face, weapon);
  const pr = e.profile || SHIP_PROFILES.Gunner;
  const dmg = weapon === "missile" ? (pr.missileDmg || ENEMY_MISSILE_DMG)
                                   : (pr.phaserDmg || ENEMY_PHASER_DMG);
  const hit = cells.some(c => c.gx === target.gx && c.gy === target.gy);
  if (weapon === "missile") e.ammo--;
  const fx = enemyFx(e);                                  // this hull's signature look
  combat.flashes.push({ cells, t: 520,
    color: weapon === "missile" ? "rgba(255,120,40,0.5)" : "rgba(255,90,90,0.4)" });
  const etgt = hit ? { gx: target.gx, gy: target.gy } : farthestCell(e.gx, e.gy, cells);
  spawnShot(e.gx, e.gy, etgt.gx, etgt.gy, weapon,
            weapon === "missile" ? "#ffae42" : fx.color, fx.thick, fx);
  if (!hit) { sfx("miss"); spawnFloater(etgt.gx, etgt.gy, "MISS", "#9fb4c2"); return; }        // Brett's #1: a whiff used to be silent and unreadable
  if (isGuest) {
    const taken = dmg;                      // no dodge, no shield — he's not fitted with the player's modules
    combat.guest.hp -= taken;
    combat.flashes.push({ cells: [{ gx: target.gx, gy: target.gy }], color: "rgba(255,140,74,0.6)", t: 520 });
    sfx("hit");
    spawnFloater(target.gx, target.gy, "-" + taken, "#ff6a5a");
    clog("Crimson takes " + taken + " damage!");
    if (combat.guest.hp <= 0) {
      combat.guest = null;                  // out of THIS fight...
      crimsonHired = false; saveCrimsonHire();   // ...and off the team until re-hired at the hangar
      crimsonBarkSay("knockedOut");
    } else if (taken >= CRIMSON_MAX_HP * 0.34) {
      crimsonBarkSay("heavyHit");
    }
    return;
  }
  if (isEscort) {                           // civilian transport — no dodge/shield/crew, just HP
    const taken = dmg;
    target.hp -= taken;
    combat.flashes.push({ cells: [{ gx: target.gx, gy: target.gy }], color: "rgba(255,140,74,0.6)", t: 520 });
    if (target.hp <= 0 && !target._destroyed) {
      target._destroyed = true;
      spawnExplosion(target.gx, target.gy, false);
      spawnFloater(target.gx, target.gy, "TRANSPORT LOST", "#ff6a5a");
      clog("An evacuation transport is destroyed!");
    } else {
      sfx("hit");
      spawnFloater(target.gx, target.gy, "-" + taken, "#ff6a5a");
      clog("An evacuation transport takes " + taken + " damage!");
    }
    return;
  }
  const p = target;
  if (p.dodge && Math.random() < DODGE_CHANCE) {   // Astra · Evasive Roll — the shot whiffs
    clog("Evasive roll — the enemy " + weapon + " misses!"); sfx("miss");
    spawnFloater(p.gx, p.gy, "MISS", "#9fb4c2");
  } else {
    let taken = dmg;
    const shielded = p.shieldPct > 0;
    if (shielded) taken = Math.max(1, Math.round(dmg * (1 - p.shieldPct)));   // Kael's shield
    p.hp -= taken;
    combat.flashes.push({ cells: [{ gx: p.gx, gy: p.gy }], color: "rgba(255,60,60,0.6)", t: 520 });
    sfx(shielded ? "shield_hit" : "hit");
    spawnFloater(p.gx, p.gy, "-" + taken, "#ff6a5a");
    clog("Enemy " + weapon + " hits for " + taken + (taken < dmg ? " (shielded)" : ""));
    // a solid hit can knock a crew member out (revived by Selyra's Heal); never the last one
    const up = combat.crew.filter(cs => !cs.incap);
    let knocked = false;
    if (up.length > 1 && Math.random() < INCAP_CHANCE) {
      const v = up[(Math.random() * up.length) | 0];
      v.incap = true; v.reviveIn = INCAP_TURNS;        // auto-revives after this many player turns
      combat.actedThisTurn = combat.actedThisTurn.filter(x => x !== v.idx);
      clog(CREW[v.idx].name + " knocked out!");
      knocked = true;
      const still = up.filter(cs => cs !== v);         // a standing crewmate calls it out, not the downed one
      crewBarkSay("ally-down", still.length ? CREW[still[(Math.random() * still.length) | 0].idx].name : null);
    }
    if (!knocked && taken >= p.maxhp * 0.2) crewBarkSay("heavy-hit");   // real blows only, not chip
  }
}

// Plan an enemy's move: BFS the tiles reachable within this hull's move range
// (avoiding the player and other ships), then pick a tile that yields a firing
// solution, scored by the hull's doctrine (moves little, but steers toward its
// preferred stand-off distance). If nothing reachable can fire, it repositions
// toward that same preferred range. Returns the path (incl. start) or null when
// staying put is best.
function planEnemyMove(e, p) {
  const key = (x, y) => x + "," + y;
  const pr = e.profile || SHIP_PROFILES.Gunner;
  const moves = pr.moves;                                 // this hull's per-turn reach
  const others = combat.enemies.filter(o => o !== e);
  // a single tile is blocked if the player or another ship's footprint sits on it
  const blocked = (x, y) => (x === p.gx && y === p.gy)
                          || others.some(o => enemyCells(o).some(c => c.gx === x && c.gy === y));
  // this ship can anchor at (x,y) only if BOTH its footprint tiles are on the grid & clear
  const anchorOK = (x, y) => enemyFootFits(x, y)
                          && !blocked(x, y)
                          && !blocked(x + ENEMY_FOOT.dx, y + ENEMY_FOOT.dy);
  const dist = new Map([[key(e.gx, e.gy), 0]]);
  const prev = new Map();
  const reach = [{ gx: e.gx, gy: e.gy }];
  const q = [{ gx: e.gx, gy: e.gy }];
  while (q.length) {
    const c = q.shift(), d = dist.get(key(c.gx, c.gy));
    if (d >= moves) continue;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = c.gx + dx, ny = c.gy + dy, k = key(nx, ny);
      if (!inBounds(nx, ny) || dist.has(k)) continue;
      if (!anchorOK(nx, ny)) continue;                 // footprint must fit & be clear
      dist.set(k, d + 1); prev.set(k, c);
      const cell = { gx: nx, gy: ny };
      reach.push(cell); q.push(cell);
    }
  }
  let best = null, bestScore = Infinity;
  for (const c of reach) {                              // tiles we could fire from
    if (!shotFromTile(c.gx, c.gy, p, e)) continue;
    const steps = dist.get(key(c.gx, c.gy));
    const range = Math.abs(c.gx - p.gx) + Math.abs(c.gy - p.gy);
    // prefer moving little, but steer toward this hull's preferred stand-off:
    // snipers pick the farthest firing tile, rushers the closest.
    const score = steps * 25 + Math.abs(range - pr.prefRange) * pr.rangeW;
    if (score < bestScore) { bestScore = score; best = c; }
  }
  if (!best) {                                          // can't fire → reposition by doctrine
    let bd = Infinity;                                  // toward prefRange: rushers close in,
    for (const c of reach) {                            // snipers hold / open distance
      const range = Math.abs(c.gx - p.gx) + Math.abs(c.gy - p.gy);
      const dd = Math.abs(range - pr.prefRange);
      if (dd < bd) { bd = dd; best = c; }
    }
  }
  if (!best || (best.gx === e.gx && best.gy === e.gy)) return null;
  const path = [best];
  let cur = best;
  while (!(cur.gx === e.gx && cur.gy === e.gy)) { cur = prev.get(key(cur.gx, cur.gy)); path.unshift(cur); }
  return path;
}

// Enemy-turn state machine, one ship at a time: plan → glide → fire → gap.
// The "moving" state is resolved in tickCombat once the glide animation ends.
// A straight path from a ship's tile out past the nearest arena edge — used by a
// fleeing ship to glide off and exit the battle.
function fleePath(e) {
  const dL = e.gx, dR = GRID_SIZE - 1 - e.gx, dU = e.gy, dD = GRID_SIZE - 1 - e.gy;
  const m = Math.min(dL, dR, dU, dD);
  let dx = 0, dy = 0;
  if (m === dU) dy = -1; else if (m === dD) dy = 1; else if (m === dL) dx = -1; else dx = 1;
  const path = [{ gx: e.gx, gy: e.gy }];
  let x = e.gx, y = e.gy;
  while (x >= -1 && x <= GRID_SIZE && y >= -1 && y <= GRID_SIZE) {
    x += dx; y += dy; path.push({ gx: x, gy: y });       // step straight out past the edge
  }
  return path;
}

function enemyAdvance() {
  const ai = combat.ai, p = combat.player;
  if (combat.boss) { bossAdvance(); return; }             // the Nexus boss runs its own turn
  if (ai.state === "flee") {                              // scripted: this ship retreats
    const f = combat.fleeer;
    if (!f || !combat.enemies.includes(f)) { ai.idx = 0; ai.state = "start"; ai.timer = 80; return; }
    const path = fleePath(f);
    f.gx = path[path.length - 1].gx; f.gy = path[path.length - 1].gy;
    startWalk(f, path);
    ai.state = "fleeingGlide";
    combat.banner = { text: "ENEMY RETREATING", kind: "enemy", t: 1400, dur: 1400 };
    clog("A patrol ship breaks off and flees!");
    return;
  }
  if (ai.idx >= combat.enemies.length) { finishEnemyTurn(); return; }
  const e = combat.enemies[ai.idx];

  if (ai.state === "start") {
    if (e.skipTurn) {                                     // jammed by Voss's Transmission
      e.skipTurn = false;
      clog("An enemy is jammed — it can't act.");
      ai.idx++; ai.state = "start"; ai.timer = 160;
      if (ai.idx >= combat.enemies.length) finishEnemyTurn();
      return;
    }
    const path = planEnemyMove(e, p);
    if (path && path.length > 1) {
      e.gx = path[path.length - 1].gx; e.gy = path[path.length - 1].gy;   // logical move now
      startWalk(e, path);                                                 // sprite glides
      ai.state = "moving";
      return;
    }
    ai.state = "fire"; ai.timer = 140; return;
  }
  if (ai.state === "fire") {
    const target = pickEnemyTarget(e);
    const shot = enemyWeaponShot(e, target);
    if (shot) enemyFire(e, shot.weapon, shot.face, target);
    else e.facing = dirToward(e.gx, e.gy, target.gx, target.gy);
    if (p.hp <= 0) { loseCombat(); return; }         // losing the fight is always about the player
    ai.state = "gap"; ai.timer = shot ? ENEMY_FIRE_PAUSE : ENEMY_GAP_MS; return;  // hold on a hit
  }
  ai.idx++; ai.state = "start"; ai.timer = 80;          // "gap" → next ship
  if (ai.idx >= combat.enemies.length) finishEnemyTurn();
}
// Which unit this enemy shoots at. Purely opportunistic — enemies never reposition
// specifically to reach Crimson (planEnemyMove is untouched), they only ever consider
// him if he already happens to be in a valid firing line from wherever they'd move
// anyway for the player. A deliberate first-pass simplification: he's a bonus target,
// never hunted.
const ESCORT_TARGET_CHANCE = 0.35;   // chance an enemy that CAN hit a civilian transport does, over the player
function pickEnemyTarget(e) {
  const p = combat.player, g = combat.guest;
  if (e.elite) return p;             // A-17 ignores everyone but the StarGear (Echoes_Part4.txt Scene 15)
  const candidates = [];
  if (g && shotFromTile(e.gx, e.gy, g, e) && Math.random() < CRIMSON_TARGET_CHANCE) candidates.push(g);
  if (combat.escorts) for (const c of combat.escorts)
    if (c.hp > 0 && shotFromTile(e.gx, e.gy, c, e) && Math.random() < ESCORT_TARGET_CHANCE) candidates.push(c);
  return candidates.length ? candidates[(Math.random() * candidates.length) | 0] : p;
}
// Cogwheel Station's two defence turrets (Echoes_Part3.txt Phase 1 deployment) —
// ambient support fire, not full independent units: no HP/targeting AI of their
// own (the script names no turret-loss condition), just a small automatic chip of
// damage into a random live enemy each enemy turn, with a flash for feedback.
function tickTurretSupport() {
  const e = combat.echo; if (!e || !e.turrets) return;
  for (let i = 0; i < e.turrets; i++) {
    const live = combat.enemies.filter(en => en.hp > 0);
    if (!live.length) break;
    const t = live[(Math.random() * live.length) | 0];
    t.hp -= 1;
    combat.flashes.push({ cells: enemyCells(t), color: "rgba(120,255,180,0.4)", t: 400 });
    if (t.hp <= 0) {                        // turret fire can finish a ship off — kill it for real,
      for (const c of enemyCells(t)) spawnExplosion(c.gx, c.gy, false);   // there's no "shot in flight"
      grantScrapFor(t);                                                    // pending-resolution to lean on
      combat.enemies = combat.enemies.filter(en => en !== t);
      clog("Station turret fire finishes off an enemy!");
    } else {
      spawnFloater(t.gx, t.gy, "-1", "#8dffb0");
    }
  }
}
function finishEnemyTurn() {
  tickTurretSupport();
  if (combat.enemies.length === 0 && combat.echo && combat.echo.stage === 1) {
    combat.echo.stage = 1.5;
    sceneActive = true;
    try { window.parent.postMessage({ type: "playScene", id: "cogwheel_defence_wave1", freeze: true }, "*"); } catch (err) {}
    return;
  }
  combat.ai = null;
  combat.phase = "player"; combat.turn++;
  // reset the crew's action budget; buffs (overclock, shield) last only one round
  combat.actionsLeft = ACTIONS_PER_TURN;
  combat.actedThisTurn = [];
  combat.overclock = 0;
  combat.player.shieldPct = 0;
  combat.player.dodge = false;                          // Astra · Evasive Roll — one enemy turn
  for (const e of combat.enemies) e.marked = false;     // Voss · Focus Fire — one turn
  combat.banner = { text: "YOUR TURN", kind: "player", t: 1200, dur: 1200 };
}
function winCombat() {
  const bounty = combat.bountyId ? BOUNTY_BY_ID[combat.bountyId] : null;
  const scripted = MISSION_MODE || evacActive;   // a story-mission-flavored win, not just a free-roam skirmish
  combat.banner = { text: bounty ? "BOUNTY DOWN" : scripted ? "MISSION COMPLETE" : "ENEMIES DESTROYED",
                    kind: "info", t: 1400, dur: 1400 };
  combat.phase = "won"; combat.endTimer = scripted ? 1300 : 950;
  if (bounty) { completeBounty(bounty.id); combat.bountyId = null; }   // pays the coin + fires the achievement
  nexusAwake = false;                        // Nexus defeated → powers back down to dormant
  if (!MISSION_MODE) noteOptionalActivity(); // Part 2: a free-roam kill counts toward Rowan's call (no-ops once fleetCalled)
  if (evacActive) {                          // Part 3: the Evacuation Escort battle is cleared
    evacActive = false; evacWon = true; saveEvacWon();
    clog("The interceptor wave is down. The evacuation corridor holds — for now.");
  }
  if (MISSION_MODE && !missionDone) {        // tell the episode orchestrator the fight is won
    missionDone = true;
    try { window.parent.postMessage({ type: "missionComplete" }, "*"); } catch (e) {}
  }
}
// No loss is fatal (Steve, 2026-07-20). Whatever the fight, the StarGear breaks
// off with 1–2 random modules wrecked — they keep their grid slot but do nothing
// until repaired for coin at a station. That's the risk side of picking fights.
// In free-roam you limp back into open space; in a STORY mission you can't just
// wander off (there'd be nothing left to do and no way to advance), so the fight
// restages and you go again with the damage you took.
function loseCombat() {
  spawnExplosion(combat.player.gx, combat.player.gy, true);
  combat.phase = "lost"; combat.endTimer = 1800;
  const broke = breakRandomModules(1 + ((Math.random() < 0.5) ? 1 : 0));
  combat.banner = { text: MISSION_MODE ? "BREAKING OFF — REGROUPING" : "HULL CRITICAL — BREAKING OFF",
                    kind: "info", t: 1800, dur: 1800 };
  if (broke.length) {
    const names = broke.map(id => SHIP_MODULE_BY_ID[id].name);
    chatterLast = -1e9; say("moduleBroken");          // let the crew call the damage out
    clog("Damage report: " + names.join(" and ") + " wrecked. Repair at a station.");
    spawnFloater(combat.player.gx, combat.player.gy, names.length + " MODULE" + (names.length > 1 ? "S" : "") + " WRECKED", "#ff5a5a");
  } else {
    clog("The hull holds — nothing left to break.");
  }
  // …and they help themselves to the hold on the way out.
  const loot = loseCargoOnDefeat();
  if (loot.lost.length) {
    clog("They stripped the hold: " + loot.lost.join(", ") + " gone (" + loot.pct + "%).");
    spawnFloater(combat.player.gx, combat.player.gy + 1, "-" + loot.pct + "% CARGO", "#ff9a5a");
  }
}

// ============================================================
// BOSS FRAMEWORK
// Every boss is a spec in BOSS_SPECS, staged by `#mission&boss=<id>`. A spec owns
// its own setup, per-turn tactics and phase transitions, so each boss can fight
// completely differently while reusing the whole combat pipeline: its targetable
// pieces are ordinary `combat.enemies` entries carrying `boss:true` and a `part`
// name, and `combat.boss` holds the phase/attack state.
//
// The shared vocabulary the RENDERER already understands — use these names in a
// new spec and the drawing comes for free:
//   part === "core"      → the win target (orange marker; killing it wins)
//   b.shielded === true  → the core is invulnerable (hex shield ring, "shield holds")
//   b.telegraph          → { cells:[{gx,gy}], dmg } painted as a pulsing danger zone
//   b.phase              → integer phase, shown via the spec's objective() line
//
// A spec is:
//   { id, name, dexTactics,
//     setup()            → { parts, meta }     meta must include phase + shielded
//     advance(ai, b, p)  → runs ONE step of the boss turn; must eventually call
//                          finishEnemyTurn() (mirrors enemyAdvance's ai.state walk)

const BOSS_SPECS = {};
function registerBoss(spec) {

  if (spec.cg) { spec._cgImg = new Image(); spec._cgImg.src = spec.cg; }

  if (spec.portrait) { spec._portraitImg = new Image(); spec._portraitImg.src = spec.portrait; }
  BOSS_SPECS[spec.id] = spec;

// ---- boss encounter CG ----------------------------------------------------
// Full-screen splash over the arena while the boss's opening beat plays, then it
// fades and hands you the fight. Click / Space / Esc skips straight through.
let bossIntro = null;                    // { img, t, out }
function startBossIntro(spec) {
  const img = spec && spec._cgImg;

}
function tickBossIntro(dt) {
  if (!bossIntro) return;

  if (!bossSay) {                        // opening beat finished talking → fade out
    bossIntro.out += dt;

  }
}
// the boss's name card, held back while the CG was up, plays as it hands over to the fight
function releaseIntroBanner() {
  if (combat && combat.introBanner) { combat.banner = combat.introBanner; combat.introBanner = null; }
}
function skipBossIntro() { bossSay = null; bossIntro = null; stopBossVO(); releaseIntroBanner(); }
function drawBossIntroCG() {
  if (!bossIntro) return;
  const r = canvas.getBoundingClientRect();
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top; if (!(visH > 200)) visH = r.height; visH = Math.min(visH, r.height);
  const inA = clamp01(bossIntro.t / 280);
  const outA = bossIntro.out ? 1 - clamp01(bossIntro.out / 420) : 1;
  ctx.save();
  ctx.globalAlpha = clamp01(Math.min(inA, outA));
  ctx.fillStyle = "#04060c";
  ctx.fillRect(0, 0, r.width, visH);
  const img = bossIntro.img;
  const sc = Math.max(r.width / img.naturalWidth, visH / img.naturalHeight);
  const dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;
  ctx.drawImage(img, (r.width - dw) / 2, (visH - dh) / 2, dw, dh);
  ctx.fillStyle = "rgba(4,6,12,0.30)";   // knock it back so the dialogue stays readable
  ctx.fillRect(0, 0, r.width, visH);
  ctx.fillStyle = "rgba(190,220,235,0.55)";
  ctx.font = "11px Consolas, monospace";
  ctx.textAlign = "right"; ctx.textBaseline = "alphabetic";
  ctx.fillText("click / space — skip", r.width - 22, visH - 18);

}

// ---- boss dialogue --------------------------------------------------------
// A spec may carry `speaker`, `accent` and `lines` = { start, hp50, hp25, defeat },
// each an array of consecutive lines shown one after another. Beats fire once per
// fight. Text-only for now; if these get voiced, hang a clip off each line and read
// its duration at runtime the way KEEPERS/CHATTER do.
let bossSay = null;                      // { name, accent, entries, i, text, t, dur }
const BOSS_LINE_MS = 2600;               // fallback reading time when a line has no clip
// Beat order == the order lines were recorded in, which is what makes clip numbering
// work: every line's clip number is its position across ALL beats. Changing this order
// (or inserting a line mid-beat) renumbers the clips and needs a re-cut — see
// BOSS_VO_SCRIPT.md.
const BOSS_BEATS = ["start", "hp50", "hp25", "defeat"];
// Boss VO on its own channel, same shape as KEEPER_VO. A spec sets `vo` to the clip
// prefix, e.g. "bounties/drax" → audio/bounties/drax_01.mp3 …
const BOSS_VO = { vol: 1.0, _cache: {}, _cur: null };
function stopBossVO() {
  const a = BOSS_VO._cur;
  if (a) { try { a.pause(); a.currentTime = 0; } catch (e) {} BOSS_VO._cur = null; }
}
function playBossVO(file) {
  stopBossVO();
  let a = BOSS_VO._cache[file];
  if (!a) {
    a = new Audio("audio/" + file);
    a.preload = "auto";
    a.addEventListener("error", () => { a._missing = true; }, { once: true });
    BOSS_VO._cache[file] = a;
  }
  if (a._missing) return null;
  a.volume = Math.max(0, Math.min(1, BOSS_VO.vol * volVoice()));
  try { a.currentTime = 0; } catch (e) {}
  const p = a.play();
  if (p && p.catch) p.catch(() => {});
  BOSS_VO._cur = a;
  return a;
}

function bossTalk(beat) {
  const spec = bossSpec(); if (!spec || !spec.lines) return;
  const b = combat && combat.boss; if (b) {
    b.said = b.said || {};
    if (b.said[beat]) return;            // each beat lands once per fight
    b.said[beat] = true;
  }
  const pool = spec.lines[beat]; if (!pool || !pool.length) return;
  // clip number = position across every beat, in BOSS_BEATS order
  let n = 0;
  for (const k of BOSS_BEATS) {
    if (k === beat) break;
    n += (spec.lines[k] || []).length;
  }
  const entries = pool.map((text, k) => ({
    text, file: spec.vo ? spec.vo + "_" + String(n + k + 1).padStart(2, "0") + ".mp3" : null,
  }));
  bossSay = { name: spec.speaker || spec.name, accent: spec.accent || "#ff7a6a",
              entries, i: -1, text: "", t: 0, dur: BOSS_LINE_MS };
  bossSayAdvance();
}
// start the next line of the current beat, taking its on-screen time from the clip
function bossSayAdvance() {
  const c = bossSay; if (!c) return;
  c.i++;
  if (c.i >= c.entries.length) { bossSay = null; stopBossVO(); return; }
  const ent = c.entries[c.i];
  c.text = ent.text; c.t = 0; c.dur = BOSS_LINE_MS;
  if (!ent.file) return;
  const a = playBossVO(ent.file);
  if (!a) return;
  const sync = () => {
    if (!a.duration || !isFinite(a.duration) || bossSay !== c || c.entries[c.i] !== ent) return;
    c.dur = Math.max(900, a.duration * 1000 + 450);
  };
  if (a.readyState >= 1) sync();
  else a.addEventListener("loadedmetadata", sync, { once: true });
}
function tickBossSay(dt) {
  if (!bossSay) return;
  bossSay.t += dt;
  if (bossSay.t >= bossSay.dur) bossSayAdvance();
}
// HP-threshold barks. Checked per frame against the core's own health, so a boss
// whose core is invulnerable early (Drax behind his wing) still speaks on the way down.
function bossCheckHpLines() {
  const b = combat && combat.boss; if (!b) return;
  const core = bossCore(); if (!core || !core.maxhp) return;
  const f = core.hp / core.maxhp;
  if (f <= 0.25) bossTalk("hp25");
  else if (f <= 0.5) bossTalk("hp50");
}
// Boss dialogue reads as a visual-novel bar, not a HUD pill — these are scripted lines
// over story art, so they get the weight the episode's dialogue gets. Anchored bottom-left
// and kept clear of the right-hand crew panel so it works over the arena as well as the CG.
function drawBossSay() {
  if (!bossSay) return;
  const r = canvas.getBoundingClientRect();
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top; if (!(visH > 200)) visH = r.height; visH = Math.min(visH, r.height);
  const f = bossSay.t / bossSay.dur;
  const alpha = f < 0.06 ? f / 0.06 : f > 0.9 ? (1 - f) / 0.1 : 1;
  // full width over the CG (nothing else is on screen); narrowed in the arena so it can't
  // run under the combat panel
  const w = bossIntro ? Math.min(1000, r.width - 96) : Math.min(880, r.width - 400);
  const x = bossIntro ? (r.width - w) / 2 : 44;
  ctx.save();
  ctx.globalAlpha = clamp01(alpha);
  ctx.font = "17px Consolas, monospace";
  const lines = wrapLines(bossSay.text, w - 56);
  const h = 40 + lines.length * 25;
  const y = visH - h - (bossIntro ? 54 : 38);

  ctx.fillStyle = "rgba(6,10,18,0.86)";
  chamferPath(ctx, x, y, w, h, 10); ctx.fill();
  ctx.strokeStyle = bossSay.accent; ctx.lineWidth = 2;
  chamferPath(ctx, x, y, w, h, 10); ctx.stroke();
  ctx.fillStyle = bossSay.accent;                  // accent spine down the speaker's edge
  ctx.fillRect(x + 3, y + 10, 3, h - 20);

  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = bossSay.accent; ctx.font = "bold 13px Consolas, monospace";
  ctx.fillText(bossSay.name.toUpperCase(), x + 26, y + 24);
  ctx.fillStyle = "#f2f8fb"; ctx.font = "17px Consolas, monospace";
  lines.forEach((ln, i) => ctx.fillText(ln, x + 26, y + 50 + i * 25));

// A boss fight can be staged two ways: by the URL hash (the episode's scripted
// Nexus finale) or at runtime by flying to an accepted bounty's target, which
// sets `pendingBossId` just before startCombat.
let pendingBossId = null;
function bossIdNow() { return pendingBossId || BOSS_ID; }
function bossSpec() { return (combat && combat.boss && combat.boss.spec) || BOSS_SPECS[bossIdNow()] || BOSS_SPECS.nexus; }
// stage whichever boss was asked for, defaulting to the Nexus fortress
function setupBoss() {
  const spec = BOSS_SPECS[bossIdNow()] || BOSS_SPECS.nexus;
  const b = spec.setup();
  b.meta.spec = spec;

}
function bossAdvance() {
  const spec = bossSpec();

}
function updateBossPhase() {
  const b = combat.boss; if (!b) return;
  bossSpec().updatePhase(b);

  if (combat.phase !== "player") faceBossPartsAtPlayer();

  if (!bossCore() && combat.enemies.length) {
    bossTalk("defeat");                  // last words, over the win banner
    // swept survivors (escorts still up when the flagship falls, leftover shield
    // generators) explode AND pay their salvage — they died, however it happened

function bossObjectiveText(b) { return bossSpec().objective(b); }

// ============================================================
// NEXUS BOSS — a stationary three-phase fortress fight, no other ships. The
// targetable parts (core + shield generators) are modeled as `combat.enemies`
// entries with a `boss` flag, so the existing weapon-damage / aim-targeting / kill
// pipeline applies unchanged; `combat.boss` holds phase + attack state. All numbers
// are tunable here. See ISO_GRID_SPEC §8.
//   Phase 1: core SHIELDED (invulnerable) — destroy the shield generators.
//   Phase 2: core exposed — dodge the telegraphed beam lane, damage the core.
//   Phase 3 (core ≤40%): beam widens + a turn-timed OVERLOAD blast → race to kill it.
// ============================================================
const NEXUS_BOSS = {
  core:      { gx: CENTER - 2, gy: 0 },                          // the win target (shifted 2 left)
  nodeCells: [ { gx: 1, gy: 2 }, { gx: CENTER - 2, gy: 2 }, { gx: 7, gy: 2 } ],  // shield generators (shifted 2 left)
  coreHp: 30, nodeHp: 8,
  turretDmg: 2,                       // immediate small hit each boss turn
  beamDmg: 6, beamDmgP3: 8,           // telegraphed beam lane
  overloadTurns: 4, overloadDmg: 18,  // phase-3 race: full-arena blast after this many boss turns
};
function setupNexusBoss() {
  const mk = (part, gx, gy, hp) => ({ boss: true, part, gx, gy, vgx: gx, vgy: gy, walk: null,
      facing: DIR.FWD, hp, maxhp: hp, shield: 0, bob: Math.random() * 6.283 });
  const parts = NEXUS_BOSS.nodeCells.map(c => mk("node", c.gx, c.gy, NEXUS_BOSS.nodeHp));
  parts.push(mk("core", NEXUS_BOSS.core.gx, NEXUS_BOSS.core.gy, NEXUS_BOSS.coreHp));
  return { parts, meta: { phase: 1, shielded: true, telegraph: null, overload: 0 } };
}
function bossCore()       { return combat.enemies.find(e => e.boss && e.part === "core"); }
function bossNodesAlive() { return combat.enemies.some(e => e.boss && e.part === "node"); }

// player hit by a boss attack — mirrors enemyFire's damage-to-player block
function bossHitPlayer(dmg) {
  const p = combat.player;
  if (p.dodge && Math.random() < DODGE_CHANCE) { clog("Evasive roll — the attack misses!"); sfx("miss"); spawnFloater(p.gx, p.gy, "MISS", "#9fb4c2"); return; }   // Astra · Evasive Roll
  let taken = dmg;
  const shielded = p.shieldPct > 0;
  if (shielded) taken = Math.max(1, Math.round(dmg * (1 - p.shieldPct)));   // Kael's Shield
  p.hp -= taken;
  combat.flashes.push({ cells: [{ gx: p.gx, gy: p.gy }], color: "rgba(255,60,60,0.6)", t: 520 });
  sfx(shielded ? "shield_hit" : "hit");
  spawnFloater(p.gx, p.gy, "-" + taken, "#ff6a5a");
  clog(bossSpec().name + " hits for " + taken + (taken < dmg ? " (shielded)" : ""));
  const up = combat.crew.filter(cs => !cs.incap);                                  // may knock a crew out
  let knocked = false;
  if (up.length > 1 && Math.random() < INCAP_CHANCE) {
    const v = up[(Math.random() * up.length) | 0];
    v.incap = true; v.reviveIn = INCAP_TURNS;
    combat.actedThisTurn = combat.actedThisTurn.filter(x => x !== v.idx);
    clog(CREW[v.idx].name + " knocked out!");
    knocked = true;
    const still = up.filter(cs => cs !== v);
    crewBarkSay("ally-down", still.length ? CREW[still[(Math.random() * still.length) | 0].idx].name : null);
  }
  if (!knocked && taken >= p.maxhp * 0.2) crewBarkSay("heavy-hit");
}
// danger cells for the next telegraphed beam, aimed down the player's column(s)
function bossPlanTelegraph() {
  const b = combat.boss, p = combat.player;
  if (b.phase < 2) return null;                                  // phase 1: turret barrage only
  const cols = b.phase >= 3 ? [p.gx - 1, p.gx, p.gx + 1] : [p.gx];
  const cells = [];
  for (const gx of cols) if (gx >= 0 && gx < GRID_SIZE)
    for (let gy = 0; gy < GRID_SIZE; gy++) cells.push({ gx, gy });
  return { cells, dmg: b.phase >= 3 ? NEXUS_BOSS.beamDmgP3 : NEXUS_BOSS.beamDmg };
}
// one boss "turn", stepped by combat.ai so each stage reads: fire the beam charged
// last turn → turret barrage → charge the next beam (+ phase-3 overload race).
function nexusAdvance(ai, b, p) {
  if (ai.state === "start") {
    if (b.telegraph) {                                           // the beam charged last turn FIRES
      const tg = b.telegraph; b.telegraph = null;
      combat.flashes.push({ cells: tg.cells, color: "rgba(255,70,70,0.55)", t: 560 });
      for (const gx of [...new Set(tg.cells.map(c => c.gx))])
        spawnShot(gx, 0, gx, GRID_SIZE - 1, "missile", "#7fd4ff", 3.0);
      combat.banner = { text: "NEXUS BEAM", kind: "enemy", t: 900, dur: 900 };
      if (tg.cells.some(c => c.gx === p.gx && c.gy === p.gy)) { bossHitPlayer(tg.dmg); if (p.hp <= 0) { loseCombat(); return; } }
      else clog("Nexus beam misses — you cleared the lane.");
    }
    ai.state = "barrage"; ai.timer = 720; return;
  }
  if (ai.state === "barrage") {
    spawnShot(NEXUS_BOSS.core.gx, 0, p.gx, p.gy, "phaser", "#ff7a6a", 2.0);   // turret barrage
    combat.flashes.push({ cells: [{ gx: p.gx, gy: p.gy }], color: "rgba(255,120,60,0.5)", t: 420 });
    bossHitPlayer(NEXUS_BOSS.turretDmg);
    if (p.hp <= 0) { loseCombat(); return; }
    ai.state = "charge"; ai.timer = 720; return;
  }
  if (ai.state === "charge") {
    if (b.phase >= 3 && ++b.overload >= NEXUS_BOSS.overloadTurns) {            // phase-3 race lost
      const cells = []; for (let gx = 0; gx < GRID_SIZE; gx++) for (let gy = 0; gy < GRID_SIZE; gy++) cells.push({ gx, gy });
      combat.flashes.push({ cells, color: "rgba(255,90,60,0.6)", t: 900 });
      combat.banner = { text: "NEXUS OVERLOAD!", kind: "enemy", t: 1200, dur: 1200 };
      bossHitPlayer(NEXUS_BOSS.overloadDmg);
      if (p.hp <= 0) { loseCombat(); return; }
    }
    b.telegraph = bossPlanTelegraph();                                        // warn for next turn
    if (b.telegraph) combat.banner = { text: "NEXUS CHARGING — MOVE!", kind: "enemy", t: 1100, dur: 1100 };
    ai.state = "done"; ai.timer = 480; return;
  }
  finishEnemyTurn();
}
// phase transitions — checked each frame in tickCombat
function nexusUpdatePhase(b) {
  if (b.phase === 1 && !bossNodesAlive()) {
    b.phase = 2; b.shielded = false;
    combat.banner = { text: "CORE EXPOSED", kind: "info", t: 1400, dur: 1400 };
    clog("Shield generators down — the core is exposed!");
  }
  const core = bossCore();
  if (b.phase === 2 && core && core.hp <= core.maxhp * 0.4) {
    b.phase = 3; b.overload = 0;
    combat.banner = { text: "NEXUS OVERLOADING", kind: "enemy", t: 1500, dur: 1500 };
    clog("The Nexus is overloading — finish it!");
  }
}
// ============================================================
// BOUNTY BOSSES — the three station bounties are boss fights, each with its own

//
// ⚠ PLACEHOLDER IDENTITIES: Steve is supplying the real characters, ship hulls and
// names. Everything here is mechanics-first — the FIGHTS are finished and playable;
// the names/`hull`/flavour lines are stand-ins. To re-skin one, change `name`,
// `subtitle`, `dexTactics` and `hull` (any key of SHIP_PROFILES / ENEMY_SHIPS) and
// leave the tactics alone.
//
// Stage one with `#mission&boss=<id>`:  wolfpack · phaserunner · siegehauler
// ============================================================
// shared constructor for a boss piece (mirrors setupNexusBoss's `mk`)
function bossPart(part, gx, gy, hp, ship) {
  return { boss: true, part, gx, gy, vgx: gx, vgy: gy, walk: null, facing: DIR.FWD,
           hp, maxhp: hp, shield: 0, bob: Math.random() * 6.283, ship: ship || null,
           profile: (ship && ship.profile) || null };
}
// hull image set by name, for bosses that are ships rather than fortress pieces
function bossHull(name) {
  return ENEMY_SHIPS.find(s => s.shipName === name) ||
         BOSS_SHIPS.find(s => s.shipName === name) || null;
}
function bossEscorts() { return combat.enemies.filter(e => e.boss && e.part === "node"); }
// Boss pieces are stationary, so nothing ever turned them — they sat on their spawn
// facing (FWD/NE) with their backs to you for the whole fight. Regular enemies get a
// facing from moving and firing; these need it applied directly. Skipped mid-glide so a
// blink/reposition still settles on its own end facing.
function faceBossPartsAtPlayer() {
  const p = combat && combat.player; if (!p) return;
  for (const e of combat.enemies) {
    if (!e.boss || !e.ship || e.walk) continue;
    if (e.gx === p.gx && e.gy === p.gy) continue;
    e.facing = dirToward(e.gx, e.gy, p.gx, p.gy);
  }
}
// a free cell at least `minD` tiles from the player, for warp-ins and blinks
function bossFreeCell(minD) {
  const p = combat.player;
  for (let i = 0; i < 200; i++) {
    const gx = 1 + ((Math.random() * (GRID_SIZE - 2)) | 0);
    const gy = 1 + ((Math.random() * (GRID_SIZE - 2)) | 0);
    if (Math.abs(gx - p.gx) + Math.abs(gy - p.gy) < minD) continue;
    if (combat.enemies.some(e => e.gx === gx && e.gy === gy)) continue;
    return { gx, gy };
  }
  return { gx: CENTER, gy: 1 };
}

  dexTactics: "Drax never fights alone. The Blood Crown's plating holds while any of his wing " +

    return { parts, meta: { phase: 1, shielded: true, telegraph: null, callIn: WOLFPACK.callEvery } };
  },
  advance(ai, b, p) {
    if (ai.state === "start") {                    // every escort fires
      const esc = bossEscorts();
      if (esc.length) {
        for (const e of esc) spawnShot(e.gx, e.gy, p.gx, p.gy, "phaser", "#ff9a6a", 1.6);
        combat.flashes.push({ cells: [{ gx: p.gx, gy: p.gy }], color: "rgba(255,140,60,0.5)", t: 420 });
        bossHitPlayer(WOLFPACK.escortDmg * esc.length);
        if (p.hp <= 0) { loseCombat(); return; }
      }
      ai.state = "flag"; ai.timer = 620; return;
    }
    if (ai.state === "flag") {                     // the flagship only commits once exposed
      const core = bossCore();
      if (core && !b.shielded) {
        spawnShot(core.gx, core.gy, p.gx, p.gy, "missile", "#ffd479", 2.4);
        combat.banner = { text: "FLAGSHIP SALVO", kind: "enemy", t: 900, dur: 900 };
        bossHitPlayer(WOLFPACK.flagDmg);
        if (p.hp <= 0) { loseCombat(); return; }
      }
      ai.state = "call"; ai.timer = 620; return;
    }
    if (ai.state === "call") {                     // reinforcement timer
      if (--b.callIn <= 0) {
        b.callIn = WOLFPACK.callEvery;
        const room = WOLFPACK.maxEscorts - bossEscorts().length;
        const wave = b.phase >= 3 ? WOLFPACK.maxEscorts : room;   // desperate phase: always a full pair
        for (let i = 0; i < wave; i++) {
          const c = bossFreeCell(3);
          const e = bossPart("node", c.gx, c.gy, WOLFPACK.escortHp, bossHull("Hound"));
          combat.enemies.push(e);
          combat.flashes.push({ cells: [{ gx: c.gx, gy: c.gy }], color: "rgba(120,210,255,0.55)", t: 520 });
        }
        if (wave > 0) {
          combat.banner = { text: "ESCORTS WARPING IN", kind: "enemy", t: 1100, dur: 1100 };
          clog("The flagship calls in " + wave + " escort" + (wave > 1 ? "s" : "") + " — its plating re-seals.");
        }
      } else if (b.callIn === 1) {
        combat.banner = { text: "REINFORCEMENTS INBOUND", kind: "enemy", t: 900, dur: 900 };
      }
      ai.state = "done"; ai.timer = 420; return;
    }
    finishEnemyTurn();
  },
  updatePhase(b) {
    const alive = bossEscorts().length > 0;
    if (b.shielded && !alive) {
      b.shielded = false; b.phase = 2;
      combat.banner = { text: "FLAGSHIP EXPOSED", kind: "info", t: 1400, dur: 1400 };
      clog("Escorts down — the flagship's plating is open. Hit it now!");
    } else if (!b.shielded && alive) {             // a fresh wave re-seals the plating
      b.shielded = true; b.phase = 1;
    }
    const core = bossCore();
    if (core && b.phase === 2 && core.hp <= core.maxhp * 0.35) {
      b.phase = 3;
      combat.banner = { text: "THE PACK CLOSES IN", kind: "enemy", t: 1500, dur: 1500 };
      clog("The flagship is crippled — it's calling everything it has left.");
    }
  },
  objective(b) {
    if (b.shielded) return "Escorts up — the flagship is armoured. Clear them first (" + bossEscorts().length + " left)";
    if (b.phase === 3) return "Flagship crippled — kill it before the next wave lands";
    return "Flagship exposed — burn it down, reinforcements in " + b.callIn;
  },
});
