// SHIP CONFIG — Resonance of Fate-style module fit-grid over the ship blueprint.
// Left: module inventory. Right: the blueprint grid with placed modules + a ghost
// piece while placing. Modules only install where they fit, and only power their
// crew action when connected back to the Reactor Core. See the SHIP CONFIG block.
// the Ship Config inventory only lists modules you own (shop stock appears here
// once bought, and disappears again if you sell it back)
function scfgList() { return ownedModules(); }
function scfgFillCells(cells, ox, oy, cell, fill, stroke, alpha) {
  ctx.save();
  if (alpha != null) ctx.globalAlpha = alpha;
  for (const [x, y] of cells) {
    const px = ox + x * cell, py = oy + y * cell;
    if (fill)   { ctx.fillStyle = fill; ctx.fillRect(px + 1, py + 1, cell - 2, cell - 2); }
    if (stroke) { ctx.globalAlpha = 1; ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.strokeRect(px + 1.5, py + 1.5, cell - 3, cell - 3); if (alpha != null) ctx.globalAlpha = alpha; }
  }
  ctx.restore();
}
// The SHIP screen is one menu entry with two tabs: CONFIGURATION (the fit-grid
// below) and CARGO (the hold readout). The tab strip is drawn for both.
const SHIP_TABS = ["CONFIGURATION", "CARGO"];
let shipTab = 0;
function drawShipTabs(r) {
  const tw = 156, th = 32, gap = 8;
  const total = SHIP_TABS.length * tw + (SHIP_TABS.length - 1) * gap;
  let x = (r.width - total) / 2;
  SHIP_TABS.forEach((t, i) => {
    const active = i === shipTab;
    techPanel(x, 12, tw, th, 9, active, active ? "#8af2ff" : "#2f9fb8");
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = active ? "#ffffff" : "#cfeef6"; ctx.font = "bold 12px Consolas, monospace";
    let label = t;
    if (t === "CARGO") label += "  " + cargoUsed() + "/" + cargoCap();
    ctx.fillText(label, x + tw / 2, 12 + th / 2);
    _menuHit.shipTabs.push({ x, y: 12, w: tw, h: th, idx: i });
    x += tw + gap;
  });
}
function drawShipView(r) {
  drawShipTabs(r);
  if (shipTab === 1) drawCargoView(r);
  else drawShipConfigView(r);
}
function drawShipConfigView(r) {
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top; if (!(visH > 120)) visH = r.height; visH = Math.min(visH, r.height);

  const top = 58, bottom = visH - 46, listW = 292, gap = 22;
  let cell = Math.floor(Math.min((bottom - top - 40) / SHIPCFG_ROWS, (r.width - listW - gap - 80) / SHIPCFG_COLS, 52));
  cell = Math.max(24, cell);
  const gridW = cell * SHIPCFG_COLS, gridH = cell * SHIPCFG_ROWS;
  const gpW = gridW + 32, panelH = gridH + 32;
  const blockW = listW + gap + gpW;
  const bx = Math.max(20, r.width / 2 - blockW / 2);
  const listX = bx, gpX = bx + listW + gap, py0 = top;

  // ---- left: module inventory ----
  techPanel(listX, py0, listW, panelH, 14, true, "#7fe3f5");
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 15px Consolas, monospace";
  ctx.fillText("MODULES", listX + 18, py0 + 22);
  const list = scfgList();               // only modules you actually own
  // Fixed-height rows that SCROLL — they used to shrink to cram the whole inventory
  // in, so every module you bought made the list harder to read (Steve, v0.4).
  const rowsTop = py0 + 44, rowH = 48;
  const maxRows = Math.max(1, Math.floor((panelH - 68) / rowH));
  _scfgMaxRows = maxRows;                // the key handler scrolls the selection into view with this
  scfgScroll = Math.max(0, Math.min(scfgScroll, Math.max(0, list.length - maxRows)));
  // Scroll affordances: players weren't realising modules were hidden off-screen
  // (Steve, v0.5). Show a live count, a scrollbar with a proportional thumb, and
  // pulsing ▲/▼ chevrons whenever there's more to see in that direction.
  const more = list.length > maxRows;
  if (!more) _scfgScrollbar = null;      // nothing to scroll → no draggable bar this frame
  const hiddenAbove = more && scfgScroll > 0;
  const hiddenBelow = more && scfgScroll + maxRows < list.length;
  const sbW = more ? 14 : 0;             // reserve a right gutter for the scrollbar
  const rowW = listW - 20 - sbW;
  // count in the header, so the total is visible before you even scroll
  ctx.textAlign = "right"; ctx.fillStyle = "rgba(160,205,220,0.8)"; ctx.font = "11px Consolas, monospace";
  ctx.fillText(list.length + (list.length === 1 ? " module" : " modules"), listX + listW - 18, py0 + 22);
  ctx.textAlign = "left";
  ctx.strokeStyle = "rgba(120,200,220,0.3)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(listX + 16, py0 + 36); ctx.lineTo(listX + listW - 16, py0 + 36); ctx.stroke();
  list.slice(scfgScroll, scfgScroll + maxRows).forEach((m, vi) => {
    const i = scfgScroll + vi;
    const ry = rowsTop + vi * rowH, mid = ry + (rowH - 6) / 2;
    const placed = shipLoadout.some(p => p.id === m.id), powered = shipPowered.has(m.id);
    const held = scfgPlacing && scfgPlacing.id === m.id, active = i === scfgSel;
    techPanel(listX + 10, ry, rowW, rowH - 6, 8, active, active ? m.color : "#2b5563");
    scfgFillCells(rotCells(m.cells, 0), listX + 22, ry + 7, 6, m.color, null, powered || !placed ? 1 : 0.45);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = active ? "#ffffff" : "#dbeef5"; ctx.font = "bold 13px Consolas, monospace";
    ctx.fillText(m.name, listX + 68, mid - 7);
    ctx.fillStyle = "rgba(160,200,215,0.7)"; ctx.font = "10px Consolas, monospace";
    ctx.fillText(m.action ? (m.crew + " · " + m.action) : "Powers the grid", listX + 68, mid + 8);
    // BROKEN outranks powered: the part is fitted and connected but does nothing
    // until it's repaired for coin at a station.
    const st = held ? ["HELD", "#ffd479"] : !placed ? ["INSTALL", "rgba(150,200,220,0.7)"]
             : moduleBroken(m.id) ? ["✖ BROKEN", "#ff5a5a"] : powered ? ["● ON", "#7ee787"] : ["⚠ OFF", "#ff9e6b"];
    ctx.textAlign = "right"; ctx.fillStyle = st[1]; ctx.font = "bold 11px Consolas, monospace";
    ctx.fillText(st[0], listX + 10 + rowW - 12, mid);
    _menuHit.scfg.push({ x: listX + 10, y: ry, w: rowW, h: rowH - 6, idx: i });
  });
  if (more) {
    const rowsBottom = rowsTop + maxRows * rowH - 6;
    // Scroll SHADOWS: fade the rows out at any edge that has more content, so it
    // reads as rows sliding under the frame. Roomless (overlays the rows), unlike a
    // text cue crammed into the header gap (Steve, v0.5: "▲ scroll up" was squashed).
    if (hiddenAbove) {
      const g = ctx.createLinearGradient(0, rowsTop, 0, rowsTop + 26);
      g.addColorStop(0, "rgba(6,18,29,0.95)"); g.addColorStop(1, "rgba(6,18,29,0)");
      ctx.fillStyle = g; ctx.fillRect(listX + 10, rowsTop, rowW, 26);
    }
    if (hiddenBelow) {
      const g = ctx.createLinearGradient(0, rowsBottom - 26, 0, rowsBottom);
      g.addColorStop(0, "rgba(6,18,29,0)"); g.addColorStop(1, "rgba(6,18,29,0.95)");
      ctx.fillStyle = g; ctx.fillRect(listX + 10, rowsBottom - 26, rowW, 26);
    }
    // scrollbar: track + proportional thumb, with a lit chevron at each roomy end
    const trackX = listX + listW - 11, trackW = 5;
    const trackTop = rowsTop + 12, trackH = maxRows * rowH - 30;
    ctx.fillStyle = "rgba(120,200,220,0.16)"; ctx.fillRect(trackX, trackTop, trackW, trackH);
    const thumbH = Math.max(26, trackH * maxRows / list.length);
    const thumbY = trackTop + (trackH - thumbH) * (scfgScroll / Math.max(1, list.length - maxRows));
    ctx.fillStyle = _scfgDragging ? "#bfefff" : "rgba(127,227,245,0.9)"; ctx.fillRect(trackX, thumbY, trackW, thumbH);
    _scfgScrollbar = { x: trackX, w: trackW, top: trackTop, h: trackH, thumbH, maxScroll: Math.max(0, list.length - maxRows) };
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 300), glow = (0.45 + 0.55 * pulse).toFixed(2);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "bold 10px Consolas, monospace";
    ctx.fillStyle = hiddenAbove ? "rgba(127,227,245," + glow + ")" : "rgba(127,227,245,0.2)";
    ctx.fillText("▲", trackX + trackW / 2, rowsTop + 4);
    ctx.fillStyle = hiddenBelow ? "rgba(127,227,245," + glow + ")" : "rgba(127,227,245,0.2)";
    ctx.fillText("▼", trackX + trackW / 2, rowsBottom - 4);
    // bottom line: an explicit hidden-count when there's more below, else the range
    const below = list.length - (scfgScroll + maxRows);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (hiddenBelow) {
      ctx.fillStyle = "rgba(127,227,245," + glow + ")"; ctx.font = "bold 11px Consolas, monospace";
      ctx.fillText("▼ " + below + " more below  ·  scroll", listX + 10 + rowW / 2, py0 + panelH - 12);
    } else {
      ctx.fillStyle = "rgba(165,210,230,0.7)"; ctx.font = "10px Consolas, monospace";
      ctx.fillText((scfgScroll + 1) + "–" + list.length + " of " + list.length + "  ·  ↑↓ / wheel", listX + 10 + rowW / 2, py0 + panelH - 12);
    }
  }

  // ---- right: blueprint grid ----
  techPanel(gpX, py0, gpW, panelH, 14, true, "#7fe3f5");
  const ox = gpX + 16, oy = py0 + 16;
  _scfgGrid = { ox, oy, cell };
  ctx.save();
  ctx.beginPath(); ctx.rect(ox, oy, gridW, gridH); ctx.clip();
  ctx.globalAlpha = 0.35; drawPortrait(blueprintImg, ox, oy, gridW, gridH, "cover", false); ctx.globalAlpha = 1;
  ctx.restore();
  ctx.strokeStyle = "rgba(127,227,245,0.2)"; ctx.lineWidth = 1;
  for (let x = 0; x <= SHIPCFG_COLS; x++) { ctx.beginPath(); ctx.moveTo(ox + x * cell, oy); ctx.lineTo(ox + x * cell, oy + gridH); ctx.stroke(); }
  for (let y = 0; y <= SHIPCFG_ROWS; y++) { ctx.beginPath(); ctx.moveTo(ox, oy + y * cell); ctx.lineTo(ox + gridW, oy + y * cell); ctx.stroke(); }
  for (const p of shipLoadout) {
    const m = SHIP_MODULE_BY_ID[p.id], powered = shipPowered.has(p.id), broken = moduleBroken(p.id);
    const cells = placedCells(p);
    scfgFillCells(cells, ox, oy, cell, m.color, broken ? "#ff5a5a" : powered ? "#ffffff" : "#ff9e6b",

        ctx.beginPath(); ctx.moveTo(px + 5, py + 5); ctx.lineTo(px + cell - 5, py + cell - 5);

    const blurb = m.desc
      || (m.action ? m.crew + "'s " + m.action + " — " + (ABILITY_DESC[m.action] || "")
                   : "The reactor. Every module must trace a connection back here to be powered.");
    const ch = 52, cy0 = oy + gridH - ch;
    ctx.fillStyle = "rgba(4,10,16,0.88)"; ctx.fillRect(ox, cy0, gridW, ch);
    ctx.strokeStyle = m.color; ctx.lineWidth = 1; ctx.strokeRect(ox + 0.5, cy0 + 0.5, gridW - 1, ch - 1);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";

  ctx.fillText(onCount + " / " + totalActions + " crew actions powered" + (shipPowered.has("core") ? "" : "   ·   ⚠ REACTOR CORE OFFLINE"), r.width / 2, fy);
  if (scfgMsg && gTime < scfgMsgUntil) {
    ctx.fillStyle = "#ffb454"; ctx.font = "bold 12px Consolas, monospace";
    ctx.fillText(scfgMsg, r.width / 2, fy + 18);
  } else {
    ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "12px Consolas, monospace";
    ctx.fillText(scfgPlacing
        ? "move: mouse / arrows · R or right-click: rotate · click / Enter: place · Q: uninstall"
        : "click a module or grid part to inspect it · click it again to pick it up · ← →: tabs · M / Q: back",
      r.width / 2, fy + 18);
  }
  drawBackButton(shipCfgFromDock ? "◀ STATION" : "◀ BACK");
}

// ---- sci-fi UI chrome (beveled teal panels + glowing cyan edges) ----
// chamfered-rectangle path: an octagon with the four corners cut for that
// angular "tech panel" silhouette seen in the reference art.
function chamferPath(g, x, y, w, h, cut) {
  g.beginPath();
  g.moveTo(x + cut, y);
  g.lineTo(x + w - cut, y);
  g.lineTo(x + w, y + cut);
  g.lineTo(x + w, y + h - cut);
  g.lineTo(x + w - cut, y + h);
  g.lineTo(x + cut, y + h);
  g.lineTo(x, y + h - cut);
  g.lineTo(x, y + cut);
  g.closePath();
}
// Filled chamfered panel with a glowing cyan rim. `active` brightens it.
function techPanel(x, y, w, h, cut, active, edge) {
  edge = edge || (active ? "#8af2ff" : "#34c6de");
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  if (active) { g.addColorStop(0, "rgba(28,86,108,0.96)"); g.addColorStop(1, "rgba(13,46,62,0.96)"); }
  else        { g.addColorStop(0, "rgba(13,40,54,0.88)");  g.addColorStop(1, "rgba(8,24,34,0.88)"); }
  chamferPath(ctx, x, y, w, h, cut);
  ctx.fillStyle = g; ctx.fill();
  ctx.save();
  ctx.shadowColor = edge; ctx.shadowBlur = active ? 14 : 7;
  ctx.lineWidth = active ? 2 : 1.4; ctx.strokeStyle = edge;
  chamferPath(ctx, x, y, w, h, cut); ctx.stroke();
  ctx.restore();
  // inner top sheen line
  ctx.strokeStyle = active ? "rgba(190,250,255,0.5)" : "rgba(120,200,220,0.22)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + cut + 3, y + 2.5); ctx.lineTo(x + w - cut - 3, y + 2.5); ctx.stroke();
}

// combat action icons, stroked in a caller-supplied accent colour
function drawActionIcon(type, cx, cy, s, col) {
  ctx.save();
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.8;
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  switch (type) {
    case "phaser":                                   // energy bolt
      ctx.beginPath();
      ctx.moveTo(cx + s*0.5, cy - s); ctx.lineTo(cx - s*0.25, cy - s*0.05);
      ctx.lineTo(cx + s*0.2, cy - s*0.05); ctx.lineTo(cx - s*0.5, cy + s);
      ctx.stroke();
      break;
    case "missile":                                  // rocket
      ctx.beginPath();
      ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s*0.45, cy + s*0.35);
      ctx.lineTo(cx, cy + s*0.12); ctx.lineTo(cx - s*0.45, cy + s*0.35); ctx.closePath();
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy + s*0.12); ctx.lineTo(cx, cy + s); ctx.stroke();
      break;
    case "fire":                                     // targeting reticle
      ctx.beginPath(); ctx.arc(cx, cy, s*0.7, 0, 6.283); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - s, cy); ctx.lineTo(cx - s*0.35, cy);
      ctx.moveTo(cx + s*0.35, cy); ctx.lineTo(cx + s, cy);
      ctx.moveTo(cx, cy - s); ctx.lineTo(cx, cy - s*0.35);
      ctx.moveTo(cx, cy + s*0.35); ctx.lineTo(cx, cy + s);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, 1.4, 0, 6.283); ctx.fill();
      break;
    case "endturn":                                  // confirm check
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(cx - s*0.7, cy); ctx.lineTo(cx - s*0.1, cy + s*0.6); ctx.lineTo(cx + s*0.8, cy - s*0.7);
      ctx.stroke();
      break;
  }
  ctx.restore();
}

// Full-screen sector map: the circular playfield, filled in only where seen.
function drawMapView() {
  const r = canvas.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2;
  ctx.save();
  ctx.fillStyle = "rgba(2,4,10,0.93)"; ctx.fillRect(0, 0, r.width, r.height);
  const D = Math.min(r.width, r.height) * 0.8;        // on-screen diameter
  const ox = cx - D / 2, oy = cy - D / 2;
  // unexplored backdrop disc
  ctx.beginPath(); ctx.arc(cx, cy, D / 2, 0, 6.283);
  ctx.fillStyle = "rgba(12,16,28,0.95)"; ctx.fill();
  // explored pixels, clipped to the disc
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, D / 2, 0, 6.283); ctx.clip();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(mapCanvas, ox, oy, D, D);
  ctx.restore();
  // sector boundary
  ctx.strokeStyle = "rgba(120,150,210,0.65)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, D / 2, 0, 6.283); ctx.stroke();
  // player marker (centre of the map is sector 0,0)
  const scale = D / FOG_SIZE;
  const px = world.worldOriginX + CENTER, py = world.worldOriginY + CENTER;
  const mx = ox + (px + MAP_RADIUS) * scale, my = oy + (py + MAP_RADIUS) * scale;
  const pulse = 0.5 + 0.5 * Math.sin(gTime * 0.006);
  // story objective waypoint(s) + dashed course line(s) from the player. During the
  // belt scan phase this is the two unscanned wreckage clusters (sensor cyan);
  // otherwise the usual single green "fly here" waypoint.
  const mapObjMarks = (storyStage === "belt" && !beltScanDone())
    ? BELT_SCAN_POINTS.filter(pt => !beltScanned.has(pt.id)).map(pt => ({ ax: pt.ax, ay: pt.ay, rgb: UNSCANNED_RGB, glow: "#7fe3f5" }))
    : (storyTarget && !objectiveReached) ? [{ ax: storyTarget.ax, ay: storyTarget.ay, rgb: "126,231,135", glow: "#7ee787" }] : [];
  for (const m of mapObjMarks) {
    const tx = ox + (m.ax + MAP_RADIUS) * scale, ty = oy + (m.ay + MAP_RADIUS) * scale;
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = `rgba(${m.rgb},0.5)`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.setLineDash([]);
    const wsz = 6 + 2 * pulse;
    ctx.strokeStyle = `rgba(${m.rgb},${0.55 + 0.45 * pulse})`; ctx.lineWidth = 2;
    ctx.shadowColor = m.glow; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(tx, ty - wsz); ctx.lineTo(tx + wsz, ty);
    ctx.lineTo(tx, ty + wsz); ctx.lineTo(tx - wsz, ty); ctx.closePath(); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.fillStyle = "#7ee787";
  ctx.beginPath(); ctx.arc(mx, my, 4, 0, 6.283); ctx.fill();
  ctx.strokeStyle = `rgba(126,231,135,${0.3 + 0.5 * pulse})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(mx, my, 7 + 3 * pulse, 0, 6.283); ctx.stroke();
  // hostile contacts show as pulsing red dots — but only where the fog is lifted
  let contacts = 0;
  for (const e of enemies) {
    if (!e.hostile) continue;
    const w = enemyWorldPos(e);
    const iax = Math.round(w.ax), iay = Math.round(w.ay);
    if (iax < -MAP_RADIUS || iax > MAP_RADIUS || iay < -MAP_RADIUS || iay > MAP_RADIUS) continue;
    if (!explored[(iax + MAP_RADIUS) + (iay + MAP_RADIUS) * FOG_SIZE]) continue;   // uncharted → hidden
    const ex = ox + (w.ax + MAP_RADIUS) * scale, ey = oy + (w.ay + MAP_RADIUS) * scale;
    ctx.fillStyle = "#ff5a5a"; ctx.shadowColor = "#ff3b3b"; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(ex, ey, 3.5, 0, 6.283); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = `rgba(255,90,90,${0.3 + 0.5 * pulse})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(ex, ey, 6 + 2 * pulse, 0, 6.283); ctx.stroke();
    contacts++;
  }
  // trade stations — always shown, charted or not; they're the fixed landmarks you
  // navigate by, and hiding them behind fog makes the economy loop unfindable
  let hoverSt = null;                       // station under the cursor → tooltip (drawn last)
  for (const st of TRADE_STATIONS) {
    const sx = ox + (st.ax + MAP_RADIUS) * scale, sy = oy + (st.ay + MAP_RADIUS) * scale;
    const hovered = mouseX >= 0 && Math.hypot(mouseX - sx, mouseY - sy) <= 12;
    if (hovered && !hoverSt) hoverSt = { st, sx, sy };
    ctx.save();
    const sedge = hovered ? "#ffffff" : "#8fd8ff";
    ctx.strokeStyle = sedge; ctx.lineWidth = hovered ? 2.4 : 1.8;
    ctx.shadowColor = "#8fd8ff"; ctx.shadowBlur = hovered ? 10 : 6;
    ctx.beginPath(); ctx.arc(sx, sy, hovered ? 6 : 5, 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx - 7.5, sy); ctx.lineTo(sx + 7.5, sy); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(190,235,255,0.9)"; ctx.font = "9px Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText(st.name, sx, sy - 10);
    ctx.restore();
  }
  // Episode 1 sector landmarks — always shown once charted, styled consistently with
  // the trade-station pins above so they read as belonging to the same map, but not
  // an economy stop. Hidden Installation deliberately excluded here — see the
  // fog-gated pin drawn separately below, it stays concealed until physically found.
  let hoverLm = null;                       // landmark under the cursor → lightweight tooltip
  for (const lm of LANDMARKS) {
    const iax = Math.round(lm.ax), iay = Math.round(lm.ay);
    if (!explored[(iax + MAP_RADIUS) + (iay + MAP_RADIUS) * FOG_SIZE]) continue;   // uncharted → hidden
    const sx = ox + (lm.ax + MAP_RADIUS) * scale, sy = oy + (lm.ay + MAP_RADIUS) * scale;
    const hovered = mouseX >= 0 && Math.hypot(mouseX - sx, mouseY - sy) <= 12;
    if (hovered && !hoverLm) hoverLm = { lm, sx, sy };
    ctx.save();
    const sedge = hovered ? "#ffffff" : "#8fd8ff";
    ctx.strokeStyle = sedge; ctx.lineWidth = hovered ? 2.4 : 1.8;
    ctx.shadowColor = "#8fd8ff"; ctx.shadowBlur = hovered ? 10 : 6;
    ctx.beginPath(); ctx.arc(sx, sy, hovered ? 6 : 5, 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx - 7.5, sy); ctx.lineTo(sx + 7.5, sy); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(190,235,255,0.9)"; ctx.font = "9px Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText(lm.name, sx, sy - 10);
    ctx.restore();
  }
  // Hidden Installation — concealed inside the Nebula; its pin only appears once its
  // own tile has actually been explored (flying near it or cutting through the Nebula
  // reveals it via markExplored's normal reveal radius — no separate discovery flag).
  {
    const iax = Math.round(HIDDEN_INSTALLATION.ax), iay = Math.round(HIDDEN_INSTALLATION.ay);
    if (explored[(iax + MAP_RADIUS) + (iay + MAP_RADIUS) * FOG_SIZE]) {
      const sx = ox + (HIDDEN_INSTALLATION.ax + MAP_RADIUS) * scale, sy = oy + (HIDDEN_INSTALLATION.ay + MAP_RADIUS) * scale;
      const hovered = mouseX >= 0 && Math.hypot(mouseX - sx, mouseY - sy) <= 12;
      if (hovered && !hoverLm) hoverLm = { lm: { name: HIDDEN_INSTALLATION.name, tip: "A massive concealed complex, hidden deep in the Nebula." }, sx, sy };
      ctx.save();
      const sedge = hovered ? "#ffffff" : "#ff8a7a";
      ctx.strokeStyle = sedge; ctx.lineWidth = hovered ? 2.4 : 1.8;
      ctx.shadowColor = "#ff5a4a"; ctx.shadowBlur = hovered ? 10 : 6;
      ctx.beginPath(); ctx.arc(sx, sy, hovered ? 6 : 5, 0, 6.283); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx - 7.5, sy); ctx.lineTo(sx + 7.5, sy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx, sy - 7.5); ctx.lineTo(sx, sy + 7.5); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,170,155,0.9)"; ctx.font = "9px Consolas, monospace";
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      ctx.fillText(HIDDEN_INSTALLATION.name, sx, sy - 10);
      ctx.restore();
    }
  }
  // Crimson Nova's mercenary hangar — only once you've actually met him (Steve,
  // 2026-07-26: "once you've met crimson, his hangar should appear on the star map").
  // Before that he's just a rumour at the Hub; the hangar itself sits out on the rim
  // whether you've found it or not, so this doesn't gate on having charted that fog.
  if (crimsonMet) {
    const hx = ox + (CRIMSON_HANGAR.ax + MAP_RADIUS) * scale, hy = oy + (CRIMSON_HANGAR.ay + MAP_RADIUS) * scale;
    const hhov = mouseX >= 0 && Math.hypot(mouseX - hx, mouseY - hy) <= 12;
    ctx.save();
    ctx.shadowColor = "#ff5a4a"; ctx.shadowBlur = hhov ? 10 : 6;
    drawMenuIcon("nova", hx, hy, hhov ? 7 : 6, hhov ? "#ffffff" : "#ff8a7a");
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,170,155,0.9)"; ctx.font = "9px Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText(CRIMSON_HANGAR.name, hx, hy - 12);
    ctx.restore();
  }
  // every accepted contract's mark, each with its own line back to the ship
  for (const abm of acceptedBounties()) {
    const bx = ox + (abm.where.ax + MAP_RADIUS) * scale, by = oy + (abm.where.ay + MAP_RADIUS) * scale;
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = "rgba(242,193,78,0.45)"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(bx, by); ctx.stroke();
    ctx.setLineDash([]);
    const sz = 6 + 2 * pulse;
    ctx.strokeStyle = `rgba(242,193,78,${0.6 + 0.4 * pulse})`; ctx.lineWidth = 2;
    ctx.shadowColor = "#f2c14e"; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(bx, by - sz); ctx.lineTo(bx + sz, by);
    ctx.lineTo(bx, by + sz); ctx.lineTo(bx - sz, by); ctx.closePath(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffe9a8"; ctx.font = "bold 9px Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText(abm.title, bx, by - sz - 5);
    ctx.restore();
  }
  // the player's own waypoint — violet diamond + dashed course line from the ship
  if (customWaypoint) {
    const wx = ox + (customWaypoint.ax + MAP_RADIUS) * scale, wy = oy + (customWaypoint.ay + MAP_RADIUS) * scale;
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = `rgba(${WAYPOINT_RGB},0.5)`; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(wx, wy); ctx.stroke();
    ctx.setLineDash([]);
    const sz = 6 + 2 * pulse;
    ctx.strokeStyle = `rgba(${WAYPOINT_RGB},${0.6 + 0.4 * pulse})`; ctx.lineWidth = 2;
    ctx.shadowColor = `rgb(${WAYPOINT_RGB})`; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(wx, wy - sz); ctx.lineTo(wx + sz, wy); ctx.lineTo(wx, wy + sz); ctx.lineTo(wx - sz, wy);
    ctx.closePath(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  // remember the disc transform so the click handler can invert screen → tile
  _mapDisc = { ox, oy, scale };

  drawMapLegend(ox, oy, D, r);            // key to the markers + zone colours

  // header banner
  const hw = 210, hh = 44;
  techPanel(cx - hw / 2, oy - hh - 14, hw, hh, 14, true, "#7fe3f5");
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 20px Consolas, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("STAR MAP", cx, oy - hh / 2 - 13);
  // labels
  ctx.textBaseline = "alphabetic"; let ly = oy + D + 24;
  ctx.fillStyle = "#9fd6e6"; ctx.font = "13px Consolas, monospace";
  ctx.fillText("you are here · " + REGION_NAME[currentRegion()], cx, ly); ly += 20;
  if (contacts > 0) {
    ctx.fillStyle = "#ff8a8a"; ctx.font = "bold 12px Consolas, monospace";
    ctx.fillText("⚠ " + contacts + " hostile contact" + (contacts > 1 ? "s" : "") + " in charted space", cx, ly); ly += 20;
  }
  const closeHint = mapFromMenu ? "Q / M — back to menu" : "Q / M to close";
  if (storyStage === "belt" && !beltScanDone()) {
    ctx.fillStyle = "#bff6ea"; ctx.font = "bold 13px Consolas, monospace";
    ctx.fillText("◆ SCAN THE ASTEROID BELT (" + beltScanned.size + "/" + BELT_SCAN_POINTS.length + ")", cx, ly); ly += 18;
  } else if (storyTarget && !objectiveReached) {
    ctx.fillStyle = "#bfffce"; ctx.font = "bold 13px Consolas, monospace";
    ctx.fillText("◆ FLY TO: " + storyTarget.label, cx, ly); ly += 18;
  }
  ctx.fillStyle = "rgba(196,142,255,0.85)"; ctx.font = "12px Consolas, monospace";
  ctx.fillText(customWaypoint ? "click your waypoint to clear it · click elsewhere to move it" : "click the map to set a waypoint", cx, ly); ly += 18;
  ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "12px Consolas, monospace";
  ctx.fillText(closeHint, cx, ly);
  ctx.textAlign = "left";
  _mapBackRect = drawBackButton(mapFromMenu ? "◀ MENU" : "◀ CLOSE");   // Back button / Q·M·Esc close; a map click drops a waypoint
  if (hoverSt) drawStationTip(hoverSt.st, hoverSt.sx, hoverSt.sy);      // hover a station → name/keeper/market tip, on top
  else if (hoverLm) drawLandmarkTip(hoverLm.lm, hoverLm.sx, hoverLm.sy);   // hover a sector landmark → name/flavor tip
  ctx.restore();
}
// Lightweight landmark tooltip — just name + one flavor line, since Episode 1's
// sector landmarks have no economy data to show yet (unlike drawStationTip below).
// Reuses drawStationTip's panel/positioning mechanics, not its content-gathering.
function drawLandmarkTip(lm, sx, sy) {
  const r = canvas.getBoundingClientRect();
  const tipW = 220, tpad = 11, tlh = 15, titleH = 20;
  const tipH = tpad * 2 + titleH + tlh;
  let tx = sx + 16, ty = sy - tipH / 2;
  if (tx + tipW > r.width - 8) tx = sx - tipW - 16;      // flip to the left if it would clip
  tx = Math.max(8, tx);
  ty = Math.max(8, Math.min(ty, r.height - tipH - 8));
  techPanel(tx, ty, tipW, tipH, 8, true, "#7fe3f5");
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 13px Consolas, monospace";
  ctx.fillText(fitText(lm.name, tipW - tpad * 2), tx + tpad, ty + tpad + 12);
  ctx.font = "11px Consolas, monospace"; ctx.fillStyle = "#cfe9f2";
  ctx.fillText(fitText(lm.tip || "", tipW - tpad * 2), tx + tpad, ty + tpad + titleH + 11);
}
// Build the hover tooltip lines for a station: its keeper, and trade tips derived from
// prices the player has ACTUALLY SEEN (marketIntel) — an unvisited station just prompts
// you to dock. Prices are normalised by each commodity's base so the "best to buy/sell"
// picks reflect the station's character, not just which good is cheapest by nature.
// Unaccepted work relevant to this station: bounties are a shared galaxy-wide board
// (every station lists all of them, same count everywhere), jobs are posted at ONE
// station each (Steve, 2026-07-26: the star map hover should surface both, so you can
// tell there's something to pick up here before you fly all the way in).
function stationJobCounts(st) {
  const bounties = BOUNTIES.filter(b => bountyState(b.id) === "open").length;
  const jobs = SIDE_MISSIONS.filter(m => m.from === st.id && sideState(m.id) === "open").length;
  return { bounties, jobs };
}
function stationTip(st) {
  const keeper = (KEEPERS[st.id] && KEEPERS[st.id].name) || null;
  const work = stationJobCounts(st);
  const workLines = [];
  if (work.jobs) workLines.push(work.jobs + " job" + (work.jobs > 1 ? "s" : "") + " posted here");
  if (work.bounties) workLines.push(work.bounties + (work.bounties > 1 ? " bounties" : " bounty") + " open");
  const rec = marketIntel[st.id];
  if (!rec) return { keeper, lines: workLines.concat(["No prices yet — dock to learn."]), seen: null };
  let bestBuy = null, bestSell = null, lastAt = 0;
  for (const cid in rec) {
    const e = rec[cid], c = COMMODITY_BY_ID[cid]; if (!e || !c || !c.base) continue;
    if (e.at > lastAt) lastAt = e.at;
    const br = e.buy / c.base, sr = e.sell / c.base;
    if (!bestBuy || br < bestBuy.r) bestBuy = { name: c.name, price: e.buy, r: br };
    if (!bestSell || sr > bestSell.r) bestSell = { name: c.name, price: e.sell, r: sr };
  }
  const lines = workLines.slice();
  if (bestBuy)  lines.push("Cheapest to buy: " + bestBuy.name);
  if (bestSell) lines.push("Best to sell: " + bestSell.name);
  if (!lines.length) lines.push("No trades recorded yet.");
  return { keeper, lines, seen: lastAt ? intelAge(lastAt) : null };
}
function drawStationTip(st, sx, sy) {
  const r = canvas.getBoundingClientRect();
  const info = stationTip(st);
  const body = [];
  if (info.keeper) body.push("Keeper — " + info.keeper);
  for (const l of info.lines) body.push(l);
  if (info.seen) body.push("market seen " + info.seen);
  const tipW = 244, tpad = 11, tlh = 15, titleH = 20;
  const tipH = tpad * 2 + titleH + body.length * tlh;
  let tx = sx + 16, ty = sy - tipH / 2;
  if (tx + tipW > r.width - 8) tx = sx - tipW - 16;      // flip to the left if it would clip
  tx = Math.max(8, tx);
  ty = Math.max(8, Math.min(ty, r.height - tipH - 8));
  const accent = (KEEPERS[st.id] && KEEPERS[st.id].accent) || "#8fd8ff";
  techPanel(tx, ty, tipW, tipH, 8, true, "#7fe3f5");
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 13px Consolas, monospace";
  ctx.fillText(fitText(st.name, tipW - tpad * 2), tx + tpad, ty + tpad + 12);
  ctx.font = "11px Consolas, monospace";

// ---- STAR MAP LEGEND -----------------------------------------------------
// A key to everything on the disc: the three live markers, then the zone colours

// too narrow for a side panel it tucks into the map's top-left corner instead.
const MAP_LEGEND_ZONES = [REGION.OPEN, REGION.TRADE_LANE, REGION.MINING_BELT, REGION.NEBULA_FIELD];
function drawMapLegend(ox, oy, D, r) {
  const w = 190, rowH = 21;
  const marks = [
    { kind: "player",  label: "Your ship" },
    { kind: "objective", label: "Story objective" },
    { kind: "hostile", label: "Hostile contact" },
    { kind: "station", label: "Trade station" },
    { kind: "bounty",  label: "Bounty target" },
    { kind: "waypoint", label: "Custom waypoint" },
  ];
  // Height mirrors the layout below, term for term, so adding a row can't push the
  // last line off the panel: 44 to the first row centre · the mark rows · 22 for the
  // "CHARTED SPACE" gap+header (6 + 16) · the zone rows · 18 for the footer line.
  // The old 34/20/14 spacing put the footer baseline exactly on the bottom edge and
  // clipped "unlit = uncharted" in half.
  const h = 44 + marks.length * rowH + 22 + MAP_LEGEND_ZONES.length * rowH + 18;
  const inset = ox - w - 18 < 8;                        // no room beside the disc?
  const x = inset ? ox + 12 : ox - w - 18;
  const y = inset ? oy + 12 : oy + Math.max(0, (D - h) / 2);
  techPanel(x, y, w, h, 12, false, "#2f9fb8");
  ctx.save();
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 12px Consolas, monospace";
  ctx.fillText("LEGEND", x + 16, y + 20);
  ctx.strokeStyle = "rgba(120,200,220,0.3)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + 14, y + 30); ctx.lineTo(x + w - 14, y + 30); ctx.stroke();

  const gx = x + 24;
  let ly = y + 44;
  ctx.font = "11px Consolas, monospace";
  for (const m of marks) {
    if (m.kind === "player") {
      ctx.fillStyle = "#7ee787";
      ctx.beginPath(); ctx.arc(gx, ly, 4, 0, 6.283); ctx.fill();
      ctx.strokeStyle = "rgba(126,231,135,0.6)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(gx, ly, 7.5, 0, 6.283); ctx.stroke();
    } else if (m.kind === "objective") {
      ctx.strokeStyle = "#7ee787"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gx, ly - 6); ctx.lineTo(gx + 6, ly);
      ctx.lineTo(gx, ly + 6); ctx.lineTo(gx - 6, ly); ctx.closePath(); ctx.stroke();
    } else if (m.kind === "station") {
      ctx.strokeStyle = "#8fd8ff"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(gx, ly, 4.5, 0, 6.283); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx - 7, ly); ctx.lineTo(gx + 7, ly); ctx.stroke();
    } else if (m.kind === "bounty") {
      ctx.strokeStyle = "#f2c14e"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gx, ly - 6); ctx.lineTo(gx + 6, ly);
      ctx.lineTo(gx, ly + 6); ctx.lineTo(gx - 6, ly); ctx.closePath(); ctx.stroke();
    } else if (m.kind === "waypoint") {
      ctx.strokeStyle = `rgb(${WAYPOINT_RGB})`; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gx, ly - 6); ctx.lineTo(gx + 6, ly);
      ctx.lineTo(gx, ly + 6); ctx.lineTo(gx - 6, ly); ctx.closePath(); ctx.stroke();
    } else {
      ctx.fillStyle = "#ff5a5a";
      ctx.beginPath(); ctx.arc(gx, ly, 3.5, 0, 6.283); ctx.fill();
      ctx.strokeStyle = "rgba(255,90,90,0.6)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(gx, ly, 7, 0, 6.283); ctx.stroke();
    }
    ctx.fillStyle = "#cfeef6";
    ctx.fillText(m.label, gx + 16, ly);
    ly += rowH;
  }

  ly += 6;
  ctx.fillStyle = "rgba(150,200,220,0.65)"; ctx.font = "bold 10px Consolas, monospace";
  ctx.fillText("CHARTED SPACE", x + 16, ly); ly += 16;
  ctx.font = "11px Consolas, monospace";
  for (const rg of MAP_LEGEND_ZONES) {
    ctx.fillStyle = MAP_PIXEL[rg];
    ctx.fillRect(gx - 6, ly - 5, 12, 10);
    ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 1;
    ctx.strokeRect(gx - 6.5, ly - 5.5, 13, 11);
    ctx.fillStyle = "#cfeef6";
    ctx.fillText(fitText(REGION_NAME[rg], w - 56), gx + 16, ly);
    ly += rowH;

  ctx.fillStyle = "rgba(150,200,220,0.5)"; ctx.font = "10px Consolas, monospace";
  ctx.fillText("unlit = uncharted", x + 16, ly + 2);

// ============================================================
// INPUT (spec §8.1)
// ============================================================
// The ship may not leave the circular sector. Reject a move whose resulting
// centre tile would fall outside MAP_RADIUS.
function canMove(dir) {
  let cx = world.worldOriginX + CENTER, cy = world.worldOriginY + CENTER;
  if      (dir === DIR.FWD)  cy -= 1;
  else if (dir === DIR.BACK) cy += 1;
  else if (dir === DIR.LEFT) cx -= 1;
  else if (dir === DIR.RIGHT) cx += 1;

    return;

// ---- mouse: combat is mouse-driven (keyboard kept as fallback below) ----

  mouseX = e.clientX - r.left; mouseY = e.clientY - r.top;

  // hovering a crew panel selects it, so the panel under the cursor expands

  if (menuOpen && menuView === "shipConfig" && scfgPlacing) {
    const cp = scfgCellAt(mouseX, mouseY);
    if (cp) { scfgCursor = cp; scfgClampCursor(); }
  }
  const aiming = combat && (combat.targeting || combat.actionPick) && combat.phase === "player";
  const pointer = menuOpen || mapOpen || objectivePrompt || dockPrompt || bountyPrompt || aiming || (combat && overCombatButton(mouseX, mouseY));

});
// the Field Manual's chapter pages are the only scrollable screen so far

  // Ship Config module inventory scrolls a row per notch (clamped in the draw)

// grab the Ship Config scrollbar to drag it (mousedown starts, window mouseup ends)
canvas.addEventListener("mousedown", (e) => {

  else if (menuOpen && menuView === "shipConfig" && scfgPlacing) { e.preventDefault(); scfgPlacing.rot = (scfgPlacing.rot + 1) & 3; scfgClampCursor(); }
});
canvas.addEventListener("click", (e) => {
  if (tutorialOpen) return;                      // tutorial overlay owns input while open
  if (bossIntro) { skipBossIntro(); return; }    // splash owns input; a click skips it
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  if (primaryPrompt) {                            // "make this primary?" wins input (even over the station)
    if (_primaryPromptHit && ptIn(_primaryPromptHit.yes, mx, my)) acceptPrimary();
    else if (_primaryPromptHit && ptIn(_primaryPromptHit.no, mx, my)) declinePrimary();
    return;
  }
  if (testingMode && _skipBtnRect && !menuOpen && !mapOpen && !objectivePrompt && ptIn(_skipBtnRect, mx, my)) { skipObjective(); return; }
  if (menuOpen) { handleMenuClick(mx, my); return; }

    if (_promptHit && ptIn(_promptHit.yes, mx, my)) proceedObjective();
    else if (_promptHit && ptIn(_promptHit.no, mx, my)) declineObjective();
    return;
  }

    else if (_dockPromptHit && ptIn(_dockPromptHit.no, mx, my)) declineDock();
    return;
  }
  if (hangarPrompt) {

    else if (_hangarPromptHit && ptIn(_hangarPromptHit.no, mx, my)) declineHangar();

      const ax = Math.round((mx - ox) / scale - MAP_RADIUS);
      const ay = Math.round((my - oy) / scale - MAP_RADIUS);
      if (Math.hypot(ax, ay) <= MAP_RADIUS) {                                // inside the playfield circle
        if (customWaypoint && Math.hypot(ax - customWaypoint.ax, ay - customWaypoint.ay) <= 1) clearWaypoint();

window.addEventListener("keydown", (e) => {
  if (tutorialOpen) { e.preventDefault(); closeTutorial(); return; }   // any key dismisses the tutorial
  if (primaryPrompt) {                            // "make this primary?" — Y/N (even while docked)
    if (e.key === "y" || e.key === "Y" || e.key === "Enter") { acceptPrimary(); e.preventDefault(); }
    else if (e.key === "n" || e.key === "N" || e.key === "q" || e.key === "Q" || e.key === "Escape") { declinePrimary(); e.preventDefault(); }
    return;
  }
  if (menuOpen) { handleMenuKey(e); return; }   // pause menu owns input while open
  if (objectivePrompt) {                          // "progress the story?" — Y/N
    if (e.key === "y" || e.key === "Y" || e.key === "Enter") { proceedObjective(); e.preventDefault(); }
    else if (e.key === "n" || e.key === "N" || e.key === "q" || e.key === "Q" || e.key === "Escape") { declineObjective(); e.preventDefault(); }
    return;
  }
  if (dockPrompt) {                               // "request docking?" — Y/N (E also docks)
    if (e.key === "y" || e.key === "Y" || e.key === "Enter" || e.key === "e" || e.key === "E") { acceptDock(); e.preventDefault(); }
    else if (e.key === "n" || e.key === "N" || e.key === "q" || e.key === "Q" || e.key === "Escape") { declineDock(); e.preventDefault(); }
    return;
  }
  if (hangarPrompt) {                            // "enter the hangar?" — Y/N (E also enters)
    if (e.key === "y" || e.key === "Y" || e.key === "Enter" || e.key === "e" || e.key === "E") { enterHangar(); e.preventDefault(); }
    else if (e.key === "n" || e.key === "N" || e.key === "q" || e.key === "Q" || e.key === "Escape") { declineHangar(); e.preventDefault(); }
    return;
  }
  if (bountyPrompt) {                            // "engage the bounty?" — Y/N
    if (e.key === "y" || e.key === "Y" || e.key === "Enter") { engageBounty(); e.preventDefault(); }
    else if (e.key === "n" || e.key === "N" || e.key === "q" || e.key === "Q" || e.key === "Escape") { declineBounty(); e.preventDefault(); }
    return;
  }
  if (mapOpen) {                                 // sector map is up — any of these close it
    if (e.key === "Escape" || e.key === "q" || e.key === "Q" || e.key === "m" || e.key === "M" || e.key === "Enter") {
      exitMap(); e.preventDefault();
    }
    return;
  }
  if (!combat && (e.key === "m" || e.key === "M")) { openMenu(); e.preventDefault(); return; }  // M → menu (not in combat)
  if (bossIntro) {                               // encounter splash — any of these skip it
    if (e.key === " " || e.key === "Enter" || e.key === "q" || e.key === "Q" || e.key === "Escape") { skipBossIntro(); e.preventDefault(); }
    return;                                      // and nothing reaches the arena underneath
  }
  if (combat) {                                  // combat is mouse-driven; keys assist
    if (combat.confirmEnd) {                      // the end-turn confirm owns keys while up
      if (e.key === "y" || e.key === "Y" || e.key === "Enter") { combat.confirmEnd = false; endPlayerTurn(); }
      else if (e.key === "n" || e.key === "N" || e.key === "q" || e.key === "Q" || e.key === "Escape") { combat.confirmEnd = false; }
      e.preventDefault(); return;
    }
    if (combat.phase !== "player" || combat.player.walk || combat.pending) return;   // ignore input mid-glide / shot
    if ((e.key === "Escape" || e.key === "q" || e.key === "Q") && (combat.targeting || combat.actionPick)) { cancelTargeting(); e.preventDefault(); return; }
    switch (e.key) {
      // number keys 1–6 pick the matching crew member; Enter ends the turn
      case "1": case "2": case "3": case "4": case "5": case "6":
        activateCrew(parseInt(e.key, 10) - 1); e.preventDefault(); break;
      case "Enter": if (!combat.targeting) tryEndTurn(); e.preventDefault(); break;
    }
    return;
  }
  switch (e.key) {
    case "ArrowUp": case "w": case "W":    requestMove(DIR.FWD);   e.preventDefault(); break;
    case "ArrowDown": case "s": case "S":  requestMove(DIR.BACK);  e.preventDefault(); break;
    case "ArrowLeft": case "a": case "A":  requestMove(DIR.LEFT);  e.preventDefault(); break;
    case "ArrowRight": case "d": case "D": requestMove(DIR.RIGHT); e.preventDefault(); break;
    // E docks when alongside a trade station (D is taken by "move right")
    case "e": case "E": { const st = stationInRange(); if (st) { dockAt(st); e.preventDefault(); } break; }
    case "f": case "F": doScan(); e.preventDefault(); break;   // sweep for salvage / points of interest
    // M alone opens the pause menu — Enter used to as well, but Steve (2026-07-26) found it
    // fired the menu by accident off dialogue-advance muscle memory; M is unambiguous.
    case "r": case "R": initWorld(); spawnEnemies(); break;   // return to the nebula spawn (map is fixed)
    case "i": case "I": showIDs = !showIDs; break;
    case "g": case "G": showGrid = !showGrid; break;
  }
});

// ============================================================
// BGM — looping exploration / combat music, crossfaded on transitions.
// Audio can't autoplay until a user gesture; startBgm() runs on the first
// click/keypress (or when a tutorial pop-up is dismissed).
// ============================================================
// `station` is optional — if audio/BGM/Station.mp3 isn't there the play() simply
// rejects and we fall back to silence at the dock rather than erroring.
const BGM = {
  explore: new Audio("audio/BGM/Explore.mp3"),
  combat:  new Audio("audio/BGM/Combat.mp3"),
  station: new Audio("audio/BGM/Station.mp3"),
  vol: 0.55, current: null, started: false,

for (const k of ["explore", "combat", "station"]) { BGM[k].loop = true; BGM[k].volume = 0; BGM[k].preload = "auto"; }
function _bgmFade(a, target, ms) {
  if (a._fade) clearInterval(a._fade);
  const s = a.volume, t0 = performance.now();
  a._fade = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    a.volume = s + (target - s) * k;
    if (k >= 1) { clearInterval(a._fade); a._fade = null; if (target === 0) { try { a.pause(); } catch (e) {} } }
  }, 40);
}
function bgm(track) {                         // crossfade to a named loop
  if (!BGM.started) return;
  const next = BGM[track];
  if (!next || next === BGM.current) return;
  if (BGM.current) _bgmFade(BGM.current, 0, 700);
  BGM.current = next;
  next.play().then(() => _bgmFade(next, BGM.vol * volBgm(), 700))
             .catch(() => { BGM.current = null; });   // blocked → retry on next gesture
}
function bgmStop() { if (BGM.current) _bgmFade(BGM.current, 0, 500); BGM.current = null; }
// the track the moment should be playing — combat wins, then dockside, then explore
function bgmWanted() {
  // the dock's config sub-screen (Fit Modules) keeps the station track playing
  const docked = dockedAt && menuOpen && (menuView === "station" || (menuView === "shipConfig" && shipCfgFromDock));
  return combat ? "combat" : docked ? "station" : "explore";
}
function startBgm() {                         // unlock + start the right track (once)
  if (BGM.started) return;
  BGM.started = true;
  bgm(bgmWanted());
}
// Every gesture RE-ASSERTS the music rather than only unlocking it once. A rejected
// play() (autoplay policy, mid-decode reload) nulls BGM.current, and the old one-shot
// listeners never retried — inside the episode that meant a whole mission could run
// silent after its iframe reload (Brett's LOC02 dropout). Now any click or key brings
// the right track back.
function bgmKick() {
  if (!BGM.started) return startBgm();
  if (!BGM.current) bgm(bgmWanted());
}
window.addEventListener("pointerdown", bgmKick);
window.addEventListener("keydown", bgmKick);

// ============================================================
// SOUND EFFECTS
// One-shot cues from `audio/SFX/`. Every cue is OPTIONAL: if the file isn't there
// the play call silently does nothing, so the game runs mute-but-correct and each
// file swaps itself in the moment it's dropped in the folder. See AUDIO_PROMPTS.md
// for what to generate.
//
// Each cue keeps a small POOL of Audio elements and round-robins them, because a
// single element restarted mid-playback cuts itself off — which is exactly what
// happens when salvage auto-collects from four kills at once, or a laser fires
// twice in a turn.
// ============================================================
const SFX_VOL = {                            // per-cue mix, relative to SFX.vol
  laser: 0.55, missile: 0.7, hit: 0.8, shield_hit: 0.6, miss: 0.35,
  explode: 0.9, scan: 0.5, scrap: 0.4, coin: 0.6, dock: 0.7, ui_select: 0.25,
  // third-ability cues (audio/SFX/<name>.mp3 — silent until the files exist; see AUDIO_PROMPTS.md)
  railgun: 0.75, vent: 0.7, disruptor: 0.6, evade: 0.5, focus: 0.5, triage: 0.55,

const SFX_POOL = { laser: 3, hit: 3, scrap: 4, miss: 3, explode: 3 };   // cues that overlap
// Optional cap on how long a cue may ring, in ms, with a short fade so the cut
// isn't a click. This is a SAFETY NET for cues that fire in bursts, not a fix:
// laser and explode were regenerated to spec (2026-07-20) so their caps now sit
// above the file length and never bite. `ui_select` is still ~0.9s against a
// 0.15s spec, and `scrap` ~0.5s against 0.25s — those two are genuinely trimmed,

    pool.push(a);

function sfx(name, gain) {

      const step = vol / Math.max(1, SFX_FADE_MS / 20);
      a._fade = setInterval(() => {
        a.volume = Math.max(0, a.volume - step);
        if (a.volume <= 0.001) { clearInterval(a._fade); a._fade = null; try { a.pause(); } catch (e) {} }
      }, 20);
    }, Math.max(0, cap - SFX_FADE_MS));
  } catch (e) { SFX._missing[name] = true; }
}
// warm the cues most likely to fire first, so the first shot isn't silent
function preloadSfx() { for (const n of ["laser", "hit", "explode", "scrap", "miss"]) _sfxPool(n); }
window.addEventListener("pointerdown", preloadSfx, { once: true });
window.addEventListener("keydown", preloadSfx, { once: true });

let _tutKey = null, _tutShownAt = 0;
const _tutQueue = [];                        // tips raised while another one is up
function tipSeen(key) {
  try { return localStorage.getItem("echoes_tut_" + key + "_v3") === "1"; } catch (e) { return false; }
}
function showTutorial(key, onClose) {
  const c = TIPS[key];
  // tips switched off, unknown key, or already dismissed once → straight through
  if (!tipsOn || !c || tipSeen(key)) { if (onClose) onClose(); return; }
  // a tip never opens on top of another tip OR a Y/N prompt — it queues and update()
  // drains it once the screen is clear (two popups at once read as a glitch)
  if (tutorialOpen || objectivePrompt || dockPrompt || bountyPrompt) { _tutQueue.push(key); if (onClose) onClose(); return; }
  _tutKey = "echoes_tut_" + key + "_v3";
  tutEl.querySelector(".tutTitle").textContent = c.title;
  tutEl.querySelector(".tutBody").innerHTML = c.body;
  tutEl.classList.add("show");
  tutorialOpen = true;
  _tutShownAt = performance.now();
  _tutOnClose = onClose || null;
}
function closeTutorial() {
  if (!tutorialOpen) return;
  // Reaching the flight game means tapping through dialogue; that same click/key
  // can carry over onto the freshly-loaded iso. Ignore dismissals for a moment so
  // the pop-up isn't closed before it's even seen.
  if (performance.now() - _tutShownAt < 450) return;
  tutorialOpen = false;
  tutEl.classList.remove("show");
  try { if (_tutKey) localStorage.setItem(_tutKey, "1"); } catch (e) {}   // mark seen only once actually dismissed
  _tutKey = null;
  bgmKick();                                  // the dismiss gesture unlocks / re-asserts audio
  const cb = _tutOnClose; _tutOnClose = null;
  if (cb) cb();
  while (_tutQueue.length && !tutorialOpen) showTutorial(_tutQueue.shift());   // next queued tip
}
tutEl.addEventListener("pointerdown", (e) => { e.stopPropagation(); closeTutorial(); });

// ============================================================
// MAIN LOOP
// ============================================================
const statusEl = document.getElementById("status");
let last = performance.now();
function frame(now) {
  gTime = now;
  let dt = now - last; last = now;
  if (dt > 50) dt = 50;            // clamp big stalls
  update(dt);
  render();
  drawScan(dt);                    // sweep ring + result line (needs dt, so it runs here)
  drawChatter(dt);                 // crew one-liners while flying
  drawAchToasts(dt);               // unlock banners ride above everything, menus included
  _skipBtnRect = null;
  if (testingMode && !menuOpen && !mapOpen && !objectivePrompt) drawSkipButton();   // testing skip button on top
  const px = world.worldOriginX + CENTER, py = world.worldOriginY + CENTER;
  const objHint = (storyStage === "belt" && !beltScanDone())
    ? `  ·  ◆ SCAN THE ASTEROID BELT (${beltScanned.size}/${BELT_SCAN_POINTS.length}) (M → Star Map)`
    : (storyTarget && !objectiveReached)
    ? `  ·  ◆ FLY TO ${storyTarget.label.toUpperCase()} (M → Star Map)` : "";
  statusEl.textContent = combat
    ? `COMBAT — turn ${combat.turn} · ${combat.phase} · enemies:${combat.enemies.length}`
    : `${REGION_NAME[currentRegion()]}  ·  pos(${px},${py})  ·  ` +
      `${Math.round(Math.hypot(px, py))}/${MAP_RADIUS} from centre` + objHint;
  requestAnimationFrame(frame);
}

buildAllTileSprites();
MAP_OBJECTS = buildMap();          // assemble the fixed sector once
civilians = buildCivilians();      // Trade Lane traffic + the Main Station drone
resize();
initWorld();
// Fog persists in shared localStorage so it survives the per-segment iframe
// reloads WITHIN a run. Only a continuation segment (episode passes start=ax,ay)
// should inherit it; a fresh load — the run's first segment, or the iso opened
// standalone — must start with a clean map, or last run's fog bleeds through.
if (START_AT) loadFog();           // continuation: restore explored map from earlier segments
else { try { localStorage.removeItem(FOG_KEY); } catch (e) {} }   // fresh run: wipe stale fog
// LOAD FROM THE TITLE SCREEN. episode1.html's main-menu Load passes `load=<slot>`
// (alongside a `start=` taken from the same slot, so the restore code above treats
// this as a continuation and doesn't wipe anything). Runs here, at the end of boot,
// because loadFromSlot rebuilds the world and repaints fog — both need initWorld()
// and the map canvas to exist first. It overwrites whatever the live keys held.
const HAS_LOAD = LOAD_SLOT === "f" || LOAD_SLOT >= 0;   // "f" is the file-import slot
if (HAS_LOAD && !loadFromSlot(LOAD_SLOT))
  console.warn("iso: load=" + LOAD_SLOT + " requested but that slot is empty");

if (MISSION_MODE) startCombat(enemies.find(e => e.hostile));   // scripted battles begin immediately (no roaming first)
else if (HAS_LOAD) { /* a loaded game skips the first-flight tutorial */ }
else showTutorial("explore");      // free-roam beat → first-time flight controls pop-up
// Kick the music off at boot rather than waiting for the first in-page gesture.
// Standalone first loads are blocked by autoplay policy (play() rejects, harmless —
// the gesture listeners above recover), but inside the episode the iframe inherits
// the parent page's activation, so each segment reload gets its music back straight
// away instead of cutting to silence until the player happens to click (LOC02 fix).
startBgm();
try { window.focus(); } catch (e) {}   // grab keyboard focus so movement works without a click
requestAnimationFrame(frame);
