    techPanel(x, y, w, ch, 14, active, active ? "#8af2ff" : "#2f9fb8");
    drawMenuIcon(it.icon, x + 32, y + ch / 2, 12, active ? "#ffffff" : it.accent);
    ctx.strokeStyle = "rgba(120,200,220,0.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 58, y + 12); ctx.lineTo(x + 58, y + ch - 12); ctx.stroke();
    ctx.fillStyle = active ? "#ffffff" : "#cfeef6"; ctx.font = "bold 17px Consolas, monospace";
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(it.label, x + 74, y + ch / 2);
    _menuHit.options.push({ x, y, w, h: ch, idx: i });
    y += ch + gap;
  }
  // footer hint + close button
  y += 12;
  ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "12px Consolas, monospace";
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("↑↓ move · Enter select · Q close", x + 2, y);
  drawBackButton("✕ CLOSE");
  ctx.restore();
}

// The Missions screen carries three tabs: the STORY log (supplied by episode1.html
// over postMessage), the SIDE jobs board, and the BOUNTY contracts. The tab strip
// is drawn across the top for all three; STORY then falls through to the original
// two-column log below.
const MISSION_TABS = ["STORY", "SIDE", "BOUNTY", "AWARDS"];
let missionTab = 0;
let jobSel = 0;         // highlighted row in the SIDE / BOUNTY job lists
function drawMissionTabs(r) {
  const tw = 132, th = 32, gap = 8;
  const total = MISSION_TABS.length * tw + (MISSION_TABS.length - 1) * gap;
  let x = (r.width - total) / 2;
  MISSION_TABS.forEach((t, i) => {
    const active = i === missionTab;
    techPanel(x, 12, tw, th, 9, active, active ? "#8af2ff" : "#2f9fb8");
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = active ? "#ffffff" : "#cfeef6"; ctx.font = "bold 12px Consolas, monospace";
    let label = t;
    if (t === "AWARDS") label += "  " + ACHIEVEMENTS.filter(a => achUnlocked.has(a.id)).length + "/" + ACHIEVEMENTS.length;
    ctx.fillText(label, x + tw / 2, 12 + th / 2);
    _menuHit.missionTabs.push({ x, y: 12, w: tw, h: th, idx: i });
    x += tw + gap;
  });
}
// Shared list renderer for the SIDE and BOUNTY tabs: one row per job with its
// state, payout and — when it's the active one — a step-by-step checklist.
function drawJobList(r, kind) {
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top; if (!(visH > 200)) visH = r.height; visH = Math.min(visH, r.height);
  const w = Math.min(720, r.width - 60), x = (r.width - w) / 2;
  const top = 58, h = Math.min(visH - 90, 520);
  techPanel(x, top, w, h, 14, true, kind === "side" ? "#8dffb0" : "#f2c14e");
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 18px Consolas, monospace";
  ctx.fillText(kind === "side" ? "SIDE MISSIONS" : "BOUNTY CONTRACTS", r.width / 2, top + 30);

  // Only what you've actually collected. A job you haven't taken doesn't belong in
  // your log — you find those on a station's board. (Playtest P6.)
  const stateOf = kind === "side" ? sideState : bountyState;
  const list = collectedJobs(kind);
  if (!list.length) {
    ctx.textAlign = "center"; ctx.fillStyle = "#9fd6e6"; ctx.font = "14px Consolas, monospace";
    ctx.fillText(kind === "side" ? "No jobs in your log." : "No contracts in your log.",
                 r.width / 2, top + 96);
    ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "11px Consolas, monospace";
    ctx.fillText(kind === "side" ? "Dock at a station and check its JOBS board."
                                 : "Dock at a station and check its BOUNTIES board.",
                 r.width / 2, top + 118);
    drawBackButton("◀ BACK"); return;
  }
  if (jobSel >= list.length) jobSel = list.length - 1;
  if (jobSel < 0) jobSel = 0;
  let y = top + 48;
  for (let ji = 0; ji < list.length; ji++) {
    const m = list[ji];
    const st = stateOf(m.id);
    // bounties have no "make active" step any more — every accepted contract is live
    const isActive = st === "active" || (kind === "bounty" && st === "accepted");
    const picked = ji === jobSel;
    // an active side mission expands to show its checklist
    const steps = (kind === "side" && isActive) ? m.steps : null;
    const rowH = 52 + (steps ? steps.length * 18 + 6 : 0);
    if (y + rowH > top + h - 40) break;
    const edge = picked ? "#ffffff"
               : st === "done" ? "#4a6b55" : isActive ? (kind === "side" ? "#8dffb0" : "#f2c14e") : "#2f9fb8";
    techPanel(x + 16, y, w - 32, rowH, 10, isActive || picked, edge);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = st === "done" ? "#7f96a3" : "#ffffff"; ctx.font = "bold 14px Consolas, monospace";
    ctx.fillText(fitText(m.title, w - 200), x + 34, y + 18);
    ctx.font = "11px Consolas, monospace";
    ctx.fillStyle = st === "done" ? "#5f7280" : "rgba(160,200,215,0.8)";
    const status = st === "done" ? "Complete"
      : (kind === "bounty" && isActive) ? "Accepted — marked at " + m.zone
      : isActive ? "In progress"
      : "In your log — Enter to " + (kind === "side" ? "start" : "hunt this one");
    ctx.fillText(status, x + 34, y + 38);
    // Collected-but-not-running rows are the actionable ones; clicking picks them up.
    if (st === "taken") {
      ctx.textAlign = "right"; ctx.fillStyle = kind === "side" ? "#8dffb0" : "#f2c14e";
      ctx.font = "bold 11px Consolas, monospace";
      ctx.fillText("▶ MAKE ACTIVE", x + w - 34, y + 38);
    }
    // Pin toggle — only on the tracked row (active side / accepted bounty), where the
    // MAKE ACTIVE slot is free. Sets/clears the primary objective for this job.
    let pinBtn = null;
    if (isActive && st !== "done") {
      const pinned = isPinned(kind, m.id);
      const pw = 104, ph = 22, pbx = x + w - 34 - pw, pby = y + 27;
      techPanel(pbx, pby, pw, ph, 6, pinned, pinned ? "#8fd8ff" : "#3a5a68");
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = pinned ? "#bfe9ff" : "#9fb8c4"; ctx.font = "bold 10px Consolas, monospace";
      ctx.fillText(pinned ? "📌 PINNED" : "📌 PIN", pbx + pw / 2, pby + ph / 2 + 1);
      pinBtn = { x: pbx, y: pby, w: pw, h: ph };
    }
    _menuHit.missions.push({ x: x + 16, y, w: w - 32, h: rowH, idx: ji, jobId: m.id, jobKind: kind, jobState: st, pinBtn });
    ctx.textAlign = "right";
    ctx.fillStyle = st === "done" ? "#5f7280" : kind === "side" ? "#8dffb0" : "#f2c14e";
    ctx.font = "bold 13px Consolas, monospace";
    ctx.fillText((st === "done" ? "paid " : "") + m.reward + " coin", x + w - 34, y + 18);
    if (steps) {                                   // checklist for the running job
      let sy = y + 56;
      steps.forEach((s, i) => {
        const done = i < sides.step, current = i === sides.step;
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        ctx.fillStyle = done ? "#8dffb0" : current ? "#ffffff" : "rgba(150,200,220,0.5)";
        ctx.font = (current ? "bold " : "") + "11px Consolas, monospace";
        // countable steps carry a live tally ("4 / 10") so a collect objective shows
        // how far along it is without leaving the menu
        const tally = current ? stepProgressText(s) : "";     // only the live step counts
        ctx.fillText((done ? "✓ " : current ? "▶ " : "  ") + s.text + (tally ? "   " + tally : ""), x + 40, sy);
        if (current && s.hint) {
          ctx.textAlign = "right"; ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "10px Consolas, monospace";
          ctx.fillText(fitText(s.hint, 300), x + w - 40, sy);
        }
        sy += 18;
      });
    }
    y += rowH + 8;
  }
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "11px Consolas, monospace";
  ctx.fillText((kind === "side" ? "↑↓ select · Enter make active   ·   Take jobs at a station's JOBS board — each station posts its own."
                                : "↑↓ select   ·   Every accepted contract is marked in the sector. Take more at a station's BOUNTIES board."),
               r.width / 2, top + h - 16);
  drawBackButton("◀ BACK");
}

// Story Part 1 (Echoes/Echoes_Part1.txt) gave the STORY log and the SIDE board real
// content (the EP1 travel beat + "Investigate the Asteroid Belt"), so Missions is
// back to the full four-tab Episode-0 screen — the tab strip, job-list renderer and
// their click/keyboard handling were already ported over from the fork and just
// needed this dispatcher reconnected. BOUNTY/AWARDS stay reachable but empty
// (`BOUNTIES`/`ACHIEVEMENTS` are still `[]`) — drawJobList/drawAchievementsView
// already render an honest "nothing yet" state for that, same as before.
function drawMissionsView(r) {
  drawMissionTabs(r);
  if (missionTab === 1) { drawJobList(r, "side"); return; }
  if (missionTab === 2) { drawJobList(r, "bounty"); return; }
  if (missionTab === 3) { drawAchievementsView(r); return; }
  // STORY — the read-only campaign log, supplied by project_echoes.html over
  // postMessage (requestMissions / missions). Styled to match the SIDE / BOUNTY
  // job lists: one container panel, full-width rows, the selected entry expands
  // to show its recap.
  const items = (missionLog && missionLog.items) ? missionLog.items : [];
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top; if (!(visH > 200)) visH = r.height; visH = Math.min(visH, r.height);
  const w = Math.min(720, r.width - 60), x = (r.width - w) / 2;
  const top = 58, h = Math.min(visH - 90, 520);
  techPanel(x, top, w, h, 14, true, "#7fe3f5");
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 18px Consolas, monospace";
  ctx.fillText("STORY LOG", r.width / 2, top + 30);

  if (!items.length) {
    ctx.textAlign = "center"; ctx.fillStyle = "#9fd6e6"; ctx.font = "14px Consolas, monospace";
    ctx.fillText("Mission log unavailable.", r.width / 2, top + 96);
    drawBackButton("◀ BACK"); return;
  }
  if (missionSel >= items.length) missionSel = items.length - 1;
  if (missionSel < 0) missionSel = 0;

  let y = top + 48;
  for (let i = 0; i < items.length; i++) {
    const it = items[i], picked = i === missionSel, isActive = it.status === "active";
    let recapLines = null;
    if (picked && it.text) { ctx.font = "12px Consolas, monospace"; recapLines = wrapLines(it.text, w - 68).slice(0, 6); }
    const rowH = 52 + (recapLines ? recapLines.length * 18 + 6 : 0);
    if (y + rowH > top + h - 40) break;
    const edge = picked ? "#ffffff" : isActive ? "#8af2ff" : "#2f9fb8";
    techPanel(x + 16, y, w - 32, rowH, 10, isActive || picked, edge);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = isActive ? "#ffffff" : "#cfeef6"; ctx.font = "bold 14px Consolas, monospace";
    ctx.fillText(fitText(it.title, w - 220), x + 34, y + 18);
    ctx.font = "11px Consolas, monospace";
    ctx.fillStyle = isActive ? "rgba(159,240,171,0.9)" : "rgba(160,200,215,0.7)";
    ctx.fillText((isActive ? "◆ ACTIVE OBJECTIVE" : "✓ COMPLETE") + "  ·  " + fitText(it.kind || "", 150), x + 34, y + 38);

    // Story pinning stays reachable here too (storyTarget is null in Project Echoes
    // this pass — see the "side" pin note on SIDE_MISSIONS — so this simply never
    // shows, exactly like the pin-less rows on a completed job).
    if (isActive && storyTarget && !objectiveReached) {
      const pinned = isPinned("story");
      const pw = 104, ph = 22, pbx = x + w - 34 - pw, pby = y + 6;
      techPanel(pbx, pby, pw, ph, 6, pinned, pinned ? "#8fd8ff" : "#3a5a68");
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = pinned ? "#bfe9ff" : "#9fb8c4"; ctx.font = "bold 10px Consolas, monospace";
      ctx.fillText(pinned ? "📌 PINNED" : "📌 PIN", pbx + pw / 2, pby + ph / 2 + 1);
      _menuHit.storyPinBtn = { x: pbx, y: pby, w: pw, h: ph };
    }
    _menuHit.missions.push({ x: x + 16, y, w: w - 32, h: rowH, idx: i });

    if (recapLines) {
      let sy = y + 56; ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#d7eef5"; ctx.font = "12px Consolas, monospace";
      for (const ln of recapLines) { ctx.fillText(ln, x + 34, sy); sy += 18; }
    }
    y += rowH + 8;
  }

  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "11px Consolas, monospace";
  ctx.fillText("↑↓ select   ·   Your campaign so far. Objectives advance as you play the story.", r.width / 2, top + h - 16);
  drawBackButton("◀ BACK");
}

// Options view — the audio mix, plus two toggles: Tutorial Tips (the first-time
// pop-ups) and Testing Mode (the on-screen SKIP button).
function drawOptionsView(r) {
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top; if (!(visH > 200)) visH = r.height; visH = Math.min(visH, r.height);
  const w = 520, h = 472, x = r.width / 2 - w / 2;   // h fits 4 sliders + 3 toggle rows
  const y = Math.max(24, (visH - h) / 2);
  techPanel(x, y, w, h, 16, true, "#7fe3f5");
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 22px Consolas, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText("OPTIONS", r.width / 2, y + 46);

  // ---- audio sliders ----
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#7fe3f5"; ctx.font = "bold 12px Consolas, monospace";
  ctx.fillText("SOUND", x + 28, y + 76);
  let sy = y + 96;
  const barX = x + 140, barW = w - 140 - 92;
  AUDIO_CHANNELS.forEach((ch, i) => {
    const v = audioMix[ch.key];
    const sel = i === optSel;
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = sel ? "#ffffff" : "#dceff5"; ctx.font = "bold 14px Consolas, monospace";
    ctx.fillText(ch.label, x + 28, sy + 9);
    // track + fill
    ctx.fillStyle = "rgba(10,26,34,0.9)"; ctx.fillRect(barX, sy + 3, barW, 12);
    ctx.fillStyle = sel ? "#8af2ff" : "#2f9fb8";
    ctx.fillRect(barX, sy + 3, barW * Math.max(0, Math.min(1, v)), 12);
    ctx.strokeStyle = sel ? "rgba(138,242,255,0.9)" : "rgba(150,200,220,0.35)";
    ctx.lineWidth = 1; ctx.strokeRect(barX + 0.5, sy + 3.5, barW - 1, 11);
    ctx.textAlign = "right"; ctx.fillStyle = sel ? "#ffffff" : "rgba(190,225,240,0.8)";
    ctx.font = "13px Consolas, monospace";
    ctx.fillText(Math.round(v * 100) + "%", x + w - 28, sy + 10);
    _menuHit.sliders.push({ x: barX - 6, y: sy - 4, w: barW + 12, h: 26, key: ch.key, barX, barW });
    sy += 34;
  });
  ctx.textAlign = "left"; ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "11px Consolas, monospace";
  ctx.fillText("↑↓ pick · ←→ adjust · or click the bar", x + 28, sy + 8);

  // ---- toggle rows: label + sub-line on the left, ON/OFF pill on the right ----
  const rowH = 52;
  const toggleRow = (rowY, label, sub, on, key) => {
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#dceff5"; ctx.font = "bold 15px Consolas, monospace";
    ctx.fillText(label, x + 28, rowY + rowH / 2 - 8);
    ctx.fillStyle = "rgba(150,200,220,0.65)"; ctx.font = "11px Consolas, monospace";
    ctx.fillText(sub, x + 28, rowY + rowH / 2 + 12);
    const tw = 84, th = 34, tx = x + w - tw - 28, ty = rowY + rowH / 2 - th / 2;
    techPanel(tx, ty, tw, th, 9, on, on ? "#7ee787" : "#5a6b7d");
    ctx.fillStyle = on ? "#7ee787" : "#8fa6b4"; ctx.font = "bold 13px Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(on ? "ON" : "OFF", tx + tw / 2, ty + th / 2 + 1);
    _menuHit.toggles.push({ x: tx, y: ty, w: tw, h: th, key });
  };
  toggleRow(sy + 24, "Tutorial Tips",
            "First-time pop-ups for each new system",
            tipsOn, "tips");
  toggleRow(sy + 24 + rowH + 8, "Testing Mode",
            "Show an on-screen SKIP button to jump to the next objective",
            testingMode, "testing");
  toggleRow(sy + 24 + (rowH + 8) * 2, "Confirm End Turn",
            "Warn before ending a turn with actions to spare",
            confirmEndOn, "confirmend");
  ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "12px Consolas, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText("M / Q — back", r.width / 2, y + h - 18);
  drawBackButton("◀ BACK");
}

// ============================================================
// MERCENARY — status screen for Crimson Nova. No hire button here: hiring/rehiring
// happens by flying to his hangar (enterHangar/sceneDone). This is status + release.
// ============================================================
function drawMercenaryView(r) {
  // Laid out like the crew character sheet (bio / portrait / status columns) so the
  // Mercenary screen doesn't read as a lesser, bolted-on menu (Steve, 2026-07-26).
  const panelW = 860, panelH = 380;
  const x = r.width / 2 - panelW / 2, y = Math.max(20, r.height / 2 - panelH / 2);
  techPanel(x, y, panelW, panelH, 16, true, "#ff5a4a");

  // far-left column: biography. Wider than a crew bio column (which has a taller
  // panel to work with) so the text doesn't need as many wrapped lines to fit its
  // shorter box; `maxLines` is a hard backstop so a future bio edit can never push
  // text past the panel's bottom edge again (Steve, 2026-07-26 — it did, by ~1 line).
  const bioW = 340, colH = panelH - 40, bioX = x + 20, colY = y + 20;
  techPanel(bioX, colY, bioW, colH, 12, false, "#ff8a72");
  ctx.fillStyle = "#ff9a86"; ctx.font = "bold 13px Consolas, monospace";
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("BIOGRAPHY", bioX + 18, colY + 28);
  ctx.strokeStyle = "rgba(255,150,130,0.35)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(bioX + 18, colY + 38); ctx.lineTo(bioX + bioW - 18, colY + 38); ctx.stroke();
  ctx.fillStyle = "#ffe3da"; ctx.font = "13px Consolas, monospace";
  const bioMaxLines = Math.max(1, Math.floor((colH - 72) / 19));
  wrapText(CRIMSON_BIO, bioX + 18, colY + 60, bioW - 36, 19, bioMaxLines);

  // middle column: portrait (Heroic Pose — the same still the hangar scene opens on)
  const portW = 220, portX = bioX + bioW + 24, portY = colY;
  techPanel(portX, portY, portW, colH, 12, false, "#ff8a72");
  drawPortrait(crimsonPortraitImg, portX + 6, portY + 6, portW - 12, colH - 12, "cover", false);

  // right column: name, status, cost, release. Narrower than the bio/portrait pair —
  // its longest sentence is now wrapped to fill it rather than left as one unwrapped
  // line with dead space trailing off to the panel's edge (Steve, 2026-07-26).
  const rx = portX + portW + 24, colRight = x + panelW - 26, rightColW = colRight - rx;
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 26px Consolas, monospace";
  ctx.fillText("Crimson Nova", rx, y + 46);
  ctx.fillStyle = "#ff9a86"; ctx.font = "bold 14px Consolas, monospace";
  ctx.fillText("MERCENARY — HIRED GUN", rx, y + 68);
  ctx.strokeStyle = "rgba(255,150,130,0.35)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(rx, y + 82); ctx.lineTo(colRight, y + 82); ctx.stroke();

  let ly = y + 108;
  ctx.font = "13px Consolas, monospace";
  if (crimsonHired) {
    ctx.fillStyle = "#7ee787"; wrapText("ACTIVE — flying with you", rx, ly, rightColW, 18); ly += 26;
    ctx.fillStyle = "#dceff5";
    ly = wrapText("Cost: " + CRIMSON_FEE + " coin per battle, deducted automatically when a fight starts.", rx, ly, rightColW, 18) + 26;
    ly = wrapText("If he's knocked out in a fight, he retreats and leaves the team.", rx, ly, rightColW, 18) + 30;
    const bw = rightColW, bh = 44, bx = rx, by = ly;
    techPanel(bx, by, bw, bh, 10, true, "#ff5a4a");
    ctx.textAlign = "center"; ctx.fillStyle = "#ffcfc4"; ctx.font = "bold 15px Consolas, monospace";
    ctx.fillText("RELEASE CRIMSON", bx + bw / 2, by + bh / 2 + 1);
    _menuHit.mercRelease = { x: bx, y: by, w: bw, h: bh };
    ctx.textAlign = "left";
  } else {
    ctx.fillStyle = "#f2c14e"; wrapText("AT THE HANGAR — return to hire him", rx, ly, rightColW, 18); ly += 26;
    ctx.fillStyle = "#dceff5";
    ly = wrapText("Cost: " + CRIMSON_FEE + " coin per battle, deducted automatically when a fight starts.", rx, ly, rightColW, 18) + 26;
    wrapText(crimsonFreeUsed ? "You've already used your one free battle with him." :
                               "Your next battle together will be free.", rx, ly, rightColW, 18);
  }
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "12px Consolas, monospace";
  ctx.fillText("Q — back", r.width / 2, y + panelH - 18);
  drawBackButton("◀ BACK");
}

// Field Manual index — one row per chapter, in the style of the job/mission lists.

  const clientH = document.documentElement.clientHeight || r.height;

    ctx.fillText(c.title, x + 68, ry + rowH / 2 - (rowH >= 46 ? 8 : 0));

    else            ctx.fillText(fitText(c.sub, w - 130 - titleW), x + 80 + titleW, ry + rowH / 2 + 1);

// One chapter. Body lines are laid out into a scrollable column so a long chapter
// can never overrun its panel however short the window is.
const MAN_KEY_COL = 210;
function manualPageLayout(w) {
  const out = [];
  const textW = w - 72;
  for (const ln of MANUAL[manPage].lines) {
    if (typeof ln === "string") {
      ctx.font = "13px Consolas, monospace";
      for (const t of wrapLines(ln, textW)) out.push({ kind: "p", t, h: 19 });
      out.push({ kind: "gap", h: 8 });
    } else if (ln.h) {
      out.push({ kind: "h", t: ln.h, h: 30 });
    } else {
      ctx.font = "13px Consolas, monospace";
      const rows = wrapLines(ln.t, textW - MAN_KEY_COL);
      out.push({ kind: "k", k: ln.k, t: rows[0] || "", h: 24 });
      for (let i = 1; i < rows.length; i++) out.push({ kind: "kcont", t: rows[i], h: 18 });
    }
  }
  return out;
}
function drawManualPageView(r) {
  const c = MANUAL[manPage];
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top; if (!(visH > 200)) visH = r.height; visH = Math.min(visH, r.height);
  const w = Math.min(720, r.width - 60), x = (r.width - w) / 2;
  const y = 48, h = Math.max(240, visH - y - 28);
  techPanel(x, y, w, h, 16, true, "#8af2ff");
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 20px Consolas, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText(c.title, r.width / 2, y + 40);
  ctx.fillStyle = "rgba(138,242,255,0.75)"; ctx.font = "12px Consolas, monospace";
  ctx.fillText(c.sub, r.width / 2, y + 60);

  const bodyTop = y + 80, bodyBot = y + h - 38;
  const rows = manualPageLayout(w);
  const total = rows.reduce((a, l) => a + l.h, 0);
  const maxScroll = Math.max(0, total - (bodyBot - bodyTop));
  manScroll = Math.max(0, Math.min(manScroll, maxScroll));

  ctx.save();
  ctx.beginPath(); ctx.rect(x + 8, bodyTop - 6, w - 16, bodyBot - bodyTop + 6); ctx.clip();
  let ly = bodyTop - manScroll;
  ctx.textBaseline = "alphabetic";
  for (const ln of rows) {
    if (ly > bodyTop - 40 && ly < bodyBot + 40) {
      ctx.textAlign = "left";
      if (ln.kind === "p") {
        ctx.fillStyle = "#d7eef5"; ctx.font = "13px Consolas, monospace";
        ctx.fillText(ln.t, x + 36, ly + 13);
      } else if (ln.kind === "h") {
        ctx.fillStyle = "#8af2ff"; ctx.font = "bold 12px Consolas, monospace";
        ctx.fillText(ln.t, x + 36, ly + 21);
        const tw = ctx.measureText(ln.t).width;
        ctx.strokeStyle = "rgba(138,242,255,0.28)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x + 44 + tw, ly + 17.5); ctx.lineTo(x + w - 36, ly + 17.5); ctx.stroke();
      } else if (ln.kind === "k") {
        ctx.fillStyle = "#9ff0ab"; ctx.font = "bold 13px Consolas, monospace";
        ctx.fillText(fitText(ln.k, MAN_KEY_COL - 16), x + 44, ly + 15);
        ctx.fillStyle = "#d7eef5"; ctx.font = "13px Consolas, monospace";
        ctx.fillText(ln.t, x + 36 + MAN_KEY_COL, ly + 15);
      } else if (ln.kind === "kcont") {
        ctx.fillStyle = "#d7eef5"; ctx.font = "13px Consolas, monospace";
        ctx.fillText(ln.t, x + 36 + MAN_KEY_COL, ly + 12);
      }
    }
    ly += ln.h;
  }
  ctx.restore();

  // scroll rail, only when there's something below the fold
  if (maxScroll > 0) {
    const railX = x + w - 20, railH = bodyBot - bodyTop;
    ctx.fillStyle = "rgba(10,26,34,0.9)"; ctx.fillRect(railX, bodyTop, 4, railH);
    const knobH = Math.max(28, railH * (railH / total));
    const knobY = bodyTop + (railH - knobH) * (manScroll / maxScroll);
    ctx.fillStyle = "#2f9fb8"; ctx.fillRect(railX, knobY, 4, knobH);
  }
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "12px Consolas, monospace";
  ctx.fillText((maxScroll > 0 ? "↑↓ scroll · " : "") + "← → chapter · M / Q back",
               r.width / 2, y + h - 14);
  drawBackButton("◀ BACK");
}

  const rowH = 66, gap = 8, rx = x + 16, rw = w - 32;

    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = got ? "#ffe9a8" : "#cfeef6"; ctx.font = "bold 15px Consolas, monospace";
    ctx.fillText(a.name, rx + 56, ry + 22);
    ctx.fillStyle = "rgba(150,200,220,0.75)"; ctx.font = "12px Consolas, monospace";

      ctx.fillStyle = "rgba(150,200,220,0.45)"; ctx.font = "12px Consolas, monospace";

    ry += rowH + gap;
  });
  ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "12px Consolas, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText("↑↓ move · ← → tabs · M / Q — back", r.width / 2, y + h - 16);

// ============================================================
// TRADE STATION — the dock screen. Left: tabs. Right: the tab's rows, each an
// affordable/unaffordable action. Everything is paid for in COIN; scrap only
// becomes coin here. Rows register in `_menuHit.station` with an `act` string that
// stationAction() dispatches, so adding a row is: draw it + name the action.
// ============================================================
// No UNDOCK tab: leaving is the "◀ UNDOCK" button at the top left, which reads as a back
// button rather than a seventh thing to trade with. Esc and that button are the two ways out.
const STATION_TABS = ["RESOURCES", "MODULES", "BOUNTIES", "JOBS", "RUMOURS"];
const RESOURCE_SUBS = ["BUY", "SELL"];    // sub-tabs inside RESOURCES
// RUMOURS — read-only tips that point you at things out in the sector. You never
// ACCEPT a rumour and it raises no objective marker; it's flavour, and some players
// will stumble onto what it hints at without ever reading it. Keyed by station id.
const RUMOURS = [
  { id: "crimson_hangar", station: "hub", title: "A Hero for Hire",
    text: "Traders coming in off the rim keep telling the same story — a crimson ship and a man in a" +
          " gleaming hero suit, running a mercenary hangar somewhere past the charted pockets." +
          "\n▸ They call him the Crimson Nova. Answers distress calls no one else will, asks little in" +
          " return, and — they swear — never once misses an entrance." +
          "\n▸ If he's real, he's out past Veil Anchorage — the far edge of the charted nebula, and" +
          " further still. You'd have to go looking." },
];
// Row metrics. The mugshot is a fixed square rather than rowH-derived, so a row that
// grows to fit a long brief doesn't also grow its portrait.
const ROW_SUB_TOP = 42, ROW_SUB_LINE = 15, ROW_MUG = 60;
// Width of a row's text column: the panel less the mugshot and less whatever the
// right-hand price/zone column actually needs. Shared by the wrap pass and the draw
// pass so the two can never disagree about how much fits.
function stationRowTextW(row, pw) {
  const hasImg = !!(row.img && row.img.complete && row.img.naturalWidth);
  ctx.font = "10px Consolas, monospace";
  const whereW = row.where ? ctx.measureText(row.where).width : 0;
  ctx.font = "bold 15px Consolas, monospace";
  const coinStr = row.cost != null ? "-" + row.cost + " coin" : row.gain ? "+" + row.gain + " coin" : "";
  const rightW = Math.max(whereW, coinStr ? ctx.measureText(coinStr).width : 0) + 26;
  return pw - 56 - rightW - (hasImg ? ROW_MUG + 14 : 0);
}
let stationTab = 0, stationSel = 0, stationMsg = "", stationSub = 0;   // stationSub: 0 BUY / 1 SELL (RESOURCES)
// Handing back a job/bounty must be asked for twice: the act string is parked here on
// the first activation and only executes if the second matches. Any tab switch or
// selection change clears it — a stray click can't abandon work (Brett, v0.4).
let stationConfirm = null;

// rows for the current tab: { label, sub, cost, act, ok } — `ok` false = greyed out
function stationRows() {
  const rows = [];
  if (STATION_TABS[stationTab] === "RESOURCES") {
    const sid = (dockedAt && dockedAt.id) || "hub";
    touchStock(sid);                         // shelves restock while you're away
    recordIntel(sid);                        // standing here is how you learn these prices
    if (RESOURCE_SUBS[stationSub] === "BUY") {
      for (const c of COMMODITIES) {
        const price = goodsBuyPrice(sid, c.id);
        const held = goodsHeld(c.id), have = stockOf(sid, c.id);
        const lot = Math.min(TRADE_LOT, cargoFree(), have, Math.floor(econ.coin / price));
        // where else you've seen this good move — the whole point of the trade loop
        const best = bestKnownMarket(c.id, sid);
        let intel;
        if (!best) intel = "▸ No price data — dock at another station to learn its market.";
        else if (best.sell > price) intel = "▸ " + best.name + " pays " + best.sell + " each · +" +
               (best.sell - price) + " a unit · seen " + intelAge(best.at) + " · " + bearingTo(best.st);
        else intel = "▸ No known buyer above " + price + " — nowhere you've seen pays to carry this.";
        rows.push({
          label: "Buy " + c.name + (lot ? "  ×" + lot : ""),
          sub: c.desc + "   ·   " + stockHint(sid, c.id) + "   ·   " + goodsHint(sid, c.id) +
               (held ? "   ·   holding " + held + " @ " + Math.round(goodsBasis(c.id)) + " paid" : "") +
               "\n" + intel,
          cost: lot ? lot * price : price,
          act: lot ? "buygoods:" + c.id : null,
          ok: lot > 0,
        });
      }
    } else {   // SELL — trade goods (profit or the whole lot) and raw scrap
      rows.push({ label: "Sell all scrap", act: "sell", ok: econ.scrap > 0,
        sub: econ.scrap > 0 ? econ.scrap + " scrap × " + SCRAP_PRICE + " coin"
                            : "Your hold is empty — go break something.",
        gain: econ.scrap * SCRAP_PRICE });
      for (const c of COMMODITIES) {
        const pays = goodsSellPrice(sid, c.id), held = goodsHeld(c.id);
        if (!held) continue;
        // Selling stops at break-even by default: the market is allowed to crash under
        // what you paid, but the game never makes you eat it. Selling the whole lot stays
        // available as a second, explicitly priced row.
        const prof = sellableAtProfit(sid, c.id);
        const allCoin = (() => { let t = 0, s0 = stockOf(sid, c.id);
          for (let i = 0; i < held; i++) { setStock(sid, c.id, s0 + i); t += goodsSellPrice(sid, c.id); }
          setStock(sid, c.id, s0); return t; })();
        const basis = goodsBasis(c.id);
        if (prof.n > 0) rows.push({
          label: "Sell " + c.name + "  ×" + prof.n + (prof.n < held ? "  (at a profit)" : ""),
          sub: pays + " coin each at " + ((dockedAt && dockedAt.name) || "this station") +
               " · you paid " + Math.round(basis) + " · profit +" + Math.round(prof.coin - basis * prof.n) +
               (prof.n < held ? "\n▸ The price drops below your cost after " + prof.n +
                                " — the other " + (held - prof.n) + " are worth more elsewhere." : ""),
          gain: prof.coin, act: "sellgoods:" + c.id, ok: true,
        });
        if (prof.n < held) rows.push({
          label: "Sell all " + c.name + "  ×" + held,
          sub: "Sell the lot regardless of price · you paid " + Math.round(basis) + " each" +
               "\n▸ Nets " + (allCoin - Math.round(basis * held) >= 0 ? "+" : "") +
               (allCoin - Math.round(basis * held)) + " against what you paid — clears the hold now.",
          gain: allCoin, act: "dumpgoods:" + c.id, ok: true,
        });
      }
    }
  } else if (STATION_TABS[stationTab] === "MODULES") {
    rows.push({ label: "⚙ Fit Modules", sub: "Open the configuration grid to place a part",
                act: "config", ok: true });
    // repair broken modules here too (Steve, 2026-07-24: repair lives in the module menu)
    for (const id of shipBroken) {
      const m = SHIP_MODULE_BY_ID[id]; if (!m) continue;
      const c = repairCost(m);
      rows.push({ label: "Repair " + m.name, sub: (m.action ? m.crew + " · " + m.action : "Ship system") + " — broken",
                  cost: c, act: "repair:" + id, ok: econ.coin >= c });
    }
    // only what THIS station stocks (+ anything you sold here), and don't already own
    const sid = (dockedAt && dockedAt.id) || "hub";
    for (const id of stationBuyableMods(sid)) {
      if (shipOwned.has(id)) continue;
      const m = SHIP_MODULE_BY_ID[id]; if (!m) continue;
      const c = modulePrice(m);
      rows.push({ label: "Buy " + m.name, sub: m.desc || moduleBlurb(m), cost: c,
                  act: "buy:" + id, ok: econ.coin >= c, modId: id });
    }
    if (!rows.length) rows.push({ label: "Nothing in stock", sub: "This station has nothing you don't have.", act: null, ok: false });
  } else if (STATION_TABS[stationTab] === "BOUNTIES") {
    for (const b of BOUNTIES) {
      const st = bountyState(b.id);
      // The board always lists every contract — that's how you learn they exist.
      // Accepted ones read as taken; there's no hand-back — a contract is a commitment
      // (Steve/Brett, 2026-07-24). Only an OPEN contract is actionable.
      rows.push({
        label: b.title + (st === "done" ? "  ✓ CLAIMED" : st !== "open" ? "  ◆ ACCEPTED" : ""),
        sub: st === "done" ? "Contract closed."
           : st !== "open" ? "Accepted — the mark is up in the sector and on the star map." : b.brief,
        gain: st === "done" ? 0 : b.reward,
        act: st === "open" ? "bounty:" + b.id : null,
        ok: st === "open",
        where: b.zone, state: st,
        // head-and-shoulders mugshot for the board, once that target has art
        img: (BOSS_SPECS[b.boss] && BOSS_SPECS[b.boss]._portraitImg) || null,
        imgCrop: (BOSS_SPECS[b.boss] && BOSS_SPECS[b.boss].portraitCrop) || null,
      });
    }
  } else if (STATION_TABS[stationTab] === "JOBS") {
    // A job is posted at ONE station — you have to find it, which gives the
    // stations their own character rather than making them interchangeable.
    const here = (dockedAt && dockedAt.id) || null;
    for (const m of SIDE_MISSIONS) {
      const st = sideState(m.id);
      const mine = m.from === here;
      if (st === "open" && !mine) continue;              // posted elsewhere — not on this board
      const step = st === "active" ? m.steps[sides.step] : null;
      rows.push({
        label: m.title + (st === "done" ? "  ✓ COMPLETE" : st === "active" ? "  ● IN PROGRESS"
                        : st === "taken" ? "  ◆ IN YOUR LOG" : ""),
        sub: st === "done" ? "Job closed."
           : st === "active" ? "Step " + (sides.step + 1) + "/" + m.steps.length + ": " + (step ? step.text : "") +
                               (step && stepProgressText(step) ? "  (" + stepProgressText(step) + ")" : "")
           : st === "taken" ? "In your log — make it active from Missions." : m.brief,
        gain: st === "done" ? 0 : m.reward,
        // No hand-back — an accepted job stays in your log (Steve/Brett, 2026-07-24).
        act: st === "open" ? "side:" + m.id : null,
        ok: st === "open",
        state: st,
      });
    }
    if (!rows.length) rows.push({ label: "No work posted here",
      sub: "Try another station — each posts its own jobs.", act: null, ok: false });
  } else if (STATION_TABS[stationTab] === "RUMOURS") {
    // Read-only tips. No act → inert (greyed, can't be selected/accepted), no marker.
    const here = (dockedAt && dockedAt.id) || "hub";
    for (const r of RUMOURS) {
      if (r.station !== here) continue;
      rows.push({ label: r.title, sub: r.text, act: null, ok: false });
    }
    if (!rows.length) rows.push({ label: "No rumours here",
      sub: "Word travels — dock around the sector and keep your ears open.", act: null, ok: false });
  }
  return rows;
}
function moduleBlurb(m) {
  if (m.cargo) return "Capacity to hold " + m.cargo + " more scrap while powered.";
  if (m.hull)  return "+" + m.hull + " maximum hull while powered.";
  return m.action ? m.crew + " · " + m.action : "Ship system.";
}
// run a row's action string
function stationAction(act) {
  if (!act) return;
  sfx("ui_select");
  stationConfirm = null;               // any action clears a stale confirm state
  const [kind, arg] = act.split(":");
  if (kind === "sell") {
    const r = sellAllScrap();
    if (r.scrap) sfx("coin");
    stationMsg = r.scrap ? "Sold " + r.scrap + " scrap for " + r.coin + " coin."
                         : "Nothing to sell.";
  } else if (kind === "buygoods") {
    const sid = (dockedAt && dockedAt.id) || "hub";
    const r = buyGoods(sid, arg, TRADE_LOT);
    if (r.n) sfx("coin");
    stationMsg = r.n ? "Bought " + r.n + " " + COMMODITY_BY_ID[arg].name + " for " + r.coin + " coin."
                     : (r.why || "Couldn't buy that.");
  } else if (kind === "sellgoods" || kind === "dumpgoods") {
    const sid = (dockedAt && dockedAt.id) || "hub";
    const r = sellGoods(sid, arg, kind === "dumpgoods");
    if (r.n) sfx("coin");
    stationMsg = r.n
      ? "Sold " + r.n + " " + COMMODITY_BY_ID[arg].name + " for " + r.coin + " coin (" +
        (r.profit >= 0 ? "+" : "") + r.profit + " on what you paid)." +
        (r.left ? " " + r.left + " still in the hold." : "")
      : (r.why || "None held.");
  } else if (kind === "repair") {
    const m = SHIP_MODULE_BY_ID[arg]; if (!m) return;
    const c = repairCost(m);
    if (!spendCoin(c)) { stationMsg = "Not enough coin — " + c + " needed."; return; }
    repairModule(arg);
    stationMsg = m.name + " repaired for " + c + " coin.";
  } else if (kind === "buy") {
    const m = SHIP_MODULE_BY_ID[arg]; if (!m) return;
    const c = modulePrice(m);
    if (!spendCoin(c)) { stationMsg = "Not enough coin — " + c + " needed."; return; }
    shipOwned.add(arg); saveOwned();
    stationMsg = m.name + " bought. Fit it from ⚙ Fit Modules.";
  } else if (kind === "config") {
    // open the fit-grid without leaving the dock; back returns here (see shipCfgFromDock)
    shipCfgFromDock = true; stationMsg = "";
    menuView = "shipConfig"; shipTab = 0; scfgSel = -1; scfgScroll = 0; scfgPlacing = null;
    showTutorial("modules");
  } else if (kind === "bounty") {
    acceptBounty(arg);
    const b = BOUNTY_BY_ID[arg];
    bountyDeclined = false;
    // Accepting is the whole commitment — the mark goes up straight away.
    stationMsg = "Contract accepted: " + b.title + ". Mark set in " + b.zone + ".";
  } else if (kind === "side") {
    acceptSide(arg);
    const m = SIDE_BY_ID[arg];
    stationMsg = "Job accepted: " + m.title + ". First step: " + m.steps[0].text + ".";
  } else if (kind === "undock") {
    requestUndock();
  }
}

// The dock screen's painted interior: the station's own room, cover-fitted to the
// canvas so it never letterboxes, then knocked back hard so the UI panels stay the
// thing you read. Falls back to the old flat fill while the art loads or if it's
// missing, which is why the scrim is drawn as its own layer rather than baked in.
// Cover-fit geometry for a station's backdrop, shared by the art and by the keeper's
// baseline so the two can never drift apart. Fitted to the VISIBLE height, not the canvas
// height: the canvas runs taller than the window at wide-short aspects (and inside the
// episode iframe), and fitting to the canvas pushed the whole painted foreground — the
// counter every room is composed around — below the fold.
function dockBgGeom(r, visH) {
  const img = dockBgImg[dockedAt && dockedAt.id];
  if (!(img && img.complete && img.naturalWidth)) return null;
  const sc = Math.max(r.width / img.naturalWidth, visH / img.naturalHeight);
  const dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;
  return { img, sc, dw, dh, x: (r.width - dw) / 2, y: (visH - dh) / 2 };
}

function drawDockBackdrop(r) {
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top; if (!(visH > 200)) visH = r.height; visH = Math.min(visH, r.height);
  const g = dockBgGeom(r, visH);
  if (g) {
    ctx.drawImage(g.img, g.x, g.y, g.dw, g.dh);
    ctx.fillStyle = "rgba(2,4,10,0.62)";            // scrim: art readable, text still crisp
  } else ctx.fillStyle = "rgba(2,4,10,0.93)";
  ctx.fillRect(0, 0, r.width, r.height);
}

// The art is cut square across the waist, which reads as a hard edge floating over the
// counter. Pre-render each keeper once with the bottom band dissolved to transparent so
// they fade into the counter's shadow instead of stopping dead. Cached per station —
// this runs on the first dock and never again.
const KEEPER_FADE = 0.20;                // fraction of the image height that dissolves
const _keeperFaded = {};
function keeperFaded(id, img) {
  let c = _keeperFaded[id];
  if (c && c.width === img.naturalWidth && c.height === img.naturalHeight) return c;
  c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  const top = c.height * (1 - KEEPER_FADE);
  const grad = g.createLinearGradient(0, top, 0, c.height);
  grad.addColorStop(0, "rgba(0,0,0,0)");
  grad.addColorStop(0.55, "rgba(0,0,0,0.55)");
  grad.addColorStop(1, "rgba(0,0,0,1)");
  g.globalCompositeOperation = "destination-out";
  g.fillStyle = grad;
  g.fillRect(0, top, c.width, c.height - top);
  _keeperFaded[id] = c;
  return c;
}

// Where the keeper stands, and how much width that leaves the UI. Returns null when
// there's no art or the window is too narrow to fit a figure and a usable panel —
// in which case the screen falls back to its old full-width centred layout.
function keeperLayout(r, visH) {
  const s = dockedAt; if (!s || !s.keeper) return null;
  const img = keeperImg[s.id];
  if (!(img && img.complete && img.naturalWidth)) return null;
  // `baseline` is where the room's counter crosses IN THE BACKDROP'S OWN COORDINATES (a
  // fraction of the source image height), not the viewport's. It has to be mapped through
  // the same cover-fit transform `drawDockBackdrop` uses, because at wide-but-short aspects
  // the art is cropped top and bottom and the counter slides down the screen — anchor the
  // figure to the viewport instead and it floats above the counter at 1808×690.
  const bfrac = s.keeper.baseline != null ? s.keeper.baseline : 0.78;
  const g = dockBgGeom(r, visH);
  const base = g ? g.y + bfrac * g.dh            // same transform the backdrop is drawn with
                 : visH * bfrac;                 // no art: fall back to a viewport estimate
  // Keeper art is waist-up, not full-body like the crew's `<Name>-Status.png`: the counter
  // takes everything below the waist anyway, so a full body would either float above the
  // counter or have to be source-cropped — and a head-to-waist slice of a full body is a
  // wide, short region that eats far too much width to fit beside the panel at 1280.
  const h = visH * s.keeper.scale;
  const w = h * (img.naturalWidth / img.naturalHeight);
  // A panel narrower than this stops being readable, so below it the keeper is dropped
  // rather than squeezing both. 640 is the width at which MARKET's rows still fit.
  if (r.width - w - 56 < 640) return null;
  const x = s.keeper.side === "right" ? r.width - w - s.keeper.dx : s.keeper.dx;
  // Sink them by half the fade band so the dissolve straddles the counter line rather
  // than ending above it — the opaque part of the figure still reaches the counter.
  const y = base - h + h * KEEPER_FADE * 0.5;
  return { img: keeperFaded(s.id, img), x, y, w, h, base, side: s.keeper.side };
}

function drawStationView(r) {
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top; if (!(visH > 200)) visH = r.height; visH = Math.min(visH, r.height);
  const s = dockedAt || { name: "Station" };

  // The keeper goes down first so the UI overlaps their lower body, which is what sells
  // them as standing behind the counter rather than pasted on top of the room.
  const kp = keeperLayout(r, visH);
  if (kp) ctx.drawImage(kp.img, kp.x, kp.y, kp.w, kp.h);

  // The send-off plays with the UI cleared away, so the last thing on screen is the
  // keeper rather than a trade menu. No hit rects are registered while this runs.
  if (dockLeaving) { drawKeeperSay(r, visH, kp); return; }

  const rows = stationRows();
  const tabH = 46, tabW = 190;

  let w = Math.min(880, r.width - 40), x = (r.width - w) / 2;
  if (kp) {                                    // slide the UI clear of the figure
    w = Math.min(880, r.width - kp.w - 56);
    x = kp.side === "right" ? 28 : r.width - w - 28;
  }
  const px = x + tabW + 16, pw = w - tabW - 16;

  // Wrap every row's blurb FIRST, then size the rows to the longest one. A fixed 76px
  // row only had space for two lines, so the longer bounty briefs were ellipsized away
  // mid-sentence — you couldn't read the contract you were being asked to take.
  let subMax = 1;
  for (const row of rows) {
    const tw = stationRowTextW(row, pw);      // leaves the font on the label's, so reset it
    ctx.font = "11px Consolas, monospace";
    row._subLines = wrapLines(row.sub || "", tw);
    subMax = Math.max(subMax, row._subLines.length);
  }
  const rowH = Math.max(76, ROW_SUB_TOP + (subMax - 1) * ROW_SUB_LINE + 14);
  const subH = STATION_TABS[stationTab] === "RESOURCES" ? 36 : 0;   // Buy/Sell sub-tab strip inside the panel

  // Height follows content. The panel used to be a fixed 560 whatever was in it, so
  // TRADE (one row) drew a ~480px empty slab across the middle of the art. The floor is
  // the tab column's own height — the tabs are drawn outside the panel and would hang
  // off the bottom of anything shorter.
  const needed = 16 + subH + rows.length * (rowH + 8) + 44;
  const bodyMax = Math.min(visH - 80, 560) - 66;
  // The tab column is its own stack of chips beside the panel, not inside it, so the
  // panel is free to be shorter than the tabs — 150 just keeps one row + the footer.
  const bodyH = Math.max(150, Math.min(needed, bodyMax));
  const h = bodyH + 66;

  const y = 46;

  // ---- header: station name + your money ----

  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 19px Consolas, monospace";
  ctx.fillText(s.name.toUpperCase(), x + 22, y + 27);
  ctx.textAlign = "right"; ctx.font = "bold 14px Consolas, monospace";
  ctx.fillStyle = "#f2c14e"; ctx.fillText(econ.coin + " coin", x + w - 22, y + 18);
  const cap = cargoCap(), used = cargoUsed(), gt = goodsTotal();
  ctx.fillStyle = used >= cap ? "#ff7a6a" : "#8dffb0"; ctx.font = "12px Consolas, monospace";
  ctx.fillText(used + " / " + cap + " hold" + (gt ? "  (" + econ.scrap + " scrap, " + gt + " cargo)" : " · scrap"),
               x + w - 22, y + 38);

  // ---- left: tabs ----

  STATION_TABS.forEach((t, i) => {
    const ty = top + i * (tabH + 8), active = i === stationTab;
    techPanel(x, ty, tabW, tabH, 10, active, active ? "#8af2ff" : "#2f9fb8");
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = active ? "#ffffff" : "#cfeef6"; ctx.font = "bold 14px Consolas, monospace";
    ctx.fillText(t, x + 22, ty + tabH / 2);
    // a badge for things wanting attention
    let badge = "";
    if (t === "MODULES" && shipBroken.size) badge = String(shipBroken.size);   // broken parts want repair
    if (t === "BOUNTIES") { const open = BOUNTIES.filter(b => bountyState(b.id) === "open").length; if (open) badge = String(open); }
    if (t === "JOBS") { const open = SIDE_MISSIONS.filter(m => m.from === s.id && sideState(m.id) === "open").length; if (open) badge = String(open); }
    if (badge) {

  stationSel = Math.max(0, Math.min(stationSel, rows.length - 1));
  // RESOURCES carries a BUY / SELL sub-tab strip at the top of the panel

  if (subH) {
    const chipW = 100, chipH = 26, chipY = top + 8;

      const cx0 = px + 14 + si * (chipW + 8), on = si === stationSub;
      techPanel(cx0, chipY, chipW, chipH, 7, on, on ? "#8af2ff" : "#2f6577");
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = on ? "#ffffff" : "#bfe0ea"; ctx.font = "bold 12px Consolas, monospace";
      ctx.fillText(st, cx0 + chipW / 2, chipY + chipH / 2 + 1);

    });

  for (let i = first; i < Math.min(rows.length, first + maxRows); i++) {
    const row = rows[i], ry = listTop + (i - first) * (rowH + 8), sel = i === stationSel;
    const accent = !row.act ? "#4a5c68" : row.ok ? (sel ? "#8af2ff" : "#2f9fb8") : "#6b4a4a";
    techPanel(px + 12, ry, pw - 24, rowH, 10, sel && !!row.act, accent);
    // a row may carry a mugshot (bounty targets); text shifts right to make room, and
    // rows without one are laid out exactly as before

    const textW = stationRowTextW(row, pw);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = !row.act ? "#7f96a3" : row.ok ? "#ffffff" : "#c99a9a";
    ctx.font = "bold 15px Consolas, monospace";
    ctx.fillText(fitText(row.label, textW), tx, ry + 22);
    ctx.fillStyle = "rgba(160,200,215,0.75)"; ctx.font = "11px Consolas, monospace";
    // Every wrapped line is drawn — the row was sized for the longest blurb on the board.
    (row._subLines || []).forEach((ln, li) => ctx.fillText(ln, tx, ry + ROW_SUB_TOP + li * ROW_SUB_LINE));
    // price / payout on the right
    ctx.textAlign = "right";
    if (row.cost != null) {
      ctx.fillStyle = row.ok ? "#f2c14e" : "#ff7a6a"; ctx.font = "bold 15px Consolas, monospace";
      ctx.fillText("-" + row.cost + " coin", px + pw - 28, ry + 26);
      if (!row.ok) { ctx.fillStyle = "rgba(255,122,106,0.8)"; ctx.font = "10px Consolas, monospace";
        ctx.fillText("not enough coin", px + pw - 28, ry + 44); }
    } else if (row.gain) {
      ctx.fillStyle = "#8dffb0"; ctx.font = "bold 15px Consolas, monospace";
      ctx.fillText("+" + row.gain + " coin", px + pw - 28, ry + 26);
      if (row.where) { ctx.fillStyle = "rgba(160,200,215,0.7)"; ctx.font = "10px Consolas, monospace";
        ctx.fillText(row.where, px + pw - 28, ry + 44); }
    }
    // BOUNTIES / JOBS get an explicit ACCEPT button rather than relying on the
    // click-the-row-twice idiom (Steve, 2026-07-26: taking a contract is a one-way
    // commitment — it deserves a deliberate button, not an implicit double-click).
    const isJobBoard = STATION_TABS[stationTab] === "BOUNTIES" || STATION_TABS[stationTab] === "JOBS";
    if (isJobBoard && row.act && row.ok) {
      const abw = 96, abh = 28, abx = px + pw - 24 - abw, aby = ry + rowH - abh - 10;
      techPanel(abx, aby, abw, abh, 8, true, "#7ee787");
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#7ee787"; ctx.font = "bold 13px Consolas, monospace";
      ctx.fillText("✓ ACCEPT", abx + abw / 2, aby + abh / 2 + 1);
      _menuHit.stationAccept.push({ x: abx, y: aby, w: abw, h: abh, idx: i, act: row.act });
    }
    _menuHit.station.push({ x: px + 12, y: ry, w: pw - 24, h: rowH, idx: i, act: row.act, ok: row.ok });
  }
  if (rows.length > maxRows) {
    ctx.textAlign = "right"; ctx.fillStyle = "rgba(150,200,220,0.5)"; ctx.font = "10px Consolas, monospace";
    ctx.fillText((first + 1) + "–" + Math.min(rows.length, first + maxRows) + " of " + rows.length, px + pw - 20, top + bodyH - 32);
  }
  // ---- footer, two lines: the last action's result gets its OWN row above the key
  // hints — sharing one line meant a long message ("Job accepted: …", the hand-back
  // confirm) printed straight through the hint text (Brett's overlap defect)
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#8dffb0"; ctx.font = "12px Consolas, monospace";
  ctx.fillText(fitText(stationMsg, rows.length > maxRows ? pw - 160 : pw - 48), px + 24, top + bodyH - 32);   // share the row with the pager only when it's drawn
  ctx.textAlign = "right"; ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "12px Consolas, monospace";
  ctx.fillText((STATION_TABS[stationTab] === "RESOURCES" ? "←→ tab · Tab buy/sell · ↑↓ select · Enter confirm · Q undock"
                                                          : "←→ tab · ↑↓ select · Enter confirm · Q undock"), px + pw - 20, top + bodyH - 14);
  drawKeeperSay(r, visH, kp);            // over the panels, so a line is never buried
  drawBackButton("◀ UNDOCK");
}

// The keeper's line, sitting on the counter in front of them — anchored to the figure so
// it reads as theirs, and clamped into the visible area at any aspect.
function drawKeeperSay(r, visH, kp) {
  if (!keeperSay) return;
  const f = keeperSay.t / keeperSay.dur;
  const alpha = f < 0.05 ? f / 0.05 : f > 0.86 ? (1 - f) / 0.14 : 1;
  ctx.save();
  ctx.globalAlpha = clamp01(alpha);
  ctx.font = "13px Consolas, monospace";
  const w = Math.min(430, r.width - 60);
  const lines = wrapLines(keeperSay.text, w - 34);
  const h = 34 + lines.length * 17;
  const cx = kp ? kp.x + kp.w / 2 : r.width / 2;
  const x = Math.max(16, Math.min(cx - w / 2, r.width - w - 16));
  let y = kp ? kp.base + 12 : visH - h - 40;   // on the counter, not below the faded hem
  y = Math.min(y, visH - h - 12);
  techPanel(x, y, w, h, 12, true, keeperSay.accent);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = keeperSay.accent; ctx.font = "bold 11px Consolas, monospace";
  ctx.fillText(keeperSay.name.toUpperCase(), x + 17, y + 20);
  ctx.fillStyle = "#e8f6fb"; ctx.font = "13px Consolas, monospace";
  lines.forEach((ln, i) => ctx.fillText(ln, x + 17, y + 38 + i * 17));
  ctx.restore();
}

// CARGO — what's actually in the hold. The HUD chip only has room for totals, and it's
// hidden in combat and at stations, so this is the place to see the manifest itemised.
function drawCargoView(r) {
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top; if (!(visH > 200)) visH = r.height; visH = Math.min(visH, r.height);
  const held = COMMODITIES.filter(c => goodsHeld(c.id) > 0);
  const rows = 1 + held.length;                    // scrap line + each commodity held
  const w = Math.min(620, r.width - 60), x = (r.width - w) / 2;
  const h = Math.min(visH - 80, 250 + rows * 34);
  const y = Math.max(60, (visH - h) / 2);        // clears the SHIP tab strip
  techPanel(x, y, w, h, 16, true, "#ff9a5a");

  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 22px Consolas, monospace";
  ctx.fillText("CARGO HOLD", r.width / 2, y + 42);

  // capacity bar — the same amber/red thresholds as the HUD chip
  const cap = cargoCap(), used = cargoUsed(), pct = cap ? used / cap : 0;
  const bx = x + 30, bw = w - 60, by = y + 62;
  ctx.fillStyle = "rgba(10,26,34,0.9)"; ctx.fillRect(bx, by, bw, 12);
  ctx.fillStyle = pct >= 1 ? "#ff7a6a" : pct >= 0.85 ? "#f2c14e" : "#8dffb0";
  ctx.fillRect(bx, by, Math.max(0, Math.min(1, pct)) * bw, 12);
  ctx.strokeStyle = "rgba(150,200,220,0.35)"; ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, 11);
  ctx.textAlign = "left"; ctx.fillStyle = "rgba(190,225,240,0.8)"; ctx.font = "12px Consolas, monospace";
  ctx.fillText(used + " / " + cap + " used", bx, by + 30);
  ctx.textAlign = "right";
  ctx.fillStyle = pct >= 1 ? "#ff7a6a" : "rgba(190,225,240,0.8)";
  ctx.fillText(pct >= 1 ? "HOLD FULL" : (cap - used) + " free", bx + bw, by + 30);

  let ry = by + 58;
  // ⚠️ The quantity column is measured off the note, not a fixed 120px inset. The note
  // used to be a short "~300 coin at base"; a market hint ("Veil Anchorage pays 14 ·
  // just now") is far longer and ran straight over the number.
  const line = (label, qty, note, colour) => {
    ctx.textAlign = "left"; ctx.fillStyle = colour; ctx.font = "bold 15px Consolas, monospace";
    ctx.fillText(label, bx, ry);
    let noteW = 0;
    if (note) {
      ctx.font = "12px Consolas, monospace";
      note = fitText(note, bw * 0.62);            // never let it reach the label
      noteW = ctx.measureText(note).width;
      ctx.textAlign = "right"; ctx.fillStyle = "rgba(160,200,215,0.7)";
      ctx.fillText(note, bx + bw, ry);
    }
    ctx.textAlign = "right"; ctx.fillStyle = "#ffffff"; ctx.font = "bold 15px Consolas, monospace";
    ctx.fillText(String(qty), bx + bw - (noteW ? noteW + 18 : 0), ry);
    ry += 34;
  };
  line("Scrap", econ.scrap, econ.scrap ? "sells at " + SCRAP_PRICE + " coin" : "", "#cfe9f1");
  for (const c of held) {
    // The manifest answers the only question that matters about trade cargo: where do I
    // take this? Falls back to what you paid when you've no intel on anywhere else yet.
    const best = bestKnownMarket(c.id, dockedAt && dockedAt.id);
    const note = best ? best.name + " pays " + best.sell + " · " + intelAge(best.at)
                      : "paid " + Math.round(goodsBasis(c.id)) + " each · no market data";
    line(c.name, goodsHeld(c.id), note, "#ffd479");
  }
  if (!held.length && !econ.scrap) {
    ctx.textAlign = "center"; ctx.fillStyle = "rgba(160,200,215,0.7)"; ctx.font = "13px Consolas, monospace";
    ctx.fillText("Hold's empty. Go break something.", r.width / 2, ry + 4);
    ry += 34;
  }

  ctx.strokeStyle = "rgba(255,154,90,0.3)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(bx, ry - 16); ctx.lineTo(bx + bw, ry - 16); ctx.stroke();
  // note sits beside the LABEL, not beside the value — right-aligning both collided
  ctx.textAlign = "left"; ctx.fillStyle = "#f2c14e"; ctx.font = "bold 15px Consolas, monospace";
  ctx.fillText("Coin", bx, ry + 6);
  ctx.fillStyle = "rgba(160,200,215,0.7)"; ctx.font = "12px Consolas, monospace";
  ctx.fillText("banked — not in the hold", bx + 58, ry + 6);
  ctx.textAlign = "right"; ctx.fillStyle = "#f2c14e"; ctx.font = "bold 15px Consolas, monospace";
  ctx.fillText(String(econ.coin), bx + bw, ry + 6);

  ctx.textAlign = "center"; ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "12px Consolas, monospace";
  ctx.fillText("← → tabs · Q — back", r.width / 2, y + h - 16);
  drawBackButton(shipCfgFromDock ? "◀ STATION" : "◀ BACK");
}

// Draw a portrait image into a box, preserving aspect ratio. mode "cover"
// fills the box (cropping); "contain" fits the whole figure inside. `topAlign`
// anchors a cover crop to the top so faces stay visible. Clipped to the box.
function drawPortrait(img, x, y, w, h, mode, topAlign) {
  if (!img.complete || !img.naturalWidth) {
    ctx.fillStyle = "rgba(90,160,185,0.12)";
    chamferPath(ctx, x, y, w, h, 8); ctx.fill();
    ctx.fillStyle = "rgba(150,210,230,0.5)"; ctx.font = "12px Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("…", x + w / 2, y + h / 2);
    return;
  }
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const sc = mode === "cover" ? Math.max(w / iw, h / ih) : Math.min(w / iw, h / ih);
  const dw = iw * sc, dh = ih * sc;
  const dx = x + (w - dw) / 2;
  const dy = topAlign ? y : y + (h - dh) / 2;
  ctx.save();
  chamferPath(ctx, x, y, w, h, 8); ctx.clip();
  ctx.drawImage(img, dx, dy, dw, dh);
  ctx.restore();
}
// A wanted-poster mugshot: head and shoulders taken out of a full-body portrait, so a
// small square reads as a face instead of a tiny whole person. `crop` is expressed in
// fractions of the source image — `cx` the figure's horizontal centre, `top` where the
// head starts, `h` how much of the image height to take — so it's tunable per character
// without touching the art. Defaults suit a centred, full-height standing figure.
const MUGSHOT_CROP = { cx: 0.5, top: 0.02, h: 0.30 };
function drawMugshot(img, x, y, w, h, crop) {
  if (!img || !img.complete || !img.naturalWidth) return drawPortrait(img || new Image(), x, y, w, h, "cover", false);
  const c = Object.assign({}, MUGSHOT_CROP, crop || {});
  const iw = img.naturalWidth, ih = img.naturalHeight;
  let sh = ih * c.h, sw = sh * (w / h);
  if (sw > iw) { sw = iw; sh = sw * (h / w); }          // never sample outside the image
  let sx = iw * c.cx - sw / 2, sy = ih * c.top;
  sx = Math.max(0, Math.min(iw - sw, sx));
  sy = Math.max(0, Math.min(ih - sh, sy));
  ctx.save();
  chamferPath(ctx, x, y, w, h, 8); ctx.clip();
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  ctx.restore();
}
// Draw an image as a flat filled silhouette (its alpha shape painted one colour),
// letterboxed into the box like drawPortrait's "contain". Used for undiscovered
// Ship Database entries. Renders through an offscreen buffer so the fill respects
// the sprite's transparency. Falls back to a placeholder until the image loads.
let _silCanvas = null;
function drawSilhouette(img, x, y, w, h, color) {
  if (!img.complete || !img.naturalWidth) { drawPortrait(img, x, y, w, h, "contain", false); return; }
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const sc = Math.min(w / iw, h / ih);
  const dw = Math.max(1, Math.round(iw * sc)), dh = Math.max(1, Math.round(ih * sc));
  const oc = _silCanvas || (_silCanvas = document.createElement("canvas"));
  oc.width = dw; oc.height = dh;
  const og = oc.getContext("2d");
  og.clearRect(0, 0, dw, dh);
  og.drawImage(img, 0, 0, dw, dh);
  og.globalCompositeOperation = "source-in";     // keep alpha shape, replace colour
  og.fillStyle = color; og.fillRect(0, 0, dw, dh);
  ctx.drawImage(oc, x + (w - dw) / 2, y + (h - dh) / 2);
}

// CREW roster — one row of large full-body character panels (camp-menu style):
// each crew member's status portrait fills a tall column, name + role beneath.
// Widths adapt to the canvas so all six fit — the game is also embedded in
// episode1.html's shorter iframe.
function drawCrewView(r) {
  const cols = CREW.length, gap = 12;
  const titleH = 30, titleGap = 14, hintH = 22;
  const marginTop = 12, marginBottom = 20;   // keep name/role + hint clear of the bottom
  // The embedded canvas can be TALLER than the visible iframe, so laying out
  // against r.height alone drops the name/role band below the fold. Use the
  // document's visible height (canvas top → viewport bottom) as the real budget.
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top;
  if (!(visH > 120)) visH = r.height;         // guard against a bogus reading during load
  visH = Math.min(visH, r.height);

  const availW = r.width - 32;
  const availH = visH - marginTop - marginBottom - titleH - titleGap - hintH;
  const ch = Math.max(140, availH);           // panels fill the visible height

  // ease each panel's expand amount toward 1 for the selected/hovered member
  const now = gTime || 0;
  const dt = _crewAnimLast ? Math.min(60, now - _crewAnimLast) : 16;
  _crewAnimLast = now;
  const k = 1 - Math.pow(0.001, dt / 150);    // ~150ms to settle, frame-rate independent
  for (let i = 0; i < cols; i++) crewExpand[i] += ((i === crewSel ? 1 : 0) - crewExpand[i]) * k;

  // reserve room for one fully-expanded panel so the row always fits the width
  const baseW = (availW - (cols - 1) * gap - (rawExpandPx(availW, cols, gap))) / cols;
  const expandPx = rawExpandPx(availW, cols, gap);
  let sumE = 0; for (let i = 0; i < cols; i++) sumE += crewExpand[i];
  const norm = sumE > 1 ? 1 / sumE : 1;       // never overflow if transitions overlap
  const widths = crewExpand.map(e => baseW + e * norm * expandPx);

  let totalW = (cols - 1) * gap; for (const w of widths) totalW += w;
  const left = r.width / 2 - totalW / 2;
  const top = marginTop;                       // anchor to the (always visible) top

  ctx.fillStyle = "#dffaff"; ctx.font = "bold 24px Consolas, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText("CREW", r.width / 2, top + titleH);

  const gridTop = top + titleH + titleGap;
  const footBand = Math.round(Math.min(56, Math.max(38, ch * 0.14)));
  let x = left;
  for (let i = 0; i < CREW.length; i++) {
    const c = CREW[i], active = i === crewSel;
    const cw = widths[i], y = gridTop;
    const nameSize = Math.round(Math.min(20, Math.max(13, cw * 0.11)));
    const roleSize = Math.round(Math.min(12, Math.max(9, cw * 0.07)));
    techPanel(x, y, cw, ch, 12, active, active ? c.accent : "#2f8ba0");
    // full-body portrait fills the panel above the name/role footer band
    drawPortrait(crewStatusImg[i], x + 6, y + 6, cw - 12, ch - footBand - 6, "cover", false);
    ctx.fillStyle = active ? "#ffffff" : "#cfeef6"; ctx.font = "bold " + nameSize + "px Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText(c.name, x + cw / 2, y + ch - roleSize - 12);
    ctx.fillStyle = c.accent; ctx.font = roleSize + "px Consolas, monospace";
    ctx.fillText(c.role.toUpperCase(), x + cw / 2, y + ch - 10);
    _menuHit.crew.push({ x, y, w: cw, h: ch, idx: i });
    x += cw + gap;
  }
  ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "12px Consolas, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText("←→ / hover select · Enter open · M/Q back", r.width / 2, gridTop + ch + hintH - 6);
  drawBackButton("◀ BACK");
}
// how much wider the expanded (hovered) panel grows, sized off the base column.
function rawExpandPx(availW, cols, gap) {
  const rawW = (availW - (cols - 1) * gap) / cols;
  return rawW * 0.55;
}

// CREW character sheet — large portrait, name/role, and three action slots.
function drawCrewCharView(r) {
  const c = CREW[crewOpen];
  const panelW = 1000, panelH = 420;
  const x = r.width / 2 - panelW / 2, y = Math.max(20, r.height / 2 - panelH / 2);
  techPanel(x, y, panelW, panelH, 16, true, c.accent);

  // far-left column: biography in its own framed panel
  const bioW = 280, colH = panelH - 40, bioX = x + 20, colY = y + 20;
  techPanel(bioX, colY, bioW, colH, 12, false, "#2f8ba0");
  ctx.fillStyle = c.accent; ctx.font = "bold 13px Consolas, monospace";
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("BIOGRAPHY", bioX + 18, colY + 28);
  ctx.strokeStyle = "rgba(120,200,220,0.35)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(bioX + 18, colY + 38); ctx.lineTo(bioX + bioW - 18, colY + 38); ctx.stroke();
  ctx.fillStyle = "#cfe9f1"; ctx.font = "13px Consolas, monospace";
  wrapText(c.bio || "", bioX + 18, colY + 60, bioW - 36, 19);   // free wrap, no ellipsis

  // middle column: big portrait in its own framed panel
  const portW = 260, portH = colH, portX = bioX + bioW + 26, portY = colY;
  techPanel(portX, portY, portW, portH, 12, false, "#2f8ba0");
  drawPortrait(crewStatusImg[crewOpen], portX + 6, portY + 6, portW - 12, portH - 12, "cover", false);

  // right column header: name + role
  const rx = portX + portW + 26;
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 30px Consolas, monospace";
  ctx.fillText(c.fullName || c.name, rx, y + 52);
  ctx.fillStyle = c.accent; ctx.font = "bold 15px Consolas, monospace";
  ctx.fillText(c.role.toUpperCase(), rx, y + 76);
  ctx.strokeStyle = "rgba(120,200,220,0.35)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(rx, y + 90); ctx.lineTo(x + panelW - 26, y + 90); ctx.stroke();

  // three action slots
  const slotX = rx, slotW = x + panelW - 26 - rx;
  const slotH = 92, slotGap = 12;
  let sy = y + 104;
  for (let s = 0; s < 3; s++) {
    const active = s === crewSlotSel;
    const locked = s > 0;
    if (locked) {
      techPanel(slotX, sy, slotW, slotH, 10, active, active ? "#6f8794" : "#2b5563");
      ctx.fillStyle = "rgba(150,190,205,0.55)"; ctx.font = "bold 14px Consolas, monospace";
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("SLOT " + (s + 1), slotX + 16, sy + 26);
      // padlock glyph
      const lx = slotX + slotW / 2, ly = sy + slotH / 2 + 6;
      ctx.strokeStyle = "rgba(150,190,205,0.6)"; ctx.lineWidth = 2;
      ctx.strokeRect(lx - 11, ly - 8, 22, 16);
      ctx.beginPath(); ctx.arc(lx, ly - 8, 7, Math.PI, 2 * Math.PI); ctx.stroke();
      ctx.fillStyle = "rgba(150,190,205,0.7)"; ctx.font = "12px Consolas, monospace";
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      ctx.fillText("LOCKED", lx, sy + slotH - 12);
    } else {
      const act = crewEquipped(c), avail = crewAvailableIdxs(c), swappable = avail.length > 1;
      techPanel(slotX, sy, slotW, slotH, 10, active, active ? c.accent : "#34c6de");
      ctx.fillStyle = "rgba(150,200,220,0.7)"; ctx.font = "bold 12px Consolas, monospace";
      ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
      ctx.fillText("SLOT 1 · ACTION", slotX + 16, sy + 20);
      ctx.fillStyle = active ? "#ffffff" : "#eaf7fb"; ctx.font = "bold 18px Consolas, monospace";
      ctx.fillText(act.name, slotX + 16, sy + 42);
      ctx.fillStyle = "#cfe9f1"; ctx.font = "12px Consolas, monospace";
      // The chip sits above the description's rows, so only the first line has to
      // dodge it — the ability name does that; the description gets full width.
      wrapText(act.desc, slotX + 16, sy + 60, slotW - 32, 15, 2);   // ≤2 rows, auto-ellipsized
      if (swappable) {
        // swap chip on the right, carrying its own "1/2" so nothing sits under it
        const bw = 116, bh = 26, bx = slotX + slotW - bw - 12, by = sy + 12;
        techPanel(bx, by, bw, bh, 8, active, active ? "#ffffff" : c.accent);
        ctx.fillStyle = active ? "#ffffff" : c.accent; ctx.font = "bold 12px Consolas, monospace";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        // Position among the options actually *available* right now, not the raw
        // slot index — a module-gated 3rd option (e.g. Kael's Disruptor Pulse) that
        // isn't fitted must not inflate the denominator to a count you can't reach.
        const pos = avail.indexOf(c.slot0.options.indexOf(act)) + 1;
        ctx.fillText("⇄ SWAP  " + (pos || 1) + "/" + avail.length, bx + bw / 2, by + bh / 2 + 1);
      }
    }
    _menuHit.slots.push({ x: slotX, y: sy, w: slotW, h: slotH, idx: s });
    sy += slotH + slotGap;
  }

  ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "12px Consolas, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  const hint = c.slot0.options.length > 1
    ? "↑↓ slot · Enter swap action · M/Q back"
    : "↑↓ slot · M/Q back";
  ctx.fillText(hint, r.width / 2, y + panelH + 22);
  drawBackButton("◀ CREW");
}

// SHIP DATABASE grid — a card per hostile hull + the Command Nexus. Undiscovered
// entries show a flat silhouette and "? ? ?"; scanning one in battle reveals its
// sprite + name and makes the card openable (drawDbShipView).
function drawDatabaseView(r) {
  const entries = DEX_ENTRIES, n = entries.length;
  // lay out against the visible height (canvas can be taller than the iframe)
  const clientH = document.documentElement.clientHeight || r.height;
  let visH = clientH - r.top; if (!(visH > 120)) visH = r.height; visH = Math.min(visH, r.height);
  const titleH = 28, titleGap = 12, hintH = 46, marginTop = 12, marginBottom = 16, gap = 14, labelH = 26;
  const cols = DEX_COLS, rows = Math.ceil(n / cols);
  const availW = Math.min(r.width - 40, 860);
  const cardW = (availW - (cols - 1) * gap) / cols;
  const availH = visH - marginTop - marginBottom - titleH - titleGap - hintH;
  const cardH = Math.max(118, Math.min(200, (availH - (rows - 1) * gap) / rows));
  const gridW = cols * cardW + (cols - 1) * gap;
  const gridH = rows * cardH + (rows - 1) * gap;
  const left = r.width / 2 - gridW / 2;
  const top = marginTop + titleH + titleGap;

  ctx.fillStyle = "#dffaff"; ctx.font = "bold 24px Consolas, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText("SHIP DATABASE", r.width / 2, marginTop + titleH);

  for (let i = 0; i < n; i++) {
    const e = entries[i], col = i % cols, row = (i / cols) | 0;
    const x = left + col * (cardW + gap), y = top + row * (cardH + gap);
    const active = i === dbSel, found = shipDex.has(e.id);
    techPanel(x, y, cardW, cardH, 12, active,
      active ? (found ? "#8dffb0" : "#8af2ff") : (found ? "#2f8ba0" : "#26505e"));
    const imgY = y + 8, imgH = cardH - labelH - 12;
    if (found) drawPortrait(e.img, x + 10, imgY, cardW - 20, imgH, "contain", false);
    else       drawSilhouette(e.img, x + 10, imgY, cardW - 20, imgH, "rgba(96,146,166,0.4)");
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.font = "bold 13px Consolas, monospace";
    ctx.fillStyle = found ? (active ? "#ffffff" : "#cfeef6") : "rgba(150,190,205,0.55)";
    ctx.fillText(found ? e.name.toUpperCase() : "? ? ?", x + cardW / 2, y + cardH - 9);
    _menuHit.db.push({ x, y, w: cardW, h: cardH, idx: i, discovered: found });
  }

  const foundCount = entries.reduce((a, e) => a + (shipDex.has(e.id) ? 1 : 0), 0);
  const hy = top + gridH + 24;
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#8dffb0"; ctx.font = "12px Consolas, monospace";
  ctx.fillText("◆ Scan enemy ships in battle (Kael's Scan) to reveal their full profile.", r.width / 2, hy);
  ctx.fillStyle = "rgba(150,200,220,0.6)";
  ctx.fillText("Discovered " + foundCount + " / " + n + "   ·   ← → ↑ ↓ select · Enter open · M / Q back", r.width / 2, hy + 18);
  drawBackButton("◀ BACK");
}

// Ship Database profile — big sprite + name/class/stats/tactics for one revealed
// entry. Stats come from the ship's combat profile (or the Nexus boss numbers).
function dbStats(e) {
  if (e.kind === "nexus") return [
    ["Core HP", NEXUS_BOSS.coreHp],
    ["Shield Generators", "3 × " + NEXUS_BOSS.nodeHp + " HP"],
    ["Core Shield", "Active until nodes down"],
    ["Beam Lane", NEXUS_BOSS.beamDmg + "–" + NEXUS_BOSS.beamDmgP3 + " dmg"],
    ["Overload Blast", NEXUS_BOSS.overloadDmg + " dmg · turn " + NEXUS_BOSS.overloadTurns],
  ];
  const p = e.profile;
  const rows = [
    ["Hull HP", p.hp],
    ["Shields", "None"],
    ["Combat Move", p.moves + " tiles / turn"],
    ["Cruise Speed", speedWord(p.speed)],
    ["Phaser", p.phaserDmg + " dmg"],
    ["Missiles", p.ammo ? p.missileDmg + " dmg × " + p.ammo : "None"],
  ];
  // A named hull reads as a ship like any other, then carries who flies it and what
  // the contract on it is worth — the bounty is filed against the ship, not a face.
  if (e.kind === "boss") {
    if (e.flownBy) rows.push([e.bossId ? "Flown by" : "Wing of", e.flownBy]);
    const b = e.bossId ? BOUNTY_BY_ID[e.bossId] : null;
    if (b) rows.push(["Contract", b.reward + " coin"], ["Last seen", b.zone]);
  }
  return rows;
}
// qualitative label + multiplier for a hull's free-roam speed (see SHIP_PROFILES.speed)
function speedWord(sp) {
  const s = sp || 1;
  const tier = s <= 0.7 ? "Slow" : s < 0.95 ? "Steady" : s < 1.2 ? "Fast" : "Very Fast";
  return tier + " (" + s.toFixed(2).replace(/\.?0+$/, "") + "×)";
}
function drawDbShipView(r) {

  // stat rows (label left, value right)

  ctx.fillStyle = "rgba(150,200,220,0.6)"; ctx.font = "12px Consolas, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
