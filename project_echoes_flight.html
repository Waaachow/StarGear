// ---- weapon fire: phaser beam / travelling missile bolt ----
// farthest cell of an attack pattern from the shooter (the beam/bolt endpoint)
function farthestCell(fromGx, fromGy, cells) {
  let best = { gx: fromGx, gy: fromGy }, bd = -1;
  for (const c of cells) {
    const d = Math.abs(c.gx - fromGx) + Math.abs(c.gy - fromGy);
    if (d > bd) { bd = d; best = c; }
  }
  return best;
}
// ---- per-hull attack visuals ---------------------------------------------
// The six hostile hulls no longer all fire the same orange beam. Each has its own
// signature so you can tell WHO shot you without reading the log — which matters
// once four ships are firing in sequence. Style is drawn by drawShots(); colour
// and weight come from here. Missiles keep the shared bolt look (a missile is a
// missile) but inherit the hull's colour.
//   lance   — one long thin beam with a hot core (sniper)
//   twin    — two parallel beams either side of the line
//   scatter — a fan of short bolts
//   pulse   — a dashed, segmented beam
//   beam    — the original single flash (default / player)
const ENEMY_FX = {
  Cyclops: { style: "lance",   color: "#9fe8ff", thick: 1.4, dur: 420 },  // artillery: long, precise
  Dread:   { style: "twin",    color: "#ff5a5a", thick: 2.6, dur: 300 },  // bruiser: heavy double
  Gunner:  { style: "beam",    color: "#ff9a3c", thick: 2.2, dur: 260 },  // the baseline
  Neo:     { style: "scatter", color: "#b481ff", thick: 1.6, dur: 300 },  // flanker: quick burst
  Tank:    { style: "pulse",   color: "#ffc766", thick: 3.2, dur: 380 },  // soak: slow heavy thud
  Wing:    { style: "twin",    color: "#7ee787", thick: 1.3, dur: 220 },  // interceptor: fast light
};
function enemyFx(e) {
  const n = e && e.ship && e.ship.shipName;
  return (n && ENEMY_FX[n]) || ENEMY_FX.Gunner;
}

// `thick` scales the beam/bolt width (enemy fire passes >1 so its shots read heavier).
// `fx` optionally carries a per-hull style/duration (see ENEMY_FX).
function spawnShot(fromGx, fromGy, toGx, toGy, weapon, color, thick, fx) {
  const style = weapon === "missile" ? "missile" : (fx && fx.style) || "beam";
  const dur = (fx && fx.dur) || (weapon === "missile" ? 360 : 240);
  combat.shots.push({ fromGx, fromGy, toGx, toGy, weapon, color, thick: thick || 1,
                      style, t: 0, dur });
  sfx(weapon === "missile" ? "missile" : "laser");   // every shot in the game routes through here
}
function drawShots() {
  const MUZZLE = 14;                                   // raise beams to the ship body
  for (const sh of combat.shots) {
    const a = cellToScreen(sh.fromGx, sh.fromGy), b = cellToScreen(sh.toGx, sh.toGy);
    const ax = a.x, ay = a.y - MUZZLE, bx = b.x, by = b.y - MUZZLE;
    const f = clamp01(sh.t / sh.dur), k = sh.thick;
    ctx.save();
    if (sh.weapon === "missile") {                     // bolt flies from shooter to target
      const px = lerp(ax, bx, f), py = lerp(ay, by, f);
      const tx = lerp(ax, px, 0.65), ty = lerp(ay, py, 0.65);
      ctx.strokeStyle = "rgba(255,170,66,0.55)"; ctx.lineWidth = 2 * k;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(px, py); ctx.stroke();
      ctx.shadowColor = sh.color; ctx.shadowBlur = 10; ctx.fillStyle = "#fff0c4";
      ctx.beginPath(); ctx.arc(px, py, 3.5 * k, 0, 6.283); ctx.fill();
    } else {
      const alpha = 1 - f;
      ctx.shadowColor = sh.color; ctx.shadowBlur = 12 * k;
      ctx.globalAlpha = alpha;
      // unit vector along the shot + its perpendicular, for offset/segmented styles
      let dx = bx - ax, dy = by - ay;
      const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
      const nx = -dy, ny = dx;
      const line = (x1, y1, x2, y2, w, col) => {
        ctx.strokeStyle = col; ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      };
      if (sh.style === "twin") {                       // two parallel beams
        const off = 3.2 * k;
        for (const s of [-1, 1]) {
          line(ax + nx * off * s, ay + ny * off * s, bx + nx * off * s, by + ny * off * s, 2.2 * k, sh.color);
          ctx.globalAlpha = alpha * 0.85;
          line(ax + nx * off * s, ay + ny * off * s, bx + nx * off * s, by + ny * off * s, 0.9 * k, "#eafcff");
          ctx.globalAlpha = alpha;
        }
      } else if (sh.style === "lance") {               // thin precise beam, bright core, hot muzzle
        line(ax, ay, bx, by, (2.2 + 1.6 * (1 - f)) * k, sh.color);
        ctx.globalAlpha = alpha * 0.95;
        line(ax, ay, bx, by, 1.1 * k, "#ffffff");
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(ax, ay, 3.4 * k * (1 - f * 0.5), 0, 6.283); ctx.fill();
      } else if (sh.style === "scatter") {             // a fan of short bolts down the line
        const n = 3;
        for (let i = 0; i < n; i++) {
          const spread = (i - (n - 1) / 2) * 7 * k;
          const t0 = 0.15 + i * 0.06, t1 = Math.min(1, t0 + 0.55);
          const sxp = lerp(ax, bx, t0) + nx * spread, syp = lerp(ay, by, t0) + ny * spread;
          const exp2 = lerp(ax, bx, t1) + nx * spread, eyp = lerp(ay, by, t1) + ny * spread;
          line(sxp, syp, exp2, eyp, 2 * k, sh.color);
        }
      } else if (sh.style === "pulse") {               // heavy dashed slug
        const segs = 5;
        for (let i = 0; i < segs; i++) {
          const t0 = i / segs, t1 = t0 + 0.55 / segs;
          line(lerp(ax, bx, t0), lerp(ay, by, t0), lerp(ax, bx, t1), lerp(ay, by, t1), (3 + 2 * (1 - f)) * k, sh.color);
        }
        ctx.globalAlpha = alpha * 0.8;
        line(ax, ay, bx, by, 1.2 * k, "#fff3d0");
      } else {                                         // "beam": the original single flash
        line(ax, ay, bx, by, (3 + 2 * (1 - f)) * k, sh.color);
        ctx.globalAlpha = alpha * 0.9;
        line(ax, ay, bx, by, 1.4 * k, "#eafcff");
      }
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ---- floating notices: short-lived text that drifts up off a tile, used for
// salvage pickups ("+7 SCRAP") and the hold-full warning. ----
function spawnFloater(gx, gy, text, color) {
  if (!combat) return;
  combat.floaters.push({ gx, gy, text, color: color || "#8dffb0", t: 0, dur: 1150 });
}
function drawFloaters() {
  for (const fl of combat.floaters) {
    const s = cellToScreen(fl.gx, fl.gy), f = clamp01(fl.t / fl.dur);
    ctx.save();
    ctx.globalAlpha = f < 0.15 ? f / 0.15 : 1 - Math.max(0, (f - 0.6) / 0.4);   // pop in, fade out
    ctx.font = "bold 15px Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const y = s.y - 30 - 26 * f;
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(2,4,10,0.85)";
    ctx.strokeText(fl.text, s.x, y);
    ctx.fillStyle = fl.color; ctx.fillText(fl.text, s.x, y);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// Salvage auto-collects the instant a hull dies (design: no flying over drops).
// If the hold is full nothing is taken and the floater says so — that's the nudge
// back to a station, since scrap left behind is gone for good.
function grantScrapFor(e) {
  if (!e) return;
  // "kill N" side-job steps still count regular hulls only — a boss piece is a
  // contract or a story beat, not an odd-job tally mark
  if (!e.boss) sideKills++;
  // Everything that dies pays out now (Steve, v0.5): boss SHIPS carry real scrap
  // values in their profiles (Blood Crown 40, Hound 8, Half-Light 26, Tithe 34 —
  // defined since v0.4 but never paid); fortress pieces pay small for a shield
  // generator, big for the core.
  const base = (e.ship && e.ship.profile && e.ship.profile.scrap)
            || (e.boss ? (e.part === "core" ? 30 : 5) : 6);
  const amt = Math.max(1, Math.round(base * (0.8 + Math.random() * 0.4)));
  const got = addScrap(amt);
  spawnFloater(e.gx, e.gy, got ? "+" + got + " SCRAP" : "HOLD FULL", got ? "#8dffb0" : "#ff9a6a");
  if (got) sfx("scrap");
  else _holdFullNoted = true;               // told to the crew once the fight ends
}

// ---- ship explosions: shockwave ring + core flash + flying debris ----
function spawnExplosion(gx, gy, big) {
  const parts = [], n = big ? 24 : 14;
  const palette = ["#fff2c4", "#ffb347", "#ff6a2c", "#ff3b30"];
  for (let i = 0; i < n; i++)
    parts.push({ a: Math.random() * 6.283, sp: (big ? 80 : 52) * (0.4 + Math.random()),
                 r: 1 + Math.random() * 2.5, c: palette[(Math.random() * palette.length) | 0] });
  combat.explosions.push({ gx, gy, t: 0, dur: big ? 950 : 650, parts, big });
  sfx("explode", big ? 1 : 0.85);
}
function drawExplosions() {
  for (const ex of combat.explosions) {
    const s = cellToScreen(ex.gx, ex.gy), cy = s.y - 14;   // sit where the ship hovered
    const f = clamp01(ex.t / ex.dur), fade = 1 - f;
    ctx.save();
    // expanding shockwave ring
    ctx.globalAlpha = fade * 0.7;
    ctx.strokeStyle = "#ffd27a"; ctx.lineWidth = (ex.big ? 4 : 3) * fade + 0.5;
    ctx.beginPath(); ctx.arc(s.x, cy, (ex.big ? 50 : 34) * f, 0, 6.283); ctx.stroke();
    // hot core flash
    ctx.globalAlpha = fade * fade;
    const cg = ctx.createRadialGradient(s.x, cy, 0, s.x, cy, ex.big ? 28 : 18);
    cg.addColorStop(0, "rgba(255,245,200,0.95)");
    cg.addColorStop(0.5, "rgba(255,140,40,0.6)");
    cg.addColorStop(1, "rgba(255,60,30,0)");
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(s.x, cy, ex.big ? 28 : 18, 0, 6.283); ctx.fill();
    // debris flying outward (slight iso squash on Y)
    const tt = ex.t / 1000;
    ctx.globalAlpha = fade;
    for (const pt of ex.parts) {
      const d = pt.sp * tt * (1 - 0.4 * f);
      const px = s.x + Math.cos(pt.a) * d, py = cy + Math.sin(pt.a) * d * 0.7;
      ctx.fillStyle = pt.c;
      ctx.beginPath(); ctx.arc(px, py, pt.r * fade + 0.4, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function tickCombat(dt) {
  tickBossSay(dt);
  tickCrewBark(dt);
  tickBossIntro(dt);
  // Opening beat. With encounter art we open ON the CG and hold the name card until it
  // fades; without it (or if the art never decodes) the boss speaks over the arena once
  // its banner has cleared, so nothing depends on the image being there.
  if (combat.boss && !(combat.boss.said && combat.boss.said.start)) {
    if (combat.introBanner) {                       // holding the name card for the CG
      startBossIntro(bossSpec());
      if (bossIntro) bossTalk("start");
      else {
        combat.cgWait = (combat.cgWait || 0) + dt;
        if (combat.cgWait > 6000) releaseIntroBanner();   // art never arrived — carry on
      }
    } else if (!combat.banner) {
      startBossIntro(bossSpec());
      bossTalk("start");
    }
  }
  // Crimson couldn't afford the fee this time — one bark once the opening banner clears,
  // so it doesn't collide with "COMBAT!"/the boss intro (same idea as the block above).
  if (combat._crimsonNoShow && !combat._crimsonNoShowSaid && !combat.banner) {
    combat._crimsonNoShowSaid = true;
    crimsonBarkSay("noShow");
  }
  for (const e of combat.enemies) e.bob += dt / 1000;
  if (combat.guest) combat.guest.bob += dt / 1000;
  // glide all ships along their movement paths
  tickWalk(combat.player, dt);
  for (const e of combat.enemies) tickWalk(e, dt);
  for (let i = combat.flashes.length - 1; i >= 0; i--)
    if ((combat.flashes[i].t -= dt) <= 0) combat.flashes.splice(i, 1);
  if (combat.banner && (combat.banner.t -= dt) <= 0) combat.banner = null;
  for (let i = combat.explosions.length - 1; i >= 0; i--)
    if ((combat.explosions[i].t += dt) >= combat.explosions[i].dur) combat.explosions.splice(i, 1);
  for (let i = combat.shots.length - 1; i >= 0; i--)
    if ((combat.shots[i].t += dt) >= combat.shots[i].dur) combat.shots.splice(i, 1);
  for (let i = combat.floaters.length - 1; i >= 0; i--)
    if ((combat.floaters[i].t += dt) >= combat.floaters[i].dur) combat.floaters.splice(i, 1);
  if (combat.boss) updateBossPhase();                    // shields-down / overload transitions
  // a player shot is in flight — let it land before ships blow up and the turn ends
  if (combat.pending) {
    if ((combat.pending.t -= dt) <= 0) {
      for (const e of combat.pending.kill) {                // 2-tile warship → blast both tiles
        for (const c of enemyCells(e)) spawnExplosion(c.gx, c.gy, false);
        grantScrapFor(e);                                   // salvage auto-collects on the kill
      }
      const dead = new Set(combat.pending.kill);
      const hadKill = combat.pending.kill.length > 0;
      combat.enemies = combat.enemies.filter(e => !dead.has(e));
      const endAfter = combat.pending.endAfter;
      combat.pending = null;
      if (combat.enemies.length === 0) {
        if (combat.echo && combat.echo.stage === 1) {
          combat.echo.stage = 1.5;
          sceneActive = true;
          try { window.parent.postMessage({ type: "playScene", id: "cogwheel_defence_wave1", freeze: true }, "*"); } catch (err) {}
          return;
        }
        // See the matching comment in endPlayerTurn() — past stage 1, an empty
        // board isn't a win, the echo stage machine drives what happens next.
        if (!combat.echo) { winCombat(); return; }   // victory chatter handled by winCombat
      }
      if (hadKill) crewBarkSay("kill");                           // a downed ship the fight outlives
      // crew shots always pass endAfter:false (they keep the turn open); Crimson's shot
      // is the one caller that passes true, so this only ever fires for his phase — but
      // route on combat.phase anyway rather than assuming, in case that ever changes.
      if (endAfter) { if (combat.phase === "guest") finishGuestTurn(); else endPlayerTurn(); }
    }
    return;                                        // freeze AI/turn logic while it resolves
  }
  if (combat.echo) updateEchoDefence();
  if (combat.phase === "guest" && combat.guestAi) {
    combat.guestAi.timer -= dt;
    if (combat.guestAi.timer <= 0) guestAdvance();
  } else if (combat.phase === "enemy" && combat.ai) {
    const ai = combat.ai;
    if (ai.state === "moving") {
      const e = combat.enemies[ai.idx];
      if (!e || !e.walk) { ai.state = "fire"; ai.timer = 150; }   // glide finished → fire
    } else if (ai.state === "fleeingGlide") {
      const f = combat.fleeer;
      if (!f || !f.walk) {                                        // cleared the edge → out of the fight
        combat.enemies = combat.enemies.filter(o => o !== f);
        combat.fleeer = null;
        ai.idx = 0; ai.state = "start"; ai.timer = 220;
        if (combat.enemies.length === 0) finishEnemyTurn();
      }
    } else {
      ai.timer -= dt;
      if (ai.timer <= 0) enemyAdvance();
    }
  } else if (combat.phase === "won" || combat.phase === "lost") {
    if ((combat.endTimer -= dt) <= 0) {
      // the wreck banner has played out — now say what a loss actually costs
      if (combat.phase === "lost") showTutorial("defeat");
      // A lost STORY fight restages instead of ending the run or dumping the player
      // into an empty free-roam they can't advance out of: same battle, same staging,
      // but carrying the modules it just wrecked. evacActive gets the same treatment —
      // the Evacuation Escort battle (Part 3) is just as unavoidable as a MISSION_MODE
      // fight, it just isn't staged through that hash-driven system (see startEvacMission).
      if (combat.phase === "lost" && evacActive) {
        combat = null;
        startEvacMission();                                // restarts the whole scripted battle at stage 1
        return;
      }
      if (combat.phase === "lost" && MISSION_MODE) {
        const trigger = combat.trigger || null;
        combat = null;
        startCombat(trigger);                              // rebuilds the same staged encounter
        return;
      }
      bgm("explore");                                      // back to the exploration track
      recenterAndExit();
    }
  }
}

function regenerateGrid() {
  for (let x = 0; x < GRID_SIZE; x++)
    for (let y = 0; y < GRID_SIZE; y++)
      world.grid[x][y] = generateTile(world.worldOriginX + x, world.worldOriginY + y, 0.0);
  world.droppingTiles.length = 0;
}
// Exit combat back onto the map AT THE SPOT THE FIGHT STARTED. Combat movement is
// tactical, not travel — carrying it over meant the ship resurfaced a few squares
// from where the player remembered stopping, which read as a position glitch (two
// playtesters), and a combat Space Hop was silently worth free sector distance.
// The camera still starts on the ship's final combat tile and eases home, so the
// return reads as flying back rather than a cut.
function recenterAndExit() {
  const p = combat.player;
  const dx = (p.gx - p.gy) * HALF_W;
  const dy = (p.gx + p.gy) * HALF_H - CENTER_WORLD_Y;
  world.worldOriginX = combat.entryOrigin.x;
  world.worldOriginY = combat.entryOrigin.y;
  regenerateGrid();
  world.shipFacing = p.facing;
  world.moving = false;
  world.cameraOffsetX = dx; world.cameraOffsetY = dy;          // start where the ship was…
  world.lateral = { elapsed: 0, dur: 450, startX: dx, startY: dy, ease: cubicInOut }; // …ease to centre
  const wasWon = combat.phase === "won";
  combat = null;
  // the crew comment on the fight now that we're back in open space (during combat
  // the chatter bar is suppressed, so this has to wait until here)
  if (wasWon) { chatterLast = -1e9; chatterIdle = 0; say("victory"); }
  // don't instantly re-engage a bounty you're still sitting on top of — whether you
  // won it or limped away, you have to leave the mark and come back
  bountyDeclined = true;
  nexusAwake = false;                                          // back to free-roam → Nexus dormant (covers a loss too)
  combatCooldown = 5000;                                       // ≥5s breather before the population refills
  // you destroyed the ships that engaged you: clear the hostiles that were right
  // on top of the (now recentred) player; distant patrols persist, and the sector
  // trickles back up to strength during play (see updateEnemies).
  const rpx = world.worldOriginX + CENTER, rpy = world.worldOriginY + CENTER;
  enemies = enemies.filter(e => !(e.hostile && Math.hypot(e.ax - rpx, e.ay - rpy) <= ENEMY_CLEAR_TILES));
  enemySpawnTimer = ENEMY_SPAWN_STAGGER_MS;
}

// ---- combat rendering ----
function fillCell(gx, gy, color) {
  const s = cellToScreen(gx, gy);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(s.x, s.y - HALF_H); ctx.lineTo(s.x + HALF_W, s.y);
  ctx.lineTo(s.x, s.y + HALF_H); ctx.lineTo(s.x - HALF_W, s.y);
  ctx.closePath(); ctx.fill();
}
function outlineCell(gx, gy, color) {
  const s = cellToScreen(gx, gy);
  ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(s.x, s.y - HALF_H); ctx.lineTo(s.x + HALF_W, s.y);
  ctx.lineTo(s.x, s.y + HALF_H); ctx.lineTo(s.x - HALF_W, s.y);
  ctx.closePath(); ctx.stroke();
}
function drawHpBar(cx, cy, hp, maxhp, color) {
  const w = 42, h = 5, x = cx - w / 2, y = cy;
  ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = "#222";            ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;             ctx.fillRect(x, y, w * Math.max(0, hp) / maxhp, h);
}
// Turn banner — slides up into view, holds, then fades. Colour-coded so the
// player can tell at a glance whose turn it is (green = you, red = enemy).
const BANNER_STYLE = {
  player: { bg: "rgba(12,40,26,0.82)", edge: "#7ee787", text: "#b6ffce", tag: "▶ YOUR MOVE" },
  enemy:  { bg: "rgba(48,14,14,0.82)", edge: "#ff6b6b", text: "#ffb3a8", tag: "ENEMY ATTACK ◀" },
  info:   { bg: "rgba(40,32,8,0.82)",  edge: "#ffd86b", text: "#ffe9a8", tag: "" },
  guest:  { bg: "rgba(14,32,50,0.82)", edge: GUEST_TEAM_COLOR, text: "#cfeeff", tag: "★ GUEST" },
};
function drawBanner(b) {
  const r = canvas.getBoundingClientRect();
  const st = BANNER_STYLE[b.kind] || BANNER_STYLE.info;
  const age = b.dur - b.t;                              // ms since it appeared
  const slide = cubicOut(clamp01(age / 240));           // ease up on entry
  const appear = clamp01(age / 200);
  const fade = clamp01(b.t / 260);                      // fade out at the end
  const alpha = Math.min(appear, fade);

  const h = 60;
  // Some objective banners run much longer than the original "COMBAT!"/"YOUR
  // TURN" shouts this box was sized for (e.g. "OBJECTIVE UPDATED: Protect Both
  // Evacuation Ships") — measure the text and grow the box to fit it, shrinking
  // the font as a last resort so nothing overflows the box or runs off-screen.
  const maxW = r.width * 0.92, pad = 64;
  let fontSize = 30;
  ctx.font = "bold " + fontSize + "px Consolas, monospace";
  let textW = ctx.measureText(b.text).width;
  while (textW + pad > maxW && fontSize > 16) {
    fontSize--;
    ctx.font = "bold " + fontSize + "px Consolas, monospace";
    textW = ctx.measureText(b.text).width;
  }
  const w = Math.min(maxW, Math.max(300, textW + pad));
  const cx = r.width / 2;
  const cy = r.height * 0.30 + (1 - slide) * 26;        // rises into place
  const x = cx - w / 2, y = cy - h / 2;

  ctx.save();
  ctx.globalAlpha = alpha;
  // soft outer glow in the team colour
  ctx.shadowColor = st.edge; ctx.shadowBlur = 26;
  ctx.fillStyle = st.bg;
  chamferPath(ctx, x, y, w, h, 18); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 2; ctx.strokeStyle = st.edge; chamferPath(ctx, x, y, w, h, 18); ctx.stroke();
  // accent bars on the sides
  ctx.fillStyle = st.edge;
  ctx.fillRect(x + 14, y + 12, 4, h - 24);
  ctx.fillRect(x + w - 18, y + 12, 4, h - 24);
  // tag line
  if (st.tag) {
    ctx.globalAlpha = alpha * 0.85;
    ctx.font = "bold 11px Consolas, monospace"; ctx.textAlign = "center";
    ctx.fillStyle = st.edge; ctx.fillText(st.tag, cx, y + 16);
  }
  // main text
  ctx.globalAlpha = alpha;
  ctx.font = "bold " + fontSize + "px Consolas, monospace"; ctx.textAlign = "center";
  ctx.fillStyle = st.text; ctx.fillText(b.text, cx, y + (st.tag ? 44 : 39));
  ctx.restore();
}
// ---- turn-order avatar bar (top of screen) ----
// Order of play: the player acts first, then each surviving enemy in list order.
function combatTurnOrder() {
  const order = [{ kind: "player", ent: combat.player }];
  if (combat.guest) order.push({ kind: "guest", ent: combat.guest });   // vanishes the instant he's knocked out
  // The evacuation transports are guests too while they're on the field (Steve:
  // "they should appear on the turn timeline") — same vanish-when-gone rule.
  if (combat.escorts) for (const c of combat.escorts) if (c.hp > 0) order.push({ kind: "escort", ent: c });
  if (combat.boss) { const c = bossCore(); if (c) order.push({ kind: "enemy", ent: c }); }  // one boss avatar
  else for (const e of combat.enemies) order.push({ kind: "enemy", ent: e });
  return order;
}
// The entity whose turn is currently active (highlighted in the bar).
function activeTurnEnt() {
  if (combat.phase === "player") return combat.player;
  if (combat.phase === "guest") return combat.guest;
  if (combat.phase !== "enemy") return null;
  if (combat.boss) return bossCore();
  if (combat.ai && combat.ai.idx < combat.enemies.length) return combat.enemies[combat.ai.idx];
  return null;
}
// Shared layout so the bar drawing and hover hit-testing agree on positions.
function turnOrderLayout(order) {
  const r = canvas.getBoundingClientRect();
  const R = 23, gap = 16, n = order.length;
  const totalW = n * R * 2 + (n - 1) * gap;
  let x = r.width / 2 - totalW / 2 + R;
  const y = 34;
  const out = [];
  for (const o of order) { out.push({ ...o, cx: x, cy: y, R }); x += R * 2 + gap; }
  return out;
}
// Find which ship the cursor is over — either its sprite in the arena or its
// avatar in the turn bar — so we can cross-highlight the two.
function combatHoverEnt(mx, my, layout) {
  for (const a of layout)                                  // avatars in the top bar
    if (Math.hypot(mx - a.cx, my - a.cy) <= a.R) return a.ent;
  let best = null, bd = 30;                                // ship sprites on the grid
  for (const o of layout) {
    const isEnemy = o.kind === "enemy";   // guest is a single fixed tile like the player — no footprint offset
    const s = isEnemy
      ? cellToScreen(o.ent.vgx + ENEMY_FOOT.dx / 2, o.ent.vgy + ENEMY_FOOT.dy / 2)
      : cellToScreen(o.ent.vgx, o.ent.vgy);
    const reach = isEnemy ? 42 : 30;                       // bigger hull → larger hit area
    const d = Math.hypot(mx - s.x, my - (s.y - 18));
    if (d < reach && d < bd + 12) { bd = d; best = o.ent; }
  }
  return best;
}
// A small ship sprite drawn to fill a circular avatar.
function drawAvatarShip(cx, cy, size, facing, tint, set) {
  const { img, flip } = shipSprite(facing, set);
  if (!img.complete || img.naturalWidth === 0) {           // sprite not ready → dot
    ctx.fillStyle = (tint || (set && set !== shipImg)) ? "#ff6b6b" : "#bfe9ff";
    ctx.beginPath(); ctx.arc(cx, cy, size * 0.28, 0, 6.283); ctx.fill();
    return;
  }
  const src = tint ? getTintedSprite(img, tint) : img;
  const W = size, H = W * (img.naturalHeight / img.naturalWidth);
  ctx.save();
  if (flip) { ctx.translate(cx, cy); ctx.scale(-1, 1); ctx.drawImage(src, -W / 2, -H / 2, W, H); }
  else      { ctx.drawImage(src, cx - W / 2, cy - H / 2, W, H); }
  ctx.restore();
}
function drawTurnOrder(layout, activeEnt, hoverEnt) {
  // baseline connecting the avatars (reads as a sequence)
  if (layout.length > 1) {
    ctx.strokeStyle = "rgba(120,150,190,0.35)"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(layout[0].cx, layout[0].cy);
    for (const a of layout) ctx.lineTo(a.cx, a.cy);
    ctx.stroke();
  }
  layout.forEach((a, i) => {
    const isPlayer = a.kind === "player", isGuest = a.kind === "guest", isEscort = a.kind === "escort";
    const active = a.ent === activeEnt, hover = a.ent === hoverEnt;
    const team = isPlayer ? "#7ee787" : isEscort ? "#7ecbff" : isGuest ? GUEST_TEAM_COLOR : "#ff6b6b";
    ctx.save();
    // backing circle
    ctx.beginPath(); ctx.arc(a.cx, a.cy, a.R, 0, 6.283);
    ctx.fillStyle = isPlayer ? "rgba(14,38,26,0.95)" : (isGuest || isEscort) ? "rgba(14,32,50,0.95)" : "rgba(46,16,16,0.95)"; ctx.fill();
    // icon, clipped to the circle — a Nexus-core glyph for the boss, a plain
    // transport dot for an escort, else a ship
    ctx.save(); ctx.clip();
    if (a.ent.boss) {
      const puls = 0.6 + 0.4 * Math.sin(gTime * 0.006);
      const g = ctx.createRadialGradient(a.cx, a.cy, 2, a.cx, a.cy, a.R);
      g.addColorStop(0, `rgba(255,190,110,${0.95 * puls})`);
      g.addColorStop(0.55, "rgba(255,150,60,0.92)");
      g.addColorStop(1, "rgba(70,34,18,0.92)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(a.cx, a.cy, a.R, 0, 6.283); ctx.fill();
      ctx.strokeStyle = `rgba(255,224,150,${0.55 + 0.35 * puls})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(a.cx, a.cy, a.R * 0.58, 0, 6.283); ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${0.6 + 0.3 * puls})`;
      ctx.beginPath(); ctx.arc(a.cx, a.cy, a.R * 0.24, 0, 6.283); ctx.fill();
    } else if (isEscort) {
      // No ship art exists for a civilian transport (see ASSETS_NEEDED.md) — the

      ctx.fillStyle = "rgba(200,225,255,0.9)"; ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(a.cx, a.cy, a.R * 0.6, 0, 6.283); ctx.fill(); ctx.stroke();
    } else {
      const set = isPlayer ? null : isGuest ? CRIMSON_SHIP : enemyShipSet(a.ent);
      drawAvatarShip(a.cx, a.cy + 1, a.R * 2.0, a.ent.facing, null, set);
    }
    ctx.restore();
    // hp ring (fraction of max as an arc from the top)
    const hpFrac = Math.max(0, a.ent.hp) / a.ent.maxhp;
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath(); ctx.arc(a.cx, a.cy, a.R + 4, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = team;
    ctx.beginPath(); ctx.arc(a.cx, a.cy, a.R + 4, -Math.PI / 2, -Math.PI / 2 + hpFrac * 6.283); ctx.stroke();
    // outer ring: pulsing gold when active, white when hovered, team colour otherwise
    if (active) {
      const puls = 0.55 + 0.45 * Math.sin(gTime * 0.008);
      ctx.lineWidth = 3.5; ctx.strokeStyle = `rgba(255,216,107,${puls})`;
      ctx.shadowColor = "#ffd86b"; ctx.shadowBlur = 14;
    } else if (hover) {
      ctx.lineWidth = 3; ctx.strokeStyle = "#ffffff"; ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 8;
    } else {
      ctx.lineWidth = 2; ctx.strokeStyle = "rgba(150,175,205,0.7)";
    }
    ctx.beginPath(); ctx.arc(a.cx, a.cy, a.R, 0, 6.283); ctx.stroke();
    ctx.shadowBlur = 0;
    // order number badge
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.beginPath(); ctx.arc(a.cx - a.R + 5, a.cy - a.R + 5, 8, 0, 6.283); ctx.fill();
    ctx.fillStyle = team; ctx.font = "bold 11px Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(String(i + 1), a.cx - a.R + 5, a.cy - a.R + 5);
    ctx.restore();
  });
  ctx.textBaseline = "alphabetic";
  // "active now" marker under the live actor
  const act = layout.find(a => a.ent === activeEnt);
  if (act) {
    ctx.fillStyle = act.kind === "player" ? "#7ee787" : act.kind === "escort" ? "#7ecbff" : act.kind === "guest" ? GUEST_TEAM_COLOR : "#ff6b6b";
    ctx.font = "10px Consolas, monospace"; ctx.textAlign = "center";
    ctx.fillText("▲", act.cx, act.cy + act.R + 16);
  }
}

// ---- mouse-driven combat menu (right-side action panel) ----
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y,     x + w, y + h, r);
  g.arcTo(x + w, y + h, x,     y + h, r);
  g.arcTo(x,     y + h, x,     y,     r);
  g.arcTo(x,     y,     x + w, y,     r);
  g.closePath();
}

const COMBAT_PANEL_W = 208;
// Layout the right-side panel: stats block on top, a 2×3 grid of crew face
// circles, then the End Turn button. Both the renderer and the click handler
// read this so hit-testing always matches what's drawn.
function combatPanelLayout() {
  const r = canvas.getBoundingClientRect();
  const pad = 14, w = COMBAT_PANEL_W;
  const x = r.width - w - 16, y = 56;
  const shieldOn = combat && combat.player && combat.player.shieldPct > 0;
  const nStats = 3;                                // HULL, SHIELD (always listed), ACTIONS
  const headerH = pad + 12 + 20 * nStats + 12;
  const facesTop = y + headerH;
  const cols = 2, R = 26, labelBlock = 26, rowGap = 8;
  const innerW = w - pad * 2, cellW = innerW / cols;
  const rowH = R * 2 + labelBlock + rowGap;
  const faces = [];
  for (let i = 0; i < CREW.length; i++) {
    const col = i % cols, row = (i / cols) | 0;
    const cx = x + pad + cellW * col + cellW / 2;
    const cy = facesTop + R + 4 + row * rowH;
    faces.push({ idx: i, cx, cy, R, labelY: cy + R + 13 });
  }
  const facesBottom = facesTop + 4 + 3 * rowH;
  // A hired guest gets a status row of its own between the crew faces and End Turn —
  // informational only (he's AI-controlled, no click target), styled like a crew face so
  // he reads as part of the team roster rather than a stat readout (Steve, 2026-07-26:
  // "a crew icon for active guest"; swapped above End Turn per Steve's follow-up so End
  // Turn stays the panel's fixed last element, same as when there's no guest).
  const guestBox = combat && combat.guest ? { x: x + pad, y: facesBottom + 2, w: innerW, h: 48 } : null;
  const endBtn = { x: x + pad, y: (guestBox ? guestBox.y + guestBox.h + 10 : facesBottom + 2), w: innerW, h: 40 };
  const panelH = (endBtn.y + endBtn.h + pad) - y;   // panel always ends at the End Turn button
  return { x, y, w, pad, faces, endBtn, guestBox, panelH, shieldOn, R };
}
function inCircle(mx, my, f, pad) { const dx = mx - f.cx, dy = my - f.cy; return dx * dx + dy * dy <= (f.R + (pad || 0)) * (f.R + (pad || 0)); }

function overCombatButton(mx, my) {
  if (!combat || combat.phase !== "player") return false;
  const L = combatPanelLayout(), eb = L.endBtn;
  if (mx >= eb.x && mx <= eb.x + eb.w && my >= eb.y && my <= eb.y + eb.h) return true;
  for (const f of L.faces) if (inCircle(mx, my, f, 3)) return true;
  if (combat.actionPick) { const P = actionPickLayout(); if (P && mx >= P.x && mx <= P.x + P.w && my >= P.y && my <= P.y + P.h) return true; }
  return false;
}
function handleCombatClick(mx, my) {
  if (combat.confirmEnd) {                        // the end-turn confirm owns clicks while up
    if (_endConfirmHit && ptIn(_endConfirmHit.yes, mx, my)) { combat.confirmEnd = false; endPlayerTurn(); }
    else if (_endConfirmHit && ptIn(_endConfirmHit.no, mx, my)) { combat.confirmEnd = false; }
    return;                                        // swallow all other arena clicks
  }
  if (combat.phase !== "player" || combat.player.walk || combat.pending) return;   // ignore input mid-glide / shot
  const L = combatPanelLayout(), eb = L.endBtn, t = combat.targeting;
  // action-picker popup takes priority
  if (combat.actionPick) {
    const P = actionPickLayout();
    if (P) {
      const spendCi = P.borrower != null ? P.borrower : P.ci;             // Voss pays when borrowing a role
      for (const rc of P.rects) if (mx >= rc.x && mx <= rc.x + rc.w && my >= rc.y && my <= rc.y + rc.h) {
        if (rc.type === "locked") return;                                  // locked slot → no-op, keep menu open
        if (rc.type === "use") beginAction(P.ci, rc.label, spendCi);
        else if (rc.type === "change") changeAction(P.ci);
        else if (rc.type === "pickslot") combat.actionPick = { ci: P.ci, mode: "changeAbility", slot: rc.slot, borrower: P.borrower };
        else if (rc.type === "assign") assignAction(P.ci, rc.slot, rc.optIdx, spendCi);
        return;
      }
      const af = L.faces.find(f => f.idx === P.ci);
      if (af && inCircle(mx, my, af, 0)) { combat.actionPick = null; return; }   // click the crew again → close
    }
    combat.actionPick = null;                          // any other click cancels, then falls through
  }
  // crew faces: apply a crew-target ability, else begin/cancel targeting
  for (const f of L.faces) if (inCircle(mx, my, f, 0)) {
    if (t && t.kind === "crew" && crewTargetValid(t.spec.need, f.idx)) { applyCrewTarget(t.name, f.idx); spendAction(t.ci); return; }
    if (t && t.kind === "role" && crewTargetValid(t.spec.need, f.idx)) { assumeRole(t.ci, f.idx); return; }   // Voss borrows their action (spends when it resolves)
    activateCrew(f.idx); return;
  }
  // End Turn button — while aiming it cancels the aim instead
  if (mx >= eb.x && mx <= eb.x + eb.w && my >= eb.y && my <= eb.y + eb.h) {
    if (t) cancelTargeting(); else tryEndTurn();
    return;
  }
  // otherwise a grid click resolves the current target (tile / facing / aim / enemy)
  if (t) handleTargetingGrid(mx, my);
}

function drawCombatPanel() {
  const L = combatPanelLayout();
  const { x, y, w, pad } = L;
  const p = combat.player;
  const isPlayerPhase = combat.phase === "player";

  ctx.save();
  techPanel(x, y, w, L.panelH, 14, false, "#34c6de");

  // title + stats
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.font = "bold 13px Consolas, monospace";
  ctx.fillStyle = "#7fe3f5";
  ctx.fillText("COMBAT · TURN " + combat.turn +
    (combat.phase === "enemy" ? " · enemy…" : combat.phase === "guest" ? " · guest…" : ""), x + pad, y + pad + 12);
  ctx.font = "12px Consolas, monospace";
  // SHIELD is always listed — dimmed "down" when inactive — so raising it reads as a
  // visible change and the ship's defence is never a mystery (Steve, v0.4)
  const stats = [
    ["HULL",    Math.max(0, p.hp) + "/" + p.maxhp,                    "#8affc0"],
    ["SHIELD",  L.shieldOn ? "−" + Math.round(p.shieldPct * 100) + "% dmg" : "down",
                L.shieldOn ? "#8ad8ff" : "rgba(150,200,220,0.45)"],
    ["ACTIONS", combat.actionsLeft + "/" + ACTIONS_PER_TURN,          "#9cd2ff"],
  ];
  stats.forEach((s, i) => {
    const yy = y + pad + 12 + 20 * (i + 1);
    ctx.fillStyle = "#6fa6ba"; ctx.textAlign = "left";  ctx.fillText(s[0], x + pad, yy);
    ctx.fillStyle = s[2];      ctx.textAlign = "right"; ctx.fillText(s[1], x + w - pad, yy);
  });

  // crew face circles
  for (const f of L.faces) {
    const i = f.idx, c = CREW[i], cs = combat.crew[i];
    const acted = combat.actedThisTurn.indexOf(i) !== -1;
    const incap = cs.incap;
    const actable = canCrewAct(i);
    const hover = isPlayerPhase && inCircle(mouseX, mouseY, f, 0);
    const tg = combat.targeting;
    const isActing = tg && tg.ci === i;                                   // this crew is mid-aim
    const validTgt = tg && (tg.kind === "crew" || tg.kind === "role") && crewTargetValid(tg.spec.need, i);  // clickable crew target
    const dim = (incap || acted || !actable) && !validTgt && !isActing;
    ctx.save();
    // backing + portrait (zoomed to the face, clipped to the circle)
    ctx.beginPath(); ctx.arc(f.cx, f.cy, f.R, 0, 6.283);
    ctx.fillStyle = "rgba(10,26,34,0.96)"; ctx.fill();
    const img = crewImg[i];
    if (img.complete && img.naturalWidth) {
      ctx.save(); ctx.beginPath(); ctx.arc(f.cx, f.cy, f.R, 0, 6.283); ctx.clip();
      const sc = (f.R * 2) / img.naturalWidth * 5.2;           // zoom in on the head (2× larger)
      const dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;
      ctx.globalAlpha = dim ? 0.4 : 1;
      ctx.drawImage(img, f.cx - dw / 2, f.cy - dh * 0.13, dw, dh);   // face centred in the circle
      ctx.restore();
    }
    // outer ring: acting=gold, valid target=green, out=red, actable=accent, hover=white
    let ring, glow = false;
    if (isActing)     { ring = "#ffd86b"; glow = true; }
    else if (validTgt) { ring = "#7dff9b"; glow = true; }
    else if (incap)   ring = "#ff5a5a";
    else if (hover && actable) ring = "#ffffff";
    else if (actable) ring = c.accent;
    else              ring = "rgba(120,140,160,0.6)";
    ctx.lineWidth = (isActing || validTgt || actable) ? 3 : 2; ctx.strokeStyle = ring;
    if (glow || actable) { ctx.shadowColor = ring; ctx.shadowBlur = hover ? 12 : 7; }
    ctx.beginPath(); ctx.arc(f.cx, f.cy, f.R, 0, 6.283); ctx.stroke();
    ctx.shadowBlur = 0;
    // status glyph: ✓ when spent, revive countdown number when incapacitated
    if (incap || acted) {
      if (incap) {
        ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.beginPath(); ctx.arc(f.cx, f.cy, 15, 0, 6.283); ctx.fill();
        ctx.fillStyle = "#ff7a7a"; ctx.font = "bold 22px Consolas, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(String(cs.reviveIn || 1), f.cx, f.cy + 1);
      } else {
        ctx.fillStyle = "#8fb0bd"; ctx.font = "bold 20px Consolas, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("✓", f.cx, f.cy);
      }
    }
    ctx.restore();
    // labels: name + equipped action / state
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = dim ? "#7f96a3" : "#eafcff"; ctx.font = "bold 11px Consolas, monospace";
    ctx.fillText(c.name, f.cx, f.labelY);
    ctx.font = "9px Consolas, monospace";
    ctx.fillStyle = incap ? "#ff8a8a" : acted ? "#7f96a3" : c.accent;
    // Clamped to the column width — "Disruptor Pulse" is the longest ability name in
    // the game and ran to the panel's edge with no room to spare (Steve, 2026-07-26
    // playtest: "action text clipping over text in battle"). Every other dynamic
    // label in this file guards against overflow; this one didn't.
    const label = incap ? "OUT" : crewOffline(c) ? "OFFLINE" : acted ? "DONE" : crewEquipped(c).name;
    ctx.fillText(fitText(label, L.w / 2 - 20), f.cx, f.labelY + 11);
  }

  // hired guest's status row — informational only, no click target (he's AI-controlled).
  // Sits above End Turn (Steve, 2026-07-26 follow-up: swapped from below).
  if (L.guestBox) {
    const gb = L.guestBox, g = combat.guest, active = combat.phase === "guest";
    techPanel(gb.x, gb.y, gb.w, gb.h, 8, active, GUEST_TEAM_COLOR);
    const gcx = gb.x + 28, gcy = gb.y + gb.h / 2, gR = 20;
    ctx.save();
    ctx.beginPath(); ctx.arc(gcx, gcy, gR, 0, 6.283); ctx.fillStyle = "rgba(10,26,34,0.96)"; ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(gcx, gcy, gR, 0, 6.283); ctx.clip();
    if (crimsonPortraitImg.complete && crimsonPortraitImg.naturalWidth) {
      const sc = (gR * 2) / crimsonPortraitImg.naturalWidth * 5.2;      // same face-zoom trick as the crew faces
      const dw = crimsonPortraitImg.naturalWidth * sc, dh = crimsonPortraitImg.naturalHeight * sc;
      ctx.drawImage(crimsonPortraitImg, gcx - dw / 2, gcy - dh * 0.13, dw, dh);
    }
    ctx.restore();
    ctx.lineWidth = 2.5; ctx.strokeStyle = GUEST_TEAM_COLOR;
    if (active) { ctx.shadowColor = GUEST_TEAM_COLOR; ctx.shadowBlur = 10; }
    ctx.beginPath(); ctx.arc(gcx, gcy, gR, 0, 6.283); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#cfeeff"; ctx.font = "bold 12px Consolas, monospace";
    ctx.fillText("Crimson", gb.x + 56, gb.y + 21);
    ctx.font = "10px Consolas, monospace"; ctx.fillStyle = "rgba(180,220,255,0.8)";
    ctx.fillText("Guest · HP " + Math.max(0, g.hp) + "/" + g.maxhp, gb.x + 56, gb.y + 36);
  }

  // End Turn button (pulses once the action budget is spent)
  const eb = L.endBtn;
  const mustEnd = combat.actionsLeft <= 0;
  const endHover = isPlayerPhase && mouseX >= eb.x && mouseX <= eb.x + eb.w && mouseY >= eb.y && mouseY <= eb.y + eb.h;
  const endActive = isPlayerPhase && (endHover || mustEnd);
  techPanel(eb.x, eb.y, eb.w, eb.h, 8, endActive, isPlayerPhase ? "#f2c23e" : "rgba(72,86,102,0.7)");
  drawActionIcon("endturn", eb.x + 21, eb.y + eb.h / 2, 10, isPlayerPhase ? "#f2c23e" : "#6b7480");
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = !isPlayerPhase ? "#6b7480" : endActive ? "#fff6d9" : "#f2c23e";
  ctx.font = "bold 14px Consolas, monospace";
  ctx.fillText("End Turn", eb.x + 42, mustEnd ? eb.y + eb.h / 2 - 1 : eb.y + eb.h / 2 + 5);
  if (mustEnd) {
    ctx.font = "10px Consolas, monospace"; ctx.fillStyle = "rgba(255,235,180,0.8)";
    ctx.fillText("no actions left", eb.x + 42, eb.y + eb.h / 2 + 13);
  }

  ctx.restore();
}
function drawCombat() {
  const p = combat.player;
  const order = combatTurnOrder();
  const layout = turnOrderLayout(order);
  const activeEnt = activeTurnEnt();
  const hoverEnt = overCombatButton(mouseX, mouseY) ? null : combatHoverEnt(mouseX, mouseY, layout);
  if (combat.boss && combat.boss.telegraph) {           // pulsing red danger lane — MOVE out of it
    const puls = 0.5 + 0.5 * Math.sin(gTime * 0.008);
    for (const c of combat.boss.telegraph.cells) {
      fillCell(c.gx, c.gy, `rgba(255,55,55,${0.10 + 0.13 * puls})`);
      outlineCell(c.gx, c.gy, `rgba(255,95,95,${0.30 + 0.45 * puls})`);
    }
  }
  if (combat.boss) {                                     // mark each weak point's grid cell so it reads on the board
    for (const e of combat.enemies) if (e.boss) {
      const isCore = e.part === "core", shielded = isCore && combat.boss.shielded;
      const puls = 0.5 + 0.5 * Math.sin(gTime * 0.006 + e.bob * 3);
      const rgb = shielded ? "120,180,255" : (isCore ? "255,150,60" : "120,210,255");
      // light every tile the part occupies, so the open core lights all three tiles
      // of its widened hull the same as the centre (Steve, v0.5) — matches enemyCells,
      // so what's lit is exactly what's hittable.
      for (const c of enemyCells(e)) {
        fillCell(c.gx, c.gy, `rgba(${rgb},${0.10 + 0.12 * puls})`);
        outlineCell(c.gx, c.gy, `rgba(${rgb},${0.55 + 0.35 * puls})`);
      }
    }
  }
  drawTargetFills();                    // move/hop/aim highlights (aim's green "will-hit" draws over the markers)
  for (const f of combat.flashes) for (const c of f.cells) fillCell(c.gx, c.gy, f.color);
  // spotlight the enemy currently taking its turn so the sequence is visible
  if (!combat.boss && combat.phase === "enemy" && combat.ai && combat.ai.idx < combat.enemies.length) {
    const ae = combat.enemies[combat.ai.idx];
    const puls = 0.55 + 0.45 * Math.sin(gTime * 0.012);
    for (const c of enemyCells(ae)) {
      fillCell(c.gx, c.gy, `rgba(255,170,60,${0.12 + 0.10 * puls})`);
      outlineCell(c.gx, c.gy, `rgba(255,210,90,${puls})`);
    }
  }

  // entities back-to-front by iso band (using gliding visual coords) so nearer
  // ships overlap correctly during movement
  const ents = combat.enemies.map(e => ({ vgx: e.vgx, vgy: e.vgy, e }));
  ents.push({ vgx: p.vgx, vgy: p.vgy, player: true });
  if (combat.guest) ents.push({ vgx: combat.guest.gx, vgy: combat.guest.gy, guest: true });
  if (combat.escorts) for (const c of combat.escorts) ents.push({ vgx: c.gx, vgy: c.gy, escort: c });
  ents.sort((a, b) => (a.vgx + a.vgy) - (b.vgx + b.vgy));
  for (const ent of ents) {
    if (ent.escort) { drawEscortShip(ent.escort, ent.escort === hoverEnt); continue; }
    const e = ent.player ? p : ent.guest ? combat.guest : ent.e;
    const isEnemy = !ent.player && !ent.guest;
    if (ent.player && combat.phase === "lost") continue;   // destroyed — its explosion stands in
    // Fortress pieces have no hull, so they draw as glyphs; a boss that IS a ship
    // (the bounty bosses) falls through and draws with its sprite like any enemy —
    // its core/shield state still reads from the cell markers above.
    if (isEnemy && e.boss && !e.ship) { drawBossPart(e, e === hoverEnt); continue; }
    // enemies draw centred over their footprint and scaled up; a hull may carry its own
    // multiplier (Drax's Hounds are deliberately small beside his flagship)
    const scale = isEnemy ? ENEMY_SCALE * ((e.ship && e.ship.scale) || 1) : ent.guest ? CRIMSON_SHIP.scale : 1;
    const cs = isEnemy
      ? cellToScreen(ent.vgx + ENEMY_FOOT.dx / 2, ent.vgy + ENEMY_FOOT.dy / 2)
      : cellToScreen(ent.vgx, ent.vgy);
    const bob = isEnemy ? Math.sin(ent.e.bob * 3) * 2
              : ent.guest ? Math.sin((combat.guest.bob || 0) * 3) * 2
              : Math.sin(world.shipBobPhase * 3) * 2;
    // ring the ship the cursor is hovering, matching its avatar in the bar
    if (e === hoverEnt) {
      ctx.save();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
      ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 10; ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.ellipse(cs.x, cs.y - 4, 30 * scale, 16 * scale, 0, 0, 6.283); ctx.stroke();
      ctx.restore();
    }
    const shipSet = isEnemy ? enemyShipSet(e) : ent.guest ? CRIMSON_SHIP : null;
    drawShip(cs.x, cs.y - 18 * scale + bob, e.facing, null, shipSet, scale);
    // Kael's shield, visibly ON the ship: a pulsing iso bubble in the shield-stat
    // blue, so "shield up" is readable from the arena and not just the panel
    if (ent.player && p.shieldPct > 0) {
      const puls = 0.55 + 0.35 * Math.sin(gTime * 0.006);
      const bx = cs.x, by = cs.y - 14 + bob;
      ctx.save();
      const halo = ctx.createRadialGradient(bx, by, 6, bx, by, 48);
      halo.addColorStop(0, `rgba(138,216,255,${0.16 * puls})`);
      halo.addColorStop(1, "rgba(138,216,255,0)");
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.ellipse(bx, by, 46, 32, 0, 0, 6.283); ctx.fill();
      ctx.strokeStyle = `rgba(200,240,255,${0.20 * puls})`; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(bx, by, 38, 25, 0, 0, 6.283); ctx.stroke();
      ctx.strokeStyle = `rgba(138,216,255,${0.5 + 0.35 * puls})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(bx, by, 38, 25, 0, 0, 6.283); ctx.stroke();

// FOG OF WAR — record which tiles the player has seen, for the map screen.
// A 201×201 grid (one cell per sector tile) plus an offscreen minimap canvas
// that we paint incrementally so the map view is cheap to draw.
// ============================================================
const FOG_SIZE = 2 * MAP_RADIUS + 1;
const explored = new Uint8Array(FOG_SIZE * FOG_SIZE);
const REVEAL_R = 7;                       // tiles revealed around the ship
const mapCanvas = document.createElement("canvas");

// bright per-zone colours for the minimap (distinct from the in-world tint)
const MAP_PIXEL = {
  [REGION.NEBULA]: "#7b4cc4", [REGION.MOON]: "#9c6c44",
  [REGION.ARMADA]: "#3f68a0", [REGION.NEXUS]: "#c5902f",
  [REGION.OPEN]:   "#26324a",   // dim blue-grey for explored open space
  [REGION.TRADE_LANE]:  "#5a8fc4",
  [REGION.MINING_BELT]: "#a87c3c",
  [REGION.NEBULA_FIELD]:"#c452a8",

function markExplored(cx, cy) {
  for (let dy = -REVEAL_R; dy <= REVEAL_R; dy++)
    for (let dx = -REVEAL_R; dx <= REVEAL_R; dx++) {
      if (dx * dx + dy * dy > REVEAL_R * REVEAL_R) continue;
      const ax = cx + dx, ay = cy + dy;
      if (ax < -MAP_RADIUS || ax > MAP_RADIUS || ay < -MAP_RADIUS || ay > MAP_RADIUS) continue;
      const idx = (ax + MAP_RADIUS) + (ay + MAP_RADIUS) * FOG_SIZE;
      if (explored[idx]) continue;                       // already seen
      const rg = regionAt(ax, ay);
      if (rg === REGION.OUTSIDE) continue;
      explored[idx] = 1; _fogDirty = true;
      mapCtx.fillStyle = MAP_PIXEL[rg];
      mapCtx.fillRect(ax + MAP_RADIUS, ay + MAP_RADIUS, 1, 1);
    }
}

let _fogDirty = false, _fogSaveAcc = 0;

    localStorage.setItem(FOG_KEY, btoa(s));

}

  for (let ay = -MAP_RADIUS; ay <= MAP_RADIUS; ay++)
    for (let ax = -MAP_RADIUS; ax <= MAP_RADIUS; ax++) {
      const idx = (ax + MAP_RADIUS) + (ay + MAP_RADIUS) * FOG_SIZE;
      if (!explored[idx]) continue;
      const rg = regionAt(ax, ay);
      if (rg === REGION.OUTSIDE) continue;

      mapCtx.fillRect(ax + MAP_RADIUS, ay + MAP_RADIUS, 1, 1);

  try {

    if (!raw) return;
    const s = atob(raw);
    for (let i = 0; i < explored.length && i < s.length; i++) explored[i] = s.charCodeAt(i) ? 1 : 0;

    if (_menuHit.back && ptIn(_menuHit.back, mx, my)) menuView = "root";

// episode1.html answers requestMissions with the current segment log
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "missions") {
    missionLog = e.data.log;
    if (missionLog && menuView === "missions") missionSel = Math.min(missionSel, Math.max(0, missionLog.items.length - 1));
  }
  // the episode player reaching its END beat completes Episode 0
  if (e.data && e.data.type === "episodeComplete") markEpisodeComplete();
  // a VN scene (Crimson Nova) the parent was playing over us has finished — resume flight
  if (e.data && e.data.type === "sceneDone") {
    sceneActive = false;
    hangarDeclined = true;                        // still parked in range — don't re-offer at once
    const firstMeeting = e.data.id === "crimson_nova" && !crimsonMet;
    if (firstMeeting) { crimsonMet = true; saveCrimson(); }
    // both the full scene and the repeat greeting (re)hire him — this IS the rehire flow,
    // "return to the hangar when you've got the coin" means exactly this round trip.
    if (e.data.id === "crimson_nova" || e.data.id === "crimson_greet") {
      crimsonHired = true; saveCrimsonHire();
      crimsonPos = null;   // fresh formation join, not a warp from wherever he last was
      if (firstMeeting) showTutorial("crimsonHired");   // tip names the Mercenary menu; don't auto-open it — return to space
    }
    // Part 1 briefing finished (Rowan's Operations Office) — the story chain advances
    // to "Investigate the Asteroid Belt" (still a `story`-kind pin, same as the
    // opening "dock at Cogwheel Station" stage — see STORY_TARGETS/setStoryStage).
    // Returns to free-roam space rather than auto-opening the station UI (Steve,
    // 2026-07-27: the briefing shouldn't drop you straight into the dock screen).
    // The player is still standing right alongside Cogwheel Station, so without
    // dockDeclined the ordinary proximity check re-raises "Dock at Cogwheel Station?"
    // on the very next frame — same bug report, "it should only appear if you move
    // away and come back". Treating it like a declined prompt re-arms the normal way,
    // via stationInRange() going false once the player actually leaves DOCK_DIST.
    // Re-docking afterward opens the real station UI, since acceptDock()'s first-time
    // cutscene branch is already skipped once rowanBriefed is true.
    if (e.data.id === "cogwheel_arrival" && !rowanBriefed) {
      rowanBriefed = true; saveRowanBriefed();
      setStoryStage("belt");
      setPin("story");
      dockPrompt = null; dockDeclined = true;
    }
    // ---- Part 2 (Echoes/Echoes_Part2.txt) chain — each standalone scene hands the
    // story on to the next waypoint the same way cogwheel_arrival does above. ----
    // Scene 4+5 (wreckage, out at the belt) -> follow the energy trail to the relay.
    if (e.data.id === "wreckage_scan") {
      setStoryStage("relay");
      setPin("story");
    }
    // Scene 6 (the dark relay, the transmission) -> head back to report to Rowan.
    if (e.data.id === "comms_relay") {
      setStoryStage("station2");
      setPin("story");
    }
    // Scene 7 (Rowan's office) — same "don't auto-dock, don't instantly re-prompt"
    // treatment as the Part 1 briefing above. Ends Part 2's forced leg: the player is
    // free to roam (scan, fight) until enough of that activity calls Rowan back —
    // see noteOptionalActivity()/fleetCallPending in update(). Still a real story pin
    // even with no map target — see part2ExploreActive() in primaryInfo() (Steve:
    // "make sure the Explore and Investigate story mission gets pinned").
    if (e.data.id === "rowan_debrief" && !part2Debriefed) {
      part2Debriefed = true; savePart2Debriefed();
      setStoryStage(null);
      setPin("story");
      dockPrompt = null; dockDeclined = true;
    }
    // "Rowan (Radio): We've got company." -> fly back and watch the fleet arrive.
    if (e.data.id === "fleet_call") {
      setStoryStage("station3");
      setPin("story");
    }
    // The fleet drops out of hyperspace. Part 2's content ends here — the next dock
    // (once the player comes in to find out what's happening) picks up Part 3.
    if (e.data.id === "fleet_arrival") {
      setStoryStage(null);
      clearPin();
    }
    // ---- Part 3 (Echoes/Echoes_Part3.txt) ----
    // Scenes 8-12: Astra's origin, Raze's ultimatum, Crimson's arrival, the evacuation
    // order. Ends by dropping straight into the Evacuation Escort battle, not another
    // waypoint — this is the story's first real "you have to fight now" beat, so there's
    // no free-roam gap to walk away in (script: "as the mission begins..."). Same
    // "don't auto-dock, don't instantly re-prompt" treatment as the earlier briefings,
    // even though the station UI was never opened this time (dockAt() never got called).
    if (e.data.id === "the_truth" && !truthBriefed) {
      truthBriefed = true; saveTruthBriefed();
      dockPrompt = null; dockDeclined = true;
      startEvacMission();
    }
    // ---- "Defence of Cogwheel Station" — the Evacuation Escort battle's own
    // mid-combat cutscenes. Unlike every scene above, these fire while `combat` is
    // still populated (frozen, not ended) — sceneActive=false above already lets
    // tickCombat() resume; each branch here just does that stage's spawn/handoff
    // work. See updateEchoDefence()/startEvacMission() (this file, ~4000-4160).
    if (e.data.id === "cogwheel_defence_wave1" && combat && combat.echo) {
      combat.escorts = placeEscorts(2);
      combat.enemies.push(...placeEnemyWave([ECHO_FIGHTER_HULL, ECHO_FIGHTER_HULL,
                                              ECHO_BOMBER_HULL, ECHO_BOMBER_HULL]));
      combat.echo.stage = 2;
      combat.banner = { text: "PROTECT THE TRANSPORT SHIPS", kind: "info", t: 2400, dur: 2400 };
      clog("MISSION: Protect the evacuation transports. Destroy the enemy bombers.");
    }
    if (e.data.id === "cogwheel_defence_crimson" && combat && combat.echo) {
      crimsonHired = true; crimsonFreeUsed = true; saveCrimsonHire(); crimsonPos = null;
      combat.guest = { gx: CENTER - 1, gy: CENTER + 1, facing: DIR.FWD, bob: Math.random() * 6.283,
                        hp: CRIMSON_MAX_HP, maxhp: CRIMSON_MAX_HP };
      combat.echo.stage = 3;
      combat.echo.roundBase = combat.turn;
      combat.banner = { text: "REPEL THE ENEMY SHIPS... AGAIN", kind: "enemy", t: 2400, dur: 2400 };
      clog("Crimson Nova has joined the fight.");
      // The transports are considered safely away the moment Crimson joins —
      // Steve: don't leave them lingering through the whole 3-round holding
      // pattern just because that's how long it takes A-17 to show up (their
      // exit has nothing to do with her timer). Clearing the array (rather than
      // just no longer drawing it) also means the escorts-destroyed lose check
      // in updateEchoDefence() naturally stops applying, same as it already did
      // whenever combat.escorts was empty.
      if (combat.escorts.length) {
        clog("The evacuation transports have cleared the battle zone.");
        combat.escorts = [];
      }
      // A fresh 3-ship wave joins the fight the moment Crimson does (Steve) —
      // A-17 herself arrives one round later (see updateEchoDefence()'s stage-3
      // round check), not alongside these.
      combat.enemies.push(...placeEnemyWave([ECHO_FIGHTER_HULL, ECHO_FIGHTER_HULL, ECHO_FIGHTER_HULL]));
    }
    if (e.data.id === "cogwheel_defence_a17" && combat && combat.echo) {
      spawnA17();
      combat.echo.stage = 4;
    }
    if (e.data.id === "cogwheel_defence_final" && combat && combat.echo) {
      endEchoDefence();
    }
  }
});

// word-wrapped text helper for the summary panel. Pass `maxLines` to clamp the
// output to N rows, ellipsizing the last row so text can never overrun its box.
function wrapText(text, x, y, maxW, lh, maxLines) {
  const words = String(text || "").split(/\s+/);
  let line = "", yy = y, drawn = 0;
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      if (maxLines && drawn === maxLines - 1) {   // last allowed row, more remains → ellipsize
        let s = line;
        while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
        ctx.fillText(s + "…", x, yy);
        return yy;
      }
      ctx.fillText(line, x, yy); drawn++; line = w; yy += lh;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
  return yy;
}
// split text into lines that each fit within maxW (caller sets the font first)
// An explicit \n forces a break — the market intel line has to sit on its own row rather
// than trailing off the end of the blurb, and that can't be left to where the wrap lands.
function wrapLines(text, maxW) {
  const lines = [];
  for (const para of String(text || "").split("\n")) {
    const words = para.split(/\s+/).filter(Boolean);
    if (!words.length) { lines.push(""); continue; }
    let line = "";
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
      else line = test;
    }
    if (line) lines.push(line);
  }
  return lines;
}
// truncate a single line with an ellipsis so it fits within maxW (caller sets the font)
function fitText(text, maxW) {
  text = String(text || "");
  if (ctx.measureText(text).width <= maxW) return text;
  let s = text;
  while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
  return s + "…";
}

// menu row glyphs, stroked/filled in a caller-supplied accent colour
function drawMenuIcon(type, cx, cy, s, col) {
  ctx.save();
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.8;
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  switch (type) {
    case "nova":                                   // 4-point starburst — Crimson's mercenary badge
      ctx.beginPath();
      ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s * 0.28, cy - s * 0.28);
      ctx.lineTo(cx + s, cy); ctx.lineTo(cx + s * 0.28, cy + s * 0.28);
      ctx.lineTo(cx, cy + s); ctx.lineTo(cx - s * 0.28, cy + s * 0.28);
      ctx.lineTo(cx - s, cy); ctx.lineTo(cx - s * 0.28, cy - s * 0.28);
      ctx.closePath(); ctx.stroke();
      break;
    case "ship":                                   // upward starship delta
      ctx.beginPath();
      ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s * 0.8, cy + s * 0.8);
      ctx.lineTo(cx, cy + s * 0.35); ctx.lineTo(cx - s * 0.8, cy + s * 0.8); ctx.closePath();
      ctx.stroke(); break;
    case "config":                                 // crossed tools
      ctx.beginPath();
      ctx.moveTo(cx - s, cy + s); ctx.lineTo(cx + s, cy - s);
      ctx.moveTo(cx + s, cy + s); ctx.lineTo(cx - s, cy - s); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx - s, cy - s, s * 0.32, 0, 6.283); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + s, cy - s, s * 0.32, 0, 6.283); ctx.stroke();
      break;
    case "planet":                                 // ringed planet
      ctx.beginPath(); ctx.arc(cx, cy, s * 0.6, 0, 6.283); ctx.stroke();
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.5);
      ctx.beginPath(); ctx.ellipse(0, 0, s * 1.15, s * 0.42, 0, 0, 6.283); ctx.stroke();
      ctx.restore(); break;
    case "warn":                                   // warning triangle
      ctx.beginPath();
      ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s, cy + s * 0.82); ctx.lineTo(cx - s, cy + s * 0.82);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy - s * 0.3); ctx.lineTo(cx, cy + s * 0.22); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy + s * 0.52, 1, 0, 6.283); ctx.fill();
      break;
    case "book":                                   // open manual
      ctx.beginPath();                             // spine
      ctx.moveTo(cx, cy - s * 0.7); ctx.lineTo(cx, cy + s * 0.8); ctx.stroke();
      ctx.beginPath();                             // the two leaves
      ctx.moveTo(cx, cy - s * 0.7); ctx.lineTo(cx - s, cy - s * 0.45);
      ctx.lineTo(cx - s, cy + s * 0.6); ctx.lineTo(cx, cy + s * 0.8);
      ctx.lineTo(cx + s, cy + s * 0.6); ctx.lineTo(cx + s, cy - s * 0.45);
      ctx.closePath(); ctx.stroke();
      break;
    case "gear":                                   // gem / settings diamond
      ctx.beginPath();
      ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s, cy); ctx.lineTo(cx, cy + s); ctx.lineTo(cx - s, cy);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, s * 0.28, 0, 6.283); ctx.stroke();
      break;
    case "cross": {                                // medical cross
      const t = s * 0.5;
      ctx.fillRect(cx - t / 2, cy - s, t, 2 * s);
      ctx.fillRect(cx - s, cy - t / 2, 2 * s, t);
      break;
    }
    case "cargo":                                  // stacked cargo crate
      ctx.strokeRect(cx - s * 0.85, cy - s * 0.45, s * 1.7, s * 1.3);
      ctx.beginPath();                             // strapping
      ctx.moveTo(cx - s * 0.3, cy - s * 0.45); ctx.lineTo(cx - s * 0.3, cy + s * 0.85);
      ctx.moveTo(cx + s * 0.3, cy - s * 0.45); ctx.lineTo(cx + s * 0.3, cy + s * 0.85);
      ctx.moveTo(cx - s * 0.85, cy + s * 0.2); ctx.lineTo(cx + s * 0.85, cy + s * 0.2);
      ctx.stroke();
      ctx.beginPath();                             // lid
      ctx.moveTo(cx - s * 0.85, cy - s * 0.45); ctx.lineTo(cx - s * 0.6, cy - s * 0.8);
      ctx.lineTo(cx + s * 0.6, cy - s * 0.8); ctx.lineTo(cx + s * 0.85, cy - s * 0.45);
      ctx.stroke();
      break;
    case "save":                                   // floppy / save slot
      ctx.strokeRect(cx - s * 0.85, cy - s * 0.85, s * 1.7, s * 1.7);
      ctx.beginPath();                             // shutter
      ctx.rect(cx - s * 0.4, cy - s * 0.85, s * 0.8, s * 0.7); ctx.stroke();
      ctx.beginPath();                             // label
      ctx.rect(cx - s * 0.55, cy + s * 0.1, s * 1.1, s * 0.75); ctx.stroke();
      break;
    case "trophy":                                 // achievement cup
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.62, cy - s * 0.8); ctx.lineTo(cx + s * 0.62, cy - s * 0.8);
      ctx.lineTo(cx + s * 0.42, cy + s * 0.15); ctx.lineTo(cx - s * 0.42, cy + s * 0.15);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath();                             // side handles
      ctx.arc(cx - s * 0.62, cy - s * 0.45, s * 0.32, 1.6, 4.7, true); ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + s * 0.62, cy - s * 0.45, s * 0.32, 4.7, 1.6, true); ctx.stroke();
      ctx.beginPath();                             // stem + base
      ctx.moveTo(cx, cy + s * 0.15); ctx.lineTo(cx, cy + s * 0.6);
      ctx.moveTo(cx - s * 0.5, cy + s * 0.85); ctx.lineTo(cx + s * 0.5, cy + s * 0.85);
      ctx.stroke();
      break;
    case "crew":                                   // person / crew figure
      ctx.beginPath(); ctx.arc(cx, cy - s * 0.5, s * 0.42, 0, 6.283); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.8, cy + s * 0.85);
      ctx.quadraticCurveTo(cx - s * 0.8, cy + s * 0.05, cx, cy + s * 0.05);
      ctx.quadraticCurveTo(cx + s * 0.8, cy + s * 0.05, cx + s * 0.8, cy + s * 0.85);
      ctx.stroke();
      break;
  }
  ctx.restore();
}
